<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan Diagnostic - EPS PRO</title>
    <style>
        :root {
            --bg: #0b101d;
            --card: #1c2333;
            --accent: #00d2ff;
            --success: #00ff88;
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2rem; margin-bottom: 10px; }
        .accent-text { color: var(--accent); }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn-secondary { background: #666; color: white; }
        .stat-box {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border: 2px solid var(--accent);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            font-size: 0.85rem;
        }
        th {
            background: linear-gradient(135deg, var(--warning), var(--success));
            color: black;
            padding: 10px 8px;
            font-weight: 700;
            text-align: left;
            font-size: 0.8rem;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        tr:hover { background: rgba(0,210,255,0.05); }
        .stars { color: var(--warning); font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>EPS<span class="accent-text">PRO</span></h1>
        <p class="subtitle" style="color: var(--warning); font-size: 1.3rem; font-weight: 700;">📊 BILAN DIAGNOSTIC (L1)</p>
        
        <button onclick="window.location.href='index.html'" class="btn btn-secondary" style="margin-bottom: 20px;">← Retour</button>
        
        <div id="stats"></div>
        <div id="table-container"></div>
    </div>
    
    <script>
    let students = [];
    
    window.onload = function() {
        const stored = localStorage.getItem('eps_pro_students');
        if (!stored) {
            alert('⚠️ Aucun élève.');
            return;
        }
        students = JSON.parse(stored);
        displayBilan();
    };
    
    function displayBilan() {
        const withDiag = students.filter(s => s.diagnostique && s.vma);
        
        if(withDiag.length === 0) {
            document.getElementById('stats').innerHTML = '<div class="stat-box"><p>Aucun diagnostic enregistré.</p></div>';
            return;
        }
        
        // Stats
        let totalVMA = 0;
        withDiag.forEach(s => totalVMA += parseFloat(s.vma));
        
        document.getElementById('stats').innerHTML = `
            <div class="stat-box">
                <h3 style="color: var(--accent); margin-bottom: 10px;">Statistiques globales</h3>
                <p><strong>Élèves diagnostiqués :</strong> ${withDiag.length} / ${students.length}</p>
                <p><strong>VMA moyenne :</strong> ${(totalVMA/withDiag.length).toFixed(1)} km/h</p>
            </div>
        `;
        
        // Tableau compact
        let html = '<table><thead><tr>';
        html += '<th>Élève</th><th>VMA</th><th>Moy 3×400</th><th>Saut -élan</th><th>Saut +élan</th><th>Lancer</th><th>⭐Course</th><th>⭐Saut</th><th>⭐Lanc</th></tr></thead><tbody>';
        
        withDiag.forEach(s => {
            const d = s.diagnostique;
            const vma = parseFloat(s.vma);
            
            // Lire les bons champs selon le nouveau format
            const moy = d.moyenneCourse || (d.tour1 && d.tour2 && d.tour3 ? (d.tour1+d.tour2+d.tour3)/3 : null);
            const sautSansBest = d.sautSansBest || (d.sautSans && d.sautSans.length ? Math.max(...d.sautSans) : null);
            const sautAvecBest = d.sautAvecBest || (d.sautAvec && d.sautAvec.length ? Math.max(...d.sautAvec) : null);
            const lancerBest = d.lancerBest || (d.lancerResults && d.lancerResults.length ? Math.max(...d.lancerResults) : null);
            
            const evalVMA = evaluateVMA(vma, s.sexe);
            const evalSaut = sautAvecBest ? evaluateSaut(sautAvecBest, s.sexe) : null;
            const evalLancer = lancerBest ? evaluateLancer(lancerBest, s.sexe) : null;
            
            html += '<tr>';
            html += '<td>'+(s.sexe==='F'?'👧':'🧑')+' '+s.nomPrenom+'</td>';
            html += '<td>'+vma.toFixed(1)+' km/h</td>';
            html += '<td>'+(moy ? formatTime(moy*1000) : '-')+'</td>';
            html += '<td>'+(sautSansBest ? sautSansBest.toFixed(2)+'m' : '-')+'</td>';
            html += '<td>'+(sautAvecBest ? sautAvecBest.toFixed(2)+'m' : '-')+'</td>';
            html += '<td>'+(lancerBest ? lancerBest.toFixed(1)+'m'+(d.lancerType?' ('+d.lancerType+')':'') : '-')+'</td>';
            html += '<td class="stars">'+evalVMA.stars+'</td>';
            html += '<td class="stars">'+(evalSaut ? evalSaut.stars : '-')+'</td>';
            html += '<td class="stars">'+(evalLancer ? evalLancer.stars : '-')+'</td>';
            html += '</tr>';
        });
        
        html += '</tbody></table>';
        document.getElementById('table-container').innerHTML = html;
    }
    
    function evaluateVMA(vma, sexe) {
        let stars;
        if(sexe === 'F') {
            if(vma >= 13.5) stars = 5;
            else if(vma >= 12.5) stars = 4;
            else if(vma >= 11.5) stars = 3;
            else if(vma >= 10.5) stars = 2;
            else stars = 1;
        } else {
            if(vma >= 15) stars = 5;
            else if(vma >= 14) stars = 4;
            else if(vma >= 13) stars = 3;
            else if(vma >= 12) stars = 2;
            else stars = 1;
        }
        return { stars: '⭐'.repeat(stars) };
    }
    
    function evaluateSaut(distance, sexe) {
        let stars;
        if(sexe === 'F') {
            if(distance >= 3.2) stars = 5;
            else if(distance >= 2.8) stars = 4;
            else if(distance >= 2.4) stars = 3;
            else if(distance >= 2.0) stars = 2;
            else stars = 1;
        } else {
            if(distance >= 3.8) stars = 5;
            else if(distance >= 3.3) stars = 4;
            else if(distance >= 2.8) stars = 3;
            else if(distance >= 2.3) stars = 2;
            else stars = 1;
        }
        return { stars: '⭐'.repeat(stars) };
    }
    
    function evaluateLancer(distance, sexe) {
        let stars;
        if(sexe === 'F') {
            if(distance >= 10) stars = 5;
            else if(distance >= 8) stars = 4;
            else if(distance >= 6) stars = 3;
            else if(distance >= 4) stars = 2;
            else stars = 1;
        } else {
            if(distance >= 12) stars = 5;
            else if(distance >= 10) stars = 4;
            else if(distance >= 8) stars = 3;
            else if(distance >= 6) stars = 2;
            else stars = 1;
        }
        return { stars: '⭐'.repeat(stars) };
    }
    
    function formatTime(ms) {
        const sec = Math.floor(ms/1000);
        const m = Math.floor(sec/60);
        const s = sec%60;
        return m+"'"+(s<10?'0':'')+s+'"';
    }
    </script>
</body>
</html>
