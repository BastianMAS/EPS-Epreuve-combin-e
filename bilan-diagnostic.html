<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan Diagnostic - EPS PRO</title>
    <style>
        :root {
            --bg: #0b101d;
            --card: #1c2333;
            --accent: #00d2ff;
            --success: #00ff88;
            --warning: #ffcc00;
            --purple: #9b59b6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2rem; margin-bottom: 10px; }
        .accent-text { color: var(--accent); }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn-secondary { background: #666; color: white; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            font-size: 0.8rem;
        }
        th {
            background: linear-gradient(135deg, var(--warning), var(--success));
            color: black;
            padding: 10px 8px;
            font-weight: 700;
            text-align: left;
            font-size: 0.75rem;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        tr:hover { background: rgba(0,210,255,0.05); }
        .stat-box {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border: 2px solid var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EPS<span class="accent-text">PRO</span></h1>
        <p class="subtitle" style="color: var(--warning); font-size: 1.3rem; font-weight: 700;">📊 BILAN DIAGNOSTIC (L1)</p>
        
        <button onclick="window.location.href='index.html'" class="btn btn-secondary" style="margin-bottom: 20px;">← Retour</button>
        
        <div id="stats"></div>
        <div id="table-container"></div>
    </div>
    
    <script>
    let students = [];
    
    window.onload = function() {
        const stored = localStorage.getItem('eps_pro_students');
        if (!stored) {
            alert('⚠️ Aucun élève.');
            return;
        }
        students = JSON.parse(stored);
        displayBilan();
    };
    
    function displayBilan() {
        const withDiag = students.filter(s => s.diagnostique);
        
        if(withDiag.length === 0) {
            document.getElementById('stats').innerHTML = '<div class="stat-box"><p>Aucun diagnostic enregistré.</p></div>';
            return;
        }
        
        // Stats globales
        let totalVMA = 0;
        let totalSautSans = 0;
        let totalSautAvec = 0;
        let totalLancer = 0;
        
        withDiag.forEach(s => {
            const d = s.diagnostique;
            totalVMA += parseFloat(s.vma);
            if(d.sautSansElan) totalSautSans += d.sautSansElan;
            if(d.sautAvecElan) totalSautAvec += d.sautAvecElan;
            if(d.lancer) totalLancer += d.lancer;
        });
        
        const moyVMA = totalVMA / withDiag.length;
        const moySautSans = totalSautSans / withDiag.length;
        const moySautAvec = totalSautAvec / withDiag.length;
        const moyLancer = totalLancer / withDiag.length;
        
        document.getElementById('stats').innerHTML = `
            <div class="stat-box">
                <h3 style="color: var(--accent); margin-bottom: 10px;">Statistiques globales</h3>
                <p><strong>Élèves diagnostiqués :</strong> ${withDiag.length} / ${students.length}</p>
                <p><strong>VMA moyenne :</strong> ${moyVMA.toFixed(1)} km/h</p>
                <p><strong>Saut sans élan moyen :</strong> ${moySautSans.toFixed(2)} m</p>
                <p><strong>Saut avec élan moyen :</strong> ${moySautAvec.toFixed(2)} m</p>
                <p><strong>Lancer moyen :</strong> ${moyLancer.toFixed(1)} m</p>
            </div>
        `;
        
        // Tableau
        let html = '<table><thead><tr>';
        html += '<th>Élève</th><th>Classe</th><th>VMA</th><th>T1</th><th>T2</th><th>T3</th><th>Moy</th><th>Saut -</th><th>Saut +</th><th>Lancer</th></tr></thead><tbody>';
        
        withDiag.forEach(s => {
            const d = s.diagnostique;
            const vma = parseFloat(s.vma);
            const moy = (d.tour1 + d.tour2 + d.tour3) / 3;
            
            html += '<tr>';
            html += '<td>'+(s.sexe==='F'?'👧':'🧑')+' '+s.nomPrenom+'</td>';
            html += '<td>'+s.classe+'</td>';
            html += '<td>'+vma+' km/h</td>';
            html += '<td>'+formatTime(d.tour1*1000)+'</td>';
            html += '<td>'+formatTime(d.tour2*1000)+'</td>';
            html += '<td>'+formatTime(d.tour3*1000)+'</td>';
            html += '<td>'+formatTime(moy*1000)+'</td>';
            html += '<td>'+(d.sautSansElan ? d.sautSansElan.toFixed(2)+' m' : '-')+'</td>';
            html += '<td>'+(d.sautAvecElan ? d.sautAvecElan.toFixed(2)+' m' : '-')+'</td>';
            html += '<td>'+(d.lancer ? d.lancer.toFixed(1)+' m' : '-')+'</td>';
            html += '</tr>';
        });
        
        html += '</tbody></table>';
        document.getElementById('table-container').innerHTML = html;
    }
    
    function formatTime(ms) {
        const sec = Math.floor(ms/1000);
        const m = Math.floor(sec/60);
        const s = sec%60;
        return m+"'"+(s<10?'0':'')+s+'"';
    }
    </script>
</body>
</html>
