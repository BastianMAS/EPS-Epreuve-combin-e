<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan Général L1-L7 - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #00d9ff;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            color: white; 
            padding: 16px; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 2.5rem; 
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 30px;
        }
        
        .eleves-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .eleve-card {
            background: var(--card);
            border: 1px solid rgba(0,217,255,0.3);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .eleve-header {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: white;
            padding: 16px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .eleve-body {
            padding: 20px;
        }
        
        .parcours-section {
            margin-bottom: 20px;
            background: rgba(255,255,255,0.02);
            padding: 16px;
            border-radius: 12px;
        }
        
        .section-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 1rem;
        }
        
        .observation {
            background: rgba(0,217,255,0.1);
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .orientation {
            background: rgba(251,191,36,0.15);
            border-left: 4px solid var(--warning);
            padding: 12px 16px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .question {
            background: rgba(139,92,246,0.15);
            border-left: 4px solid var(--purple);
            padding: 12px 16px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 0.9rem;
            line-height: 1.4;
            font-style: italic;
        }
        
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        
        .no-data {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-style: italic;
            padding: 40px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS: épreuve Combinée</h1>
<p class="subtitle">📊 BILAN GÉNÉRAL L1-L7</p>

<div class="eleves-list" id="eleves-list"></div>

<script>
window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('eleves-list').innerHTML = '<div class="no-data">⚠️ Aucune donnée trouvée</div>';
        return;
    }
    
    const eleves = JSON.parse(stored);
    renderElevesComplet(eleves);
};

function renderElevesComplet(eleves) {
    const container = document.getElementById('eleves-list');
    
    if(eleves.length === 0) {
        container.innerHTML = '<div class="no-data">⚠️ Aucun élève trouvé</div>';
        return;
    }
    
    let html = '';
    
    eleves.forEach(eleve => {
        const analyse = analyserParcours(eleve);
        
        html += `
            <div class="eleve-card">
                <div class="eleve-header">
                    <span>${eleve.sexe === 'F' ? '👧' : '🧑'}</span>
                    <span>${eleve.nomPrenom}</span>
                    <span style="margin-left: auto; font-size: 0.9rem;">${eleve.age} ans | VMA ${eleve.vma || 'N/A'}</span>
                </div>
                <div class="eleve-body">
                    
                    <div class="parcours-section">
                        <div class="section-title">🏃‍♂️ TON PARCOURS COURSE</div>
                        ${analyse.course.observations.map(obs => `<div class="observation">${obs}</div>`).join('')}
                        ${analyse.course.orientation ? `<div class="orientation"><strong>💡 Orientation :</strong> ${analyse.course.orientation}</div>` : ''}
                    </div>
                    
                    <div class="parcours-section">
                        <div class="section-title">🦘 TON PARCOURS SAUT</div>
                        ${analyse.saut.observations.map(obs => `<div class="observation">${obs}</div>`).join('')}
                        ${analyse.saut.orientation ? `<div class="orientation"><strong>💡 Orientation :</strong> ${analyse.saut.orientation}</div>` : ''}
                    </div>
                    
                    <div class="parcours-section">
                        <div class="section-title">🎯 TON PARCOURS LANCER</div>
                        ${analyse.lancer.observations.map(obs => `<div class="observation">${obs}</div>`).join('')}
                        ${analyse.lancer.orientation ? `<div class="orientation"><strong>💡 Orientation :</strong> ${analyse.lancer.orientation}</div>` : ''}
                    </div>
                    
                    <div class="parcours-section">
                        <div class="section-title">🎯 PRÉPARATION L8</div>
                        ${analyse.preparation.observations.map(obs => `<div class="observation">${obs}</div>`).join('')}
                        <div class="question"><strong>🤔 Question pour toi :</strong> ${analyse.preparation.question}</div>
                    </div>
                    
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function analyserParcours(eleve) {
    const seances = eleve.seances || [];
    const seanceL3 = seances.find(s => s.lecon === 'L3');
    const seanceL4 = seances.find(s => s.lecon === 'L4');
    const seanceL5 = seances.find(s => s.lecon === 'L5');
    const seanceL6 = seances.find(s => s.lecon === 'L6');
    const seanceL7 = seances.find(s => s.lecon === 'L7');
    
    const analyse = {
        course: { observations: [], orientation: null },
        saut: { observations: [], orientation: null },
        lancer: { observations: [], orientation: null },
        preparation: { observations: [], question: null }
    };
    
    // ANALYSE COURSE
    if(seanceL3?.moyenne200m) {
        const moyenne = parseFloat(seanceL3.moyenne200m);
        const vmaTheorique = eleve.vma ? (200 / (parseFloat(eleve.vma) * 1.05 / 3.6)) : null;
        
        if(vmaTheorique && moyenne < vmaTheorique * 0.95) {
            analyse.course.observations.push("📊 Tes 200m L3/L4 montrent de bonnes capacités en vitesse.");
            analyse.course.orientation = "Tu sembles à l'aise sur des efforts intenses et courts.";
        } else if(vmaTheorique && moyenne > vmaTheorique * 1.05) {
            analyse.course.observations.push("📊 Tes 200m L3/L4 révèlent un profil plus endurant que sprinteur.");
            analyse.course.orientation = "Les efforts longs pourraient mieux te convenir.";
        } else {
            analyse.course.observations.push("📊 Tes 200m L3/L4 sont équilibrés par rapport à ta VMA.");
        }
    }
    
    if(seanceL6?.pyramideReussie) {
        analyse.course.observations.push("⚡ Pyramide L6 réussie : tu gères bien les efforts fractionnés intenses.");
    } else if(seanceL6?.pyramideEchec) {
        analyse.course.observations.push(`⚡ Pyramide L6 : difficulté sur ${seanceL6.pyramideEchec}. Normal, c'est intense !`);
    }
    
    if(seanceL7?.temps1 && seanceL7?.temps2 && seanceL7?.temps3) {
        analyse.course.observations.push("🎯 L7 : tu as testé tes 3×400m, c'est une base solide pour L8.");
    }
    
    // ANALYSE SAUT
    let scoreSautTotal = 0;
    let seancesSaut = 0;
    
    if(seanceL3?.sautTech1 !== undefined) {
        const score = [seanceL3.sautTech1, seanceL3.sautTech2, seanceL3.sautTech3, seanceL3.sautTech4].filter(Boolean).length;
        scoreSautTotal += score;
        seancesSaut++;
    }
    if(seanceL6?.sautTech1 !== undefined) {
        const score = [seanceL6.sautTech1, seanceL6.sautTech2, seanceL6.sautTech3, seanceL6.sautTech4, seanceL6.sautTech5].filter(Boolean).length;
        scoreSautTotal += score;
        seancesSaut++;
    }
    
    if(seancesSaut > 0) {
        const moyenneSaut = scoreSautTotal / seancesSaut;
        if(moyenneSaut >= 4) {
            analyse.saut.observations.push("🦘 Technique saut : très bonne maîtrise technique !");
            analyse.saut.orientation = "Le saut semble être un de tes points forts.";
        } else if(moyenneSaut >= 3) {
            analyse.saut.observations.push("🦘 Technique saut : bonne progression technique.");
        } else {
            analyse.saut.observations.push("🦘 Technique saut : des bases à consolider.");
            analyse.saut.orientation = "Concentre-toi sur la régularité de ta course d'élan.";
        }
    }
    
    // ANALYSE LANCER
    let scoreLancerTotal = 0;
    let seancesLancer = 0;
    
    if(seanceL4?.lancerTech1 !== undefined) {
        const score = [seanceL4.lancerTech1, seanceL4.lancerTech2, seanceL4.lancerTech3, seanceL4.lancerTech4].filter(Boolean).length;
        scoreLancerTotal += score;
        seancesLancer++;
    }
    if(seanceL6?.lancerTech1 !== undefined) {
        const score = [seanceL6.lancerTech1, seanceL6.lancerTech2, seanceL6.lancerTech3, seanceL6.lancerTech4, seanceL6.lancerTech5].filter(Boolean).length;
        scoreLancerTotal += score;
        seancesLancer++;
    }
    
    if(seancesLancer > 0) {
        const moyenneLancer = scoreLancerTotal / seancesLancer;
        if(moyenneLancer >= 4) {
            analyse.lancer.observations.push("🎯 Technique lancer : excellente coordination !");
            analyse.lancer.orientation = "Le lancer est clairement un atout pour toi.";
        } else if(moyenneLancer >= 3) {
            analyse.lancer.observations.push("🎯 Technique lancer : bonne maîtrise du geste.");
        } else {
            analyse.lancer.observations.push("🎯 Technique lancer : la chaîne cinétique demande encore du travail.");
            analyse.lancer.orientation = "Pense à bien coordonner le transfert de poids.";
        }
    }
    
    // PRÉPARATION L8
    if(seanceL7?.confiantL8) {
        analyse.preparation.observations.push("💪 Tu te sens confiant pour l'évaluation L8, c'est parfait !");
    }
    
    if(seanceL7?.strategieTrouvee) {
        analyse.preparation.observations.push("🎯 Tu as identifié ta stratégie pour les 3×400m.");
    }
    
    if(seanceL7?.projetReussi) {
        analyse.preparation.observations.push("✅ Ton projet L7 était réussi, tu peux viser similaire en L8.");
    }
    
    // QUESTION FINALE
    const profils = [];
    if(analyse.course.orientation?.includes("intense")) profils.push("sprinteur");
    if(analyse.course.orientation?.includes("longs")) profils.push("endurant");
    if(analyse.saut.orientation?.includes("points forts")) profils.push("sauteur");
    if(analyse.lancer.orientation?.includes("atout")) profils.push("lanceur");
    
    if(profils.length > 0) {
        analyse.preparation.question = `Avec ton profil ${profils.join('/')}, quelle stratégie veux-tu adopter pour tes 3×400m en L8 ?`;
    } else {
        analyse.preparation.question = "Après ce parcours L1-L7, comment veux-tu aborder tes 3×400m d'évaluation ?";
    }
    
    return analyse;
}
</script>
</body>
</html>
