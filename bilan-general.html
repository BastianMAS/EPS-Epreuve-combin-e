<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan Général L1-L7 - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #00d9ff;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'SF Pro Display', sans-serif; 
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            color: white; 
            padding: 16px; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 3rem; 
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--purple), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.3rem; 
            font-weight: 600; 
            margin-bottom: 40px;
        }
        
        .eleves-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .eleve-card {
            background: var(--card);
            border: 1px solid rgba(0,217,255,0.3);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .eleve-header {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: white;
            padding: 16px 20px;
            font-weight: 800;
            font-size: 1.1rem;
        }
        
        .eleve-body {
            padding: 20px;
        }
        
        .parcours-section {
            margin: 16px 0;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border-left: 4px solid var(--accent);
        }
        
        .section-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        
        .observation {
            font-style: italic;
            color: rgba(255,255,255,0.8);
            margin: 8px 0;
            font-size: 0.9rem;
        }
        
        .question-reflexion {
            background: rgba(251,191,36,0.15);
            border: 1px solid var(--warning);
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            color: var(--warning);
            font-weight: 600;
        }
        
        .profil-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 4px;
        }
        
        .profil-explosif { background: rgba(239,68,68,0.3); color: var(--danger); }
        .profil-regulier { background: rgba(251,191,36,0.3); color: var(--warning); }
        .profil-endurant { background: rgba(75,222,128,0.3); color: var(--success); }
        .profil-tactique { background: rgba(139,92,246,0.3); color: var(--purple); }
        
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS: épreuve Combinée</h1>
<p class="subtitle">🎯 BILAN GÉNÉRAL L1-L7 - TON PARCOURS</p>

<div class="eleves-list" id="eleves-list"></div>

<script>
window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('eleves-list').innerHTML = '<div style="text-align:center; padding:40px;">⚠️ Aucune donnée trouvée</div>';
        return;
    }
    
    const eleves = JSON.parse(stored);
    renderParcours(eleves);
};

function renderParcours(eleves) {
    const container = document.getElementById('eleves-list');
    
    let html = '';
    eleves.forEach(eleve => {
        const parcours = analyserParcours(eleve);
        
        html += `
            <div class="eleve-card">
                <div class="eleve-header">
                    ${eleve.sexe === 'F' ? '👧' : '🧑'} ${eleve.nomPrenom} - TON PARCOURS
                </div>
                <div class="eleve-body">
                    
                    <div class="parcours-section">
                        <div class="section-title">🏃‍♂️ TON PROFIL COURSE</div>
                        <div class="observation">${parcours.course.observation}</div>
                        <div class="question-reflexion">💭 ${parcours.course.question}</div>
                    </div>
                    
                    <div class="parcours-section">
                        <div class="section-title">🦘🎯 TES TECHNIQUES</div>
                        <div class="observation">${parcours.technique.observation}</div>
                        <div class="question-reflexion">💭 ${parcours.technique.question}</div>
                    </div>
                    
                    <div class="parcours-section">
                        <div class="section-title">🎯 TON PROJET L8</div>
                        <div class="observation">${parcours.projet.observation}</div>
                        <div class="question-reflexion">🤔 ${parcours.projet.question}</div>
                        ${parcours.projet.profils ? `<div>${parcours.projet.profils}</div>` : ''}
                    </div>
                    
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function analyserParcours(eleve) {
    const seances = eleve.seances || [];
    const seanceL3 = seances.find(s => s.lecon === 'L3');
    const seanceL4 = seances.find(s => s.lecon === 'L4');
    const seanceL5 = seances.find(s => s.lecon === 'L5');
    const seanceL6 = seances.find(s => s.lecon === 'L6');
    const seanceL7 = seances.find(s => s.lecon === 'L7');
    
    let courseObs = "";
    let courseQ = "";
    
    if(seanceL6?.pyramideReussie) {
        courseObs = "Tes fractionnés courts L6 montrent une belle explosivité. Tu sembles à l'aise sur les efforts intenses et courts.";
        courseQ = "Es-tu plutôt du genre à partir vite et tenir, ou préfères-tu accélérer progressivement ?";
    } else if(seanceL3?.moyenne200m && seanceL4?.moyenne200m) {
        const progression = seanceL4.moyenne200m < seanceL3.moyenne200m;
        if(progression) {
            courseObs = "Tes 200m L3/L4 montrent une progression. Tu sembles bien t'adapter aux allures VMA.";
            courseQ = "Cette régularité est un atout : comment veux-tu l'utiliser sur 3×400m ?";
        } else {
            courseObs = "Tes 200m L3/L4 montrent de la constance. Tu as ton rythme et tu le maintiens.";
            courseQ = "Cette stabilité peut être une force : veux-tu miser sur la régularité ?";
        }
    } else {
        courseObs = "Tes premières séances révèlent ton potentiel. Chaque cours t'apprend quelque chose sur ton profil.";
        courseQ = "Quel type de coureur penses-tu être ? Explosif, régulier, endurant ?";
    }
    
    let techObs = "";
    let techQ = "";
    
    const scoreSautTotal = (seanceL6?.scoreTechniqueSaut || 0) + (seanceL4?.sautTech1 ? 1 : 0) + (seanceL4?.sautTech2 ? 1 : 0);
    const scoreLancerTotal = (seanceL6?.scoreTechniqueLancer || 0) + (seanceL4?.lancerTech1 ? 1 : 0) + (seanceL4?.lancerTech2 ? 1 : 0);
    
    if(scoreSautTotal > scoreLancerTotal) {
        techObs = "Le saut semble plus naturel pour toi. Tes progrès techniques y sont visibles.";
        techQ = "Cette aisance au saut révèle peut-être une explosivité que tu peux exploiter en course ?";
    } else if(scoreLancerTotal > scoreSautTotal) {
        techObs = "Le lancer te correspond bien. Tu développes une belle coordination technique.";
        techQ = "Cette maîtrise du lancer montre ta capacité à construire un geste : et si tu appliquais ça à ta course ?";
    } else {
        techObs = "Tu progresses de façon équilibrée sur saut et lancer. Beau travail technique !";
        techQ = "Cette polyvalence est un atout : sur quelle qualité veux-tu t'appuyer en course ?";
    }
    
    let projetObs = "";
    let projetQ = "";
    let profils = "";
    
    if(seanceL7?.confiantL8) {
        projetObs = "Ta mise en situation L7 te donne confiance pour L8. Tu as une idée plus claire de tes capacités.";
        if(seanceL7?.strategieTrouvee) {
            projetQ = "Tu as ta stratégie : maintenant, quel est TON objectif personnel pour L8 ?";
            profils = `
                <span class="profil-badge profil-explosif">🔥 Performer dès le 1er 400m</span>
                <span class="profil-badge profil-regulier">⚖️ Maintenir la même allure</span>
                <span class="profil-badge profil-endurant">💪 Terminer en beauté</span>
                <span class="profil-badge profil-tactique">🎯 M'adapter selon la situation</span>
            `;
        } else {
            projetQ = "Tu as confiance, mais quelle stratégie veux-tu adopter ? Partir fort, rester régulier, ou finir en sprint ?";
        }
    } else {
        projetObs = "L8 arrive bientôt. C'est normal d'avoir encore des questions, l'important est de définir TON projet.";
        projetQ = "Qu'est-ce qui te ferait dire 'j'ai réussi' après tes 3×400m ? Une performance, une stratégie maîtrisée, un dépassement de soi ?";
    }
    
    return {
        course: { observation: courseObs, question: courseQ },
        technique: { observation: techObs, question: techQ },
        projet: { observation: projetObs, question: projetQ, profils: profils }
    };
}
</script>
</body>
</html>
