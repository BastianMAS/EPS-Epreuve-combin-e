<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan L3 - EPS: épreuve Combinée</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #ff6b35;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --orange: #ff8800;
            --blue: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1a1028 100%);
            color: white;
            padding: 16px;
            min-height: 100vh;
        }

        h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 4px; }
        .subtitle { color: var(--accent); font-weight: 700; font-size: 1rem; margin-bottom: 20px; }

        .btn-back {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stat-value { font-size: 2rem; font-weight: 900; color: var(--accent); }
        .stat-label { font-size: 0.75rem; color: #aaa; margin-top: 4px; }

        /* NIVEAU DISTRIBUTION */
        .niveau-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 0.82rem;
        }
        .niveau-label { min-width: 100px; color: #ccc; }
        .niveau-bar-track {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
            height: 20px;
            overflow: hidden;
        }
        .niveau-bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            padding-left: 6px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .niveau-count { min-width: 28px; text-align: right; color: #aaa; font-size: 0.75rem; }

        /* CARDS GRID */
        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 24px 0 12px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        .eleve-card {
            background: var(--card);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .eleve-name {
            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .niveau-badge {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 5px;
            margin-left: auto;
        }
        .n95 { background: rgba(59,130,246,0.3); color: #93c5fd; }
        .n100 { background: rgba(74,222,128,0.3); color: #86efac; }
        .n105 { background: rgba(251,146,60,0.3); color: #fdba74; }
        .n110 { background: rgba(239,68,68,0.3); color: #fca5a5; }

        .stat-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stat-line:last-child { border-bottom: none; }
        .stat-line span:first-child { color: #888; }
        .stat-line span:last-child { font-weight: 700; }

        .tech-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .tech-chip {
            font-size: 0.68rem;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
        }
        .tech-ok { background: rgba(74,222,128,0.2); color: #86efac; border: 1px solid rgba(74,222,128,0.3); }
        .tech-no { background: rgba(255,255,255,0.05); color: #555; border: 1px solid rgba(255,255,255,0.08); }

        /* EXPORT */
        .export-zone {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .export-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .export-btn.xlsx { background: var(--success); color: black; border-color: var(--success); }

        .no-data {
            text-align: center;
            color: #666;
            padding: 40px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.4rem; }
        }
    </style>

    <script src="firebase-config.js"></script>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS<span style="color:var(--accent)">: épreuve Combinée</span></h1>
<p class="subtitle">🔎 BILAN L3 — DÉCOUVERTE ATHLÉTIQUE</p>

<div class="stats-grid" id="stats-grid"></div>

<div id="niveau-distrib-section" style="background:var(--card);border-radius:14px;padding:16px;margin-bottom:20px;display:none;">
    <div style="font-weight:800;color:var(--accent);margin-bottom:12px;font-size:0.9rem;">📊 Répartition des niveaux choisis</div>
    <div id="niveau-distrib"></div>
</div>

<div class="export-zone" id="export-zone" style="display:none">
    <button class="export-btn" onclick="exportTXT()">📄 Exporter .TXT</button>
    <button class="export-btn" onclick="exportPDF()" style="background:#8b5cf6;color:white;border-color:#8b5cf6;">📑 Exporter .PDF</button>
    <button class="export-btn xlsx" onclick="exportXLSX()">📥 Exporter .XLSX</button>
</div>

<div class="section-title" id="section-course-title" style="display:none">🏃 Course — 6×200m</div>
<div class="grid" id="grid-course"></div>

<div class="section-title" id="section-tech-title" style="display:none">🦘 Technique Saut &amp; Lancer</div>
<div class="grid" id="grid-tech"></div>

<script>
let bilanData = {
    totalEleves: 0,
    elevesAvecL3: [],
    stats: {
        niveauxRepartition: { vma95: 0, vma100: 0, vma105: 0, vma110: 0 },
        moyenneTechSaut: 0,
        moyenneTechLancer: 0,
        tauxObjectifAtteint: 0,
    }
};

const NIVEAUX = {
    vma95:  { label: '95% VMA',  desc: 'Endurance active', classe: 'n95',  pourcent: 95,  color: '#93c5fd' },
    vma100: { label: '100% VMA', desc: 'Découverte',       classe: 'n100', pourcent: 100, color: '#86efac' },
    vma105: { label: '105% VMA', desc: 'Progression',      classe: 'n105', pourcent: 105, color: '#fdba74' },
    vma110: { label: '110% VMA', desc: 'Challenge',         classe: 'n110', pourcent: 110, color: '#fca5a5' },
};

const SAUT_LABELS  = ['Course d\'élan régulière', 'Pied d\'appel précis'];
const LANCER_LABELS = ['Position de profil', 'Prise et placement'];

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('grid-course').innerHTML = '<div class="no-data">⚠️ Aucune donnée trouvée. Effectuez d\'abord une séance L3.</div>';
        return;
    }
    const eleves = JSON.parse(stored);
    analyseL3(eleves);
    renderStats();
    renderNiveauDistrib();
    renderCards();
    document.getElementById('export-zone').style.display = 'flex';
};

function analyseL3(eleves) {
    const elevesL3 = eleves.filter(e => e.seances?.some(s => s.lecon === 'L3'));
    bilanData.totalEleves = elevesL3.length;

    let totalTechSaut = 0, totalTechLancer = 0, totalObjAtteint = 0;

    elevesL3.forEach(eleve => {
        // Toutes les sessions L3
        const sessionsL3 = eleve.seances.filter(s => s.lecon === 'L3');
        // Stats sur la dernière session (pour les moyennes classe)
        const s = sessionsL3[sessionsL3.length - 1];
        const niv = NIVEAUX[s.niveau] || null;

        if(s.niveau && bilanData.stats.niveauxRepartition[s.niveau] !== undefined)
            bilanData.stats.niveauxRepartition[s.niveau]++;

        const techSaut = (s.sautTech1 ? 1 : 0) + (s.sautTech2 ? 1 : 0);
        const techLancer = (s.lancerTech1 ? 1 : 0) + (s.lancerTech2 ? 1 : 0);
        totalTechSaut += techSaut;
        totalTechLancer += techLancer;

        const toursValides = s.tours ? s.tours.filter(t => t).length : 0;
        const objAtteint = toursValides >= 4 && niv && niv.pourcent >= 100;
        if(objAtteint) totalObjAtteint++;

        let pctVMAMoyen = null;
        if(eleve.vma && s.moyenne200m) {
            const vitesse = (0.2 / (s.moyenne200m / 3600));
            pctVMAMoyen = Math.round((vitesse / eleve.vma) * 100);
            if(pctVMAMoyen < 50 || pctVMAMoyen > 200) pctVMAMoyen = null;
        }

        // Toutes sessions avec index réel pour suppression
        const sessions = sessionsL3.map(seance => ({
            seance,
            seanceIdx: eleve.seances.indexOf(seance),
            date: seance.date
        }));

        bilanData.elevesAvecL3.push({
            id: eleve.id,
            nomPrenom: eleve.nomPrenom,
            sexe: eleve.sexe,
            age: eleve.age,
            vma: eleve.vma,
            seanceL3: s,
            sessions,
            niv,
            techSaut,
            techLancer,
            objAtteint,
            pctVMAMoyen,
            toursValides,
        });
    });

    if(elevesL3.length > 0) {
        bilanData.stats.moyenneTechSaut   = Math.round((totalTechSaut   / elevesL3.length) * 10) / 10;
        bilanData.stats.moyenneTechLancer = Math.round((totalTechLancer / elevesL3.length) * 10) / 10;
        bilanData.stats.tauxObjectifAtteint = Math.round((totalObjAtteint / elevesL3.length) * 100);
    }
}

function renderStats() {
    const d = bilanData;
    if(d.totalEleves === 0) {
        document.getElementById('stats-grid').innerHTML = '<div class="no-data">Aucun élève avec données L3.</div>';
        return;
    }
    document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card">
            <div class="stat-value">${d.totalEleves}</div>
            <div class="stat-label">Élèves évalués</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color:var(--success)">${d.stats.tauxObjectifAtteint}%</div>
            <div class="stat-label">Objectif ≥100% atteint</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color:var(--purple)">${d.stats.moyenneTechSaut}<span style="font-size:1rem">/2</span></div>
            <div class="stat-label">Moy. technique saut</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color:var(--blue)">${d.stats.moyenneTechLancer}<span style="font-size:1rem">/2</span></div>
            <div class="stat-label">Moy. technique lancer</div>
        </div>
    `;
}

function renderNiveauDistrib() {
    const rep = bilanData.stats.niveauxRepartition;
    const total = bilanData.totalEleves;
    if(total === 0) return;
    document.getElementById('niveau-distrib-section').style.display = 'block';
    const colors = { vma95: '#93c5fd', vma100: '#86efac', vma105: '#fdba74', vma110: '#fca5a5' };
    document.getElementById('niveau-distrib').innerHTML = Object.entries(NIVEAUX).map(([id, n]) => {
        const count = rep[id] || 0;
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        return `<div class="niveau-bar-row">
            <div class="niveau-label">${n.label}</div>
            <div class="niveau-bar-track">
                <div class="niveau-bar-fill" style="width:${pct}%;background:${colors[id]};color:black;">${pct > 12 ? pct+'%' : ''}</div>
            </div>
            <div class="niveau-count">${count} élève${count > 1 ? 's' : ''}</div>
        </div>`;
    }).join('');
}

function renderCards() {
    const eleves = bilanData.elevesAvecL3;
    if(eleves.length === 0) return;

    document.getElementById('section-course-title').style.display = 'flex';
    document.getElementById('section-tech-title').style.display = 'flex';

    const fmtS = s => { if(!s) return '-'; const m=Math.floor(s/60); const sec=Math.round(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; };

    document.getElementById('grid-course').innerHTML = eleves.map(e => {
        const s = e.seanceL3;
        const tours = s.tours || [];
        const toursHtml = tours.map((t, i) => t
            ? `<span style="font-size:0.7rem;background:rgba(255,255,255,0.07);padding:2px 5px;border-radius:4px;">#${i+1} ${fmtS(t)}</span>`
            : `<span style="font-size:0.7rem;color:#444;padding:2px 5px;">#${i+1} —</span>`
        ).join('');
        const objColor = e.objAtteint ? 'var(--success)' : e.toursValides >= 4 ? 'var(--warning)' : 'var(--danger)';
        const objTxt   = e.objAtteint ? '✅ Objectif atteint' : e.toursValides >= 4 ? '⚠️ Niveau < 100%' : '❌ Tours incomplets';

        return `<div class="eleve-card">
            <div class="eleve-name">
                ${e.sexe === 'F' ? '👧' : '🧑'} ${e.nomPrenom}
                ${e.niv ? `<span class="niveau-badge ${e.niv.classe}">${e.niv.label}</span>` : '<span class="niveau-badge" style="background:rgba(255,255,255,0.1);color:#aaa">N/D</span>'}
            </div>
            ${e.sessions.length > 1 ? `<div style="margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px;">
                ${e.sessions.map((sess, i) => `
                    <div style="display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:3px 7px;font-size:0.7rem;">
                        <span style="color:#94a3b8;">Session ${i+1} · ${sess.date ? new Date(sess.date).toLocaleDateString('fr-FR') : '—'}</span>
                        <button onclick="deleteSessionL3('${e.id}', ${sess.seanceIdx})" style="background:rgba(239,68,68,0.2);border:none;color:#f87171;border-radius:4px;padding:1px 5px;cursor:pointer;font-size:0.65rem;">🗑️</button>
                    </div>`).join('')}
            </div>` : e.sessions.length === 1 && e.sessions[0].date ? `<div style="font-size:0.7rem;color:#64748b;margin-bottom:4px;">📅 ${new Date(e.sessions[0].date).toLocaleDateString('fr-FR')} <button onclick="deleteSessionL3('${e.id}', ${e.sessions[0].seanceIdx})" style="background:rgba(239,68,68,0.2);border:none;color:#f87171;border-radius:4px;padding:1px 5px;cursor:pointer;font-size:0.65rem;margin-left:6px;">🗑️</button></div>` : ''}
            <div class="stat-line"><span>VMA</span><span>${e.vma || '?'} km/h${(() => {
        const v = parseFloat(e.vma);
        if(!v) return '';
        const s400 = Math.round(400 / (v / 3.6));
        const s200 = Math.round(200 / (v / 3.6));
        const fmt = s => Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');
        return ` <span style="font-size:0.68rem;color:rgba(255,255,255,0.45);font-weight:400">→ 400m ⏱${fmt(s400)} | 200m ⏱${fmt(s200)}</span>`;
    })()}</span></div>
            <div class="stat-line"><span>Moy. 200m</span><span>${fmtS(s.moyenne200m)}</span></div>
            ${e.pctVMAMoyen ? `<div class="stat-line"><span>% VMA réel</span><span>${e.pctVMAMoyen}%</span></div>` : ''}
            <div class="stat-line"><span>Tours valides</span><span>${e.toursValides}/6</span></div>
            <div style="font-size:0.72rem;font-weight:800;color:${objColor};margin-top:6px;">${objTxt}</div>
            <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:3px;">${toursHtml}</div>
        </div>`;
    }).join('');

    document.getElementById('grid-tech').innerHTML = eleves.map(e => {
        const s = e.seanceL3;
        const sautChips = [
            `<span class="tech-chip ${s.sautTech1 ? 'tech-ok' : 'tech-no'}">${s.sautTech1 ? '✅' : '○'} Élan</span>`,
            `<span class="tech-chip ${s.sautTech2 ? 'tech-ok' : 'tech-no'}">${s.sautTech2 ? '✅' : '○'} Appel</span>`,
        ].join('');
        const lancerChips = [
            `<span class="tech-chip ${s.lancerTech1 ? 'tech-ok' : 'tech-no'}">${s.lancerTech1 ? '✅' : '○'} Profil</span>`,
            `<span class="tech-chip ${s.lancerTech2 ? 'tech-ok' : 'tech-no'}">${s.lancerTech2 ? '✅' : '○'} Prise</span>`,
        ].join('');

        return `<div class="eleve-card">
            <div class="eleve-name">${e.sexe === 'F' ? '👧' : '🧑'} ${e.nomPrenom}</div>
            <div style="font-size:0.78rem;font-weight:700;color:var(--purple);margin-bottom:4px;">🦘 Saut — ${e.techSaut}/2 critères <span style="font-size:0.7rem;color:#aaa">${s.sautDistance ? '· ' + s.sautDistance + ' m' : ''}</span></div>
            <div class="tech-row">${sautChips}</div>
            <div style="font-size:0.78rem;font-weight:700;color:var(--blue);margin:10px 0 4px;">🎯 Lancer — ${e.techLancer}/2 critères <span style="font-size:0.7rem;color:#aaa">${s.lancerDistance ? '· ' + s.lancerDistance + ' m' : ''}</span></div>
            <div class="tech-row">${lancerChips}</div>
        </div>`;
    }).join('');
}

function deleteSessionL3(eleveId, seanceIdx) {
    if(!confirm('🗑️ Supprimer cette session L3 ? Cette action est irréversible.')) return;
    const allStudents = JSON.parse(localStorage.getItem('eps_pro_students') || '[]');
    const idx = allStudents.findIndex(s => s.id === eleveId);
    if(idx === -1) return;
    allStudents[idx].seances.splice(seanceIdx, 1);
    localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
    location.reload();
}

function exportTXT() {
    let txt = `BILAN L3 — DÉCOUVERTE ATHLÉTIQUE\nDate : ${new Date().toLocaleDateString('fr-FR')}\n\n`;
    txt += `RÉSUMÉ CLASSE :\n`;
    txt += `- Élèves avec données L3 : ${bilanData.totalEleves}\n`;
    txt += `- Objectif ≥100% atteint : ${bilanData.stats.tauxObjectifAtteint}%\n`;
    txt += `- Moy. technique saut : ${bilanData.stats.moyenneTechSaut}/2\n`;
    txt += `- Moy. technique lancer : ${bilanData.stats.moyenneTechLancer}/2\n\n`;
    txt += `NIVEAUX CHOISIS :\n`;
    Object.entries(NIVEAUX).forEach(([id, n]) => {
        txt += `- ${n.label} : ${bilanData.stats.niveauxRepartition[id]} élève(s)\n`;
    });
    txt += `\nDÉTAIL ÉLÈVES :\n`;
    bilanData.elevesAvecL3.forEach(e => {
        const s = e.seanceL3;
        txt += `\n${e.nomPrenom} (${e.age} ans, VMA ${e.vma} km/h)\n`;
        txt += `  Niveau choisi : ${e.niv?.label || 'N/D'}\n`;
        txt += `  Moy 200m : ${s.moyenne200m ? (Math.floor(s.moyenne200m/60)+':'+(Math.round(s.moyenne200m%60)).toString().padStart(2,'0')) : '-'}\n`;
        if(e.pctVMAMoyen) txt += `  % VMA réel : ${e.pctVMAMoyen}%\n`;
        txt += `  Tours valides : ${e.toursValides}/6\n`;
        txt += `  Saut : ${e.techSaut}/2 critères${s.sautDistance ? ' — ' + s.sautDistance + 'm' : ''}\n`;
        txt += `  Lancer : ${e.techLancer}/2 critères${s.lancerDistance ? ' — ' + s.lancerDistance + 'm' : ''}\n`;
    });
    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `bilan_L3_${new Date().toLocaleDateString('fr-FR').replace(/\//g,'-')}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
}

function exportXLSX() {
    const wb = XLSX.utils.book_new();

    // Feuille résumé
    const resume = [
        ['BILAN L3 — DÉCOUVERTE ATHLÉTIQUE', ''],
        ['Date', new Date().toLocaleDateString('fr-FR')],
        ['', ''],
        ['Élèves avec données L3', bilanData.totalEleves],
        ['Objectif ≥100% atteint (%)', bilanData.stats.tauxObjectifAtteint],
        ['Moy. technique saut /2', bilanData.stats.moyenneTechSaut],
        ['Moy. technique lancer /2', bilanData.stats.moyenneTechLancer],
        ['', ''],
        ['NIVEAUX', 'Nb élèves'],
        ...Object.entries(NIVEAUX).map(([id, n]) => [n.label, bilanData.stats.niveauxRepartition[id]]),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resume), 'Résumé');

    // Feuille détail
    const header = ['Élève', 'Sexe', 'Âge', 'VMA (km/h)', 'Niveau choisi', '% VMA', 'Moy 200m (s)', 'Tours valides /6', 'Tech saut /2', 'Saut distance (m)', 'Tech lancer /2', 'Lancer distance (m)', 'Objectif atteint'];
    const rows = bilanData.elevesAvecL3.map(e => {
        const s = e.seanceL3;
        return [
            e.nomPrenom,
            e.sexe === 'F' ? 'Fille' : 'Garçon',
            e.age,
            e.vma || '',
            e.niv?.label || '',
            e.pctVMAMoyen ? e.pctVMAMoyen + '%' : '',
            s.moyenne200m ? Math.round(s.moyenne200m) : '',
            e.toursValides,
            e.techSaut,
            s.sautDistance || '',
            e.techLancer,
            s.lancerDistance || '',
            e.objAtteint ? 'Oui' : 'Non',
        ];
    });
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws['!cols'] = header.map(() => ({ wch: 18 }));
    XLSX.utils.book_append_sheet(wb, ws, 'Détail élèves');

    XLSX.writeFile(wb, `bilan_L3_${new Date().toLocaleDateString('fr-FR').replace(/\//g,'-')}.xlsx`);
}

function exportPDF() {
    const d = bilanData;
    const date = new Date().toLocaleDateString('fr-FR');
    const fmtS = s => { if(!s) return '—'; const m=Math.floor(s/60); const sec=Math.round(s%60); return m+':'+String(sec).padStart(2,'0'); };
    const NIVEAU_COLORS = {vma95:'#bfdbfe',vma100:'#bbf7d0',vma105:'#fde68a',vma110:'#fca5a5'};

    // Barres niveaux
    const niveauRows = [['vma95','95% VMA'],['vma100','100% VMA'],['vma105','105% VMA'],['vma110','110% VMA']].map(([id,lbl]) => {
        const count = d.stats.niveauxRepartition[id] || 0;
        const pct = d.totalEleves > 0 ? Math.round(count/d.totalEleves*100) : 0;
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
            <span style="min-width:74px;font-size:0.75rem;font-weight:700">${lbl}</span>
            <div style="flex:1;background:#e2e8f0;border-radius:99px;height:12px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:${NIVEAU_COLORS[id]};border-radius:99px"></div>
            </div>
            <span style="min-width:55px;font-size:0.75rem;color:#64748b">${count} élève${count>1?'s':''} (${pct}%)</span>
        </div>`;
    }).join('');

    // Cartes élèves
    const cards = d.elevesAvecL3.map(e => {
        const s = e.seanceL3;
        const nc = NIVEAU_COLORS[s.niveau] || '#e2e8f0';
        const objColor = e.objAtteint ? '#10b981' : e.toursValides>=4 ? '#f59e0b' : '#ef4444';
        const objLabel = e.objAtteint ? '✅ Objectif atteint' : e.toursValides>=4 ? '⚠️ Objectif non atteint' : '❌ Tours incomplets';
        return `<div class="card" style="border-top:4px solid ${nc}">
            <div class="card-name">${e.sexe==='F'?'👧':'🧑'} ${e.nomPrenom}
                <span style="float:right;background:${nc};border-radius:20px;padding:2px 9px;font-size:0.7rem;font-weight:800;color:#1e293b">${e.niv?.label||'N/D'}</span>
            </div>
            <div class="mini-grid">
                <div class="mini-cell"><span>VMA</span>${e.vma||'?'} km/h${(() => {
        const v = parseFloat(e.vma);
        if(!v) return '';
        const s400 = Math.round(400 / (v / 3.6));
        const s200 = Math.round(200 / (v / 3.6));
        const fmt = s => Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');
        return ` <span style="font-size:0.68rem;color:rgba(255,255,255,0.45);font-weight:400">→ 400m ⏱${fmt(s400)} | 200m ⏱${fmt(s200)}</span>`;
    })()}</div>
                <div class="mini-cell"><span>% VMA réel</span>${e.pctVMAMoyen?e.pctVMAMoyen+'%':'—'}</div>
                <div class="mini-cell"><span>Moy 200m</span>${fmtS(s.moyenne200m)}</div>
                <div class="mini-cell"><span>Tours validés</span>${e.toursValides}/6</div>
            </div>
            <div class="tech-row">
                <div class="tech-cell" style="background:#f0fdf4;border-left:3px solid #10b981">
                    <span style="font-size:0.7rem;color:#64748b">🦘 Tech saut</span><br><strong>${e.techSaut}/2</strong>${s.sautDistance?' · '+s.sautDistance+'m':''}
                </div>
                <div class="tech-cell" style="background:#fffbeb;border-left:3px solid #f59e0b">
                    <span style="font-size:0.7rem;color:#64748b">🎯 Tech lancer</span><br><strong>${e.techLancer}/2</strong>${s.lancerDistance?' · '+s.lancerDistance+'m':''}
                </div>
            </div>
            <div class="result-pill" style="background:${objColor}18;color:${objColor};border:1px solid ${objColor}40">${objLabel}</div>
        </div>`;
    }).join('');

    const win = window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Bilan L3 — EPS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Nunito',Arial,sans-serif;background:#f5f3ff;padding:20px;color:#1e293b}
        .hero{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:white;padding:24px;border-radius:18px;margin-bottom:16px}
        .hero h1{font-size:1.5rem;font-weight:900;margin-bottom:4px}
        .hero p{opacity:0.85;font-size:0.88rem}
        .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
        .kpi{background:white;border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.07)}
        .kpi-val{font-size:1.8rem;font-weight:900;line-height:1}
        .kpi-lbl{font-size:0.67rem;color:#64748b;margin-top:4px}
        .section-title{font-weight:800;color:#475569;font-size:0.78rem;text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px}
        .bar-wrap{background:white;border-radius:14px;padding:16px;margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,0.07)}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
        .card{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.07);break-inside:avoid}
        .card-name{font-weight:800;font-size:0.9rem;margin-bottom:8px}
        .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:0.78rem;margin-bottom:6px}
        .mini-cell{background:#f8fafc;border-radius:8px;padding:6px}
        .mini-cell span{color:#64748b;font-size:0.68rem;display:block}
        .tech-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:0.78rem;margin-bottom:6px}
        .tech-cell{border-radius:8px;padding:6px}
        .result-pill{text-align:center;border-radius:8px;padding:6px;font-weight:800;font-size:0.78rem}
        .no-print{display:flex;gap:12px;justify-content:center;margin:24px 0}
        @media print{.no-print{display:none}body{background:white;padding:10px}@page{margin:10mm}}
    </style></head><body>
    <div class="hero">
        <h1>🏃 Bilan L3 — Découverte Athlétique</h1>
        <p>EPS Épreuve Combinée · ${date} · ${d.totalEleves} élève${d.totalEleves>1?'s':''}</p>
    </div>
    <div class="kpis">
        <div class="kpi"><div class="kpi-val" style="color:#8b5cf6">${d.totalEleves}</div><div class="kpi-lbl">Élèves évalués</div></div>
        <div class="kpi"><div class="kpi-val" style="color:#10b981">${d.stats.tauxObjectifAtteint}%</div><div class="kpi-lbl">Objectif ≥100% atteint</div></div>
        <div class="kpi"><div class="kpi-val" style="color:#6366f1">${d.stats.moyenneTechSaut}<span style="font-size:1.1rem">/2</span></div><div class="kpi-lbl">🦘 Moy. tech saut</div></div>
        <div class="kpi"><div class="kpi-val" style="color:#f59e0b">${d.stats.moyenneTechLancer}<span style="font-size:1.1rem">/2</span></div><div class="kpi-lbl">🎯 Moy. tech lancer</div></div>
    </div>
    <div class="section-title">📊 Répartition des niveaux VMA</div>
    <div class="bar-wrap">${niveauRows}</div>
    <div class="section-title">👥 Fiche par élève</div>
    <div class="grid">${cards}</div>
    <div class="no-print">
        <button onclick="window.print()" style="padding:12px 28px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:white;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer">🖨️ Imprimer / PDF</button>
        <button onclick="window.close()" style="padding:12px 28px;background:#e2e8f0;color:#475569;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer">✕ Fermer</button>
    </div>
    </body></html>`);
    win.document.close();
}

</script>

<!-- SW registration + bandeau offline -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(function(){});
}
(function() {
    function updateBanner() {
        var b = document.getElementById('_offline_banner');
        if (!b) {
            b = document.createElement('div');
            b.id = '_offline_banner';
            b.style.cssText = [
                'display:none','position:fixed','top:0','left:0','right:0',
                'background:#ff6b35','color:#fff','text-align:center',
                'padding:8px 12px','font-size:0.82rem','font-weight:700',
                'z-index:99999','letter-spacing:0.3px'
            ].join(';');
            b.textContent = '\u{1F4E1} Mode hors ligne — données sauvegardées localement';
            document.body.appendChild(b);
        }
        b.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online',  updateBanner);
    window.addEventListener('offline', updateBanner);
    window.addEventListener('load',    updateBanner);
})();
</script>
