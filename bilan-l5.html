    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<body>

<div class="container">
    <h1>EPS<span style="color: var(--olympic-yellow);">: épreuve Combinée</span></h1>
    <p class="subtitle">🏅 BILAN L5 - RELAIS OLYMPIQUE</p>

    <button class="btn-back" onclick="window.location.href='index.html'">← Retour accueil</button>

    <div id="content"></div>

    <button class="export-btn" onclick="exportBilan()" id="exportBtn" style="display:none">
        📄 Exporter .TXT
    </button>
    <button class="export-btn" onclick="exportXLSX()" id="exportXlsxBtn" style="display:none;background:#4ade80;color:black;margin-top:8px;">
        📥 Exporter .XLSX
    </button>
    <button class="export-btn" onclick="exportPDF()" id="exportPdfBtn" style="display:none;background:#8b5cf6;color:white;margin-top:8px;">
        📑 Exporter .PDF
    </button>
</div>

<script>
let ELEVES = [];
let bilanData = null;

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('content').innerHTML = `
            <div class="no-data">
                ⚠️ Aucun élève trouvé. Ajoutez des élèves depuis l'accueil.
            </div>
        `;
        return;
    }
    
    ELEVES = JSON.parse(stored);
    generateBilan();
};

function generateBilan() {
    const elevesL5 = ELEVES.filter(e => e.seances && e.seances.find(s => s.lecon === 'L5'));
    
    if(elevesL5.length === 0) {
        document.getElementById('content').innerHTML = `
            <div class="no-data">
                🏅 Aucune donnée L5 trouvée. Effectuez d'abord la leçon 5 olympique.
            </div>
        `;
        return;
    }

    // Grouper par équipes
    // Stratégie : chaque séance L5 = 1 manche (sauvegardée individuellement par élève)
    // On regroupe par équipe en prenant TOUTES les séances L5 de tous les élèves
    const equipes = {};

    // Collecter toutes les séances L5 de tous les élèves, déduplicater par manche
    // Une manche = un roundResult sauvegardé pour toute l'équipe au même moment
    // Pour éviter le double-comptage, on regroupe par (equipe + date arrondie à la minute)
    const manchesVues = new Set();

    elevesL5.forEach(eleve => {
        const seancesL5 = eleve.seances.filter(s => s.lecon === 'L5');
        if(!seancesL5.length) return;

        seancesL5.forEach(seance => {
            const equipeNom = seance.equipe;
            if(!equipeNom) return;

            // Clé unique par manche : équipe + date arrondie à la minute
            const dateMin = seance.date ? seance.date.slice(0, 16) : 'unknown';
            const mancheKey = `${equipeNom}||${dateMin}`;

            if(!equipes[equipeNom]) {
                equipes[equipeNom] = {
                    nom: equipeNom,
                    membres: {},      // map id → données agrégées
                    mancheKeys: new Set(),
                    distanceTotaleEquipeParManche: [], // une entrée par manche unique
                    objectif: seance.objectifEquipe || 0,
                    performancesParManche: [],
                };
            }

            // Ajouter les données membre (agrégées sur toutes ses séances)
            const membreId = eleve.id;
            if(!equipes[equipeNom].membres[membreId]) {
                equipes[equipeNom].membres[membreId] = {
                    id: membreId,
                    nom: eleve.nomPrenom,
                    distanceIndividuelle: 0,
                    detailManches: []
                };
            }
            equipes[equipeNom].membres[membreId].distanceIndividuelle += seance.distanceTotaleIndividuelle || 0;
            equipes[equipeNom].membres[membreId].detailManches.push(...(seance.detailManches || []));

            // Compter la distance équipe une seule fois par manche unique
            if(!equipes[equipeNom].mancheKeys.has(mancheKey)) {
                equipes[equipeNom].mancheKeys.add(mancheKey);
                equipes[equipeNom].distanceTotaleEquipeParManche.push(seance.distanceTotaleEquipe || 0);
                equipes[equipeNom].performancesParManche.push(seance.performanceMoyenne || 0);
            }
        });
    });

    // Consolider les données équipes
    bilanData = {
        equipes: Object.values(equipes).map(eq => {
            const membres = Object.values(eq.membres);
            const nbManches = eq.mancheKeys.size;
            const distanceTotale = eq.distanceTotaleEquipeParManche.reduce((a,b) => a+b, 0);
            const performanceMoyenne = nbManches > 0
                ? Math.round(eq.performancesParManche.reduce((a,b) => a+b, 0) / nbManches)
                : 0;
            membres.forEach(m => {
                m.distanceMoyenne = nbManches > 0 ? Math.round(m.distanceIndividuelle / nbManches) : 0;
            });
            return {
                nom: eq.nom,
                membres,
                distanceTotale,
                objectif: eq.objectif,
                manches: nbManches,
                performanceMoyenne
            };
        }),
        stats: {
            totalEquipes: 0,
            totalEleves: 0,
            distanceTotaleClasse: 0,
            performanceMoyenneClasse: 0,
            equipesObjectifAtteint: 0
        }
    };

    // Calculs statistiques finaux
    bilanData.stats.totalEquipes = bilanData.equipes.length;
    bilanData.stats.totalEleves = bilanData.equipes.reduce((sum, eq) => sum + eq.membres.length, 0);
    bilanData.stats.distanceTotaleClasse = bilanData.equipes.reduce((sum, eq) => sum + eq.distanceTotale, 0);
    bilanData.stats.performanceMoyenneClasse = Math.round(
        bilanData.equipes.reduce((sum, eq) => sum + eq.performanceMoyenne, 0) / bilanData.equipes.length
    );
    bilanData.stats.equipesObjectifAtteint = bilanData.equipes.filter(eq => eq.performanceMoyenne >= 95).length;

    renderBilan();
}

function renderBilan() {
    const content = document.getElementById('content');
    
    let html = `
        <div class="summary-card">
            <h2>🏆 RÉSUMÉ GÉNÉRAL DES JEUX OLYMPIQUES</h2>
            <div class="summary-stats">
                <div class="summary-box">
                    <div class="summary-number">${bilanData.stats.totalEquipes}</div>
                    <div class="summary-label">Équipes participantes</div>
                </div>
                <div class="summary-box">
                    <div class="summary-number">${bilanData.stats.totalEleves}</div>
                    <div class="summary-label">Athlètes olympiques</div>
                </div>
                <div class="summary-box">
                    <div class="summary-number">${Math.round(bilanData.stats.distanceTotaleClasse/1000*10)/10}km</div>
                    <div class="summary-label">Distance totale</div>
                </div>
                <div class="summary-box">
                    <div class="summary-number">${bilanData.stats.performanceMoyenneClasse}%</div>
                    <div class="summary-label">Performance moyenne</div>
                </div>
            </div>
            <div style="font-size: 1.1rem; margin-top: 20px;">
                🏅 <strong>${bilanData.stats.equipesObjectifAtteint}</strong> équipe(s) ont atteint leur objectif olympique !
            </div>
        </div>
    `;

    if(bilanData.equipes.length > 0) {
        html += renderPodium();
        html += renderEquipesDetails();
    }
    
    content.innerHTML = html;
    document.getElementById('exportBtn').style.display = 'block';
    document.getElementById('exportXlsxBtn').style.display = 'block';
    document.getElementById('exportPdfBtn').style.display = 'block';
}

function renderPodium() {
    const equipesTriees = [...bilanData.equipes].sort((a, b) => b.distanceTotale - a.distanceTotale);
    
    let html = `
        <div style="text-align: center; margin: 40px 0;">
            <h3 style="font-family: 'Orbitron', monospace; font-size: 1.8rem; color: var(--olympic-blue); margin-bottom: 30px;">
                🏆 PODIUM OLYMPIQUE
            </h3>
            <div class="podium">
    `;
    
    if(equipesTriees.length >= 1) {
        html += `
            <div class="podium-place first">
                <div class="podium-medal">🥇</div>
                <div class="podium-team">${equipesTriees[0].nom}</div>
                <div class="podium-distance">${equipesTriees[0].distanceTotale}m</div>
                <div style="margin-top: 8px; font-size: 0.9rem; opacity: 0.8;">
                    ${equipesTriees[0].performanceMoyenne}% objectif
                </div>
            </div>
        `;
    }
    
    if(equipesTriees.length >= 2) {
        html += `
            <div class="podium-place second">
                <div class="podium-medal">🥈</div>
                <div class="podium-team">${equipesTriees[1].nom}</div>
                <div class="podium-distance">${equipesTriees[1].distanceTotale}m</div>
                <div style="margin-top: 8px; font-size: 0.9rem; opacity: 0.8;">
                    ${equipesTriees[1].performanceMoyenne}% objectif
                </div>
            </div>
        `;
    }
    
    if(equipesTriees.length >= 3) {
        html += `
            <div class="podium-place third">
                <div class="podium-medal">🥉</div>
                <div class="podium-team">${equipesTriees[2].nom}</div>
                <div class="podium-distance">${equipesTriees[2].distanceTotale}m</div>
                <div style="margin-top: 8px; font-size: 0.9rem; opacity: 0.8;">
                    ${equipesTriees[2].performanceMoyenne}% objectif
                </div>
            </div>
        `;
    }
    
    html += `
            </div>
        </div>
    `;
    
    return html;
}

function renderEquipesDetails() {
    let html = `
        <div class="card">
            <div class="card-title">👥 DÉTAIL DES ÉQUIPES OLYMPIQUES</div>
    `;
    
    bilanData.equipes.forEach(equipe => {
        const badgeClass = equipe.performanceMoyenne >= 95 ? 'badge-excellent' : 
                          equipe.performanceMoyenne >= 85 ? 'badge-good' : 'badge-progress';
        
        const badgeText = equipe.performanceMoyenne >= 95 ? 'OBJECTIF ATTEINT' : 
                         equipe.performanceMoyenne >= 85 ? 'TRÈS PROCHE' : 'EN PROGRESSION';
        
        html += `
            <div class="team-card">
                <div class="team-header">
                    <span>🏃‍♂️ ${equipe.nom}</span>
                    <span class="performance-badge ${badgeClass}">${badgeText}</span>
                </div>
                
                <div class="team-details">
                    <div class="detail-item">
                        <div class="detail-number">${equipe.distanceTotale}m</div>
                        <div>Distance totale</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-number">${equipe.objectif}m</div>
                        <div>Objectif</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-number">${equipe.performanceMoyenne}%</div>
                        <div>Performance</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-number">${equipe.manches}</div>
                        <div>Manches</div>
                    </div>
                </div>
                
                <div style="margin-top: 16px;">
                    <strong>Membres :</strong>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 8px;">
                        ${equipe.membres.map(membre => {
                            const distanceMoyenne = membre.distanceMoyenne;
                            const distanceTotale = membre.distanceIndividuelle;
                            
                            // Calcul % VMA individuel (estimation)
                            const tempsTotal = equipe.manches * 6; // 6min par manche
                            const vitesseReelle = (distanceTotale / 1000) / (tempsTotal / 60); // km/h
                            const vmaEstimee = 12; // Valeur par défaut, idéalement récupérer vraie VMA
                            const pourcentVMA = Math.round((vitesseReelle / vmaEstimee) * 100);
                            
                            // Objectif individuel (1/4 à 1/6 de l'objectif équipe selon taille)
                            const objectifIndividuel = Math.round(equipe.objectif / equipe.membres.length);
                            const objectifAtteint = distanceMoyenne >= (objectifIndividuel * 0.9); // 90% tolérance
                            
                            // Régularité (si détails manches disponibles)
                            let regularite = "N/A";
                            if(membre.detailManches && membre.detailManches.length > 1) {
                                const distances = membre.detailManches.map(m => m.distance);
                                const moyenne = distances.reduce((a,b) => a+b, 0) / distances.length;
                                const ecartType = Math.sqrt(distances.map(d => Math.pow(d - moyenne, 2)).reduce((a,b) => a+b, 0) / distances.length);
                                regularite = ecartType < 50 ? "Excellent" : ecartType < 100 ? "Bon" : "Variable";
                            }
                            
                            return `
                                <div style="font-size: 0.85rem; padding: 8px; background: white; border-radius: 8px; border: 1px solid #e2e8f0;">
                                    <div style="font-weight: 700; color: var(--olympic-blue); margin-bottom: 6px;">${membre.nom}</div>
                                    <div><strong>Distance:</strong> ${membre.distanceIndividuelle}m</div>
                                    <div><strong>% VMA:</strong> ~${pourcentVMA}%</div>
                                    <div><strong>Objectif:</strong> ${objectifAtteint ? '✅ Atteint' : '⏳ En cours'} (${objectifIndividuel}m)</div>
                                    <div><strong>Régularité:</strong> ${regularite}</div>
                                    <div style="margin-top: 4px; padding: 4px; background: rgba(0,166,81,0.1); border-radius: 4px; font-size: 0.8rem;">
                                        <strong>🤝 Contribution équipe:</strong> ${Math.round((membre.distanceIndividuelle/equipe.distanceTotale)*100)}%
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>
        `;
    });
    
    html += `</div>`;
    return html;
}

function exportBilan() {
    if(!bilanData) return;
    
    let contenu = `BILAN L5 - RELAIS OLYMPIQUE\n`;
    contenu += `Date: ${new Date().toLocaleDateString('fr-FR')}\n\n`;
    
    contenu += `RÉSUMÉ GÉNÉRAL:\n`;
    contenu += `- Équipes participantes: ${bilanData.stats.totalEquipes}\n`;
    contenu += `- Athlètes olympiques: ${bilanData.stats.totalEleves}\n`;
    contenu += `- Distance totale parcourue: ${Math.round(bilanData.stats.distanceTotaleClasse/1000*10)/10}km\n`;
    contenu += `- Performance moyenne: ${bilanData.stats.performanceMoyenneClasse}%\n`;
    contenu += `- Équipes objectif atteint: ${bilanData.stats.equipesObjectifAtteint}\n\n`;
    
    contenu += `CLASSEMENT OLYMPIQUE:\n`;
    const equipesTriees = [...bilanData.equipes].sort((a, b) => b.distanceTotale - a.distanceTotale);
    equipesTriees.forEach((equipe, index) => {
        const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
        contenu += `${medal} ${equipe.nom}: ${equipe.distanceTotale}m (${equipe.performanceMoyenne}% objectif)\n`;
    });
    contenu += `\n`;
    
    contenu += `DÉTAIL PAR ÉQUIPE:\n`;
    bilanData.equipes.forEach(equipe => {
        contenu += `\n${equipe.nom}:\n`;
        contenu += `  Distance totale: ${equipe.distanceTotale}m\n`;
        contenu += `  Objectif: ${equipe.objectif}m\n`;
        contenu += `  Performance: ${equipe.performanceMoyenne}%\n`;
        contenu += `  Manches: ${equipe.manches}\n`;
        contenu += `  Membres:\n`;
        equipe.membres.forEach(membre => {
            const objectifIndiv = Math.round(equipe.objectif / equipe.membres.length);
            const contributionPct = Math.round((membre.distanceIndividuelle/equipe.distanceTotale)*100);
            const tempsTotal = equipe.manches * 6;
            const vitesseReelle = (membre.distanceIndividuelle / 1000) / (tempsTotal / 60);
            const pourcentVMA = Math.round((vitesseReelle / 12) * 100); // VMA estimée 12 km/h
            
            contenu += `    - ${membre.nom}: ${membre.distanceIndividuelle}m total (~${pourcentVMA}% VMA)\n`;
            contenu += `      Objectif individuel: ${objectifIndiv}m (${membre.distanceIndividuelle >= objectifIndiv*0.9 ? 'Atteint' : 'En cours'})\n`;
            contenu += `      Contribution équipe: ${contributionPct}%\n`;
        });
    });

    const blob = new Blob([contenu], { type: 'text/plain;charset=utf-8' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bilan_L5_olympique_${new Date().toLocaleDateString('fr-FR').replace(/\//g, '-')}.txt`;
    a.click();
    window.URL.revokeObjectURL(url);
}
function exportXLSX() {
    if(!bilanData) return;
    const wb = XLSX.utils.book_new();
    const date = new Date().toLocaleDateString('fr-FR');

    // Feuille résumé
    const resume = [
        ['BILAN L5 — RELAIS OLYMPIQUE', ''],
        ['Date', date],
        ['', ''],
        ['Total équipes', bilanData.stats.totalEquipes],
        ['Total élèves', bilanData.stats.totalEleves],
        ['Distance totale (km)', Math.round(bilanData.stats.distanceTotaleClasse/1000*10)/10],
        ['Performance moyenne (%)', bilanData.stats.performanceMoyenneClasse],
        ['Équipes objectif atteint', bilanData.stats.equipesObjectifAtteint],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resume), 'Résumé');

    // Feuille équipes
    const hEq = ['Équipe','Distance totale (m)','Objectif (m)','Performance (%)','Manches','Nb membres'];
    const sorted = [...bilanData.equipes].sort((a,b) => b.distanceTotale - a.distanceTotale);
    const rEq = sorted.map(eq => [eq.nom, eq.distanceTotale, eq.objectif, eq.performanceMoyenne, eq.manches, eq.membres.length]);
    const wsEq = XLSX.utils.aoa_to_sheet([hEq, ...rEq]);
    wsEq['!cols'] = hEq.map(() => ({wch: 20}));
    XLSX.utils.book_append_sheet(wb, wsEq, 'Équipes');

    // Feuille élèves
    const hMb = ['Équipe','Élève','Distance individuelle (m)','% contribution équipe'];
    const rMb = [];
    bilanData.equipes.forEach(eq => {
        eq.membres.forEach(m => {
            rMb.push([eq.nom, m.nom, m.distanceIndividuelle, Math.round((m.distanceIndividuelle/eq.distanceTotale)*100)+'%']);
        });
    });
    const wsMb = XLSX.utils.aoa_to_sheet([hMb, ...rMb]);
    wsMb['!cols'] = hMb.map(() => ({wch: 22}));
    XLSX.utils.book_append_sheet(wb, wsMb, 'Élèves');

    XLSX.writeFile(wb, 'bilan_L5_' + date.replace(/\//g,'-') + '.xlsx');
}

function exportPDF() {
    if(!bilanData) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    const W = doc.internal.pageSize.getWidth();
    const date = new Date().toLocaleDateString('fr-FR');

    doc.setFillColor(0,133,195); doc.rect(0,0,W,22,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont(undefined,'bold');
    doc.text('EPS : Épreuve Combinée', 14, 10);
    doc.setFontSize(11); doc.setFont(undefined,'normal');
    doc.text('BILAN L5 — RELAIS OLYMPIQUE', 14, 17);
    doc.text('Date : ' + date, W-14, 17, {align:'right'});

    doc.setTextColor(30,30,30);
    const stats = [
        ['Équipes', bilanData.stats.totalEquipes],
        ['Élèves', bilanData.stats.totalEleves],
        ['Distance totale', Math.round(bilanData.stats.distanceTotaleClasse/1000*10)/10+'km'],
        ['Perf. moyenne', bilanData.stats.performanceMoyenneClasse+'%'],
        ['Objectif atteint', bilanData.stats.equipesObjectifAtteint+' éq.'],
    ];
    const bw = (W-28)/stats.length;
    stats.forEach(([lbl,val],i) => {
        const x = 14 + i*bw;
        doc.setFillColor(240,248,255); doc.roundedRect(x,26,bw-4,18,2,2,'F');
        doc.setFontSize(14); doc.setFont(undefined,'bold'); doc.setTextColor(0,133,195);
        doc.text(String(val), x+(bw-4)/2, 37, {align:'center'});
        doc.setFontSize(7); doc.setFont(undefined,'normal'); doc.setTextColor(100,100,100);
        doc.text(lbl, x+(bw-4)/2, 42, {align:'center'});
    });

    doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.setTextColor(30,30,30);
    doc.text('Classement équipes', 14, 55);
    const sorted = [...bilanData.equipes].sort((a,b) => b.distanceTotale-a.distanceTotale);
    const headers = [['Rang','Équipe','Distance (m)','Objectif (m)','% atteint','Manches','Membres']];
    const rows = sorted.map((eq,i) => {
        const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
        return [medal, eq.nom, eq.distanceTotale, eq.objectif, eq.performanceMoyenne+'%', eq.manches, eq.membres.length];
    });
    doc.autoTable({startY:59, head:headers, body:rows,
        styles:{fontSize:9, cellPadding:2.5},
        headStyles:{fillColor:[0,133,195], textColor:255, fontStyle:'bold'},
        alternateRowStyles:{fillColor:[240,248,255]},
        margin:{left:14, right:14}});

    const pages = doc.internal.getNumberOfPages();
    for(let p=1; p<=pages; p++){
        doc.setPage(p); doc.setFontSize(7); doc.setTextColor(160,160,160);
        doc.text('EPS Épreuve Combinée · Bilan L5 · '+date+' · Page '+p+'/'+pages, W/2, doc.internal.pageSize.getHeight()-6, {align:'center'});
    }
    doc.save('bilan_L5_'+date.replace(/\//g,'-')+'.pdf');
}

<script>

(function() {
    function updateBanner() {
        var b = document.getElementById('_offline_banner');
        if (!b) {
            b = document.createElement('div');
            b.id = '_offline_banner';
            b.style.cssText = [
                'display:none','position:fixed','top:0','left:0','right:0',
                'background:#ff6b35','color:#fff','text-align:center',
                'padding:8px 12px','font-size:0.82rem','font-weight:700',
                'z-index:99999','letter-spacing:0.3px'
            ].join(';');
            b.textContent = '\u{1F4E1} Mode hors ligne — données sauvegardées localement';
            document.body.appendChild(b);
        }
        b.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online',  updateBanner);
    window.addEventListener('offline', updateBanner);
    window.addEventListener('load',    updateBanner);
})();
</script>
