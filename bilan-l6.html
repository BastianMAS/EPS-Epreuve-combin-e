<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan L6 - EPS: épreuve Combinée</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #ff6b35;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --orange: #ff8800;
            --blue: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0d1f1a 100%);
            color: white;
            padding: 16px;
            min-height: 100vh;
        }

        h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 4px; }
        .subtitle { color: var(--accent); font-weight: 700; font-size: 1rem; margin-bottom: 20px; }

        .btn-back {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stat-value { font-size: 2rem; font-weight: 900; color: var(--accent); }
        .stat-label { font-size: 0.75rem; color: #aaa; margin-top: 4px; }

        /* PYRAMIDE RECAP */
        .pyramide-recap {
            background: var(--card);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .pyramide-title { font-weight: 800; color: var(--accent); margin-bottom: 12px; font-size: 0.9rem; }
        .pyramide-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 0.82rem;
        }
        .pyramide-label { min-width: 120px; color: #ccc; }
        .pyramide-bar-track {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
            height: 16px;
            overflow: hidden;
        }
        .pyramide-bar-fill {
            height: 100%;
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding-left: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            color: black;
            transition: width 0.5s ease;
        }
        .pyramide-count { min-width: 28px; text-align: right; color: #aaa; font-size: 0.75rem; }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 24px 0 12px;
            color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        .eleve-card {
            background: var(--card);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .eleve-name {
            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .score-badge {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 5px;
            margin-left: auto;
        }
        .score-5 { background: rgba(74,222,128,0.3); color: #86efac; }
        .score-4 { background: rgba(251,191,36,0.3); color: #fde68a; }
        .score-3 { background: rgba(251,146,60,0.3); color: #fdba74; }
        .score-low { background: rgba(239,68,68,0.2); color: #fca5a5; }

        .stat-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stat-line:last-child { border-bottom: none; }
        .stat-line span:first-child { color: #888; }
        .stat-line span:last-child { font-weight: 700; }

        .tech-row {
            display: flex;
            gap: 5px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .tech-chip {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }
        .tech-ok { background: rgba(74,222,128,0.2); color: #86efac; border: 1px solid rgba(74,222,128,0.3); }
        .tech-star { background: rgba(251,191,36,0.25); color: #fde68a; border: 1px solid rgba(251,191,36,0.3); }
        .tech-no { background: rgba(255,255,255,0.04); color: #444; border: 1px solid rgba(255,255,255,0.07); }

        /* Pyramide mini per-card */
        .pyramide-mini {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            align-items: center;
        }
        .pyra-step {
            flex: 1;
            height: 14px;
            border-radius: 3px;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .pyra-ok { background: rgba(74,222,128,0.3); color: #86efac; }
        .pyra-no { background: rgba(255,255,255,0.06); color: #444; }

        /* Evolution vs L4 */
        .evolution-badge {
            font-size: 0.68rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }
        .evolution-up { background: var(--success); color: black; }
        .evolution-same { background: rgba(255,255,255,0.15); color: white; }
        .evolution-down { background: var(--danger); color: white; }

        .export-zone {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .export-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .export-btn.xlsx { background: var(--success); color: black; border-color: var(--success); }

        .no-data {
            text-align: center;
            color: #666;
            padding: 40px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.4rem; }
        }
    </style>

    <script src="firebase-config.js"></script>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS<span style="color:var(--accent)">: épreuve Combinée</span></h1>
<p class="subtitle">⚡ BILAN L6 — PERFECTIONNEMENT TECHNIQUE</p>

<div class="stats-grid" id="stats-grid"></div>

<div class="pyramide-recap" id="pyramide-recap" style="display:none">
    <div class="pyramide-title">🔺 Réussite pyramide 60/80/100/80/60m</div>
    <div id="pyramide-bars"></div>
</div>

<div class="export-zone" id="export-zone" style="display:none">
    <button class="export-btn" onclick="exportTXT()">📄 Exporter .TXT</button>
    <button class="export-btn xlsx" onclick="exportXLSX()">📥 Exporter .XLSX</button>
    <button class="export-btn" onclick="exportPDF()" style="background:#8b5cf6;color:white;border-color:#8b5cf6;">📑 Exporter .PDF</button>
</div>

<div class="section-title" id="section-course-title" style="display:none">⚡ Course — Pyramide</div>
<div class="grid" id="grid-course"></div>

<div class="section-title" id="section-tech-title" style="display:none">🦘 Technique Saut &amp; Lancer — Perfectionnement</div>
<div class="grid" id="grid-tech"></div>

<script>
let bilanData = {
    totalEleves: 0,
    elevesAvecL6: [],
    stats: {
        pyramide: { p60_1: 0, p80_1: 0, p100: 0, p80_2: 0, p60_2: 0, complete: 0 },
        moyenneTechSaut: 0,
        moyenneTechLancer: 0,
        tauxCritereHarmonieux: 0,
    }
};

const PYRA_STEPS = [
    { key: 'pyramide60_1',  label: '60m',  id: 'p60_1' },
    { key: 'pyramide80_1',  label: '80m',  id: 'p80_1' },
    { key: 'pyramide100',   label: '100m', id: 'p100'  },
    { key: 'pyramide80_2',  label: '80m↩', id: 'p80_2' },
    { key: 'pyramide60_2',  label: '60m↩', id: 'p60_2' },
];

const SAUT_LABELS   = ['Course d\'élan fluide', 'Placement précis', 'Impulsion maximale', 'Vol et réception', '⭐ Geste harmonieux'];
const LANCER_LABELS = ['Placement optimal', 'Chaîne cinétique', 'Transfert poids', 'Accompagnement', '⭐ Coordination globale'];

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('grid-course').innerHTML = '<div class="no-data">⚠️ Aucune donnée trouvée. Effectuez d\'abord une séance L6.</div>';
        return;
    }
    analyseL6(JSON.parse(stored));
    renderStats();
    renderPyramideRecap();
    renderCards();
    document.getElementById('export-zone').style.display = 'flex';
};

function analyseL6(eleves) {
    const elevesL6 = eleves.filter(e => e.seances?.some(s => s.lecon === 'L6'));
    bilanData.totalEleves = elevesL6.length;

    let totalTechSaut = 0, totalTechLancer = 0, totalHarmonieux = 0;

    elevesL6.forEach(eleve => {
        const s   = eleve.seances.find(s => s.lecon === 'L6');
        const sL4 = eleve.seances?.find(s => s.lecon === 'L4') || null;

        // Pyramide
        PYRA_STEPS.forEach(p => { if(s[p.key]) bilanData.stats.pyramide[p.id]++; });
        const pyramideComplete = PYRA_STEPS.every(p => s[p.key]);
        if(pyramideComplete) bilanData.stats.pyramide.complete++;

        const techSaut   = [s.sautTech1,s.sautTech2,s.sautTech3,s.sautTech4].filter(Boolean).length;
        const techLancer = [s.lancerTech1,s.lancerTech2,s.lancerTech3,s.lancerTech4].filter(Boolean).length;
        totalTechSaut   += techSaut;
        totalTechLancer += techLancer;
        if(s.sautTech5 || s.lancerTech5) totalHarmonieux++;

        // Évolution saut distance vs L4
        let evolSaut = null, evolLancer = null;
        if(s.sautDistance && sL4?.sautDistance) {
            const diff = parseFloat(s.sautDistance) - parseFloat(sL4.sautDistance);
            evolSaut = diff > 0.05 ? 'up' : diff < -0.05 ? 'down' : 'same';
        }
        if(s.lancerDistance && sL4?.lancerDistance) {
            const diff = parseFloat(s.lancerDistance) - parseFloat(sL4.lancerDistance);
            evolLancer = diff > 0.05 ? 'up' : diff < -0.05 ? 'down' : 'same';
        }

        bilanData.elevesAvecL6.push({
            nomPrenom: eleve.nomPrenom,
            sexe: eleve.sexe,
            age: eleve.age,
            vma: eleve.vma,
            seanceL6: s,
            seanceL4: sL4,
            techSaut, techLancer,
            harmonieux: s.sautTech5 || s.lancerTech5,
            pyramideComplete,
            evolSaut, evolLancer,
        });
    });

    if(elevesL6.length > 0) {
        bilanData.stats.moyenneTechSaut   = Math.round((totalTechSaut   / elevesL6.length) * 10) / 10;
        bilanData.stats.moyenneTechLancer = Math.round((totalTechLancer / elevesL6.length) * 10) / 10;
        bilanData.stats.tauxCritereHarmonieux = Math.round((totalHarmonieux / elevesL6.length) * 100);
    }
}

function renderStats() {
    const d = bilanData;
    if(d.totalEleves === 0) {
        document.getElementById('stats-grid').innerHTML = '<div class="no-data">Aucun élève avec données L6.</div>';
        return;
    }
    const pctPyraComplete = Math.round((d.stats.pyramide.complete / d.totalEleves) * 100);
    document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card">
            <div class="stat-value">${d.totalEleves}</div>
            <div class="stat-label">Élèves évalués</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color:var(--success)">${pctPyraComplete}%</div>
            <div class="stat-label">Pyramide complète</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color:var(--purple)">${d.stats.moyenneTechSaut}<span style="font-size:1rem">/4</span></div>
            <div class="stat-label">Moy. tech saut</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color:var(--blue)">${d.stats.moyenneTechLancer}<span style="font-size:1rem">/4</span></div>
            <div class="stat-label">Moy. tech lancer</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" style="color:var(--warning)">${d.stats.tauxCritereHarmonieux}%</div>
            <div class="stat-label">Critère ⭐ harmonieux</div>
        </div>
    `;
}

function renderPyramideRecap() {
    const p = bilanData.stats.pyramide;
    const total = bilanData.totalEleves;
    if(total === 0) return;
    document.getElementById('pyramide-recap').style.display = 'block';
    const colors = ['#93c5fd', '#86efac', '#fde68a', '#86efac', '#93c5fd'];
    document.getElementById('pyramide-bars').innerHTML = PYRA_STEPS.map((step, i) => {
        const count = p[step.id] || 0;
        const pct = Math.round((count / total) * 100);
        return `<div class="pyramide-row">
            <div class="pyramide-label">${step.label}</div>
            <div class="pyramide-bar-track">
                <div class="pyramide-bar-fill" style="width:${pct}%;background:${colors[i]};">${pct > 12 ? pct+'%' : ''}</div>
            </div>
            <div class="pyramide-count">${count}/${total}</div>
        </div>`;
    }).join('') + `<div style="margin-top:8px;font-size:0.78rem;color:var(--success);font-weight:700;">🏆 Pyramide complète : ${p.complete}/${total} élèves</div>`;
}

function renderCards() {
    const eleves = bilanData.elevesAvecL6;
    if(eleves.length === 0) return;

    document.getElementById('section-course-title').style.display = 'block';
    document.getElementById('section-tech-title').style.display = 'block';

    // COURSE — pyramide per-card
    document.getElementById('grid-course').innerHTML = eleves.map(e => {
        const s = e.seanceL6;
        const pyraHtml = PYRA_STEPS.map(p =>
            `<div class="pyra-step ${s[p.key] ? 'pyra-ok' : 'pyra-no'}">${p.label}</div>`
        ).join('');
        const pyramideTxt = e.pyramideComplete
            ? '<span style="color:var(--success);font-weight:800;font-size:0.75rem;">🏆 Complète</span>'
            : `<span style="color:var(--warning);font-size:0.75rem;">${PYRA_STEPS.filter(p=>s[p.key]).length}/5 étapes</span>`;

        return `<div class="eleve-card">
            <div class="eleve-name">${e.sexe === 'F' ? '👧' : '🧑'} ${e.nomPrenom} ${pyramideTxt}</div>
            <div style="font-size:0.72rem;color:#888;margin-bottom:6px;">🔺 Pyramide 60/80/100/80↩/60↩</div>
            <div class="pyramide-mini">${pyraHtml}</div>
            ${s.pyramideEchec ? `<div style="font-size:0.72rem;color:var(--danger);margin-top:6px;">❌ Abandon : ${s.pyramideEchec}</div>` : ''}
        </div>`;
    }).join('');

    // TECHNIQUE per-card
    document.getElementById('grid-tech').innerHTML = eleves.map(e => {
        const s = e.seanceL6;

        const sautTechs = [s.sautTech1,s.sautTech2,s.sautTech3,s.sautTech4,s.sautTech5];
        const lancerTechs = [s.lancerTech1,s.lancerTech2,s.lancerTech3,s.lancerTech4,s.lancerTech5];

        const sautChips = SAUT_LABELS.map((lbl, i) => {
            const ok = sautTechs[i];
            const cls = i === 4 ? (ok ? 'tech-star' : 'tech-no') : (ok ? 'tech-ok' : 'tech-no');
            return `<span class="tech-chip ${cls}">${ok ? (i===4?'⭐':'✅') : '○'} ${lbl.replace('⭐ ','')}</span>`;
        }).join('');
        const lancerChips = LANCER_LABELS.map((lbl, i) => {
            const ok = lancerTechs[i];
            const cls = i === 4 ? (ok ? 'tech-star' : 'tech-no') : (ok ? 'tech-ok' : 'tech-no');
            return `<span class="tech-chip ${cls}">${ok ? (i===4?'⭐':'✅') : '○'} ${lbl.replace('⭐ ','')}</span>`;
        }).join('');

        const scoreClass = (score) => score >= 5 ? 'score-5' : score >= 4 ? 'score-4' : score >= 3 ? 'score-3' : 'score-low';
        const totalScore = e.techSaut + e.techLancer + (s.sautTech5 ? 1 : 0) + (s.lancerTech5 ? 1 : 0);

        // évolution saut
        const evolSautHtml = e.evolSaut
            ? `<span class="evolution-badge evolution-${e.evolSaut}">${e.evolSaut==='up'?'📈 progrès':e.evolSaut==='down'?'📉 recul':'➡️ stable'}</span>`
            : '';

        return `<div class="eleve-card">
            <div class="eleve-name">
                ${e.sexe === 'F' ? '👧' : '🧑'} ${e.nomPrenom}
                <span class="score-badge ${scoreClass(totalScore)}">${totalScore}/10</span>
            </div>
            <div style="font-size:0.78rem;font-weight:700;color:var(--purple);margin-bottom:4px;">
                🦘 Saut — ${e.techSaut}/4${s.sautTech5?' ⭐':''}
                <span style="color:#888;font-weight:400;font-size:0.7rem;"> ${s.sautDistance ? s.sautDistance+'m' : ''}</span>
            </div>
            <div class="tech-row">${sautChips}</div>
            <div style="font-size:0.78rem;font-weight:700;color:var(--blue);margin:10px 0 4px;">
                🎯 Lancer — ${e.techLancer}/4${s.lancerTech5?' ⭐':''}
                <span style="color:#888;font-weight:400;font-size:0.7rem;"> ${s.lancerDistance ? s.lancerDistance+'m' : ''}</span>
            </div>
            <div class="tech-row">${lancerChips}</div>
        </div>`;
    }).join('');
}

function exportTXT() {
    let txt = `BILAN L6 — PERFECTIONNEMENT TECHNIQUE\nDate : ${new Date().toLocaleDateString('fr-FR')}\n\n`;
    txt += `RÉSUMÉ CLASSE :\n`;
    txt += `- Élèves : ${bilanData.totalEleves}\n`;
    txt += `- Pyramide complète : ${bilanData.stats.pyramide.complete}/${bilanData.totalEleves}\n`;
    txt += `- Moy. technique saut : ${bilanData.stats.moyenneTechSaut}/4\n`;
    txt += `- Moy. technique lancer : ${bilanData.stats.moyenneTechLancer}/4\n`;
    txt += `- Critère harmonieux ⭐ : ${bilanData.stats.tauxCritereHarmonieux}%\n\nDÉTAIL :\n`;
    bilanData.elevesAvecL6.forEach(e => {
        const s = e.seanceL6;
        txt += `\n${e.nomPrenom} (${e.age} ans)\n`;
        txt += `  Pyramide : ${PYRA_STEPS.filter(p=>s[p.key]).length}/5 étapes${e.pyramideComplete?' (complète)':''}\n`;
        txt += `  Saut : ${e.techSaut}/4 critères${s.sautTech5?' ⭐':''}${s.sautDistance?' — '+s.sautDistance+'m':''}\n`;
        txt += `  Lancer : ${e.techLancer}/4 critères${s.lancerTech5?' ⭐':''}${s.lancerDistance?' — '+s.lancerDistance+'m':''}\n`;
    });
    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `bilan_L6_${new Date().toLocaleDateString('fr-FR').replace(/\//g,'-')}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
}

function exportXLSX() {
    const wb = XLSX.utils.book_new();

    const resume = [
        ['BILAN L6 — PERFECTIONNEMENT TECHNIQUE', ''],
        ['Date', new Date().toLocaleDateString('fr-FR')],
        ['', ''],
        ['Élèves avec données L6', bilanData.totalEleves],
        ['Pyramide complète', bilanData.stats.pyramide.complete],
        ['Moy. technique saut /4', bilanData.stats.moyenneTechSaut],
        ['Moy. technique lancer /4', bilanData.stats.moyenneTechLancer],
        ['Critère ⭐ harmonieux (%)', bilanData.stats.tauxCritereHarmonieux],
        ['', ''],
        ['PYRAMIDE', 'Nb réussite'],
        ...PYRA_STEPS.map(p => [p.label, bilanData.stats.pyramide[p.id]]),
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resume), 'Résumé');

    const header = ['Élève', 'Sexe', 'Âge', 'VMA', 'Pyramide (étapes/5)', 'Pyramide complète',
        'Tech saut /4', '⭐ Harmonieux saut', 'Saut dist (m)',
        'Tech lancer /4', '⭐ Harmonieux lancer', 'Lancer dist (m)'];
    const rows = bilanData.elevesAvecL6.map(e => {
        const s = e.seanceL6;
        return [
            e.nomPrenom,
            e.sexe === 'F' ? 'Fille' : 'Garçon',
            e.age,
            e.vma || '',
            PYRA_STEPS.filter(p => s[p.key]).length,
            e.pyramideComplete ? 'Oui' : 'Non',
            e.techSaut,
            s.sautTech5 ? 'Oui' : 'Non',
            s.sautDistance || '',
            e.techLancer,
            s.lancerTech5 ? 'Oui' : 'Non',
            s.lancerDistance || '',
        ];
    });
    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
    ws['!cols'] = header.map(() => ({ wch: 16 }));
    XLSX.utils.book_append_sheet(wb, ws, 'Détail élèves');

    XLSX.writeFile(wb, `bilan_L6_${new Date().toLocaleDateString('fr-FR').replace(/\//g,'-')}.xlsx`);
}

function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const d = bilanData;
    const date = new Date().toLocaleDateString('fr-FR');
    const W = doc.internal.pageSize.getWidth();

    doc.setFillColor(16, 185, 129);
    doc.rect(0, 0, W, 22, 'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(16); doc.setFont(undefined,'bold');
    doc.text('EPS : Épreuve Combinée', 14, 10);
    doc.setFontSize(11); doc.setFont(undefined,'normal');
    doc.text('BILAN L6 — PERFECTIONNEMENT TECHNIQUE', 14, 17);
    doc.text('Date : ' + date, W - 14, 17, { align: 'right' });

    doc.setTextColor(30,30,30);
    const stats = [
        ['Élèves', d.totalEleves],
        ['Pyramide complète', d.stats.pyramide.complete],
        ['Tech saut /4', d.stats.moyenneTechSaut],
        ['Tech lancer /4', d.stats.moyenneTechLancer],
        ['Critère ⭐', d.stats.tauxCritereHarmonieux + '%'],
    ];
    const bw = (W - 28) / stats.length;
    stats.forEach(([lbl, val], i) => {
        const x = 14 + i * bw;
        doc.setFillColor(240, 253, 244);
        doc.roundedRect(x, 26, bw - 4, 18, 2, 2, 'F');
        doc.setFontSize(15); doc.setFont(undefined,'bold');
        doc.setTextColor(16, 185, 129);
        doc.text(String(val), x + (bw-4)/2, 37, { align: 'center' });
        doc.setFontSize(7); doc.setFont(undefined,'normal');
        doc.setTextColor(100,100,100);
        doc.text(lbl, x + (bw-4)/2, 42, { align: 'center' });
    });

    doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.setTextColor(30,30,30);
    doc.text('Détail par élève', 14, 55);

    const fmtPyra = e => {
        const s = e.seanceL6;
        const steps = ['pyramide60_1','pyramide80_1','pyramide100','pyramide80_2','pyramide60_2'];
        return steps.filter(k => s[k]).length + '/5' + (e.pyramideComplete ? ' ✓' : '');
    };
    const headers = [['Élève', 'Âge', 'VMA', 'Pyramide', 'Tech saut/4', '⭐ saut', 'Dist. saut', 'Tech lancer/4', '⭐ lancer', 'Dist. lancer', 'Total/10']];
    const rows = d.elevesAvecL6.map(e => {
        const s = e.seanceL6;
        const total = e.techSaut + e.techLancer + (s.sautTech5?1:0) + (s.lancerTech5?1:0);
        return [
            e.nomPrenom,
            e.age,
            e.vma ? e.vma + ' km/h' : '-',
            fmtPyra(e),
            e.techSaut + '/4',
            s.sautTech5 ? '⭐' : '-',
            s.sautDistance ? s.sautDistance + 'm' : '-',
            e.techLancer + '/4',
            s.lancerTech5 ? '⭐' : '-',
            s.lancerDistance ? s.lancerDistance + 'm' : '-',
            total + '/10',
        ];
    });

    doc.autoTable({
        startY: 59,
        head: headers,
        body: rows,
        styles: { fontSize: 7.5, cellPadding: 2 },
        headStyles: { fillColor: [16, 185, 129], textColor: 255, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [240, 253, 244] },
        margin: { left: 14, right: 14 },
    });

    const pages = doc.internal.getNumberOfPages();
    for(let p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFontSize(7); doc.setTextColor(160,160,160); doc.setFont(undefined,'normal');
        doc.text('EPS Épreuve Combinée · Bilan L6 · ' + date + ' · Page ' + p + '/' + pages, W/2, doc.internal.pageSize.getHeight() - 6, { align: 'center' });
    }
    doc.save('bilan_L6_' + date.replace(/\//g,'-') + '.pdf');
}

</script>

<!-- SW registration + bandeau offline -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(function(){});
}
(function() {
    function updateBanner() {
        var b = document.getElementById('_offline_banner');
        if (!b) {
            b = document.createElement('div');
            b.id = '_offline_banner';
            b.style.cssText = [
                'display:none','position:fixed','top:0','left:0','right:0',
                'background:#ff6b35','color:#fff','text-align:center',
                'padding:8px 12px','font-size:0.82rem','font-weight:700',
                'z-index:99999','letter-spacing:0.3px'
            ].join(';');
            b.textContent = '\u{1F4E1} Mode hors ligne — données sauvegardées localement';
            document.body.appendChild(b);
        }
        b.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online',  updateBanner);
    window.addEventListener('offline', updateBanner);
    window.addEventListener('load',    updateBanner);
})();
</script>
