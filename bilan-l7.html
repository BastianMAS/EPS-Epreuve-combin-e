<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan L7 - Mise en Situation Adaptative - EPS: épreuve Combinée</title>

            --card: #1a2332;
            --accent: #ff6b35;

        h1 { 
            text-align: center;

            font-weight: 900;

            background-clip: text;

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS: épreuve Combinée</h1>
<p class="subtitle">🎯 BILAN L7 - MISE EN SITUATION ADAPTATIVE</p>

<div class="stats-grid" id="stats-grid"></div>
<div class="eleves-list" id="eleves-list"></div>

<script>
let bilanData = {
    elevesAvecL7: [],
    stats: {
        totalEleves: 0,
        vmaMovennne: 0,
        confiantsL8: 0,
        strategiesTrouvees: 0
    }
};

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('eleves-list').innerHTML = '<div class="no-data">⚠️ Aucune donnée trouvée</div>';
        return;
    }
    
    const eleves = JSON.parse(stored);
    analyzerL7(eleves);
    renderStats();
    renderEleves();
};

function analyzerL7(eleves) {
    console.log('=== ANALYSE L7 DEBUG ===');
    bilanData.elevesAvecL7 = [];
    
    eleves.forEach(eleve => {
        // Prendre TOUTES les sessions L7, pas seulement la première
        const seancesL7 = eleve.seances?.filter(s => s.lecon === 'L7') || [];
        if(!seancesL7.length) return;

        const sessionsAnalysees = seancesL7.map((seanceL7, sessionIdx) => {
            let pctVMA1 = null, pctVMA2 = null, pctVMA3 = null, pctVMAMoyen = null;
            
            if(seanceL7.temps1 && seanceL7.temps2 && seanceL7.temps3 && eleve.vma) {
                const vmaKmh = parseFloat(eleve.vma);
                const vmaMs = vmaKmh / 3.6;
                const t1 = convertTempsIntelligent(seanceL7.temps1);
                const t2 = convertTempsIntelligent(seanceL7.temps2);
                const t3 = convertTempsIntelligent(seanceL7.temps3);
                if(t1 > 0 && t2 > 0 && t3 > 0) {
                    pctVMA1 = Math.round((400/t1/vmaMs)*100);
                    pctVMA2 = Math.round((400/t2/vmaMs)*100);
                    pctVMA3 = Math.round((400/t3/vmaMs)*100);
                    if(pctVMA1>=50&&pctVMA1<=200&&pctVMA2>=50&&pctVMA2<=200&&pctVMA3>=50&&pctVMA3<=200) {
                        pctVMAMoyen = Math.round((pctVMA1+pctVMA2+pctVMA3)/3);
                    } else {
                        pctVMA1=pctVMA2=pctVMA3=pctVMAMoyen=null;
                    }
                }
            }
            
            const travailSaut = [];
            const travailLancer = [];
            if(seanceL7.sautCourseElan) travailSaut.push("Course d'élan");
            if(seanceL7.sautPrecision) travailSaut.push("Précision");
            if(seanceL7.sautReception) travailSaut.push("Réception");
            if(seanceL7.sautDistance) travailSaut.push("Distance");
            if(seanceL7.lancerCoordination) travailLancer.push("Coordination");
            if(seanceL7.lancerTransfert) travailLancer.push("Transfert");
            if(seanceL7.lancerAccompagnement) travailLancer.push("Accompagnement");
            if(seanceL7.lancerRegularite) travailLancer.push("Régularité");

            return {
                sessionIdx,   // index dans le tableau seances de l'élève (pour suppression)
                seanceIdx: eleve.seances.indexOf(seanceL7),
                seanceL7,
                pctVMA1, pctVMA2, pctVMA3, pctVMAMoyen,
                travailSaut, travailLancer,
                date: seanceL7.date
            };
        });
        
        bilanData.elevesAvecL7.push({
            id: eleve.id,
            nomPrenom: eleve.nomPrenom,
            sexe: eleve.sexe,
            vma: eleve.vma,
            sessions: sessionsAnalysees,
            // Rétrocompat : exposer la dernière session comme seanceL7
            seanceL7: sessionsAnalysees[sessionsAnalysees.length-1]?.seanceL7,
            pctVMAMoyen: sessionsAnalysees[sessionsAnalysees.length-1]?.pctVMAMoyen,
        });
    });

        // Stats globales
    bilanData.stats.totalEleves = bilanData.elevesAvecL7.length;
    bilanData.stats.confiantsL8 = bilanData.elevesAvecL7.filter(e => e.seanceL7.confiantL8).length;
    bilanData.stats.strategiesTrouvees = bilanData.elevesAvecL7.filter(e => e.seanceL7.strategieTrouvee).length;
    
    // VMA moyenne de classe
    const elevesAvecVMA = bilanData.elevesAvecL7.filter(e => e.pctVMAMoyen);
    bilanData.stats.vmaMovennne = elevesAvecVMA.length > 0 ? 
        Math.round(elevesAvecVMA.reduce((acc, e) => acc + e.pctVMAMoyen, 0) / elevesAvecVMA.length) : 0;
    
    console.log(`Stats finales: ${bilanData.stats.totalEleves} élèves, VMA moy: ${bilanData.stats.vmaMovennne}%`);
}

// Fonction conversion intelligente pour analyses
function convertTempsIntelligent(tempsStr) {
    if(!tempsStr || tempsStr.trim() === '') return 0;
    
    const input = tempsStr.trim();
    console.log(`🔍 Conversion bilan: "${input}"`);
    
    // Format standard M:SS ou MM:SS
    const matchStandard = input.match(/^(\d+):(\d+)$/);
    if(matchStandard) {
        const min = parseInt(matchStandard[1]);
        const sec = parseInt(matchStandard[2]);
        if(sec < 60) {
            const total = min * 60 + sec;
            console.log(`✅ ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
            return total;
        }
        console.log(`⚠️ Secondes invalides: ${sec}`);
        return 0;
    }
    
    // Format avec dixièmes M:SS.D
    const matchDixiemes = input.match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        if(sec < 60) {
            const total = min * 60 + sec + dixieme / 10;
            console.log(`✅ ${min}:${sec.toString().padStart(2,'0')}.${dixieme} = ${total}s`);
            return total;
        }
        return 0;
    }
    
    // Corrections automatiques silencieuses pour bilans
    
    // Format décimal 2.30 → 2:30
    const matchDecimal = input.replace(',', '.').match(/^(\d+)[.,](\d+)$/);
    if(matchDecimal) {
        const min = parseInt(matchDecimal[1]);
        const sec = parseInt(matchDecimal[2]);
        if(sec < 60 && min >= 0 && min <= 10) {
            const total = min * 60 + sec;
            console.log(`🔄 Auto-corrigé: ${input} → ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
            return total;
        }
    }
    
    // Nombre entier
    const nombreEntier = parseInt(input);
    if(!isNaN(nombreEntier) && nombreEntier.toString() === input) {
        
        // Secondes directes logiques
        if(nombreEntier >= 60 && nombreEntier <= 300) {
            console.log(`🔄 Secondes directes: ${nombreEntier}s`);
            return nombreEntier;
        }
        
        // Format MMSS → MM:SS
        if(nombreEntier >= 100 && nombreEntier <= 999) {
            const minStr = Math.floor(nombreEntier / 100);
            const secStr = nombreEntier % 100;
            if(secStr < 60 && minStr >= 1 && minStr <= 9) {
                const total = minStr * 60 + secStr;
                console.log(`🔄 Auto-corrigé: ${nombreEntier} → ${minStr}:${secStr.toString().padStart(2,'0')} = ${total}s`);
                return total;
            }
        }
    }
    
    // Secondes avec décimales
    const secondes = parseFloat(input.replace(',', '.'));
    if(!isNaN(secondes) && secondes >= 60 && secondes <= 300) {
        console.log(`🔄 Secondes décimales: ${secondes}s`);
        return secondes;
    }
    
    console.log(`❌ Format non reconnu: "${input}"`);
    return 0;
}

function convertTempsAvecValidation(tempsStr, inputElement = null) {
    if(!tempsStr || tempsStr.trim() === '') return { valide: false, secondes: 0 };
    
    const input = tempsStr.trim();
    console.log(`🔍 Analyse temps: "${input}"`);
    
    // ✅ FORMATS VALIDES ACCEPTÉS
    
    // Format standard M:SS ou MM:SS
    const matchStandard = input.match(/^(\d+):(\d+)$/);
    if(matchStandard) {
        const min = parseInt(matchStandard[1]);
        const sec = parseInt(matchStandard[2]);
        
        if(sec >= 60) {
            showTempsAlert(`❌ Erreur : ${sec} secondes impossible !\n\n✅ Correction : ${min}:${Math.floor(sec/60)+min}${(sec%60).toString().padStart(2,'0')}\n\nFormat attendu : M:SS (ex: 2:30 pour 2min30s)`, inputElement);
            return { valide: false, secondes: 0 };
        }
        
        const total = min * 60 + sec;
        console.log(`✅ ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
        return { valide: true, secondes: total };
    }
    
    // Format avec dixièmes M:SS.D
    const matchDixiemes = input.match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        
        if(sec >= 60) {
            showTempsAlert(`❌ Erreur : ${sec} secondes impossible !\n\nFormat attendu : M:SS (ex: 2:30)`, inputElement);
            return { valide: false, secondes: 0 };
        }
        
        const total = min * 60 + sec + dixieme / 10;
        console.log(`✅ ${min}:${sec.toString().padStart(2,'0')}.${dixieme} = ${total}s`);
        return { valide: true, secondes: total };
    }
    
    // 🔄 CORRECTIONS AUTOMATIQUES INTELLIGENTES
    
    // Format décimal avec point/virgule : 2.30 → 2:30
    const matchDecimal = input.replace(',', '.').match(/^(\d+)[.,](\d+)$/);
    if(matchDecimal) {
        const min = parseInt(matchDecimal[1]);
        const sec = parseInt(matchDecimal[2]);
        
        if(sec < 60) {
            const correction = `${min}:${sec.toString().padStart(2,'0')}`;
            if(confirm(`⚠️ Tu as écrit "${input}"\n\n✅ Tu veux dire "${correction}" ?\n\n(${min} minutes ${sec} secondes)\n\nCliquer OK pour corriger automatiquement`)) {
                if(inputElement) inputElement.value = correction;
                const total = min * 60 + sec;
                console.log(`🔄 Corrigé: ${correction} = ${total}s`);
                return { valide: true, secondes: total };
            }
        }
        
        showTempsAlert(`❌ Format incorrect : "${input}"\n\n✅ Format attendu : M:SS\nExemple : 1:25 pour 1min25s`, inputElement);
        return { valide: false, secondes: 0 };
    }
    
    // Nombre entier : possible secondes directes ou erreur de format
    const nombreEntier = parseInt(input);
    if(!isNaN(nombreEntier) && nombreEntier.toString() === input) {
        
        // Secondes directes logiques (60-300s pour 400m)
        if(nombreEntier >= 60 && nombreEntier <= 300) {
            const min = Math.floor(nombreEntier / 60);
            const sec = nombreEntier % 60;
            const correction = `${min}:${sec.toString().padStart(2,'0')}`;
            
            if(confirm(`⚠️ Tu as écrit "${nombreEntier}"\n\n✅ Tu veux dire ${nombreEntier} secondes (${correction}) ?\n\nCliquer OK pour corriger`)) {
                if(inputElement) inputElement.value = correction;
                console.log(`🔄 ${nombreEntier}s → ${correction}`);
                return { valide: true, secondes: nombreEntier };
            }
        }
        
        // Erreur probable : format MMSS au lieu de MM:SS
        if(nombreEntier >= 100 && nombreEntier <= 999) {
            const minStr = Math.floor(nombreEntier / 100).toString();
            const secStr = (nombreEntier % 100).toString().padStart(2, '0');
            const sec = parseInt(secStr);
            
            if(sec < 60) {
                const correction = `${minStr}:${secStr}`;
                if(confirm(`⚠️ Tu as écrit "${nombreEntier}"\n\n✅ Tu veux dire "${correction}" ?\n\n(${minStr} minutes ${sec} secondes)\n\nCliquer OK pour corriger`)) {
                    if(inputElement) inputElement.value = correction;
                    const total = parseInt(minStr) * 60 + sec;
                    console.log(`🔄 Corrigé: ${nombreEntier} → ${correction} = ${total}s`);
                    return { valide: true, secondes: total };
                }
            }
        }
        
        showTempsAlert(`❌ Temps impossible : "${input}"\n\n✅ Format attendu : M:SS\nExemples :\n• 1:25 pour 1min25s\n• 2:00 pour 2min00s`, inputElement);
        return { valide: false, secondes: 0 };
    }
    
    // Secondes avec décimales
    const secondes = parseFloat(input.replace(',', '.'));
    if(!isNaN(secondes) && secondes > 0) {
        if(secondes >= 60 && secondes <= 300) {
            const min = Math.floor(secondes / 60);
            const sec = Math.floor(secondes % 60);
            const dixieme = Math.round((secondes % 1) * 10);
            const correction = dixieme > 0 ? `${min}:${sec.toString().padStart(2,'0')}.${dixieme}` : `${min}:${sec.toString().padStart(2,'0')}`;
            
            if(confirm(`⚠️ Tu as écrit "${input}"\n\n✅ Tu veux dire ${secondes}s (${correction}) ?\n\nCliquer OK pour corriger`)) {
                if(inputElement) inputElement.value = correction;
                console.log(`🔄 ${secondes}s → ${correction}`);
                return { valide: true, secondes: secondes };
            }
        }
    }
    
    // Format non reconnu
    showTempsAlert(`❌ Format non reconnu : "${input}"\n\n✅ Formats acceptés :\n• 1:25 (1min25s)\n• 2:00 (2min00s)\n• 1:30.5 (1min30s et 5 dixièmes)\n\n📝 Exemple : Pour 1 minute et 25 secondes, écris 1:25`, inputElement);
    return { valide: false, secondes: 0 };
}

function showTempsAlert(message, inputElement = null) {
    alert(message);
    if(inputElement) {
        inputElement.focus();
        inputElement.style.border = '3px solid #ef4444';
        setTimeout(() => {
            if(inputElement.style) inputElement.style.border = '';
        }, 3000);
    }
}

// Fonction simplifiée pour les bilans (sans validation UI)
function convertTemps(tempsStr) {
    const result = convertTempsAvecValidation(tempsStr);
    return result.valide ? result.secondes : 0;
}

function renderStats() {
    const container = document.getElementById('stats-grid');
    
    if(bilanData.stats.totalEleves === 0) {
        container.innerHTML = '<div class="no-data">⚠️ Aucune séance L7 trouvée</div>';
        return;
    }
    
    const tauxConfiance = Math.round((bilanData.stats.confiantsL8 / bilanData.stats.totalEleves) * 100);
    
    container.innerHTML = `
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.totalEleves}</div>
            <div class="stat-label">Élèves évalués</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.vmaMovennne}%</div>
            <div class="stat-label">% VMA moyen classe</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.confiantsL8}</div>
            <div class="stat-label">Confiants pour L8</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${tauxConfiance}%</div>
            <div class="stat-label">Taux de confiance</div>
        </div>
    `;
}

function renderEleves() {
    const container = document.getElementById('eleves-list');
    
    if(bilanData.elevesAvecL7.length === 0) {
        container.innerHTML = '<div class="no-data">⚠️ Aucun élève avec séance L7</div>';
        return;
    }
    
    let html = '';
    
    bilanData.elevesAvecL7.forEach(eleve => {
        const nbSessions = eleve.sessions.length;
        
        html += `<div class="eleve-card">
            <div class="eleve-header">
                <span>${eleve.sexe === 'F' ? '👧' : '🧑'}</span>
                <span>${eleve.nomPrenom}</span>
                <span style="margin-left: auto; font-size: 0.8rem;">VMA ${eleve.vma || 'N/A'} km/h</span>
            </div>`;

        eleve.sessions.forEach((sess, si) => {
            const seance = sess.seanceL7;
            const dateLabel = sess.date ? new Date(sess.date).toLocaleDateString('fr-FR') : `Session ${si+1}`;
            const isMulti = nbSessions > 1;

            html += `<div class="eleve-body" style="${isMulti ? 'border-top: 2px dashed rgba(255,255,255,0.1); padding-top:10px;' : ''}">`;
            
            if(isMulti) {
                html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <span style="font-size:0.8rem;color:#94a3b8;font-weight:700;">📅 ${dateLabel}</span>
                    <button onclick="deleteSession('${eleve.id}', ${sess.seanceIdx})" 
                        style="background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;
                               padding:3px 10px;border-radius:6px;font-size:0.75rem;cursor:pointer;font-weight:700;">
                        🗑️ Supprimer
                    </button>
                </div>`;
            }

            html += `
                    <div class="performance-row">
                        <span>🏃‍♂️ 400m #1</span>
                        <span>${seance.temps1 || 'N/A'} ${sess.pctVMA1 ? `(${sess.pctVMA1}% VMA)` : ''}</span>
                    </div>
                    <div class="performance-row">
                        <span>🏃‍♂️ 400m #2</span>
                        <span>${seance.temps2 || 'N/A'} ${sess.pctVMA2 ? `(${sess.pctVMA2}% VMA)` : ''}</span>
                    </div>
                    <div class="performance-row">
                        <span>🏃‍♂️ 400m #3</span>
                        <span>${seance.temps3 || 'N/A'} ${sess.pctVMA3 ? `(${sess.pctVMA3}% VMA)` : ''}</span>
                    </div>
                    ${sess.pctVMAMoyen ? `
                    <div class="performance-row" style="background:linear-gradient(45deg,rgba(255,107,53,0.2),rgba(255,136,0,0.2));font-weight:700;border:2px solid rgba(255,107,53,0.5);">
                        <span>📊 MOYENNE VMA</span>
                        <span style="color:var(--accent);font-size:1.2rem;font-weight:900;">${sess.pctVMAMoyen}%</span>
                    </div>` : ''}
                    ${sess.travailSaut.length > 0 ? `
                    <div class="performance-row">
                        <span>🦘 Saut travaillé</span>
                        <span style="font-size:0.8rem;">${sess.travailSaut.join(', ')}</span>
                    </div>` : ''}
                    ${sess.travailLancer.length > 0 ? `
                    <div class="performance-row">
                        <span>🎯 Lancer travaillé</span>
                        <span style="font-size:0.8rem;">${sess.travailLancer.join(', ')}</span>
                    </div>` : ''}
                    <div style="margin-top:12px;padding:8px;background:rgba(75,222,128,0.1);border-radius:6px;font-size:0.85rem;">
                        ${seance.projetReussi ? '✅ Projet réussi<br>' : ''}
                        ${seance.confiantL8 ? '💪 Confiant pour L8<br>' : ''}
                        ${seance.strategieTrouvee ? '🎯 Stratégie trouvée<br>' : ''}
                        ${!seance.projetReussi && !seance.confiantL8 && !seance.strategieTrouvee ? '<em>Aucun ressenti sélectionné</em>' : ''}
                    </div>
            </div>`;
        });

        html += `</div>`;
    });
    
    container.innerHTML = html;
    const ez = document.getElementById('export-zone'); if(ez) ez.style.display='block';
}
function deleteSession(eleveId, seanceIdx) {
    if(!confirm('🗑️ Supprimer cette session ? Cette action est irréversible.')) return;
    const allStudents = JSON.parse(localStorage.getItem('eps_pro_students') || '[]');
    const idx = allStudents.findIndex(s => s.id === eleveId);
    if(idx === -1) return;
    allStudents[idx].seances.splice(seanceIdx, 1);
    localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
    // Recharger le bilan
    ELEVES = allStudents;
    generateBilan();
}

function exportTXT() {
    if(!bilanData || !bilanData.elevesAvecL7.length) return;
    const date = new Date().toLocaleDateString('fr-FR');
    let txt = 'BILAN L7 — MISE EN SITUATION 3×400M\nDate : ' + date + '\n\n';
    txt += 'RÉSUMÉ CLASSE :\n';
    txt += '- Élèves avec L7 : ' + bilanData.stats.totalEleves + '\n';
    txt += '- % VMA moyen : ' + (bilanData.stats.vmaMovennne||'-') + '%\n';
    txt += '- Confiants L8 : ' + bilanData.stats.confiantsL8 + '\n';
    txt += '- Stratégie trouvée : ' + bilanData.stats.strategiesTrouvees + '\n\nDÉTAIL :\n';
    bilanData.elevesAvecL7.forEach(e => {
        txt += '\n' + e.nomPrenom + ' (VMA ' + (e.vma||'?') + ' km/h)\n';
        txt += '  Tour 1 : ' + (e.seanceL7.temps1||'-') + (e.pctVMA1?' ('+e.pctVMA1+'%)':'') + '\n';
        txt += '  Tour 2 : ' + (e.seanceL7.temps2||'-') + (e.pctVMA2?' ('+e.pctVMA2+'%)':'') + '\n';
        txt += '  Tour 3 : ' + (e.seanceL7.temps3||'-') + (e.pctVMA3?' ('+e.pctVMA3+'%)':'') + '\n';
        if(e.pctVMAMoyen) txt += '  Moy VMA : ' + e.pctVMAMoyen + '%\n';
        txt += '  Confiant L8 : ' + (e.seanceL7.confiantL8?'Oui':'Non') + '\n';
        txt += '  Stratégie trouvée : ' + (e.seanceL7.strategieTrouvee?'Oui':'Non') + '\n';
    });
    const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'bilan_L7_' + date.replace(/\//g,'-') + '.txt'; a.click();
}

function exportXLSX() {
    if(!bilanData || !bilanData.elevesAvecL7.length) return;
    const wb = XLSX.utils.book_new();
    const header = ['Élève','Sexe','VMA (km/h)','Tour 1','% VMA T1','Tour 2','% VMA T2','Tour 3','% VMA T3','% Moy','Confiant L8','Stratégie trouvée'];
    const rows = bilanData.elevesAvecL7.map(e => [
        e.nomPrenom, e.sexe==='F'?'Fille':'Garçon', e.vma||'',
        e.seanceL7.temps1||'', e.pctVMA1?e.pctVMA1+'%':'',
        e.seanceL7.temps2||'', e.pctVMA2?e.pctVMA2+'%':'',
        e.seanceL7.temps3||'', e.pctVMA3?e.pctVMA3+'%':'',
        e.pctVMAMoyen?e.pctVMAMoyen+'%':'',
        e.seanceL7.confiantL8?'Oui':'Non',
        e.seanceL7.strategieTrouvee?'Oui':'Non'
    ]);
    const ws = XLSX.utils.aoa_to_sheet([header,...rows]);
    ws['!cols'] = header.map(()=>({wch:16}));
    XLSX.utils.book_append_sheet(wb, ws, 'L7 Détail');
    XLSX.writeFile(wb, 'bilan_L7_' + new Date().toLocaleDateString('fr-FR').replace(/\//g,'-') + '.xlsx');
}

function exportPDF() {
    if(!bilanData || !bilanData.elevesAvecL7.length) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    const W = doc.internal.pageSize.getWidth();
    const date = new Date().toLocaleDateString('fr-FR');
    doc.setFillColor(59,130,246); doc.rect(0,0,W,22,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont(undefined,'bold');
    doc.text('EPS : Épreuve Combinée', 14, 10);
    doc.setFontSize(11); doc.setFont(undefined,'normal');
    doc.text('BILAN L7 — MISE EN SITUATION 3×400M', 14, 17);
    doc.text('Date : ' + date, W-14, 17, {align:'right'});
    doc.setTextColor(30,30,30);
    const headers = [['Élève','VMA','Tour 1','% T1','Tour 2','% T2','Tour 3','% T3','% Moy','Confiant L8','Stratégie']];
    const rows = bilanData.elevesAvecL7.map(e => [
        e.nomPrenom, e.vma?e.vma+' km/h':'-',
        e.seanceL7.temps1||'-', e.pctVMA1?e.pctVMA1+'%':'-',
        e.seanceL7.temps2||'-', e.pctVMA2?e.pctVMA2+'%':'-',
        e.seanceL7.temps3||'-', e.pctVMA3?e.pctVMA3+'%':'-',
        e.pctVMAMoyen?e.pctVMAMoyen+'%':'-',
        e.seanceL7.confiantL8?'✓':'-',
        e.seanceL7.strategieTrouvee?'✓':'-'
    ]);
    doc.autoTable({startY:28, head:headers, body:rows,
        styles:{fontSize:8,cellPadding:2},
        headStyles:{fillColor:[59,130,246],textColor:255,fontStyle:'bold'},
        alternateRowStyles:{fillColor:[239,246,255]},
        margin:{left:14,right:14}});
    const pages = doc.internal.getNumberOfPages();
    for(let p=1;p<=pages;p++){
        doc.setPage(p); doc.setFontSize(7); doc.setTextColor(160,160,160);
        doc.text('EPS · Bilan L7 · '+date+' · Page '+p+'/'+pages, W/2, doc.internal.pageSize.getHeight()-6, {align:'center'});
    }
    doc.save('bilan_L7_'+date.replace(/\//g,'-')+'.pdf');
}

<script>
if ('serviceWorker' in navigator) {

(function() {
    function updateBanner() {
        var b = document.getElementById('_offline_banner');
        if (!b) {
            b = document.createElement('div');
            b.id = '_offline_banner';
            b.style.cssText = [
                'display:none','position:fixed','top:0','left:0','right:0',
                'background:#ff6b35','color:#fff','text-align:center',
                'padding:8px 12px','font-size:0.82rem','font-weight:700',
                'z-index:99999','letter-spacing:0.3px'
            ].join(';');
            b.textContent = '\u{1F4E1} Mode hors ligne — données sauvegardées localement';
            document.body.appendChild(b);
        }
        b.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online',  updateBanner);
    window.addEventListener('offline', updateBanner);
    window.addEventListener('load',    updateBanner);
})();
</script>
