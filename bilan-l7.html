<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan L7 - Mise en Situation Adaptative - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #ff6b35;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --gold: #f59e0b;
            --orange: #ff8800;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: linear-gradient(135deg, var(--bg) 0%, #2d1810 100%);
            color: white; 
            padding: 16px; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 2.5rem; 
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            margin-top: 8px;
        }
        
        .eleves-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        
        .eleve-card {
            background: var(--card);
            border: 1px solid rgba(255,107,53,0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .eleve-header {
            background: linear-gradient(135deg, var(--accent), var(--orange));
            color: white;
            padding: 12px 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .eleve-body {
            padding: 16px;
        }
        
        .performance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .choix-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.75rem;
        }
        
        .choix-prudent { background: rgba(75,222,128,0.3); color: var(--success); }
        .choix-regulier { background: rgba(251,191,36,0.3); color: var(--warning); }
        .choix-ambitieux { background: rgba(255,107,53,0.3); color: var(--accent); }
        
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        
        .no-data {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-style: italic;
            padding: 40px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS: épreuve Combinée</h1>
<p class="subtitle">🎯 BILAN L7 - MISE EN SITUATION ADAPTATIVE</p>

<div class="stats-grid" id="stats-grid"></div>
<div class="eleves-list" id="eleves-list"></div>

<script>
let bilanData = {
    elevesAvecL7: [],
    stats: {
        totalEleves: 0,
        confiantsL8: 0,
        strategiesTrouvees: 0,
        projetsReussis: 0
    }
};

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('eleves-list').innerHTML = '<div class="no-data">⚠️ Aucune donnée trouvée</div>';
        return;
    }
    
    const eleves = JSON.parse(stored);
    analyzerL7(eleves);
    renderStats();
    renderEleves();
};

function analyzerL7(eleves) {
    bilanData.elevesAvecL7 = [];
    
    eleves.forEach(eleve => {
        const seanceL7 = eleve.seances?.find(s => s.lecon === 'L7');
        if(!seanceL7) return;
        
        const eleveData = {
            id: eleve.id,
            nomPrenom: eleve.nomPrenom,
            sexe: eleve.sexe,
            age: eleve.age,
            vma: eleve.vma,
            seanceL7: seanceL7
        };
        
        bilanData.elevesAvecL7.push(eleveData);
    });
    
    bilanData.stats.totalEleves = bilanData.elevesAvecL7.length;
    bilanData.stats.confiantsL8 = bilanData.elevesAvecL7.filter(e => e.seanceL7.confiantL8).length;
    bilanData.stats.strategiesTrouvees = bilanData.elevesAvecL7.filter(e => e.seanceL7.strategieTrouvee).length;
    bilanData.stats.projetsReussis = bilanData.elevesAvecL7.filter(e => e.seanceL7.projetReussi).length;
}

function renderStats() {
    const container = document.getElementById('stats-grid');
    
    if(bilanData.stats.totalEleves === 0) {
        container.innerHTML = '<div class="no-data">⚠️ Aucune séance L7 trouvée</div>';
        return;
    }
    
    const tauxConfiance = Math.round((bilanData.stats.confiantsL8 / bilanData.stats.totalEleves) * 100);
    
    container.innerHTML = `
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.totalEleves}</div>
            <div class="stat-label">Élèves évalués</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.confiantsL8}</div>
            <div class="stat-label">Confiants pour L8</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.strategiesTrouvees}</div>
            <div class="stat-label">Stratégies trouvées</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${tauxConfiance}%</div>
            <div class="stat-label">Taux de confiance</div>
        </div>
    `;
}

function renderEleves() {
    const container = document.getElementById('eleves-list');
    
    if(bilanData.elevesAvecL7.length === 0) {
        container.innerHTML = '<div class="no-data">⚠️ Aucun élève avec séance L7</div>';
        return;
    }
    
    let html = '';
    
    bilanData.elevesAvecL7.forEach(eleve => {
        const seance = eleve.seanceL7;
        
        html += `
            <div class="eleve-card">
                <div class="eleve-header">
                    <span>${eleve.sexe === 'F' ? '👧' : '🧑'}</span>
                    <span>${eleve.nomPrenom}</span>
                </div>
                <div class="eleve-body">
                    <div class="performance-row">
                        <span>🏃‍♂️ 400m #1</span>
                        <span>${seance.temps1 || 'N/A'}</span>
                    </div>
                    <div class="performance-row">
                        <span>🏃‍♂️ 400m #2</span>
                        <span>${seance.temps2 || 'N/A'}</span>
                    </div>
                    <div class="performance-row">
                        <span>🏃‍♂️ 400m #3</span>
                        <span>${seance.temps3 || 'N/A'}</span>
                    </div>
                    <div style="margin-top: 12px; padding: 8px; background: rgba(75,222,128,0.1); border-radius: 6px; font-size: 0.85rem;">
                        ${seance.projetReussi ? '✅ Projet réussi<br>' : ''}
                        ${seance.confiantL8 ? '💪 Confiant pour L8<br>' : ''}
                        ${seance.strategieTrouvee ? '🎯 Stratégie trouvée<br>' : ''}
                        ${!seance.projetReussi && !seance.confiantL8 && !seance.strategieTrouvee ? '<em>Aucun ressenti</em>' : ''}
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}
</script>
</body>
</html>
