<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan L7 - Mise en Situation - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #ff6b35;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'SF Pro Display', sans-serif; 
            background: linear-gradient(135deg, var(--bg) 0%, #2d1810 100%);
            color: white; 
            padding: 16px; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 2.5rem; 
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .eleves-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        
        .eleve-card {
            background: var(--card);
            border: 1px solid rgba(255,107,53,0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .eleve-header {
            background: linear-gradient(135deg, var(--accent), var(--gold));
            color: white;
            padding: 12px 16px;
            font-weight: 700;
        }
        
        .eleve-body {
            padding: 16px;
        }
        
        .choix-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin: 2px;
        }
        
        .choix-prudent { background: rgba(75,222,128,0.3); color: var(--success); }
        .choix-regulier { background: rgba(251,191,36,0.3); color: var(--warning); }
        .choix-ambitieux { background: rgba(239,68,68,0.3); color: var(--danger); }
        
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        
        .export-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--success), var(--accent));
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS: épreuve Combinée</h1>
<p class="subtitle">🎯 BILAN L7 - MISE EN SITUATION ADAPTATIVE</p>

<div class="stats-grid" id="stats-grid"></div>
<div class="eleves-list" id="eleves-list"></div>

<button class="export-btn" onclick="exportResults()">📄 Exporter</button>

<script>
let bilanData = { elevesAvecL7: [], stats: {} };

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('eleves-list').innerHTML = '<div style="text-align:center; padding:40px;">⚠️ Aucune donnée trouvée</div>';
        return;
    }
    
    const eleves = JSON.parse(stored);
    analyzerL7(eleves);
    renderStats();
    renderEleves();
};

function analyzerL7(eleves) {
    bilanData.elevesAvecL7 = eleves.filter(eleve => {
        const seanceL7 = eleve.seances?.find(s => s.lecon === 'L7');
        if(!seanceL7) return false;
        return {
            ...eleve,
            seanceL7: seanceL7
        };
    }).map(eleve => ({
        ...eleve,
        seanceL7: eleve.seances.find(s => s.lecon === 'L7')
    }));
    
    bilanData.stats = {
        totalEleves: bilanData.elevesAvecL7.length,
        confiantsL8: bilanData.elevesAvecL7.filter(e => e.seanceL7.confiantL8).length,
        strategieTrouvee: bilanData.elevesAvecL7.filter(e => e.seanceL7.strategieTrouvee).length,
        projetsReussis: bilanData.elevesAvecL7.filter(e => e.seanceL7.projetReussi).length
    };
}

function renderStats() {
    const container = document.getElementById('stats-grid');
    
    if(bilanData.stats.totalEleves === 0) {
        container.innerHTML = '<div style="text-align:center;">⚠️ Aucune séance L7 trouvée</div>';
        return;
    }
    
    container.innerHTML = `
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.totalEleves}</div>
            <div>Élèves évalués</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.confiantsL8}</div>
            <div>Confiants pour L8</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.strategieTrouvee}</div>
            <div>Stratégie trouvée</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.projetsReussis}</div>
            <div>Projets réussis</div>
        </div>
    `;
}

function renderEleves() {
    const container = document.getElementById('eleves-list');
    
    let html = '';
    bilanData.elevesAvecL7.forEach(eleve => {
        const seance = eleve.seanceL7;
        
        html += `
            <div class="eleve-card">
                <div class="eleve-header">
                    ${eleve.sexe === 'F' ? '👧' : '🧑'} ${eleve.nomPrenom}
                </div>
                <div class="eleve-body">
                    <div style="margin-bottom: 12px;">
                        <strong>Temps réalisés :</strong><br>
                        400m #1: ${seance.temps1 || 'N/A'}<br>
                        400m #2: ${seance.temps2 || 'N/A'}<br>
                        400m #3: ${seance.temps3 || 'N/A'}
                    </div>
                    <div style="margin-bottom: 12px;">
                        <strong>Choix stratégiques :</strong><br>
                        ${getChoixBadge(seance.choixTour1)} → ${getChoixBadge(seance.choixTour2)} → ${getChoixBadge(seance.choixTour3)}
                    </div>
                    <div>
                        ${seance.projetReussi ? '✅ Projet réussi' : '❌ Projet non réussi'}<br>
                        ${seance.confiantL8 ? '💪 Confiant pour L8' : '⚠️ Pas encore confiant'}<br>
                        ${seance.strategieTrouvee ? '🎯 Stratégie trouvée' : '🤔 Stratégie à affiner'}
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function getChoixBadge(choix) {
    const badges = {
        'prudent': '<span class="choix-badge choix-prudent">🐌 Prudent</span>',
        'regulier': '<span class="choix-badge choix-regulier">⚖️ Régulier</span>',
        'ambitieux': '<span class="choix-badge choix-ambitieux">⚡ Ambitieux</span>',
        'plus-lent': '<span class="choix-badge choix-prudent">🐌 Plus lent</span>',
        'meme': '<span class="choix-badge choix-regulier">⚖️ Même</span>',
        'plus-vite': '<span class="choix-badge choix-ambitieux">⚡ Plus vite</span>',
        'tenir': '<span class="choix-badge choix-prudent">🛡️ Tenir</span>',
        'maintenir': '<span class="choix-badge choix-regulier">⚖️ Maintenir</span>',
        'sprint': '<span class="choix-badge choix-ambitieux">🚀 Sprint</span>'
    };
    return badges[choix] || '<span class="choix-badge">❓</span>';
}

function exportResults() {
    let contenu = `BILAN L7 - MISE EN SITUATION ADAPTATIVE\\n`;
    contenu += `Date: ${new Date().toLocaleDateString('fr-FR')}\\n\\n`;
    
    contenu += `📊 STATISTIQUES:\\n`;
    contenu += `- Élèves évalués: ${bilanData.stats.totalEleves}\\n`;
    contenu += `- Confiants pour L8: ${bilanData.stats.confiantsL8}\\n`;
    contenu += `- Stratégie trouvée: ${bilanData.stats.strategieTrouvee}\\n\\n`;
    
    bilanData.elevesAvecL7.forEach(eleve => {
        const seance = eleve.seanceL7;
        contenu += `\\n${eleve.nomPrenom}:\\n`;
        contenu += `  Temps: ${seance.temps1||'N/A'} → ${seance.temps2||'N/A'} → ${seance.temps3||'N/A'}\\n`;
        contenu += `  Choix: ${seance.choixTour1||'N/A'} → ${seance.choixTour2||'N/A'} → ${seance.choixTour3||'N/A'}\\n`;
        contenu += `  Confiant L8: ${seance.confiantL8 ? 'Oui' : 'Non'}\\n`;
    });
    
    const blob = new Blob([contenu], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bilan-l7-${new Date().toISOString().split('T')[0]}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>
</body>
</html>
