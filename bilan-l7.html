<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan L7 - Mise en Situation Adaptative - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #ff6b35;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --gold: #f59e0b;
            --orange: #ff8800;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: linear-gradient(135deg, var(--bg) 0%, #2d1810 100%);
            color: white; 
            padding: 16px; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 2.5rem; 
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            margin-top: 8px;
        }
        
        .eleves-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        
        .eleve-card {
            background: var(--card);
            border: 1px solid rgba(255,107,53,0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .eleve-header {
            background: linear-gradient(135deg, var(--accent), var(--orange));
            color: white;
            padding: 12px 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .eleve-body {
            padding: 16px;
        }
        
        .performance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        
        .no-data {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-style: italic;

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <script src="firebase-config.js"></script>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS: épreuve Combinée</h1>
<p class="subtitle">🎯 BILAN L7 - MISE EN SITUATION ADAPTATIVE</p>

<div class="stats-grid" id="stats-grid"></div>
<div class="eleves-list" id="eleves-list"></div>
<div style="text-align:center;margin:20px 0;">
    <button id="exportBtn" onclick="exportBilan()" style="display:none;background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.3);border-radius:12px;padding:12px 24px;font-weight:800;cursor:pointer;font-size:0.9rem;margin-right:10px;">📄 Exporter .TXT</button>
    <button id="exportXlsxBtn" onclick="exportXLSX()" style="display:none;background:var(--success);color:black;border:none;border-radius:12px;padding:12px 24px;font-weight:800;cursor:pointer;font-size:0.9rem;">📥 Exporter .XLSX</button>
    <button id="exportPdfBtn" onclick="exportPDF()" style="display:none;background:#8b5cf6;color:white;border:none;border-radius:12px;padding:12px 24px;font-weight:800;cursor:pointer;font-size:0.9rem;">📑 Exporter .PDF</button>
</div>

<script>
let bilanData = {
    elevesAvecL7: [],
    stats: {
        totalEleves: 0,
        vmaMoyenne: 0,
        confiantsL8: 0,
        strategiesTrouvees: 0
    }
};

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('eleves-list').innerHTML = '<div class="no-data">⚠️ Aucune donnée trouvée</div>';
        return;
    }
    
    const eleves = JSON.parse(stored);
    analyzerL7(eleves);
    renderStats();
    renderEleves();
    if(bilanData.elevesAvecL7.length > 0) {
        document.getElementById('exportBtn').style.display = 'inline-block';
        document.getElementById('exportXlsxBtn').style.display = 'inline-block';
        document.getElementById('exportPdfBtn').style.display = 'inline-block';
    }
};

function analyzerL7(eleves) {
    console.log('=== ANALYSE L7 DEBUG ===');
    bilanData.elevesAvecL7 = [];
    
    eleves.forEach(eleve => {
        const seanceL7 = eleve.seances?.find(s => s.lecon === 'L7');
        if(!seanceL7) return;
        
        console.log(`Élève: ${eleve.nomPrenom}, VMA: ${eleve.vma}`);
        console.log(`Temps bruts: ${seanceL7.temps1}, ${seanceL7.temps2}, ${seanceL7.temps3}`);
        
        // Calcul % VMA avec conversion intelligente
        let pctVMA1 = null, pctVMA2 = null, pctVMA3 = null, pctVMAMoyen = null;
        
        if(seanceL7.temps1 && seanceL7.temps2 && seanceL7.temps3 && eleve.vma) {
            const vmaKmh = parseFloat(eleve.vma);
            const vmaMs = vmaKmh / 3.6; // Conversion m/s
            
            // Conversion temps avec système intelligent
            const t1 = convertTempsIntelligent(seanceL7.temps1);
            const t2 = convertTempsIntelligent(seanceL7.temps2);
            const t3 = convertTempsIntelligent(seanceL7.temps3);
            
            console.log(`VMA: ${vmaKmh} km/h = ${vmaMs.toFixed(2)} m/s`);
            console.log(`Temps convertis: ${t1}s, ${t2}s, ${t3}s`);
            
            if(t1 > 0 && t2 > 0 && t3 > 0) {
                // Vitesse = distance / temps
                const v1 = 400 / t1;
                const v2 = 400 / t2;
                const v3 = 400 / t3;
                
                // % VMA = (vitesse course / VMA) × 100
                pctVMA1 = Math.round((v1 / vmaMs) * 100);
                pctVMA2 = Math.round((v2 / vmaMs) * 100);
                pctVMA3 = Math.round((v3 / vmaMs) * 100);
                
                // Vérification cohérence (éviter aberrations)
                if(pctVMA1 >= 50 && pctVMA1 <= 200 && pctVMA2 >= 50 && pctVMA2 <= 200 && pctVMA3 >= 50 && pctVMA3 <= 200) {
                    pctVMAMoyen = Math.round((pctVMA1 + pctVMA2 + pctVMA3) / 3);
                    console.log(`Vitesses: ${v1.toFixed(2)}, ${v2.toFixed(2)}, ${v3.toFixed(2)} m/s`);
                    console.log(`% VMA: ${pctVMA1}%, ${pctVMA2}%, ${pctVMA3}% → Moyenne: ${pctVMAMoyen}%`);
                } else {
                    console.log(`⚠️ % VMA aberrants ignorés: ${pctVMA1}%, ${pctVMA2}%, ${pctVMA3}%`);
                    pctVMA1 = pctVMA2 = pctVMA3 = pctVMAMoyen = null;
                }
            }
        }
        
        // Analyse travail autonome
        const travailSaut = [];
        const travailLancer = [];
        
        if(seanceL7.sautCourseElan) travailSaut.push("Course d'élan");
        if(seanceL7.sautPrecision) travailSaut.push("Précision");
        if(seanceL7.sautReception) travailSaut.push("Réception");
        if(seanceL7.sautDistance) travailSaut.push("Distance");
        
        if(seanceL7.lancerCoordination) travailLancer.push("Coordination");
        if(seanceL7.lancerTransfert) travailLancer.push("Transfert");
        if(seanceL7.lancerAccompagnement) travailLancer.push("Accompagnement");
        if(seanceL7.lancerRegularite) travailLancer.push("Régularité");
        
        const eleveData = {
            id: eleve.id,
            nomPrenom: eleve.nomPrenom,
            sexe: eleve.sexe,
            vma: eleve.vma,
            seanceL7: seanceL7,
            pctVMA1: pctVMA1,
            pctVMA2: pctVMA2,
            pctVMA3: pctVMA3,
            pctVMAMoyen: pctVMAMoyen,
            travailSaut: travailSaut,
            travailLancer: travailLancer
        };
        
        bilanData.elevesAvecL7.push(eleveData);
    });
    
    // Stats globales
    bilanData.stats.totalEleves = bilanData.elevesAvecL7.length;
    bilanData.stats.confiantsL8 = bilanData.elevesAvecL7.filter(e => e.seanceL7.confiantL8).length;
    bilanData.stats.strategiesTrouvees = bilanData.elevesAvecL7.filter(e => e.seanceL7.strategieTrouvee).length;
    
    // VMA moyenne de classe
    const elevesAvecVMA = bilanData.elevesAvecL7.filter(e => e.pctVMAMoyen);
    bilanData.stats.vmaMoyenne = elevesAvecVMA.length > 0 ? 
        Math.round(elevesAvecVMA.reduce((acc, e) => acc + e.pctVMAMoyen, 0) / elevesAvecVMA.length) : 0;
    
    console.log(`Stats finales: ${bilanData.stats.totalEleves} élèves, VMA moy: ${bilanData.stats.vmaMoyenne}%`);
}

// Fonction conversion intelligente pour analyses
function convertTempsIntelligent(tempsStr) {
    if(!tempsStr || tempsStr.trim() === '') return 0;
    
    const input = tempsStr.trim();
    console.log(`🔍 Conversion bilan: "${input}"`);
    
    // Format standard M:SS ou MM:SS
    const matchStandard = input.match(/^(\d+):(\d+)$/);
    if(matchStandard) {
        const min = parseInt(matchStandard[1]);
        const sec = parseInt(matchStandard[2]);
        if(sec < 60) {
            const total = min * 60 + sec;
            console.log(`✅ ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
            return total;
        }
        console.log(`⚠️ Secondes invalides: ${sec}`);
        return 0;
    }
    
    // Format avec dixièmes M:SS.D
    const matchDixiemes = input.match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        if(sec < 60) {
            const total = min * 60 + sec + dixieme / 10;
            console.log(`✅ ${min}:${sec.toString().padStart(2,'0')}.${dixieme} = ${total}s`);
            return total;
        }
        return 0;
    }
    
    // Corrections automatiques silencieuses pour bilans
    
    // Format décimal 2.30 → 2:30
    const matchDecimal = input.replace(',', '.').match(/^(\d+)[.,](\d+)$/);
    if(matchDecimal) {
        const min = parseInt(matchDecimal[1]);
        const sec = parseInt(matchDecimal[2]);
        if(sec < 60 && min >= 0 && min <= 10) {
            const total = min * 60 + sec;
            console.log(`🔄 Auto-corrigé: ${input} → ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
            return total;
        }
    }
    
    // Nombre entier
    const nombreEntier = parseInt(input);
    if(!isNaN(nombreEntier) && nombreEntier.toString() === input) {
        
        // Secondes directes logiques
        if(nombreEntier >= 60 && nombreEntier <= 300) {
            console.log(`🔄 Secondes directes: ${nombreEntier}s`);
            return nombreEntier;
        }
        
        // Format MMSS → MM:SS
        if(nombreEntier >= 100 && nombreEntier <= 999) {
            const minStr = Math.floor(nombreEntier / 100);
            const secStr = nombreEntier % 100;
            if(secStr < 60 && minStr >= 1 && minStr <= 9) {
                const total = minStr * 60 + secStr;
                console.log(`🔄 Auto-corrigé: ${nombreEntier} → ${minStr}:${secStr.toString().padStart(2,'0')} = ${total}s`);
                return total;
            }
        }
    }
    
    // Secondes avec décimales
    const secondes = parseFloat(input.replace(',', '.'));
    if(!isNaN(secondes) && secondes >= 60 && secondes <= 300) {
        console.log(`🔄 Secondes décimales: ${secondes}s`);
        return secondes;
    }
    
    console.log(`❌ Format non reconnu: "${input}"`);
    return 0;
}

function convertTempsAvecValidation(tempsStr, inputElement = null) {
    if(!tempsStr || tempsStr.trim() === '') return { valide: false, secondes: 0 };
    
    const input = tempsStr.trim();
    console.log(`🔍 Analyse temps: "${input}"`);
    
    // ✅ FORMATS VALIDES ACCEPTÉS
    
    // Format standard M:SS ou MM:SS
    const matchStandard = input.match(/^(\d+):(\d+)$/);
    if(matchStandard) {
        const min = parseInt(matchStandard[1]);
        const sec = parseInt(matchStandard[2]);
        
        if(sec >= 60) {
            showTempsAlert(`❌ Erreur : ${sec} secondes impossible !\n\n✅ Correction : ${min}:${Math.floor(sec/60)+min}${(sec%60).toString().padStart(2,'0')}\n\nFormat attendu : M:SS (ex: 2:30 pour 2min30s)`, inputElement);
            return { valide: false, secondes: 0 };
        }
        
        const total = min * 60 + sec;
        console.log(`✅ ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
        return { valide: true, secondes: total };
    }
    
    // Format avec dixièmes M:SS.D
    const matchDixiemes = input.match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        
        if(sec >= 60) {
            showTempsAlert(`❌ Erreur : ${sec} secondes impossible !\n\nFormat attendu : M:SS (ex: 2:30)`, inputElement);
            return { valide: false, secondes: 0 };
        }
        
        const total = min * 60 + sec + dixieme / 10;
        console.log(`✅ ${min}:${sec.toString().padStart(2,'0')}.${dixieme} = ${total}s`);
        return { valide: true, secondes: total };
    }
    
    // 🔄 CORRECTIONS AUTOMATIQUES INTELLIGENTES
    
    // Format décimal avec point/virgule : 2.30 → 2:30
    const matchDecimal = input.replace(',', '.').match(/^(\d+)[.,](\d+)$/);
    if(matchDecimal) {
        const min = parseInt(matchDecimal[1]);
        const sec = parseInt(matchDecimal[2]);
        
        if(sec < 60) {
            const correction = `${min}:${sec.toString().padStart(2,'0')}`;
            if(confirm(`⚠️ Tu as écrit "${input}"\n\n✅ Tu veux dire "${correction}" ?\n\n(${min} minutes ${sec} secondes)\n\nCliquer OK pour corriger automatiquement`)) {
                if(inputElement) inputElement.value = correction;
                const total = min * 60 + sec;
                console.log(`🔄 Corrigé: ${correction} = ${total}s`);
                return { valide: true, secondes: total };
            }
        }
        
        showTempsAlert(`❌ Format incorrect : "${input}"\n\n✅ Format attendu : M:SS\nExemple : 1:25 pour 1min25s`, inputElement);
        return { valide: false, secondes: 0 };
    }
    
    // Nombre entier : possible secondes directes ou erreur de format
    const nombreEntier = parseInt(input);
    if(!isNaN(nombreEntier) && nombreEntier.toString() === input) {
        
        // Secondes directes logiques (60-300s pour 400m)
        if(nombreEntier >= 60 && nombreEntier <= 300) {
            const min = Math.floor(nombreEntier / 60);
            const sec = nombreEntier % 60;
            const correction = `${min}:${sec.toString().padStart(2,'0')}`;
            
            if(confirm(`⚠️ Tu as écrit "${nombreEntier}"\n\n✅ Tu veux dire ${nombreEntier} secondes (${correction}) ?\n\nCliquer OK pour corriger`)) {
                if(inputElement) inputElement.value = correction;
                console.log(`🔄 ${nombreEntier}s → ${correction}`);
                return { valide: true, secondes: nombreEntier };
            }
        }
        
        // Erreur probable : format MMSS au lieu de MM:SS
        if(nombreEntier >= 100 && nombreEntier <= 999) {
            const minStr = Math.floor(nombreEntier / 100).toString();
            const secStr = (nombreEntier % 100).toString().padStart(2, '0');
            const sec = parseInt(secStr);
            
            if(sec < 60) {
                const correction = `${minStr}:${secStr}`;
                if(confirm(`⚠️ Tu as écrit "${nombreEntier}"\n\n✅ Tu veux dire "${correction}" ?\n\n(${minStr} minutes ${sec} secondes)\n\nCliquer OK pour corriger`)) {
                    if(inputElement) inputElement.value = correction;
                    const total = parseInt(minStr) * 60 + sec;
                    console.log(`🔄 Corrigé: ${nombreEntier} → ${correction} = ${total}s`);
                    return { valide: true, secondes: total };
                }
            }
        }
        
        showTempsAlert(`❌ Temps impossible : "${input}"\n\n✅ Format attendu : M:SS\nExemples :\n• 1:25 pour 1min25s\n• 2:00 pour 2min00s`, inputElement);
        return { valide: false, secondes: 0 };
    }
    
    // Secondes avec décimales
    const secondes = parseFloat(input.replace(',', '.'));
    if(!isNaN(secondes) && secondes > 0) {
        if(secondes >= 60 && secondes <= 300) {
            const min = Math.floor(secondes / 60);
            const sec = Math.floor(secondes % 60);
            const dixieme = Math.round((secondes % 1) * 10);
            const correction = dixieme > 0 ? `${min}:${sec.toString().padStart(2,'0')}.${dixieme}` : `${min}:${sec.toString().padStart(2,'0')}`;
            
            if(confirm(`⚠️ Tu as écrit "${input}"\n\n✅ Tu veux dire ${secondes}s (${correction}) ?\n\nCliquer OK pour corriger`)) {
                if(inputElement) inputElement.value = correction;
                console.log(`🔄 ${secondes}s → ${correction}`);
                return { valide: true, secondes: secondes };
            }
        }
    }
    
    // Format non reconnu
    showTempsAlert(`❌ Format non reconnu : "${input}"\n\n✅ Formats acceptés :\n• 1:25 (1min25s)\n• 2:00 (2min00s)\n• 1:30.5 (1min30s et 5 dixièmes)\n\n📝 Exemple : Pour 1 minute et 25 secondes, écris 1:25`, inputElement);
    return { valide: false, secondes: 0 };
}

function showTempsAlert(message, inputElement = null) {
    alert(message);
    if(inputElement) {
        inputElement.focus();
        inputElement.style.border = '3px solid #ef4444';
        setTimeout(() => {
            if(inputElement.style) inputElement.style.border = '';
        }, 3000);
    }
}

// Fonction simplifiée pour les bilans (sans validation UI)
function convertTemps(tempsStr) {
    const result = convertTempsAvecValidation(tempsStr);
    return result.valide ? result.secondes : 0;
}

function renderStats() {
    const container = document.getElementById('stats-grid');
    
    if(bilanData.stats.totalEleves === 0) {
        container.innerHTML = '<div class="no-data">⚠️ Aucune séance L7 trouvée</div>';
        return;
    }
    
    const tauxConfiance = Math.round((bilanData.stats.confiantsL8 / bilanData.stats.totalEleves) * 100);
    
    container.innerHTML = `
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.totalEleves}</div>
            <div class="stat-label">Élèves évalués</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.vmaMoyenne}%</div>
            <div class="stat-label">% VMA moyen classe</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${bilanData.stats.confiantsL8}</div>
            <div class="stat-label">Confiants pour L8</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${tauxConfiance}%</div>
            <div class="stat-label">Taux de confiance</div>
        </div>
    `;
}

function renderEleves() {
    const container = document.getElementById('eleves-list');
    
    if(bilanData.elevesAvecL7.length === 0) {
        container.innerHTML = '<div class="no-data">⚠️ Aucun élève avec séance L7</div>';
        return;
    }
    
    let html = '';
    
    bilanData.elevesAvecL7.forEach(eleve => {
        const seance = eleve.seanceL7;
        
        html += `
            <div class="eleve-card">
                <div class="eleve-header">
                    <span>${eleve.sexe === 'F' ? '👧' : '🧑'}</span>
                    <span>${eleve.nomPrenom}</span>
                    <span style="margin-left: auto; font-size: 0.8rem;">VMA ${eleve.vma || 'N/A'} km/h</span>
                </div>
                <div class="eleve-body">
                    <div class="performance-row">
                        <span>🏃‍♂️ 400m #1</span>
                        <span>${seance.temps1 || 'N/A'} ${eleve.pctVMA1 ? `(${eleve.pctVMA1}% VMA)` : ''}</span>
                    </div>
                    <div class="performance-row">
                        <span>🏃‍♂️ 400m #2</span>
                        <span>${seance.temps2 || 'N/A'} ${eleve.pctVMA2 ? `(${eleve.pctVMA2}% VMA)` : ''}</span>
                    </div>
                    <div class="performance-row">
                        <span>🏃‍♂️ 400m #3</span>
                        <span>${seance.temps3 || 'N/A'} ${eleve.pctVMA3 ? `(${eleve.pctVMA3}% VMA)` : ''}</span>
                    </div>
                    ${eleve.pctVMAMoyen ? `
                    <div class="performance-row" style="background: linear-gradient(45deg, rgba(255,107,53,0.2), rgba(255,136,0,0.2)); font-weight: 700; border: 2px solid rgba(255,107,53,0.5);">
                        <span>📊 MOYENNE VMA</span>
                        <span style="color: var(--accent); font-size: 1.2rem; font-weight: 900;">${eleve.pctVMAMoyen}%</span>
                    </div>
                    ` : ''}
                    ${eleve.travailSaut.length > 0 ? `
                    <div class="performance-row">
                        <span>🦘 Saut travaillé</span>
                        <span style="font-size: 0.8rem;">${eleve.travailSaut.join(', ')}</span>
                    </div>
                    ` : ''}
                    ${eleve.travailLancer.length > 0 ? `
                    <div class="performance-row">
                        <span>🎯 Lancer travaillé</span>
                        <span style="font-size: 0.8rem;">${eleve.travailLancer.join(', ')}</span>
                    </div>
                    ` : ''}
                    <div style="margin-top: 12px; padding: 8px; background: rgba(75,222,128,0.1); border-radius: 6px; font-size: 0.85rem;">
                        ${seance.projetReussi ? '✅ Projet réussi<br>' : ''}
                        ${seance.confiantL8 ? '💪 Confiant pour L8<br>' : ''}
                        ${seance.strategieTrouvee ? '🎯 Stratégie trouvée<br>' : ''}
                        ${!seance.projetReussi && !seance.confiantL8 && !seance.strategieTrouvee ? '<em>Aucun ressenti sélectionné</em>' : ''}
                    </div>
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function exportBilan() {
    let contenu = `BILAN L7 - MISE EN SITUATION ADAPTATIVE\n`;
    contenu += `Date: ${new Date().toLocaleDateString('fr-FR')}\n\n`;
    contenu += `RÉSUMÉ CLASSE:\n`;
    contenu += `- Élèves avec données L7: ${bilanData.stats.totalEleves}\n`;
    contenu += `- % VMA moyen classe: ${bilanData.stats.vmaMoyenne}%\n`;
    contenu += `- Confiants pour L8: ${bilanData.stats.confiantsL8}\n`;
    contenu += `- Stratégie trouvée: ${bilanData.stats.strategiesTrouvees}\n\n`;
    contenu += `DÉTAIL PAR ÉLÈVE:\n`;
    bilanData.elevesAvecL7.forEach(eleve => {
        const s = eleve.seanceL7;
        contenu += `\n${eleve.nomPrenom} (VMA: ${eleve.vma || 'N/A'} km/h):\n`;
        contenu += `  Tour 1: ${s.temps1 || 'N/A'} ${eleve.pctVMA1 ? `(${eleve.pctVMA1}% VMA)` : ''}\n`;
        contenu += `  Tour 2: ${s.temps2 || 'N/A'} ${eleve.pctVMA2 ? `(${eleve.pctVMA2}% VMA)` : ''}\n`;
        contenu += `  Tour 3: ${s.temps3 || 'N/A'} ${eleve.pctVMA3 ? `(${eleve.pctVMA3}% VMA)` : ''}\n`;
        if(eleve.pctVMAMoyen) contenu += `  % VMA moyen: ${eleve.pctVMAMoyen}%\n`;
        contenu += `  Stratégie trouvée: ${s.strategieTrouvee ? 'Oui' : 'Non'}\n`;
        contenu += `  Confiant L8: ${s.confiantL8 ? 'Oui' : 'Non'}\n`;
    });
    const blob = new Blob([contenu], { type: 'text/plain;charset=utf-8' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bilan_L7_${new Date().toLocaleDateString('fr-FR').replace(/\//g, '-')}.txt`;
    a.click();
    window.URL.revokeObjectURL(url);
}

function exportXLSX() {
    const wb = XLSX.utils.book_new();

    const resumeData = [

        ['Date', new Date().toLocaleDateString('fr-FR')],
        ['', ''],
        ['Élèves avec données L7', bilanData.stats.totalEleves],
        ['% VMA moyen classe', bilanData.stats.vmaMoyenne + '%'],
        ['Confiants pour L8', bilanData.stats.confiantsL8],
        ['Stratégie trouvée', bilanData.stats.strategiesTrouvees],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumeData), 'Résumé');

    // Feuille détail
    const header = ['Élève', 'VMA (km/h)', 'Tour 1', '% VMA T1', 'Tour 2', '% VMA T2', 'Tour 3', '% VMA T3', '% VMA Moyen', 'Stratégie trouvée', 'Confiant L8'];
    const rows = bilanData.elevesAvecL7.map(e => [
        e.nomPrenom,
        e.vma || '',
        e.seanceL7.temps1 || '',
        e.pctVMA1 ? e.pctVMA1 + '%' : '',
        e.seanceL7.temps2 || '',
        e.pctVMA2 ? e.pctVMA2 + '%' : '',
        e.seanceL7.temps3 || '',
        e.pctVMA3 ? e.pctVMA3 + '%' : '',
        e.pctVMAMoyen ? e.pctVMAMoyen + '%' : '',
        e.seanceL7.strategieTrouvee ? 'Oui' : 'Non',
        e.seanceL7.confiantL8 ? 'Oui' : 'Non',
    ]);
    const wsEleves = XLSX.utils.aoa_to_sheet([header, ...rows]);
    wsEleves['!cols'] = header.map(() => ({wch: 16}));
    XLSX.utils.book_append_sheet(wb, wsEleves, 'Détail élèves');

    XLSX.writeFile(wb, `bilan_L7_${new Date().toLocaleDateString('fr-FR').replace(/\//g, '-')}.xlsx`);
}
function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const d = bilanData;
    const date = new Date().toLocaleDateString('fr-FR');
    const W = doc.internal.pageSize.getWidth();

    doc.setFillColor(59, 130, 246);
    doc.rect(0, 0, W, 22, 'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(16); doc.setFont(undefined,'bold');
    doc.text('EPS : Épreuve Combinée', 14, 10);
    doc.setFontSize(11); doc.setFont(undefined,'normal');
    doc.text('BILAN L7 — MISE EN SITUATION 3×400M', 14, 17);
    doc.text('Date : ' + date, W - 14, 17, { align: 'right' });

    doc.setTextColor(30,30,30);
    const stats = [
        ['Élèves avec L7', d.stats.totalEleves],
        ['% VMA moy classe', (d.stats.vmaMoyenne || '-') + '%'],
        ['Confiants L8', d.stats.confiantsL8],
        ['Stratégie trouvée', d.stats.strategiesTrouvees],
    ];
    const bw = (W - 28) / stats.length;
    stats.forEach(([lbl, val], i) => {
        const x = 14 + i * bw;
        doc.setFillColor(239, 246, 255);
        doc.roundedRect(x, 26, bw - 4, 18, 2, 2, 'F');
        doc.setFontSize(15); doc.setFont(undefined,'bold');
        doc.setTextColor(59, 130, 246);
        doc.text(String(val), x + (bw-4)/2, 37, { align: 'center' });
        doc.setFontSize(7); doc.setFont(undefined,'normal');
        doc.setTextColor(100,100,100);
        doc.text(lbl, x + (bw-4)/2, 42, { align: 'center' });
    });

    doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.setTextColor(30,30,30);
    doc.text('Détail par élève', 14, 55);

    const headers = [['Élève', 'VMA', 'Tour 1', '% VMA T1', 'Tour 2', '% VMA T2', 'Tour 3', '% VMA T3', '% Moy', 'Stratégie', 'Confiant L8']];
    const rows = d.elevesAvecL7.map(e => [
        e.nomPrenom,
        e.vma ? e.vma + ' km/h' : '-',
        e.seanceL7.temps1 || '-',
        e.pctVMA1 ? e.pctVMA1 + '%' : '-',
        e.seanceL7.temps2 || '-',
        e.pctVMA2 ? e.pctVMA2 + '%' : '-',
        e.seanceL7.temps3 || '-',
        e.pctVMA3 ? e.pctVMA3 + '%' : '-',
        e.pctVMAMoyen ? e.pctVMAMoyen + '%' : '-',
        e.seanceL7.strategieTrouvee ? '✓' : '-',
        e.seanceL7.confiantL8 ? '✓' : '-',
    ]);

    doc.autoTable({
        startY: 59,
        head: headers,
        body: rows,
        styles: { fontSize: 7.5, cellPadding: 2 },
        headStyles: { fillColor: [59, 130, 246], textColor: 255, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [239, 246, 255] },
        margin: { left: 14, right: 14 },
    });

    const pages = doc.internal.getNumberOfPages();
    for(let p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFontSize(7); doc.setTextColor(160,160,160); doc.setFont(undefined,'normal');
        doc.text('EPS Épreuve Combinée · Bilan L7 · ' + date + ' · Page ' + p + '/' + pages, W/2, doc.internal.pageSize.getHeight() - 6, { align: 'center' });
    }
    doc.save('bilan_L7_' + date.replace(/\//g,'-') + '.pdf');
}
