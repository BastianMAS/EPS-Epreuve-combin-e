function generateSummary(eleve) {
    const seances = eleve.seances || [];
    const seanceL7 = seances.find(s => s.lecon === 'L7');
    
    let summary = '';
    
    // VMA en premier
    if(eleve.vma) {
        summary += `VMA ${eleve.vma} km/h. `;
    }
    
    // Performance L7 (PRIORITÉ) avec conversion intelligente
    if(seanceL7 && seanceL7.temps1 && seanceL7.temps2 && seanceL7.temps3 && eleve.vma) {
        const vmaMs = parseFloat(eleve.vma) / 3.6;
        
        // Conversion intelligente des temps
        const t1 = convertTempsIntelligent(seanceL7.temps1);
        const t2 = convertTempsIntelligent(seanceL7.temps2);
        const t3 = convertTempsIntelligent(seanceL7.temps3);
        
        console.log(`Résumé ${eleve.nomPrenom}: VMA ${eleve.vma}, Temps: ${seanceL7.temps1}→${t1}s, ${seanceL7.temps2}→${t2}s, ${seanceL7.temps3}→${t3}s`);
        
        if(t1 > 0 && t2 > 0 && t3 > 0) {
            const pct1 = Math.round(((400/t1) / vmaMs) * 100);
            const pct2 = Math.round(((400/t2) / vmaMs) * 100);
            const pct3 = Math.round(((400/t3) / vmaMs) * 100);
            const pctMoy = Math.round((pct1 + pct2 + pct3) / 3);
            
            // Vérification cohérence (éviter les 5000% VMA)
            if(pct1 >= 50 && pct1 <= 200 && pct2 >= 50 && pct2 <= 200 && pct3 >= 50 && pct3 <= 200) {
                summary += `L7: ${pct1}%-${pct2}%-${pct3}% (moy ${pctMoy}%). `;
                
                // Évolution
                if(pct3 > pct1 + 3) summary += 'Finit fort. ';
                else if(pct3 < pct1 - 5) summary += 'Décroche. ';
                else summary += 'Régulier. ';
            } else {
                console.log(`⚠️ % VMA aberrants ignorés: ${pct1}%, ${pct2}%, ${pct3}%`);
                summary += `L7: 3×400m réalisé. `;
            }
        }
    }
    
    // État mental L7
    if(seanceL7?.confiantL8) summary += 'Confiant L8. ';
    if(seanceL7?.strategieTrouvee) summary += 'Stratégie OK. ';
    
    // Travail L7
    const travailSaut = [];
    const travailLancer = [];
    
    if(seanceL7?.sautCourseElan) travailSaut.push("élan");
    if(seanceL7?.sautPrecision) travailSaut.push("précision");
    if(seanceL7?.sautReception) travailSaut.push("réception");
    if(seanceL7?.sautDistance) travailSaut.push("distance");
    
    if(seanceL7?.lancerCoordination) travailLancer.push("coordination");
    if(seanceL7?.lancerTransfert) travailLancer.push("transfert");
    if(seanceL7?.lancerAccompagnement) travailLancer.push("accompagnement");
    if(seanceL7?.lancerRegularite) travailLancer.push("régularité");
    
    if(travailSaut.length > 0) summary += `Saut: ${travailSaut.join(', ')}. `;
    if(travailLancer.length > 0) summary += `Lancer: ${travailLancer.join(', ')}. `;
    
    return summary || 'Parcours en cours...';
}

// Fonction conversion intelligente pour résumés (sans UI)
function convertTempsIntelligent(tempsStr) {
    if(!tempsStr || tempsStr.trim() === '') return 0;
    
    const input = tempsStr.trim();
    console.log(`🔍 Conversion résumé: "${input}"`);
    
    // Format standard M:SS ou MM:SS
    const matchStandard = input.match(/^(\d+):(\d+)$/);
    if(matchStandard) {
        const min = parseInt(matchStandard[1]);
        const sec = parseInt(matchStandard[2]);
        if(sec < 60) {
            const total = min * 60 + sec;
            console.log(`✅ ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
            return total;
        }
        console.log(`⚠️ Secondes invalides: ${sec}`);
        return 0;
    }
    
    // Format avec dixièmes M:SS.D
    const matchDixiemes = input.match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        if(sec < 60) {
            const total = min * 60 + sec + dixieme / 10;
            console.log(`✅ ${min}:${sec.toString().padStart(2,'0')}.${dixieme} = ${total}s`);
            return total;
        }
        console.log(`⚠️ Secondes invalides: ${sec}`);
        return 0;
    }
    
    // Tentative correction automatique pour formats courants
    
    // Format décimal 2.30 → 2:30 (interprété comme 2min30s)
    const matchDecimal = input.replace(',', '.').match(/^(\d+)[.,](\d+)$/);
    if(matchDecimal) {
        const min = parseInt(matchDecimal[1]);
        const sec = parseInt(matchDecimal[2]);
        if(sec < 60 && min >= 0 && min <= 10) {
            const total = min * 60 + sec;
            console.log(`🔄 Auto-corrigé: ${input} → ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
            return total;
        }
    }
    
    // Nombre entier: secondes directes ou format MMSS
    const nombreEntier = parseInt(input);
    if(!isNaN(nombreEntier) && nombreEntier.toString() === input) {
        
        // Secondes directes logiques (60-300s pour 400m)
        if(nombreEntier >= 60 && nombreEntier <= 300) {
            console.log(`🔄 Secondes directes: ${nombreEntier}s`);
            return nombreEntier;
        }
        
        // Format MMSS → MM:SS (ex: 125 → 1:25)
        if(nombreEntier >= 100 && nombreEntier <= 999) {
            const minStr = Math.floor(nombreEntier / 100);
            const secStr = nombreEntier % 100;
            if(secStr < 60 && minStr >= 1 && minStr <= 9) {
                const total = minStr * 60 + secStr;
                console.log(`🔄 Auto-corrigé: ${nombreEntier} → ${minStr}:${secStr.toString().padStart(2,'0')} = ${total}s`);
                return total;
            }
        }
    }
    
    // Secondes avec décimales
    const secondes = parseFloat(input.replace(',', '.'));
    if(!isNaN(secondes) && secondes >= 60 && secondes <= 300) {
        console.log(`🔄 Secondes décimales: ${secondes}s`);
        return secondes;
    }
    
    console.log(`❌ Format non reconnu: "${input}"`);
    return 0;
}

function convertTemps(tempsStr) {
    if(!tempsStr) return 0;
    
    // Format M:SS ou MM:SS (STANDARD)
    const matchMinSec = tempsStr.replace(',', '.').match(/^(\d+):(\d+)$/);
    if(matchMinSec) {
        const min = parseInt(matchMinSec[1]);
        const sec = parseInt(matchMinSec[2]);
        if(sec < 60) {
            return min * 60 + sec;
        }
    }
    
    // Format M:SS.D (avec dixièmes)
    const matchDixiemes = tempsStr.replace(',', '.').match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        if(sec < 60) {
            return min * 60 + sec + dixieme / 10;
        }
    }
    
    // Format secondes directes (si cohérent)
    const sec = parseFloat(tempsStr.replace(',', '.'));
    if(!isNaN(sec) && sec >= 60 && sec <= 300) {
        return sec;
    }
    
    console.log(`⚠️ Temps ignoré (format incorrect): "${tempsStr}"`);
    return 0;
}

function parseTemps(tempsStr) {
    if(!tempsStr || tempsStr.trim() === '') return null;
    const parts = tempsStr.trim().replace(',', '.').match(/(\d+):(\d+)\.(\d+)/);
    if(parts) {
        return parseInt(parts[1]) * 60 + parseInt(parts[2]) + parseInt(parts[3]) / 10;
    }
    const secondsOnly = parseFloat(tempsStr);
    return !isNaN(secondsOnly) ? secondsOnly : null;
}

function generateProjet(eleveIndex) {
    const eleve = elevesData[eleveIndex];
    const container = document.getElementById(`projet-${eleveIndex}`);
    
    // Lire toutes les cases cochées
    const reponses = {
        course: [],
        saut: [],
        lancer: [],
        mental: [],
        objectif: []
    };
    
    ['course1', 'course2', 'course3', 'course4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.course.push(id);
        }
    });
    
    ['saut1', 'saut2', 'saut3', 'saut4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.saut.push(id);
        }
    });
    
    ['lancer1', 'lancer2', 'lancer3', 'lancer4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.lancer.push(id);
        }
    });
    
    ['mental1', 'mental2', 'mental3', 'mental4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.mental.push(id);
        }
    });
    
    ['objectif1', 'objectif2', 'objectif3', 'objectif4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.objectif.push(id);
        }
    });
    
    // Analyser le profil et générer le projet
    const projet = analyserProfil(reponses, eleve);
    container.innerHTML = projet;
}

function analyserProfil(reponses, eleve) {
    const { course, saut, lancer, mental, objectif } = reponses;
    
    if(course.length === 0 && saut.length === 0 && lancer.length === 0 && mental.length === 0 && objectif.length === 0) {
        return '🤔 Coche les cases qui te correspondent pour découvrir ton projet !';
    }
    
    let strategieCourse = '';
    let intensite = '';
    let conseilSaut = '';
    let conseilLancer = '';
    let gestion = '';
    
    // STRATÉGIE COURSE basée sur L7
    if(course.includes('course1') || course.includes('course2')) {
        // Performance L7 élevée ou bonne gestion
        if(mental.includes('mental1') || objectif.includes('objectif2')) {
            strategieCourse = '🚀 <strong>STRATÉGIE AMBITIEUSE</strong> : Ton L7 montre que tu peux viser haut !';
            intensite = 'Reproduis ton L7 ou mieux : 110-120% VMA';
        } else {
            strategieCourse = '⚖️ <strong>STRATÉGIE REPRODUCTIBLE</strong> : Ton L7 était réussi, refais pareil !';
            intensite = 'Même intensité qu\'en L7 : 105-110% VMA';
        }
    } else if(course.includes('course3') || mental.includes('mental4')) {
        // Difficultés L7 ou besoin sécurité
        strategieCourse = '🛡️ <strong>STRATÉGIE SÉCURISÉE</strong> : Après L7, sois plus prudent au départ';
        intensite = 'Départ plus calme : 95-100% VMA puis progression';
    } else {
        // Pas de retour L7 clair
        strategieCourse = '⚖️ <strong>STRATÉGIE ÉQUILIBRÉE</strong> : Base-toi sur tes sensations L7';
        intensite = 'Départ contrôlé : 100-105% VMA';
    }
    
    // CONSEIL SAUT (inchangé mais adapté)
    if(saut.includes('saut1') && saut.includes('saut2')) {
        conseilSaut = '🦘 <strong>SAUT</strong> : Tu progresses ! Vise ta meilleure distance';
    } else if(saut.includes('saut3')) {
        conseilSaut = '🦘 <strong>SAUT</strong> : Travaille encore la régularité (comme en L7)';
    } else if(saut.includes('saut4')) {
        conseilSaut = '🦘 <strong>SAUT</strong> : Relève le défi technique !';
    } else if(saut.length > 0) {
        conseilSaut = '🦘 <strong>SAUT</strong> : Continue sur ta lancée L6/L7';
    }
    
    // CONSEIL LANCER (inchangé mais adapté)
    if(lancer.includes('lancer1') && lancer.includes('lancer2')) {
        conseilLancer = '🎯 <strong>LANCER</strong> : Tes progrès payent ! Vise encore plus loin';
    } else if(lancer.includes('lancer3')) {
        conseilLancer = '🎯 <strong>LANCER</strong> : Focus régularité (applique ton travail L7)';
    } else if(lancer.includes('lancer4')) {
        conseilLancer = '🎯 <strong>LANCER</strong> : Va chercher ta distance record !';
    } else if(lancer.length > 0) {
        conseilLancer = '🎯 <strong>LANCER</strong> : Exploite ton travail technique L6/L7';
    }
    
    // GESTION GLOBALE avec référence L7
    if(course.includes('course4') || objectif.includes('objectif4')) {
        gestion = 'Comme en L7 : garde des forces pour un finish puissant ! 💥';
    } else if(objectif.includes('objectif1') || mental.includes('mental2')) {
        gestion = 'Sécurité comme en L7 : reste dans ta zone de confort ✅';
    } else if(objectif.includes('objectif3')) {
        gestion = 'Objectif clair : faire mieux qu\'en L7 ! 🎯';
    } else {
        gestion = 'Reproduis ce qui a marché en L7 🔄';
    }
    
    let projetHTML = `<div style="font-size: 0.9rem;">`;
    
    if(strategieCourse) {
        projetHTML += `<div style="margin-bottom: 8px;">${strategieCourse}</div>`;
        projetHTML += `<div style="margin-bottom: 8px; font-size: 0.85rem;"><strong>Intensité :</strong> ${intensite}</div>`;
    }
    
    if(conseilSaut) {
        projetHTML += `<div style="margin-bottom: 6px;">${conseilSaut}</div>`;
    }
    
    if(conseilLancer) {
        projetHTML += `<div style="margin-bottom: 6px;">${conseilLancer}</div>`;
    }
    
    projetHTML += `<div style="margin-top: 8px; font-weight: 600;"><strong>Conseil final :</strong> ${gestion}</div>`;
    projetHTML += `</div>`;
    
    return projetHTML;
}
</script>
