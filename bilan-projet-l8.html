<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan Projet L8 - EPS: épreuve Combinée</title>
    <style>
        :root {

        body {

            padding: 16px; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 2.5rem; 
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        }
        
        .subtitle {

            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 30px;
        }
        
        .eleves-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .eleve-card {
            background: var(--card);
            border: 1px solid rgba(0,217,255,0.3);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .eleve-header {
            background: linear-gradient(135deg, var(--accent), var(--purple));

            margin-bottom: 20px;

        }
        
        .section-title {

            font-size: 1rem;
        }

            display: grid;
            gap: 8px;
            margin: 12px 0;

            background: linear-gradient(135deg, var(--success), var(--accent));

            border-radius: 12px;
            margin-top: 16px;
            color: white;

</head>

                        const sl4 = (eleve.seances||[]).find(s=>s.lecon==='L4')||{};
                        const sl6 = (eleve.seances||[]).find(s=>s.lecon==='L6')||{};

                        if(!hasCourse && !hasSaut && !hasLancer) return '';
                        let t = '<div style="margin:10px 0;background:rgba(0,210,255,0.07);border:1px solid rgba(0,210,255,0.15);border-radius:10px;padding:10px;">';
                        t += '<div style="font-weight:800;color:#00d2ff;margin-bottom:8px;font-size:0.82rem;">📈 Mes performances du cycle</div>';
                        if(hasCourse) {
                            t += '<div style="font-weight:700;font-size:0.78rem;margin-bottom:4px;">🏃 Course</div>';
                            t += '<table style="width:100%;font-size:0.72rem;border-collapse:collapse;">';
                            t += '<tr style="color:#888"><td>Séance</td><td>Temps</td><td>Dist.</td></tr>';
                            if(sl3.moyenne200m) t += '<tr><td>L3</td><td>'+fmtS(sl3.moyenne200m)+'</td><td>200m</td></tr>';
                            if(sl4.moyenne200m) t += '<tr><td>L4</td><td>'+fmtS(sl4.moyenne200m)+'</td><td>200m</td></tr>';
                            if(sl7.temps1) t += '<tr><td>L7 T1</td><td>'+sl7.temps1+'</td><td>400m</td></tr>';
                            if(sl7.temps2) t += '<tr><td>L7 T2</td><td>'+sl7.temps2+'</td><td>400m</td></tr>';
                            if(sl7.temps3) t += '<tr><td>L7 T3</td><td>'+sl7.temps3+'</td><td>400m</td></tr>';
                            t += '</table>';

                            t += '<div style="font-weight:700;font-size:0.78rem;margin:8px 0 4px;">🦘 Saut</div>';
                            t += '<table style="width:100%;font-size:0.72rem;border-collapse:collapse;">';
                            t += '<tr style="color:#888"><td>Séance</td><td>Distance</td></tr>';
                            if(sl3.sautDistance) t += '<tr><td>L3</td><td>'+fmtD(sl3.sautDistance)+'</td></tr>';
                            if(sl4.sautDistance) t += '<tr><td>L4</td><td>'+fmtD(sl4.sautDistance)+'</td></tr>';
                            if(sl6.sautDistance) t += '<tr><td>L6</td><td>'+fmtD(sl6.sautDistance)+'</td></tr>';
                            t += '</table>';

                        if(hasLancer) {
                            t += '<div style="font-weight:700;font-size:0.78rem;margin:8px 0 4px;">🎯 Lancer</div>';
                            t += '<table style="width:100%;font-size:0.72rem;border-collapse:collapse;">';
                            t += '<tr style="color:#888"><td>Séance</td><td>Distance</td></tr>';
                            if(sl3.lancerDistance) t += '<tr><td>L3</td><td>'+fmtD(sl3.lancerDistance)+'</td></tr>';
                            if(sl4.lancerDistance) t += '<tr><td>L4</td><td>'+fmtD(sl4.lancerDistance)+'</td></tr>';
                            if(sl6.lancerDistance) t += '<tr><td>L6</td><td>'+fmtD(sl6.lancerDistance)+'</td></tr>';
                            t += '</table>';
                        }
                        t += '</div>';
                        return t;
                    })()}

                    
                    <div class="section">

                            <div class="checkbox-row">

                                <label for="course2-${index}">J'ai bien géré ma stratégie de course</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="course3-${index}" onchange="generateProjet(${index})">
                                <label for="course3-${index}">J'ai eu du mal à tenir le rythme</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="course4-${index}" onchange="generateProjet(${index})">
                                <label for="course4-${index}">J'ai fini plus fort qu'au début</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">💪 MENTAL - Quel est ton profil ?</div>
                        <div class="checkbox-group">
                            <div class="checkbox-row">
                                <input type="checkbox" id="mental1-${index}" onchange="generateProjet(${index})">
                                <label for="mental1-${index}">Je préfère prendre des risques</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="mental2-${index}" onchange="generateProjet(${index})">
                                <label for="mental2-${index}">Je préfère jouer la sécurité</label>
                            </div>
                            <div class="checkbox-row">

                            <div class="checkbox-row">

                                <label for="saut1-${index}">Ma course d'élan est devenue régulière</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="saut2-${index}" onchange="generateProjet(${index})">
                                <label for="saut2-${index}">J'ai bien progressé entre L3/L4 et L6</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="saut3-${index}" onchange="generateProjet(${index})">
                                <label for="saut3-${index}">J'ai encore du mal avec la précision d'appel</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="saut4-${index}" onchange="generateProjet(${index})">

                            </div>

                    </div>
                    
                    <div class="section">
                        <div class="section-title">🎯 LANCER - Comment te sens-tu ?</div>
                        <div class="checkbox-group">
                            <div class="checkbox-row">
                                <input type="checkbox" id="lancer1-${index}" onchange="generateProjet(${index})">
                                <label for="lancer1-${index}">Ma technique s'améliore séance après séance</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="lancer2-${index}" onchange="generateProjet(${index})">
                                <label for="lancer2-${index}">J'ai une bonne coordination globale</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="lancer3-${index}" onchange="generateProjet(${index})">
                                <label for="lancer3-${index}">Je n'arrive pas à être régulier dans mes lancers</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="lancer4-${index}" onchange="generateProjet(${index})">
                                <label for="lancer4-${index}">Je veux surtout réussir une belle distance</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">🎯 OBJECTIF - Que veux-tu ?</div>
                        <div class="checkbox-group">
                            <div class="checkbox-row">
                                <input type="checkbox" id="objectif1-${index}" onchange="generateProjet(${index})">

                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="objectif2-${index}" onchange="generateProjet(${index})">
                                <label for="objectif2-${index}">Me dépasser et viser une belle performance</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="objectif3-${index}" onchange="generateProjet(${index})">
                                <label for="objectif3-${index}">Faire mieux qu'en L7</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="objectif4-${index}" onchange="generateProjet(${index})">
                                <label for="objectif4-${index}">Montrer ce que je sais faire</label>
                            </div>
                        </div>

                </div>

        `;
    });
    
    container.innerHTML = html;
}

function generateSummary(eleve) {
    const seances = eleve.seances || [];
    const seanceL7 = seances.find(s => s.lecon === 'L7');
    
    let summary = '';
    
    // VMA en premier
    if(eleve.vma) {
        summary += `VMA ${eleve.vma} km/h. `;
    }
    
    // Performance L7 (PRIORITÉ) avec conversion intelligente
    if(seanceL7 && seanceL7.temps1 && seanceL7.temps2 && seanceL7.temps3 && eleve.vma) {
        const vmaMs = parseFloat(eleve.vma) / 3.6;
        
        // Conversion intelligente des temps
        const t1 = convertTempsIntelligent(seanceL7.temps1);
        const t2 = convertTempsIntelligent(seanceL7.temps2);
        const t3 = convertTempsIntelligent(seanceL7.temps3);
        
        console.log(`Résumé ${eleve.nomPrenom}: VMA ${eleve.vma}, Temps: ${seanceL7.temps1}→${t1}s, ${seanceL7.temps2}→${t2}s, ${seanceL7.temps3}→${t3}s`);
        
        if(t1 > 0 && t2 > 0 && t3 > 0) {
            const pct1 = Math.round(((400/t1) / vmaMs) * 100);
            const pct2 = Math.round(((400/t2) / vmaMs) * 100);
            const pct3 = Math.round(((400/t3) / vmaMs) * 100);
            const pctMoy = Math.round((pct1 + pct2 + pct3) / 3);
            
            // Vérification cohérence (éviter les 5000% VMA)
            if(pct1 >= 50 && pct1 <= 200 && pct2 >= 50 && pct2 <= 200 && pct3 >= 50 && pct3 <= 200) {
                summary += `L7: ${pct1}%-${pct2}%-${pct3}% (moy ${pctMoy}%). `;
                
                // Évolution
                if(pct3 > pct1 + 3) summary += 'Finit fort. ';
                else if(pct3 < pct1 - 5) summary += 'Décroche. ';
                else summary += 'Régulier. ';
            } else {
                console.log(`⚠️ % VMA aberrants ignorés: ${pct1}%, ${pct2}%, ${pct3}%`);
                summary += `L7: 3×400m réalisé. `;
            }
        }
    }
    
    // État mental L7
    if(seanceL7?.confiantL8) summary += 'Confiant L8. ';
    if(seanceL7?.strategieTrouvee) summary += 'Stratégie OK. ';
    
    // Travail L7
    const travailSaut = [];
    const travailLancer = [];
    
    if(seanceL7?.sautCourseElan) travailSaut.push("élan");
    if(seanceL7?.sautPrecision) travailSaut.push("précision");
    if(seanceL7?.sautReception) travailSaut.push("réception");
    if(seanceL7?.sautDistance) travailSaut.push("distance");
    
    if(seanceL7?.lancerCoordination) travailLancer.push("coordination");
    if(seanceL7?.lancerTransfert) travailLancer.push("transfert");
    if(seanceL7?.lancerAccompagnement) travailLancer.push("accompagnement");
    if(seanceL7?.lancerRegularite) travailLancer.push("régularité");
    
    if(travailSaut.length > 0) summary += `Saut: ${travailSaut.join(', ')}. `;
    if(travailLancer.length > 0) summary += `Lancer: ${travailLancer.join(', ')}. `;
    
    return summary || 'Parcours en cours...';
}

// Fonction conversion intelligente pour résumés (sans UI)
function convertTempsIntelligent(tempsStr) {
    if(!tempsStr || tempsStr.trim() === '') return 0;
    
    const input = tempsStr.trim();
    console.log(`🔍 Conversion résumé: "${input}"`);
    
    // Format standard M:SS ou MM:SS
    const matchStandard = input.match(/^(\d+):(\d+)$/);
    if(matchStandard) {
        const min = parseInt(matchStandard[1]);
        const sec = parseInt(matchStandard[2]);
        if(sec < 60) {
            const total = min * 60 + sec;
            console.log(`✅ ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
            return total;
        }
        console.log(`⚠️ Secondes invalides: ${sec}`);
        return 0;
    }
    
    // Format avec dixièmes M:SS.D
    const matchDixiemes = input.match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        if(sec < 60) {
            const total = min * 60 + sec + dixieme / 10;
            console.log(`✅ ${min}:${sec.toString().padStart(2,'0')}.${dixieme} = ${total}s`);
            return total;
        }
        console.log(`⚠️ Secondes invalides: ${sec}`);
        return 0;
    }
    
    // Tentative correction automatique pour formats courants
    
    // Format décimal 2.30 → 2:30 (interprété comme 2min30s)
    const matchDecimal = input.replace(',', '.').match(/^(\d+)[.,](\d+)$/);
    if(matchDecimal) {
        const min = parseInt(matchDecimal[1]);
        const sec = parseInt(matchDecimal[2]);
        if(sec < 60 && min >= 0 && min <= 10) {
            const total = min * 60 + sec;
            console.log(`🔄 Auto-corrigé: ${input} → ${min}:${sec.toString().padStart(2,'0')} = ${total}s`);
            return total;
        }
    }
    
    // Nombre entier: secondes directes ou format MMSS
    const nombreEntier = parseInt(input);
    if(!isNaN(nombreEntier) && nombreEntier.toString() === input) {
        
        // Secondes directes logiques (60-300s pour 400m)
        if(nombreEntier >= 60 && nombreEntier <= 300) {
            console.log(`🔄 Secondes directes: ${nombreEntier}s`);
            return nombreEntier;
        }
        
        // Format MMSS → MM:SS (ex: 125 → 1:25)
        if(nombreEntier >= 100 && nombreEntier <= 999) {
            const minStr = Math.floor(nombreEntier / 100);
            const secStr = nombreEntier % 100;
            if(secStr < 60 && minStr >= 1 && minStr <= 9) {
                const total = minStr * 60 + secStr;
                console.log(`🔄 Auto-corrigé: ${nombreEntier} → ${minStr}:${secStr.toString().padStart(2,'0')} = ${total}s`);
                return total;
            }
        }
    }
    
    // Secondes avec décimales
    const secondes = parseFloat(input.replace(',', '.'));
    if(!isNaN(secondes) && secondes >= 60 && secondes <= 300) {
        console.log(`🔄 Secondes décimales: ${secondes}s`);
        return secondes;
    }
    
    console.log(`❌ Format non reconnu: "${input}"`);
    return 0;
}

function convertTemps(tempsStr) {
    if(!tempsStr) return 0;
    
    // Format M:SS ou MM:SS (STANDARD)
    const matchMinSec = tempsStr.replace(',', '.').match(/^(\d+):(\d+)$/);
    if(matchMinSec) {
        const min = parseInt(matchMinSec[1]);
        const sec = parseInt(matchMinSec[2]);
        if(sec < 60) {
            return min * 60 + sec;
        }
    }
    
    // Format M:SS.D (avec dixièmes)
    const matchDixiemes = tempsStr.replace(',', '.').match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        if(sec < 60) {
            return min * 60 + sec + dixieme / 10;
        }
    }
    
    // Format secondes directes (si cohérent)
    const sec = parseFloat(tempsStr.replace(',', '.'));
    if(!isNaN(sec) && sec >= 60 && sec <= 300) {
        return sec;
    }
    
    console.log(`⚠️ Temps ignoré (format incorrect): "${tempsStr}"`);
    return 0;
}

function parseTemps(tempsStr) {
    if(!tempsStr || tempsStr.trim() === '') return null;
    const parts = tempsStr.trim().replace(',', '.').match(/(\d+):(\d+)\.(\d+)/);
    if(parts) {
        return parseInt(parts[1]) * 60 + parseInt(parts[2]) + parseInt(parts[3]) / 10;
    }
    const secondsOnly = parseFloat(tempsStr);
    return !isNaN(secondsOnly) ? secondsOnly : null;
}

function generateProjet(eleveIndex) {
    const eleve = elevesData[eleveIndex];
    const container = document.getElementById(`projet-${eleveIndex}`);
    
    // Lire toutes les cases cochées
    const reponses = {
        course: [],
        saut: [],
        lancer: [],
        mental: [],
        objectif: []
    };
    
    ['course1', 'course2', 'course3', 'course4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.course.push(id);
        }
    });
    
    ['saut1', 'saut2', 'saut3', 'saut4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.saut.push(id);
        }
    });
    
    ['lancer1', 'lancer2', 'lancer3', 'lancer4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.lancer.push(id);
        }
    });
    
    ['mental1', 'mental2', 'mental3', 'mental4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.mental.push(id);
        }
    });
    
    ['objectif1', 'objectif2', 'objectif3', 'objectif4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.objectif.push(id);
        }
    });
    
    // Analyser le profil et générer le projet
    const projet = analyserProfil(reponses, eleve);
    container.innerHTML = projet;
}

function analyserProfil(reponses, eleve) {
    const { course, saut, lancer, mental, objectif } = reponses;

    if(course.length === 0 && saut.length === 0 && lancer.length === 0 && mental.length === 0 && objectif.length === 0) {
        return '🤔 Coche les cases qui te correspondent pour découvrir ton projet !';
    }

    // Données cycle réelles
    const seances = eleve.seances || [];
    const sL3 = seances.find(s=>s.lecon==='L3')||{};
    const sL4 = seances.find(s=>s.lecon==='L4')||{};
    const sL6 = seances.find(s=>s.lecon==='L6')||{};
    const sL7 = seances.find(s=>s.lecon==='L7')||{};

    const techSautL6  = [sL6.sautTech1,sL6.sautTech2,sL6.sautTech3,sL6.sautTech4,sL6.sautTech5].filter(Boolean).length;
    const techLancerL6= [sL6.lancerTech1,sL6.lancerTech2,sL6.lancerTech3,sL6.lancerTech4,sL6.lancerTech5].filter(Boolean).length;
    const techSautL4  = [sL4.sautTech1,sL4.sautTech2,sL4.sautTech3,sL4.sautTech4].filter(Boolean).length;
    const techLancerL4= [sL4.lancerTech1,sL4.lancerTech2,sL4.lancerTech3,sL4.lancerTech4].filter(Boolean).length;
    const distSautL3=parseFloat(sL3.sautDistance)||0, distSautL6=parseFloat(sL6.sautDistance)||0;
    const distLancerL3=parseFloat(sL3.lancerDistance)||0, distLancerL6=parseFloat(sL6.lancerDistance)||0;
    const evolSaut  = distSautL3   && distSautL6   ? distSautL6-distSautL3     : null;
    const evolLancer= distLancerL3 && distLancerL6 ? distLancerL6-distLancerL3 : null;
    const pyramideL6= sL6.pyramide60_1 && sL6.pyramide80_1 && sL6.pyramide100 && sL6.pyramide80_2 && sL6.pyramide60_2;
    const niveauL3pct= sL3.niveau==='vma110'?110:sL3.niveau==='vma105'?105:sL3.niveau==='vma100'?100:sL3.niveau==='vma95'?95:null;

    // Analyse L7
    const cvt = t => { if(!t) return 0; const p=String(t).replace(',',':').split(':'); return p.length===2?parseInt(p[0])*60+parseInt(p[1]):0; };
    const t1s=cvt(sL7.temps1), t2s=cvt(sL7.temps2), t3s=cvt(sL7.temps3);
    const toursOk = [t1s,t2s,t3s].filter(Boolean);
    const moyL7 = toursOk.length===3 ? (t1s+t2s+t3s)/3 : null;
    const ecartL7 = toursOk.length===3 ? Math.max(t1s,t2s,t3s)-Math.min(t1s,t2s,t3s) : null;
    const regulierL7 = ecartL7!==null && ecartL7<=8;
    const finisseurL7 = t1s>0 && t3s>0 && t3s < t1s-2;
    const pctVMAL7 = eleve.vma && moyL7 ? Math.round(((0.4/(moyL7/3600))/eleve.vma)*100) : null;

    let strategieCourse='', intensite='', conseilSaut='', conseilLancer='', gestion='', conseilPerso=[];

    // STRATÉGIE COURSE — basée sur données L7 réelles
    if(pctVMAL7) {
        if(pctVMAL7>=110 && regulierL7) {
            strategieCourse='🚀 <strong>STRATÉGIE AMBITIEUSE</strong> : Ton L7 à '+pctVMAL7+'% avec une belle régularité — vise encore plus haut !';
            intensite='Objectif : '+Math.min(pctVMAL7+5,125)+'% VMA'+(eleve.vma?' · '+(Math.round(eleve.vma*Math.min(pctVMAL7+5,125)/100*10)/10)+' km/h':'');
        } else if(pctVMAL7>=100 && regulierL7) {
            strategieCourse='⚖️ <strong>STRATÉGIE REPRODUCTIBLE</strong> : L7 à '+pctVMAL7+'% régulier — reproduis exactement la même chose !';
            intensite='Même rythme qu\'en L7 : '+pctVMAL7+'% VMA · départ calme, tiens jusqu\'au bout';
        } else if(ecartL7!==null && ecartL7>15) {
            strategieCourse='🛡️ <strong>STRATÉGIE RÉGULARITÉ</strong> : En L7 l\'écart entre tours était de '+ecartL7+'s — soigne le rythme en L8 !';
            intensite='Départ prudent à '+Math.max(pctVMAL7-5,90)+'% VMA, maintiens jusqu\'au bout';
        } else {
            strategieCourse='⚖️ <strong>STRATÉGIE ÉQUILIBRÉE</strong> : Pars à '+pctVMAL7+'% VMA comme en L7';
            intensite='Tour 1 calme → Tour 2 régulier → Tour 3 tout donner';
        }
        if(finisseurL7) conseilPerso.push('💪 Tu as fini plus fort en L7 — répète ce finish en L8 !');
        if(sL7.strategieTrouvee) conseilPerso.push('🎯 Ta stratégie est trouvée — fais confiance à ton plan !');
    } else if(course.includes('course1')||course.includes('course2')) {
        strategieCourse='🚀 <strong>STRATÉGIE AMBITIEUSE</strong> : Ton ressenti en L7 était bon — vise haut !';
        intensite='Objectif : 110-115% VMA';
    } else if(course.includes('course3')||mental.includes('mental4')) {
        strategieCourse='🛡️ <strong>STRATÉGIE SÉCURISÉE</strong> : L7 était dur — pars plus calme en L8';
        intensite='Départ à 95-100% VMA, puis progressif';
    } else {
        strategieCourse='⚖️ <strong>STRATÉGIE ÉQUILIBRÉE</strong> : Pars contrôlé, accélère sur les 2 derniers tours';
        intensite='Rythme régulier : 100-105% VMA';
    }
    if(niveauL3pct===110) conseilPerso.push('⚡ Tu avais choisi le niveau Challenge en L3 — tu as le profil pour un L8 ambitieux');
    else if(niveauL3pct===95) conseilPerso.push('🌱 Tu as bien progressé depuis L3 — regarde le chemin parcouru !');

    // CONSEIL SAUT
    if(techSautL6>=4) {
        conseilSaut='🦘 <strong>SAUT</strong> : Technique solide en L6 ('+techSautL6+'/5'+(sL6.sautTech5?' ⭐':'')+')';
        if(evolSaut!==null) conseilSaut+=evolSaut>0?' — +'+evolSaut.toFixed(2)+'m depuis L3 → confiance !':' — vise ta distance record !';
    } else if(saut.includes('saut1')&&saut.includes('saut2')) {
        conseilSaut='🦘 <strong>SAUT</strong> : Tu as progressé sur le cycle — vise ta meilleure distance';
    } else if(saut.includes('saut3')) {
        conseilSaut='🦘 <strong>SAUT</strong> : Soigne l\'élan régulier et l\'appel précis';
    } else if(pyramideL6) {
        conseilSaut='🦘 <strong>SAUT</strong> : Pyramide L6 complète 🏆 — exploite cette puissance dans ton saut !';
    } else if(Math.max(techSautL4,techSautL6)>=2) {
        conseilSaut='🦘 <strong>SAUT</strong> : Applique tes 2 critères de base : élan régulier + appel précis';
    }

    // CONSEIL LANCER
    if(techLancerL6>=4) {
        conseilLancer='🎯 <strong>LANCER</strong> : Technique avancée en L6 ('+techLancerL6+'/5'+(sL6.lancerTech5?' ⭐':'')+')';
        if(evolLancer!==null) conseilLancer+=evolLancer>0?' — +'+evolLancer.toFixed(2)+'m depuis L3 → vise encore plus loin !':' — soigne la rotation + accompagnement';
    } else if(lancer.includes('lancer1')&&lancer.includes('lancer2')) {
        conseilLancer='🎯 <strong>LANCER</strong> : Tes progrès sur le cycle paient — vise ta meilleure distance';
    } else if(lancer.includes('lancer3')) {
        conseilLancer='🎯 <strong>LANCER</strong> : Focus : profil de côté + rotation du bassin';
    } else if(Math.max(techLancerL4,techLancerL6)>=2) {
        conseilLancer='🎯 <strong>LANCER</strong> : Base acquise — ajoute la rotation du bassin pour gagner des mètres';
    }

    // GESTION GLOBALE
    if(finisseurL7||course.includes('course4')) {
        gestion='Tu es un finisseur — garde des forces pour un Tour 3 explosif ! 💥';
    } else if(regulierL7&&sL7.strategieTrouvee) {
        gestion='Ta stratégie est trouvée — reproduis-la exactement ! 🔄';
    } else if(objectif.includes('objectif3')) {
        gestion='Objectif : faire mieux qu\'en L7 — pars 2-3s plus vite au Tour 1 🎯';
    } else if(mental.includes('mental2')) {
        gestion='Reste dans ta zone de confort — la régularité vaut mieux que le risque ✅';
    } else {
        gestion='Tour 1 contrôlé → Tour 2 maintenu → Tour 3 tout donner 🏁';
    }

    let projetHTML = `<div style="font-size: 0.9rem;">`;

    if(conseilPerso.length>0) {
        projetHTML+=`<div style="background:rgba(0,210,255,0.08);border:1px solid rgba(0,210,255,0.2);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:0.8rem;">`;
        conseilPerso.forEach(t=>{projetHTML+=`<div style="margin-bottom:3px;">${t}</div>`;});
        projetHTML+=`</div>`;
    }
    if(strategieCourse) {
        projetHTML+=`<div style="margin-bottom: 8px;">${strategieCourse}</div>`;
        projetHTML+=`<div style="margin-bottom: 8px; font-size: 0.85rem;"><strong>Intensité :</strong> ${intensite}</div>`;
    }
    if(conseilSaut) projetHTML+=`<div style="margin-bottom: 6px;">${conseilSaut}</div>`;
    if(conseilLancer) projetHTML+=`<div style="margin-bottom: 6px;">${conseilLancer}</div>`;
    projetHTML+=`<div style="margin-top: 8px; font-weight: 600;"><strong>Conseil final :</strong> ${gestion}</div>`;
    projetHTML+=`</div>`;

    return projetHTML;
}
</script>

<!-- SW registration + bandeau offline -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(function(){});
}
(function() {
    function updateBanner() {
        var b = document.getElementById('_offline_banner');
        if (!b) {
            b = document.createElement('div');
            b.id = '_offline_banner';
            b.style.cssText = [
                'display:none','position:fixed','top:0','left:0','right:0',
                'background:#ff6b35','color:#fff','text-align:center',
                'padding:8px 12px','font-size:0.82rem','font-weight:700',
                'z-index:99999','letter-spacing:0.3px'
            ].join(';');
            b.textContent = '\u{1F4E1} Mode hors ligne — données sauvegardées localement';
            document.body.appendChild(b);
        }
        b.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online',  updateBanner);
    window.addEventListener('offline', updateBanner);
    window.addEventListener('load',    updateBanner);
})();
</script>
