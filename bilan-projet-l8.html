<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Projet L8 - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0a0f1a;
            --card: #111827;
            --border: rgba(255,255,255,0.08);
            --accent: #00d9ff;
            --purple: #a78bfa;
            --green: #34d399;
            --orange: #fb923c;
            --gold: #fbbf24;
            --red: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            padding: 16px;
            min-height: 100vh;
        }
        .btn-back {
            position: fixed; top: 16px; left: 16px; z-index: 100;
            padding: 8px 16px; background: rgba(255,255,255,0.08);
            border: 1px solid var(--border); border-radius: 8px;
            color: white; text-decoration: none; font-size: 0.85rem; font-weight: 600;
        }
        .page-header { text-align: center; padding: 60px 16px 32px; }
        .page-header h1 {
            font-size: 2rem; font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 6px;
        }
        .page-header p { color: rgba(255,255,255,0.5); font-size: 0.9rem; }

        .eleves-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 24px; max-width: 1400px; margin: 0 auto 40px;
        }
        .eleve-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
        }
        .eleve-header {
            background: linear-gradient(135deg, rgba(0,217,255,0.12), rgba(167,139,250,0.12));
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .eleve-header .nom { font-weight: 800; font-size: 1.05rem; flex: 1; }
        .vma-badge {
            background: rgba(0,217,255,0.15); border: 1px solid rgba(0,217,255,0.3);
            color: var(--accent); padding: 3px 10px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 700;
        }

        /* Timeline */
        .timeline { padding: 16px 20px; }
        .tl-title {
            font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; color: rgba(255,255,255,0.3); margin-bottom: 14px;
        }
        .seance-bloc { display: flex; gap: 12px; margin-bottom: 12px; }
        .seance-ligne { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
        .seance-dot {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.68rem; font-weight: 900; flex-shrink: 0;
        }
        .dot-diag { background: rgba(251,191,36,0.15); border: 2px solid var(--gold); color: var(--gold); }
        .dot-L3   { background: rgba(52,211,153,0.15); border: 2px solid var(--green); color: var(--green); }
        .dot-L4   { background: rgba(52,211,153,0.15); border: 2px solid var(--green); color: var(--green); }
        .dot-L5   { background: rgba(0,217,255,0.12); border: 2px solid var(--accent); color: var(--accent); }
        .dot-L6   { background: rgba(167,139,250,0.15); border: 2px solid var(--purple); color: var(--purple); }
        .dot-L7   { background: rgba(251,113,74,0.15); border: 2px solid var(--orange); color: var(--orange); }
        .dot-empty{ background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.2); }
        .connector { width: 2px; flex: 1; background: var(--border); margin: 3px 0; min-height: 8px; }
        .seance-content { flex: 1; padding-bottom: 2px; }
        .seance-label {
            font-size: 0.75rem; font-weight: 700; margin-bottom: 6px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .seance-date { font-size: 0.68rem; color: rgba(255,255,255,0.28); font-weight: 400; }
        .perf-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
        .pill {
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
            border-radius: 6px; padding: 3px 8px; font-size: 0.72rem;
            display: flex; align-items: center; gap: 4px;
        }
        .pill span { color: rgba(255,255,255,0.4); }
        .pill strong { color: white; }
        .pill.hi { background: rgba(0,217,255,0.07); border-color: rgba(0,217,255,0.22); }
        .tech-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
        .chip {
            background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.22);
            color: var(--green); border-radius: 4px; padding: 2px 6px;
            font-size: 0.64rem; font-weight: 600;
        }
        .chip-gold { background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.25); color: var(--gold); }
        .empty-txt { font-size: 0.7rem; color: rgba(255,255,255,0.22); font-style: italic; padding: 4px 0; }

        /* Projet */
        .projet-section { padding: 16px 20px; border-top: 1px solid var(--border); }
        .proj-title {
            font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; color: rgba(255,255,255,0.3); margin-bottom: 14px;
        }
        .section { margin-bottom: 12px; }
        .sec-label { font-size: 0.78rem; font-weight: 700; color: rgba(255,255,255,0.55); margin-bottom: 7px; }
        .checkbox-group { display: flex; flex-direction: column; gap: 5px; }
        .checkbox-row {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 10px; background: rgba(255,255,255,0.025);
            border: 1px solid transparent; border-radius: 8px;
            font-size: 0.82rem; cursor: pointer; transition: background 0.15s;
        }
        .checkbox-row:hover { background: rgba(255,255,255,0.055); }
        .checkbox-row input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); flex-shrink: 0; }
        .projet-result {
            background: rgba(255,255,255,0.025); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px;
            min-height: 72px; font-size: 0.83rem; line-height: 1.6;
            color: rgba(255,255,255,0.45); font-style: italic; margin-bottom: 12px;
        }
        .projet-result.filled {
            color: white; font-style: normal;
            background: rgba(0,217,255,0.04); border-color: rgba(0,217,255,0.18);
        }
        .btn-row { display: flex; gap: 8px; }
        .btn-save { flex:1; padding:10px; border:none; border-radius:8px; cursor:pointer; font-weight:700; font-size:0.85rem; background:linear-gradient(135deg,#16a34a,#15803d); color:white; }
        .btn-pdf  { flex:1; padding:10px; border:none; border-radius:8px; cursor:pointer; font-weight:700; font-size:0.85rem; background:linear-gradient(135deg,#7c3aed,#6d28d9); color:white; }
        .save-status { text-align:center; font-size:0.75rem; color:var(--green); min-height:18px; margin-top:6px; }
        .no-data { text-align:center; color:rgba(255,255,255,0.4); padding:60px 20px; font-style:italic; }

        /* ── Félicitations cycle terminé ── */
        @keyframes confettiFall {
            0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .confetti-piece {
            position: fixed; top: -20px; width: 10px; height: 14px;
            border-radius: 2px; pointer-events: none; z-index: 9999;
            animation: confettiFall linear forwards;
        }
        #felicitations-banner {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
            background: linear-gradient(135deg, #7c3aed, #0d9488);
            padding: 14px 20px; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #felicitations-banner.visible { display: block; }
        .banner-title { font-size: 1.1rem; font-weight: 900; color: white; margin-bottom: 2px; }
        .banner-sub   { font-size: 0.78rem; color: rgba(255,255,255,0.8); }
        .banner-close { position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
                        background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>

    <div id="felicitations-banner">
        <div class="banner-title">🎉 Félicitations — Cycle terminé !</div>
        <div class="banner-sub">Tous les élèves ont validé leur projet L8 — super boulot à la classe !</div>
        <button class="banner-close" onclick="document.getElementById('felicitations-banner').classList.remove('visible')">✕</button>
    </div>


<a href="index.html" class="btn-back">← Retour</a>

<div class="page-header">
    <h1>EPS : épreuve Combinée</h1>
    <p>🎯 Mon Projet pour L8 — Bilan du cycle complet L1→L7</p>
</div>

<div class="eleves-grid" id="eleves-grid"></div>

<script>
let elevesData = [];

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('eleves-grid').innerHTML = '<div class="no-data">⚠️ Aucune donnée trouvée</div>';
        return;
    }
    elevesData = JSON.parse(stored);
    renderEleves();
};

function fmtTime(sec) {
    if(!sec || sec <= 0) return null;
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
}

function cvtTemps(v) {
    if(!v) return 0;
    const s = String(v).trim();
    const m1 = s.match(/^(\d+):(\d+)$/); if(m1){ const [,a,b]=[...m1]; const sec=parseInt(b); if(sec<60) return parseInt(a)*60+sec; }
    const m2 = s.replace(',','.').match(/^(\d+)[.,](\d+)$/); if(m2){ const [,a,b]=[...m2]; const sec=parseInt(b); if(sec<60&&parseInt(a)<=10) return parseInt(a)*60+sec; }
    const n = parseInt(s); if(!isNaN(n)&&n>=60&&n<=300) return n;
    if(!isNaN(n)&&n>=100&&n<=999){ const mm=Math.floor(n/100),ss=n%100; if(ss<60) return mm*60+ss; }
    return 0;
}

function pctVMA(tSec, vmaKmh, dist=400) {
    if(!tSec||!vmaKmh||tSec<=0) return null;
    const p = Math.round((dist/tSec/(parseFloat(vmaKmh)/3.6))*100);
    return (p>=50&&p<=200) ? p : null;
}

function lastOf(seances, lecon) {
    const f = seances.filter(s => s.lecon === lecon);
    return f.length ? f[f.length-1] : null;
}

// ── Render ──────────────────────────────────────────────────────────────
function renderEleves() {
    const c = document.getElementById('eleves-grid');
    if(!elevesData.length){ c.innerHTML='<div class="no-data">⚠️ Aucun élève trouvé</div>'; return; }
    c.innerHTML = elevesData.map((e,i) => buildCard(e,i)).join('');
    // Restaurer projets sauvegardés
    elevesData.forEach((e,i) => { if(e.projetL8) restoreProjet(e,i); });
    setTimeout(checkCycleComplete, 500);
}

function buildCard(eleve, idx) {
    const seances = eleve.seances || [];
    const diag = eleve.diagnostique || null;
    const vma = parseFloat(eleve.vma) || null;
    const sL3=lastOf(seances,'L3'), sL4=lastOf(seances,'L4'), sL5=lastOf(seances,'L5');
    const sL6=lastOf(seances,'L6'), sL7=lastOf(seances,'L7');
    const saved = eleve.projetL8 || null;

    return `<div class="eleve-card">
        <div class="eleve-header">
            ${eleve.photo
                ? `<img src="${eleve.photo}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.25);flex-shrink:0">`
                : `<span style="font-size:1.4rem">${eleve.sexe==='F'?'👧':'🧑'}</span>`}
            <span class="nom">${eleve.nomPrenom}</span>
            ${vma?`<span class="vma-badge">VMA ${vma} km/h</span>`:''}
        </div>

        <div class="timeline">
            <div class="tl-title">📋 Parcours du cycle</div>
            ${tlDiag(diag, vma)}
            ${tlL3(sL3, vma)}
            ${tlL4(sL4, vma)}
            ${tlL5(sL5)}
            ${tlL6(sL6)}
            ${tlL7(sL7, vma, true)}
        </div>

        ${buildProgression(diag, sL3, sL4, sL6)}

        <div class="projet-section">
            <div class="proj-title">🎯 Mon projet pour L8</div>

            <div class="section">
                <div class="sec-label">🏃 Course — Comment ça s'est passé en L7 ?</div>
                <div class="checkbox-group">
                    ${cb(idx,'course1','Mon % VMA sur 3×400m était élevé (>110%)',saved)}
                    ${cb(idx,'course2','J\'ai bien géré ma stratégie de course',saved)}
                    ${cb(idx,'course3','J\'ai eu du mal à tenir le rythme',saved)}
                    ${cb(idx,'course4','J\'ai fini plus fort qu\'au début',saved)}
                </div>
            </div>
            <div class="section">
                <div class="sec-label">💪 Mental — Quel est ton profil ?</div>
                <div class="checkbox-group">
                    ${cb(idx,'mental1','Je préfère prendre des risques',saved)}
                    ${cb(idx,'mental2','Je préfère jouer la sécurité',saved)}
                    ${cb(idx,'mental3','Je suis confiant après L7',saved)}
                    ${cb(idx,'mental4','J\'ai besoin de me rassurer',saved)}
                </div>
            </div>
            <div class="section">
                <div class="sec-label">🦘 Saut — Comment tu te sens ?</div>
                <div class="checkbox-group">
                    ${cb(idx,'saut1','Ma course d\'élan est devenue régulière',saved)}
                    ${cb(idx,'saut2','J\'ai bien progressé entre L3/L4 et L6',saved)}
                    ${cb(idx,'saut3','J\'ai encore du mal avec la précision d\'appel',saved)}
                    ${cb(idx,'saut4','J\'aime les défis techniques',saved)}
                </div>
            </div>
            <div class="section">
                <div class="sec-label">🎯 Lancer — Comment tu te sens ?</div>
                <div class="checkbox-group">
                    ${cb(idx,'lancer1','Ma technique s\'améliore séance après séance',saved)}
                    ${cb(idx,'lancer2','J\'ai une bonne coordination globale',saved)}
                    ${cb(idx,'lancer3','Je n\'arrive pas à être régulier dans mes lancers',saved)}
                    ${cb(idx,'lancer4','Je veux surtout réussir une belle distance',saved)}
                </div>
            </div>
            <div class="section">
                <div class="sec-label">🏁 Objectif — Que veux-tu en L8 ?</div>
                <div class="checkbox-group">
                    ${cb(idx,'objectif1','Réussir sans prendre de risque',saved)}
                    ${cb(idx,'objectif2','Me dépasser et viser une belle performance',saved)}
                    ${cb(idx,'objectif3','Faire mieux qu\'en L7',saved)}
                    ${cb(idx,'objectif4','Montrer ce que je sais faire',saved)}
                </div>
            </div>

            <div class="projet-result" id="projet-${idx}">Coche les cases pour générer ton projet personnalisé…</div>
            <div class="btn-row">
                <button class="btn-save" onclick="sauvegarderProjet(${idx})">💾 Sauvegarder</button>
                <button class="btn-pdf"  onclick="exportFiche(${idx})">📄 Fiche PDF</button>
            </div>
            <div class="save-status" id="save-status-${idx}"></div>
        </div>
    </div>`;
}

function cb(idx, id, label, saved) {
    const chk = saved?.coches?.[id] ? 'checked' : '';
    return `<label class="checkbox-row"><input type="checkbox" id="${id}-${idx}" ${chk} onchange="generateProjet(${idx})"><span>${label}</span></label>`;
}

// ── Blocs timeline ────────────────────────────────────────────────────
function dot(cls, label, isLast) {
    return `<div class="seance-ligne">
        <div class="seance-dot ${cls}">${label}</div>
        ${isLast?'':'<div class="connector"></div>'}
    </div>`;
}
function pill(label, val, hi=false) {
    return val ? `<div class="pill${hi?' hi':''}"><span>${label}</span><strong>${val}</strong></div>` : '';
}

function buildProgression(diag, sL3, sL4, sL6) {
    const diagSaut  = diag?.sautAvecBest  ?? null;
    const diagLance = diag?.lancerBest    ?? null;
    const l3Saut    = sL3?.sautDistance   ? parseFloat(sL3.sautDistance)   : null;
    const l3Lance   = sL3?.lancerDistance ? parseFloat(sL3.lancerDistance) : null;
    const l4Saut    = sL4?.sautDistance   ? parseFloat(sL4.sautDistance)   : null;
    const l4Lance   = sL4?.lancerDistance ? parseFloat(sL4.lancerDistance) : null;
    const l6Saut    = sL6?.sautDistance   ? parseFloat(sL6.sautDistance)   : null;
    const l6Lance   = sL6?.lancerDistance ? parseFloat(sL6.lancerDistance) : null;

    const hasSaut  = diagSaut||l3Saut||l4Saut||l6Saut;
    const hasLance = diagLance||l3Lance||l4Lance||l6Lance;
    if(!hasSaut && !hasLance) return '';

    function arrowRow(label, vals) {
        // vals = [{lecon, value}] — seulement ceux qui ont une valeur
        const parts = vals.filter(v => v.value !== null);
        if(!parts.length) return '';
        const cells = parts.map((p, i) => {
            const next = parts[i+1];
            const arrow = next
                ? (next.value > p.value ? '↑' : next.value < p.value ? '↓' : '→')
                : '';
            const arrowColor = arrow==='↑'?'#10b981':arrow==='↓'?'#ef4444':'#94a3b8';
            return `<span style="background:rgba(255,255,255,0.07);border-radius:8px;padding:4px 8px;font-size:0.75rem;white-space:nowrap">
                <span style="color:#94a3b8;font-size:0.65rem">${p.lecon}</span><br>
                <strong>${p.value.toFixed(2)}m</strong>
            </span>${arrow?`<span style="color:${arrowColor};font-size:1rem;font-weight:900;margin:0 2px">${arrow}</span>`:''}`;
        }).join('');
        return `<div style="margin-bottom:8px">
            <div style="font-size:0.68rem;color:rgba(255,255,255,0.4);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">${label}</div>
            <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">${cells}</div>
        </div>`;
    }

    const sautRow  = arrowRow('🦘 Progression saut en longueur', [
        {lecon:'Diag',value:diagSaut},{lecon:'L3',value:l3Saut},{lecon:'L4',value:l4Saut},{lecon:'L6',value:l6Saut}
    ]);
    const lanceRow = arrowRow('🎯 Progression lancer', [
        {lecon:'Diag',value:diagLance},{lecon:'L3',value:l3Lance},{lecon:'L4',value:l4Lance},{lecon:'L6',value:l6Lance}
    ]);

    return `<div style="padding:14px 20px;border-top:1px solid var(--border);background:rgba(255,255,255,0.02)">
        <div style="font-size:0.72rem;color:rgba(255,255,255,0.35);font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px">📈 Évolution sur le cycle</div>
        ${sautRow}${lanceRow}
    </div>`;
}

function tlDiag(diag, vma) {
    const date = diag?.date ? new Date(diag.date).toLocaleDateString('fr-FR') : '';
    const moy  = diag?.moyenneCourse ? fmtTime(diag.moyenneCourse) : null;
    const saut = diag?.sautAvecBest  ? diag.sautAvecBest.toFixed(2)+'m' : null;
    const lance= diag?.lancerBest    ? diag.lancerBest.toFixed(1)+'m'   : null;
    return `<div class="seance-bloc">
        ${dot('dot-diag','L1/L2',false)}
        <div class="seance-content">
            <div class="seance-label"><span style="color:var(--gold)">Diagnostic L1/L2</span><span class="seance-date">${date}</span></div>
            <div class="perf-grid">
                ${pill('VMA', vma?vma+' km/h':null, true)}
                ${pill('3×400m moy.', moy)}
                ${pill('Saut élan', saut)}
                ${pill('Lancer', lance)}
                ${!vma&&!moy&&!saut&&!lance?'<span class="empty-txt">Non enregistré</span>':''}
            </div>
        </div>
    </div>`;
}

function tlL3(s, vma) {
    if(!s) return vide('dot-empty','L3','L3 non enregistrée', false);
    const date = s.date?new Date(s.date).toLocaleDateString('fr-FR'):'';
    const moy  = s.moyenne200m ? fmtTime(s.moyenne200m) : null;
    const saut = s.sautDistance ? parseFloat(s.sautDistance).toFixed(2)+'m' : null;
    const lance= s.lancerDistance ? parseFloat(s.lancerDistance).toFixed(1)+'m' : null;
    const niv  = {vma95:'95% VMA',vma100:'100% VMA',vma105:'105% VMA',vma110:'110% VMA'}[s.niveau]||s.niveau||'';
    const techs= [s.sautTech1&&'Élan',s.sautTech2&&'Appel',s.lancerTech1&&'Armé',s.lancerTech2&&'Rotation'].filter(Boolean);
    return `<div class="seance-bloc">
        ${dot('dot-L3','L3',false)}
        <div class="seance-content">
            <div class="seance-label"><span style="color:var(--green)">L3 — Découverte combinée</span><span class="seance-date">${date}</span></div>
            <div class="perf-grid">
                ${pill('Niveau',niv,true)}${pill('200m moy.',moy)}${pill('🦘',saut)}${pill('🎯',lance)}
            </div>
            ${techs.length?`<div class="tech-row">${techs.map(t=>`<span class="chip">✓ ${t}</span>`).join('')}</div>`:''}
        </div>
    </div>`;
}

function tlL4(s, vma) {
    if(!s) return vide('dot-empty','L4','L4 non enregistrée', false);
    const date = s.date?new Date(s.date).toLocaleDateString('fr-FR'):'';
    const moy  = s.moyenne200m ? fmtTime(s.moyenne200m) : null;
    const saut = s.sautDistance ? parseFloat(s.sautDistance).toFixed(2)+'m' : null;
    const lance= s.lancerDistance ? parseFloat(s.lancerDistance).toFixed(1)+'m' : null;
    const prog = {maintien:'Maintien',progression:'Progression',depassement:'Dépassement'}[s.progression]||'';
    const techs= [s.sautTech1&&'Élan',s.sautTech2&&'Appel',s.sautTech3&&'Envol',s.sautTech4&&'Réception',
                  s.lancerTech1&&'Armé',s.lancerTech2&&'Rotation',s.lancerTech3&&'Transfert',s.lancerTech4&&'Accomp.'].filter(Boolean);
    return `<div class="seance-bloc">
        ${dot('dot-L4','L4',false)}
        <div class="seance-content">
            <div class="seance-label"><span style="color:var(--green)">L4 — Consolidation</span><span class="seance-date">${date}</span></div>
            <div class="perf-grid">
                ${pill('Objectif',prog,true)}${pill('200m moy.',moy)}${pill('🦘',saut)}${pill('🎯',lance)}
            </div>
            ${techs.length?`<div class="tech-row">${techs.map(t=>`<span class="chip">✓ ${t}</span>`).join('')}</div>`:''}
        </div>
    </div>`;
}

function tlL5(s) {
    if(!s) return vide('dot-empty','L5','L5 non enregistrée', false);
    const date = s.date?new Date(s.date).toLocaleDateString('fr-FR'):'';
    const pct  = s.performanceMoyenne ? Math.round(s.performanceMoyenne)+'%' : null;
    const dist = s.distanceTotaleEquipe ? s.distanceTotaleEquipe+'m' : null;
    return `<div class="seance-bloc">
        ${dot('dot-L5','L5',false)}
        <div class="seance-content">
            <div class="seance-label"><span style="color:var(--accent)">L5 — Relais Olympique</span><span class="seance-date">${date}</span></div>
            <div class="perf-grid">
                ${pill('% objectif',pct,true)}${pill('Distance éq.',dist)}
                ${s.manches?pill('Manches',s.manches+''):''}
            </div>
            ${s.equipe?`<div style="font-size:0.67rem;color:rgba(255,255,255,0.25);margin-top:3px">Éq. : ${s.equipe}</div>`:''}
        </div>
    </div>`;
}

function tlL6(s) {
    if(!s) return vide('dot-empty','L6','L6 non enregistrée', false);
    const date  = s.date?new Date(s.date).toLocaleDateString('fr-FR'):'';
    const saut  = s.sautDistance ? parseFloat(s.sautDistance).toFixed(2)+'m' : null;
    const lance = s.lancerDistance ? parseFloat(s.lancerDistance).toFixed(1)+'m' : null;
    const scS   = [s.sautTech1,s.sautTech2,s.sautTech3,s.sautTech4,s.sautTech5].filter(Boolean).length;
    const scL   = [s.lancerTech1,s.lancerTech2,s.lancerTech3,s.lancerTech4,s.lancerTech5].filter(Boolean).length;
    const pyram = [s.pyramide60_1,s.pyramide80_1,s.pyramide100,s.pyramide80_2,s.pyramide60_2].filter(Boolean).length;
    return `<div class="seance-bloc">
        ${dot('dot-L6','L6',false)}
        <div class="seance-content">
            <div class="seance-label"><span style="color:var(--purple)">L6 — Perfectionnement</span><span class="seance-date">${date}</span></div>
            <div class="perf-grid">
                ${pyram?pill('Pyramide',pyram+'/5'+(pyram===5?' 🏆':''),true):''}
                ${saut?pill('🦘 '+scS+'/5',saut):scS?pill('🦘 Saut',scS+'/5 tech.'):''}
                ${lance?pill('🎯 '+scL+'/5',lance):scL?pill('🎯 Lancer',scL+'/5 tech.'):''}
            </div>
        </div>
    </div>`;
}

function tlL7(s, vma, isLast=true) {
    if(!s) return vide('dot-empty','L7','L7 non enregistrée', isLast);
    const date = s.date?new Date(s.date).toLocaleDateString('fr-FR'):'';
    const t1=cvtTemps(s.temps1),t2=cvtTemps(s.temps2),t3=cvtTemps(s.temps3);
    const p1=pctVMA(t1,vma),p2=pctVMA(t2,vma),p3=pctVMA(t3,vma);
    const pMoy=(p1&&p2&&p3)?Math.round((p1+p2+p3)/3):null;
    const chips=[];
    if(s.confiantL8) chips.push('<span class="chip chip-gold">💪 Confiant</span>');
    if(s.strategieTrouvee) chips.push('<span class="chip chip-gold">🎯 Stratégie OK</span>');
    return `<div class="seance-bloc">
        ${dot('dot-L7','L7',isLast)}
        <div class="seance-content">
            <div class="seance-label"><span style="color:var(--orange)">L7 — Mise en situation 3×400m</span><span class="seance-date">${date}</span></div>
            <div class="perf-grid">
                ${s.temps1?pill('T1',s.temps1+(p1?' ('+p1+'%)':'')):''}
                ${s.temps2?pill('T2',s.temps2+(p2?' ('+p2+'%)':'')):''}
                ${s.temps3?pill('T3',s.temps3+(p3?' ('+p3+'%)':'')):''}
                ${pMoy?pill('Moy %VMA',pMoy+'%',true):''}
            </div>
            ${chips.length?`<div class="tech-row">${chips.join('')}</div>`:''}
        </div>
    </div>`;
}

function vide(cls, label, msg, isLast) {
    return `<div class="seance-bloc">
        ${dot(cls, label, isLast)}
        <div class="seance-content"><div class="empty-txt" style="padding:6px 0">${msg}</div></div>
    </div>`;
}

// ── Projet généré ─────────────────────────────────────────────────────
function generateProjet(idx) {
    const eleve = elevesData[idx];
    const el = document.getElementById(`projet-${idx}`);
    const get = id => document.getElementById(`${id}-${idx}`)?.checked||false;
    const course=[1,2,3,4].map(n=>`course${n}`).filter(get);
    const mental=[1,2,3,4].map(n=>`mental${n}`).filter(get);
    const saut  =[1,2,3,4].map(n=>`saut${n}`).filter(get);
    const lancer=[1,2,3,4].map(n=>`lancer${n}`).filter(get);
    const obj   =[1,2,3,4].map(n=>`objectif${n}`).filter(get);

    if(!course.length&&!mental.length&&!saut.length&&!lancer.length&&!obj.length) {
        el.className='projet-result';
        el.innerHTML='Coche les cases pour générer ton projet personnalisé…';
        return;
    }

    const seances=eleve.seances||[];
    const sL3=lastOf(seances,'L3')||{}, sL4=lastOf(seances,'L4')||{};
    const sL6=lastOf(seances,'L6')||{}, sL7=lastOf(seances,'L7')||{};
    const vma=parseFloat(eleve.vma)||null;

    const t1=cvtTemps(sL7.temps1),t2=cvtTemps(sL7.temps2),t3=cvtTemps(sL7.temps3);
    const p1=pctVMA(t1,vma),p2=pctVMA(t2,vma),p3=pctVMA(t3,vma);
    const pMoy=(p1&&p2&&p3)?Math.round((p1+p2+p3)/3):null;
    const ecart=(t1&&t2&&t3)?Math.max(t1,t2,t3)-Math.min(t1,t2,t3):null;
    const regulier=ecart!==null&&ecart<=8;
    const finisseur=t1>0&&t3>0&&t3<t1-2;

    let strat='', intensite='';
    if(pMoy) {
        if(pMoy>=110&&regulier){strat='🚀 STRATÉGIE AMBITIEUSE';intensite=`Vise ${Math.min(pMoy+5,125)}% VMA — tu en as la capacité !`;}
        else if(pMoy>=100&&regulier){strat='⚖️ STRATÉGIE REPRODUCTIBLE';intensite=`Reproduis exactement ton L7 : ${pMoy}% VMA, départ calme`;}
        else if(ecart>15){strat='🛡️ STRATÉGIE RÉGULARITÉ';intensite=`Départ prudent à ${Math.max(pMoy-5,90)}% VMA — soigne le rythme`;}
        else{strat='⚖️ STRATÉGIE ÉQUILIBRÉE';intensite='Tour 1 calme → Tour 2 régulier → Tour 3 tout donner';}
    } else if(course.includes('course1')||course.includes('course2')) {
        strat='🚀 STRATÉGIE AMBITIEUSE';intensite='Ton ressenti est bon — vise 110-115% VMA';
    } else if(course.includes('course3')||mental.includes('mental4')) {
        strat='🛡️ STRATÉGIE SÉCURISÉE';intensite='Pars à 95-100% VMA, puis progressif';
    } else {
        strat='⚖️ STRATÉGIE ÉQUILIBRÉE';intensite='Rythme régulier : 100-105% VMA';
    }

    const scS6=[sL6.sautTech1,sL6.sautTech2,sL6.sautTech3,sL6.sautTech4,sL6.sautTech5].filter(Boolean).length;
    const scL6=[sL6.lancerTech1,sL6.lancerTech2,sL6.lancerTech3,sL6.lancerTech4,sL6.lancerTech5].filter(Boolean).length;
    const dS3=parseFloat(sL3.sautDistance)||0, dS6=parseFloat(sL6.sautDistance)||0;
    const dL3=parseFloat(sL3.lancerDistance)||0, dL6=parseFloat(sL6.lancerDistance)||0;
    const evS=dS3&&dS6?(dS6-dS3).toFixed(2):null;
    const evL=dL3&&dL6?(dL6-dL3).toFixed(2):null;

    let cSaut='';
    if(scS6>=4) cSaut=`🦘 Saut : Technique solide (${scS6}/5)${evS?` — +${evS}m depuis L3 !`:' — vise ta distance record'}`;
    else if(saut.includes('saut1')&&saut.includes('saut2')) cSaut='🦘 Saut : Tu as progressé — vise ta meilleure distance';
    else if(saut.includes('saut3')) cSaut='🦘 Saut : Soigne l\'élan régulier et la précision d\'appel';

    let cLancer='';
    if(scL6>=4) cLancer=`🎯 Lancer : Technique avancée (${scL6}/5)${evL?` — +${evL}m depuis L3 !`:' — soigne la rotation'}`;
    else if(lancer.includes('lancer1')&&lancer.includes('lancer2')) cLancer='🎯 Lancer : Tes progrès paient — vise ta meilleure distance';
    else if(lancer.includes('lancer3')) cLancer='🎯 Lancer : Focus : profil de côté + rotation du bassin';

    let final='';
    if(finisseur||course.includes('course4')) final='Tu es un finisseur — garde des forces pour un Tour 3 explosif ! 💥';
    else if(regulier&&sL7.strategieTrouvee) final='Ta stratégie est trouvée — reproduis-la exactement ! 🔄';
    else if(obj.includes('objectif3')) final='Objectif : faire mieux qu\'en L7 — pars 2-3s plus vite au Tour 1 🎯';
    else if(mental.includes('mental2')) final='Reste dans ta zone de confort — la régularité vaut mieux que le risque ✅';
    else final='Tour 1 contrôlé → Tour 2 maintenu → Tour 3 tout donner 🏁';

    el.className='projet-result filled';
    el.innerHTML=`
        <div style="margin-bottom:6px"><strong>${strat}</strong></div>
        <div style="margin-bottom:10px;font-size:0.8rem;color:rgba(255,255,255,0.65)">${intensite}</div>
        ${cSaut?`<div style="margin-bottom:5px;font-size:0.81rem;padding:6px 8px;background:rgba(52,211,153,0.07);border-left:3px solid var(--green);border-radius:0 6px 6px 0">${cSaut}</div>`:''}
        ${cLancer?`<div style="margin-bottom:5px;font-size:0.81rem;padding:6px 8px;background:rgba(251,191,36,0.07);border-left:3px solid var(--gold);border-radius:0 6px 6px 0">${cLancer}</div>`:''}
        <div style="margin-top:8px;font-size:0.81rem;color:var(--gold)">${final}</div>
        ${finisseur?'<div style="font-size:0.72rem;margin-top:5px;color:rgba(255,255,255,0.35)">✓ Tendance L7 : tu as fini plus fort qu\'au départ</div>':''}
        ${sL7.strategieTrouvee?'<div style="font-size:0.72rem;color:rgba(255,255,255,0.35)">✓ Stratégie validée en L7</div>':''}
    `;
}

function restoreProjet(eleve, idx) {
    // Déclencher la génération avec les cases cochées
    generateProjet(idx);
}

// ── Sauvegarde ────────────────────────────────────────────────────────
function sauvegarderProjet(idx) {
    const eleve = elevesData[idx];
    const projetHTML = document.getElementById(`projet-${idx}`)?.innerHTML||'';
    const ids=['course1','course2','course3','course4','saut1','saut2','saut3','saut4',
               'lancer1','lancer2','lancer3','lancer4','mental1','mental2','mental3','mental4',
               'objectif1','objectif2','objectif3','objectif4'];
    const coches={};
    ids.forEach(id => { const e=document.getElementById(`${id}-${idx}`); if(e) coches[id]=e.checked; });
    const all=JSON.parse(localStorage.getItem('eps_pro_students')||'[]');
    const i=all.findIndex(s=>s.id===eleve.id);
    if(i===-1) return;
    all[i].projetL8={coches,projetHTML,date:new Date().toISOString()};
    localStorage.setItem('eps_pro_students', JSON.stringify(all));
    checkCycleComplete();
    localStorage.setItem('eps_pro_students',JSON.stringify(all));
    elevesData[i]=all[i];
    const st=document.getElementById(`save-status-${idx}`);
    if(st){st.textContent='✅ Sauvegardé !';setTimeout(()=>st.textContent='',2500);}
}

// ── Export PDF ────────────────────────────────────────────────────────
function exportFiche(idx) {
    const eleve=elevesData[idx];
    const projetHTML=document.getElementById(`projet-${idx}`)?.innerHTML||'';
    const seances=eleve.seances||[];
    const diag=eleve.diagnostique||{};
    const sL3=lastOf(seances,'L3')||{}, sL4=lastOf(seances,'L4')||{};
    const sL5=lastOf(seances,'L5')||{}, sL6=lastOf(seances,'L6')||{}, sL7=lastOf(seances,'L7')||{};
    const vma=parseFloat(eleve.vma)||null;
    const t1=cvtTemps(sL7.temps1),t2=cvtTemps(sL7.temps2),t3=cvtTemps(sL7.temps3);
    const p1=pctVMA(t1,vma),p2=pctVMA(t2,vma),p3=pctVMA(t3,vma);
    const pMoy=(p1&&p2&&p3)?Math.round((p1+p2+p3)/3):null;
    const row=(l,v)=>v?`<tr><td style="color:#666;padding:4px 8px;font-size:.83rem">${l}</td><td style="font-weight:700;padding:4px 8px;font-size:.83rem">${v}</td></tr>`:'';
    const win=window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>Mon Projet L8 — ${eleve.nomPrenom}</title>
    <style>
        body{font-family:Arial,sans-serif;padding:24px;max-width:680px;margin:0 auto;color:#1e293b}
        .hdr{background:linear-gradient(135deg,#7c3aed,#0d9488);color:white;padding:18px 20px;border-radius:12px;margin-bottom:16px}
        .hdr h2{font-size:1.3rem;margin:0 0 4px} .hdr p{opacity:.8;font-size:.82rem;margin:0}
        .bloc{background:#f8fafc;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #e2e8f0}
        .bloc-title{font-weight:800;color:#7c3aed;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
        table{width:100%;border-collapse:collapse}
        .projet-box{background:#f0fdf4;border:2px solid #0d9488;border-radius:8px;padding:12px;font-size:.85rem;line-height:1.6;margin-bottom:12px}
        .no-print{text-align:center;margin:20px 0}
        @media print{.no-print{display:none}}
    </style></head><body>
    <div class="hdr"><h2>${eleve.sexe==='F'?'👧':'🧑'} ${eleve.nomPrenom}</h2>
    <p>🎯 Mon Projet pour L8 — EPS : épreuve Combinée | ${new Date().toLocaleDateString('fr-FR')}</p></div>

    <div class="bloc">
        <div class="bloc-title">📋 Bilan du cycle L1→L7</div>
        <table>
            ${row('VMA (L1/L2)', vma?vma+' km/h':null)}
            ${row('3×400m moy. diag.', diag.moyenneCourse?fmtTime(diag.moyenneCourse):null)}
            ${row('L3 — 200m moy.', sL3.moyenne200m?fmtTime(sL3.moyenne200m)+(sL3.niveau?' ('+sL3.niveau+')':''):null)}
            ${row('L4 — 200m moy.', sL4.moyenne200m?fmtTime(sL4.moyenne200m):null)}
            ${row('L5 — Relais', sL5.distanceTotaleEquipe?sL5.distanceTotaleEquipe+'m ('+Math.round(sL5.performanceMoyenne||0)+'% obj.)':null)}
            ${row('L6 — Saut', sL6.sautDistance?parseFloat(sL6.sautDistance).toFixed(2)+'m':null)}
            ${row('L6 — Lancer', sL6.lancerDistance?parseFloat(sL6.lancerDistance).toFixed(1)+'m':null)}
            ${row('L7 T1', sL7.temps1?(sL7.temps1+(p1?' ('+p1+'% VMA)':'')):null)}
            ${row('L7 T2', sL7.temps2?(sL7.temps2+(p2?' ('+p2+'% VMA)':'')):null)}
            ${row('L7 T3', sL7.temps3?(sL7.temps3+(p3?' ('+p3+'% VMA)':'')):null)}
            ${row('% VMA moyen L7', pMoy?pMoy+'%':null)}
        </table>
    </div>

    <div class="projet-box"><strong style="display:block;margin-bottom:8px;color:#0d9488">🎯 Mon projet personnalisé</strong>
    ${projetHTML.includes('Coche')?'<em style="color:#999">Projet non encore généré.</em>':projetHTML}</div>

    <div class="no-print">
        <button onclick="window.print()" style="padding:10px 24px;background:#7c3aed;color:white;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-right:12px;">🖨️ Imprimer</button>
        <button onclick="window.close()" style="padding:10px 24px;background:#64748b;color:white;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;">✕ Fermer</button>
    </div></body></html>`);
    win.document.close();
}
</script>

<script>

// ── Félicitations fin de cycle ──
function checkCycleComplete() {
    if(!elevesData.length) return;
    const presents = elevesData.filter(e => !e.absent);
    if(!presents.length) return;
    const tous = presents.every(e => e.projetL8?.coches?.length > 0);
    if(tous) {
        document.getElementById('felicitations-banner').classList.add('visible');
        lancerConfetti();
    }
}

function lancerConfetti() {
    const colors = ['#7c3aed','#0d9488','#f59e0b','#ef4444','#3b82f6','#10b981','#f97316'];
    for(let i = 0; i < 60; i++) {
        setTimeout(() => {
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.background = colors[Math.floor(Math.random() * colors.length)];
            el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
            el.style.animationDelay = '0s';
            el.style.width = (8 + Math.random() * 8) + 'px';
            el.style.height = (10 + Math.random() * 10) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }, i * 60);
    }
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('./service-worker.js').catch(function(){}); }

    function upd(){
        var b=document.getElementById('_ob');
        if(!b){b=document.createElement('div');b.id='_ob';
        b.style.cssText='display:none;position:fixed;top:0;left:0;right:0;background:#ff6b35;color:#fff;text-align:center;padding:8px 12px;font-size:0.82rem;font-weight:700;z-index:99999';
        b.textContent='\u{1F4E1} Mode hors ligne — données sauvegardées localement';document.body.appendChild(b);}
        b.style.display=navigator.onLine?'none':'block';
    }
    window.addEventListener('online',upd);window.addEventListener('offline',upd);window.addEventListener('load',upd);
})();
</script>
