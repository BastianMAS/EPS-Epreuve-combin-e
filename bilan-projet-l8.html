<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilan Projet L8 - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #00d9ff;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            color: white; 
            padding: 16px; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 2.5rem; 
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-bottom: 30px;
        }
        
        .eleves-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .eleve-card {
            background: var(--card);
            border: 1px solid rgba(0,217,255,0.3);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .eleve-header {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: white;
            padding: 16px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .eleve-body {
            padding: 20px;
        }
        
        .section {
            margin-bottom: 20px;
            background: rgba(255,255,255,0.02);
            padding: 16px;
            border-radius: 12px;
        }
        
        .section-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 1rem;
        }
        
        .checkbox-group {
            display: grid;
            gap: 8px;
            margin: 12px 0;
        }
        
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .checkbox-row:hover {
            background: rgba(0,217,255,0.1);
        }
        
        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }
        
        .projet-result {
            background: linear-gradient(135deg, var(--success), var(--accent));
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            color: white;
            font-weight: 600;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.4;
        }
        
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        
        .no-data {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-style: italic;
            padding: 40px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            margin: 20px 0;
        }
        
        .performance-summary {
            background: rgba(0,217,255,0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS: épreuve Combinée</h1>
<p class="subtitle">🎯 MON PROJET POUR L8 - 3×400M</p>

<div class="eleves-grid" id="eleves-grid"></div>

<script>
let elevesData = [];

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        document.getElementById('eleves-grid').innerHTML = '<div class="no-data">⚠️ Aucune donnée trouvée</div>';
        return;
    }
    
    elevesData = JSON.parse(stored);
    renderEleves();
};

function renderEleves() {
    const container = document.getElementById('eleves-grid');
    
    if(elevesData.length === 0) {
        container.innerHTML = '<div class="no-data">⚠️ Aucun élève trouvé</div>';
        return;
    }
    
    let html = '';
    
    elevesData.forEach((eleve, index) => {
        const summary = generateSummary(eleve);
        
        html += `
            <div class="eleve-card">
                <div class="eleve-header">
                    <span>${eleve.sexe === 'F' ? '👧' : '🧑'}</span>
                    <span>${eleve.nomPrenom}</span>
                    <span style="margin-left: auto; font-size: 0.9rem;">${eleve.age} ans</span>
                </div>
                <div class="eleve-body">
                    
                    <div class="performance-summary">
                        <strong>📊 Ton parcours en résumé :</strong><br>
                        ${summary}
                    </div>
                    
                    <div class="section">
                        <div class="section-title">🏃‍♂️ TON TEST L7 - Comment ça s'est passé ?</div>
                        <div class="checkbox-group">
                            <div class="checkbox-row">
                                <input type="checkbox" id="course1-${index}" onchange="generateProjet(${index})">
                                <label for="course1-${index}">Mon % VMA sur 3×400m était élevé (>110%)</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="course2-${index}" onchange="generateProjet(${index})">
                                <label for="course2-${index}">J'ai bien géré ma stratégie de course</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="course3-${index}" onchange="generateProjet(${index})">
                                <label for="course3-${index}">J'ai eu du mal à tenir le rythme</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="course4-${index}" onchange="generateProjet(${index})">
                                <label for="course4-${index}">J'ai fini plus fort qu'au début</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">💪 MENTAL - Quel est ton profil ?</div>
                        <div class="checkbox-group">
                            <div class="checkbox-row">
                                <input type="checkbox" id="mental1-${index}" onchange="generateProjet(${index})">
                                <label for="mental1-${index}">Je préfère prendre des risques</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="mental2-${index}" onchange="generateProjet(${index})">
                                <label for="mental2-${index}">Je préfère jouer la sécurité</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="mental3-${index}" onchange="generateProjet(${index})">
                                <label for="mental3-${index}">Je suis confiant après L7</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="mental4-${index}" onchange="generateProjet(${index})">
                                <label for="mental4-${index}">J'ai besoin de me rassurer</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">🦘 SAUT - Comment te sens-tu ?</div>
                        <div class="checkbox-group">
                            <div class="checkbox-row">
                                <input type="checkbox" id="saut1-${index}" onchange="generateProjet(${index})">
                                <label for="saut1-${index}">Ma course d'élan est devenue régulière</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="saut2-${index}" onchange="generateProjet(${index})">
                                <label for="saut2-${index}">J'ai bien progressé entre L3/L4 et L6</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="saut3-${index}" onchange="generateProjet(${index})">
                                <label for="saut3-${index}">J'ai encore du mal avec la précision d'appel</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="saut4-${index}" onchange="generateProjet(${index})">
                                <label for="saut4-${index}">J'aime les défis techniques</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">🎯 LANCER - Comment te sens-tu ?</div>
                        <div class="checkbox-group">
                            <div class="checkbox-row">
                                <input type="checkbox" id="lancer1-${index}" onchange="generateProjet(${index})">
                                <label for="lancer1-${index}">Ma technique s'améliore séance après séance</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="lancer2-${index}" onchange="generateProjet(${index})">
                                <label for="lancer2-${index}">J'ai une bonne coordination globale</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="lancer3-${index}" onchange="generateProjet(${index})">
                                <label for="lancer3-${index}">Je n'arrive pas à être régulier dans mes lancers</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="lancer4-${index}" onchange="generateProjet(${index})">
                                <label for="lancer4-${index}">Je veux surtout réussir une belle distance</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <div class="section-title">🎯 OBJECTIF - Que veux-tu ?</div>
                        <div class="checkbox-group">
                            <div class="checkbox-row">
                                <input type="checkbox" id="objectif1-${index}" onchange="generateProjet(${index})">
                                <label for="objectif1-${index}">Réussir sans prendre de risque</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="objectif2-${index}" onchange="generateProjet(${index})">
                                <label for="objectif2-${index}">Me dépasser et viser une belle performance</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="objectif3-${index}" onchange="generateProjet(${index})">
                                <label for="objectif3-${index}">Faire mieux qu'en L7</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="objectif4-${index}" onchange="generateProjet(${index})">
                                <label for="objectif4-${index}">Montrer ce que je sais faire</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="projet-result" id="projet-${index}">
                        🤔 Coche les cases qui te correspondent pour découvrir ton projet personnalisé !
                    </div>
                    
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function generateSummary(eleve) {
    const seances = eleve.seances || [];
    const seanceL7 = seances.find(s => s.lecon === 'L7');
    const seanceL6 = seances.find(s => s.lecon === 'L6');
    
    let summary = '';
    
    // Analyse L7 (priorité absolue)
    if(seanceL7 && seanceL7.temps1 && seanceL7.temps2 && seanceL7.temps3 && eleve.vma) {
        const temps = [
            parseTemps(seanceL7.temps1),
            parseTemps(seanceL7.temps2),
            parseTemps(seanceL7.temps3)
        ].filter(t => t !== null);
        
        if(temps.length === 3) {
            const vma = parseFloat(eleve.vma);
            const tempsMoyen = temps.reduce((a,b) => a+b, 0) / 3;
            const vitesseMoyenne = 400 / tempsMoyen; // m/s
            const vitesseVMA = vma / 3.6; // VMA en m/s  
            const pctVMA = Math.round((vitesseMoyenne / vitesseVMA) * 100);
            
            // Vérification sécurité
            if(pctVMA >= 50 && pctVMA <= 200) {
                summary += `3×400m L7 à ${pctVMA}% VMA. `;
                
                // Évolution stratégique
                const temps1 = temps[0];
                const temps3 = temps[2];
                const pct1 = Math.round((400 / temps1) / vitesseVMA * 100);
                const pct3 = Math.round((400 / temps3) / vitesseVMA * 100);
                
                if(pct3 > pct1 + 3) summary += 'Progression positive. ';
                else if(pct3 < pct1 - 5) summary += 'Dégradation en cours. ';
                else summary += 'Stratégie régulière. ';
            }
        }
    }
    
    // Confiance L7
    if(seanceL7?.confiantL8) {
        summary += 'Confiant pour L8. ';
    } else if(seanceL7?.strategieTrouvee) {
        summary += 'Stratégie trouvée. ';
    }
    
    // Analyse technique (saut/lancer - progression L6/L7)
    const sautL6 = seanceL6 ? [seanceL6.sautTech1, seanceL6.sautTech2, seanceL6.sautTech3, seanceL6.sautTech4, seanceL6.sautTech5].filter(Boolean).length : 0;
    const lancerL6 = seanceL6 ? [seanceL6.lancerTech1, seanceL6.lancerTech2, seanceL6.lancerTech3, seanceL6.lancerTech4, seanceL6.lancerTech5].filter(Boolean).length : 0;
    
    if(sautL6 >= 4) summary += 'Saut maîtrisé. ';
    else if(sautL6 >= 2) summary += 'Saut en progression. ';
    
    if(lancerL6 >= 4) summary += 'Lancer maîtrisé. ';
    else if(lancerL6 >= 2) summary += 'Lancer en progression. ';
    
    // Focus autonome L7
    if(seanceL7?.focusSaut) summary += `Focus saut: ${seanceL7.focusSaut}. `;
    if(seanceL7?.focusLancer) summary += `Focus lancer: ${seanceL7.focusLancer}. `;
    
    return summary || 'Parcours en cours de construction...';
}

function parseTemps(tempsStr) {
    if(!tempsStr || tempsStr.trim() === '') return null;
    const parts = tempsStr.trim().replace(',', '.').match(/(\d+):(\d+)\.(\d+)/);
    if(parts) {
        return parseInt(parts[1]) * 60 + parseInt(parts[2]) + parseInt(parts[3]) / 10;
    }
    const secondsOnly = parseFloat(tempsStr);
    return !isNaN(secondsOnly) ? secondsOnly : null;
}

function generateProjet(eleveIndex) {
    const eleve = elevesData[eleveIndex];
    const container = document.getElementById(`projet-${eleveIndex}`);
    
    // Lire toutes les cases cochées
    const reponses = {
        course: [],
        saut: [],
        lancer: [],
        mental: [],
        objectif: []
    };
    
    ['course1', 'course2', 'course3', 'course4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.course.push(id);
        }
    });
    
    ['saut1', 'saut2', 'saut3', 'saut4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.saut.push(id);
        }
    });
    
    ['lancer1', 'lancer2', 'lancer3', 'lancer4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.lancer.push(id);
        }
    });
    
    ['mental1', 'mental2', 'mental3', 'mental4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.mental.push(id);
        }
    });
    
    ['objectif1', 'objectif2', 'objectif3', 'objectif4'].forEach(id => {
        if(document.getElementById(`${id}-${eleveIndex}`)?.checked) {
            reponses.objectif.push(id);
        }
    });
    
    // Analyser le profil et générer le projet
    const projet = analyserProfil(reponses, eleve);
    container.innerHTML = projet;
}

function analyserProfil(reponses, eleve) {
    const { course, saut, lancer, mental, objectif } = reponses;
    
    if(course.length === 0 && saut.length === 0 && lancer.length === 0 && mental.length === 0 && objectif.length === 0) {
        return '🤔 Coche les cases qui te correspondent pour découvrir ton projet !';
    }
    
    let strategieCourse = '';
    let intensite = '';
    let conseilSaut = '';
    let conseilLancer = '';
    let gestion = '';
    
    // STRATÉGIE COURSE basée sur L7
    if(course.includes('course1') || course.includes('course2')) {
        // Performance L7 élevée ou bonne gestion
        if(mental.includes('mental1') || objectif.includes('objectif2')) {
            strategieCourse = '🚀 <strong>STRATÉGIE AMBITIEUSE</strong> : Ton L7 montre que tu peux viser haut !';
            intensite = 'Reproduis ton L7 ou mieux : 110-120% VMA';
        } else {
            strategieCourse = '⚖️ <strong>STRATÉGIE REPRODUCTIBLE</strong> : Ton L7 était réussi, refais pareil !';
            intensite = 'Même intensité qu\'en L7 : 105-110% VMA';
        }
    } else if(course.includes('course3') || mental.includes('mental4')) {
        // Difficultés L7 ou besoin sécurité
        strategieCourse = '🛡️ <strong>STRATÉGIE SÉCURISÉE</strong> : Après L7, sois plus prudent au départ';
        intensite = 'Départ plus calme : 95-100% VMA puis progression';
    } else {
        // Pas de retour L7 clair
        strategieCourse = '⚖️ <strong>STRATÉGIE ÉQUILIBRÉE</strong> : Base-toi sur tes sensations L7';
        intensite = 'Départ contrôlé : 100-105% VMA';
    }
    
    // CONSEIL SAUT (inchangé mais adapté)
    if(saut.includes('saut1') && saut.includes('saut2')) {
        conseilSaut = '🦘 <strong>SAUT</strong> : Tu progresses ! Vise ta meilleure distance';
    } else if(saut.includes('saut3')) {
        conseilSaut = '🦘 <strong>SAUT</strong> : Travaille encore la régularité (comme en L7)';
    } else if(saut.includes('saut4')) {
        conseilSaut = '🦘 <strong>SAUT</strong> : Relève le défi technique !';
    } else if(saut.length > 0) {
        conseilSaut = '🦘 <strong>SAUT</strong> : Continue sur ta lancée L6/L7';
    }
    
    // CONSEIL LANCER (inchangé mais adapté)
    if(lancer.includes('lancer1') && lancer.includes('lancer2')) {
        conseilLancer = '🎯 <strong>LANCER</strong> : Tes progrès payent ! Vise encore plus loin';
    } else if(lancer.includes('lancer3')) {
        conseilLancer = '🎯 <strong>LANCER</strong> : Focus régularité (applique ton travail L7)';
    } else if(lancer.includes('lancer4')) {
        conseilLancer = '🎯 <strong>LANCER</strong> : Va chercher ta distance record !';
    } else if(lancer.length > 0) {
        conseilLancer = '🎯 <strong>LANCER</strong> : Exploite ton travail technique L6/L7';
    }
    
    // GESTION GLOBALE avec référence L7
    if(course.includes('course4') || objectif.includes('objectif4')) {
        gestion = 'Comme en L7 : garde des forces pour un finish puissant ! 💥';
    } else if(objectif.includes('objectif1') || mental.includes('mental2')) {
        gestion = 'Sécurité comme en L7 : reste dans ta zone de confort ✅';
    } else if(objectif.includes('objectif3')) {
        gestion = 'Objectif clair : faire mieux qu\'en L7 ! 🎯';
    } else {
        gestion = 'Reproduis ce qui a marché en L7 🔄';
    }
    
    let projetHTML = `<div style="font-size: 0.9rem;">`;
    
    if(strategieCourse) {
        projetHTML += `<div style="margin-bottom: 8px;">${strategieCourse}</div>`;
        projetHTML += `<div style="margin-bottom: 8px; font-size: 0.85rem;"><strong>Intensité :</strong> ${intensite}</div>`;
    }
    
    if(conseilSaut) {
        projetHTML += `<div style="margin-bottom: 6px;">${conseilSaut}</div>`;
    }
    
    if(conseilLancer) {
        projetHTML += `<div style="margin-bottom: 6px;">${conseilLancer}</div>`;
    }
    
    projetHTML += `<div style="margin-top: 8px; font-weight: 600;"><strong>Conseil final :</strong> ${gestion}</div>`;
    projetHTML += `</div>`;
    
    return projetHTML;
}
</script>
</body>
</html>
