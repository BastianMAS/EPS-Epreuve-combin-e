<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L1/L2 - Évaluation diagnostique - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0b101d;
            --card: #1c2333;
            --accent: #00d2ff;
            --success: #00ff88;
            --warning: #ffcc00;
            --danger: #ff4b4b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 12px; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 4px; }
        .accent { color: var(--accent); }
        .subtitle { text-align: center; color: var(--warning); font-size: 1rem; font-weight: 700; margin-bottom: 12px; }

        /* GRILLE 6 CARTES */
        .grid6 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        @media (max-width: 900px) { .grid6 { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 600px) { .grid6 { grid-template-columns: 1fr; } }

        /* CARTE ÉLÈVE */
        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, var(--warning), var(--success));
            color: black;
            padding: 6px 8px;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-body { padding: 8px; }

        /* SELECT ÉLÈVE */
        .student-select {
            width: 100%;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: #0f1628;
            color: white;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }
        .student-info {
            background: rgba(0,210,255,0.1);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 0.7rem;
            margin-bottom: 6px;
            display: none;
        }

        /* SECTIONS DÉPLIABLES */
        .section { border-radius: 6px; overflow: hidden; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            user-select: none;
        }
        .section-header:hover { opacity: 0.85; }
        .section-header.vma-h { background: rgba(0,210,255,0.2); color: var(--accent); }
        .section-header.course-h { background: rgba(255,204,0,0.2); color: var(--warning); }
        .section-header.saut-h { background: rgba(0,255,136,0.2); color: var(--success); }
        .section-header.lancer-h { background: rgba(255,75,75,0.2); color: var(--danger); }
        .section-body { display: none; padding: 8px; background: rgba(255,255,255,0.02); }
        .section-body.open { display: block; }
        .arrow { transition: transform 0.3s; font-size: 0.7rem; }
        .arrow.open { transform: rotate(180deg); }

        /* INPUTS */
        input[type=number], input[type=text] {
            background: #0f1628;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: white;
            padding: 4px 6px;
            font-size: 0.75rem;
        }
        input:focus { outline: none; border-color: var(--accent); }
        label { display: block; font-size: 0.7rem; color: #aaa; margin: 4px 0 2px; }

        /* BOUTONS TYPE TEST */
        .type-btns { display: flex; gap: 3px; margin: 4px 0; flex-wrap: wrap; }
        .type-btn {
            flex: 1;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 700;
            text-align: center;
            min-width: 50px;
        }
        .type-btn.selected { border-color: var(--accent); background: rgba(0,210,255,0.2); color: var(--accent); }

        /* INPUT + BOUTON AJOUTER */
        .input-row { display: flex; gap: 4px; align-items: center; margin: 4px 0; }
        .input-row input { flex: 1; }
        .btn-add {
            padding: 4px 8px;
            background: var(--accent);
            color: black;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.7rem;
            white-space: nowrap;
        }
        .btn-save-vma {
            width: 100%;
            padding: 5px;
            background: var(--success);
            color: black;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.7rem;
            margin-top: 4px;
        }

        /* RÉSULTATS */
        .vma-display {
            background: rgba(0,255,136,0.1);
            border: 1px solid var(--success);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            margin: 4px 0;
            display: none;
        }
        .vma-display .vma-val { font-size: 1.4rem; font-weight: 900; color: var(--success); }

        .historique {
            background: rgba(0,210,255,0.05);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 6px;
            margin: 4px 0;
            font-size: 0.7rem;
            display: none;
        }
        .historique-item { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .moy-vma { text-align: center; padding-top: 4px; font-weight: 800; color: var(--success); font-size: 0.8rem; }

        .results-pills { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
        .pill {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(255,255,255,0.1);
        }
        .pill.best { background: rgba(0,255,136,0.3); color: var(--success); }
        .best-label { font-size: 0.8rem; color: var(--success); font-weight: 700; margin-top: 4px; }
        
        /* FEEDBACK ET PROGRESS */
        .feedback-box {
            background: rgba(0,255,136,0.15);
            border: 1px solid var(--success);
            border-radius: 4px;
            padding: 6px;
            margin: 4px 0;
            font-weight: 700;
            text-align: center;
            font-size: 0.7rem;
            animation: pulse 0.5s ease-in-out;
        }
        .feedback-warning { background: rgba(255,204,0,0.15); border-color: var(--warning); color: var(--warning); }
        .feedback-danger { background: rgba(255,75,75,0.15); border-color: var(--danger); color: var(--danger); }
        
        .progress-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            height: 6px;
            margin: 4px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, var(--accent), var(--success));
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }
        
        .conseil-box {
            background: rgba(255,204,0,0.08);
            border: 1px solid var(--warning);
            border-radius: 6px;
            padding: 8px;
            margin: 6px 0;
            font-size: 0.7rem;
            line-height: 1.3;
        }
        .conseil-title { color: var(--warning); font-weight: 800; margin-bottom: 4px; font-size: 0.75rem; }
        .conseil-item { margin: 2px 0; }
        
        .objectif-box {
            background: rgba(0,210,255,0.1);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 6px;
            margin: 4px 0;
            text-align: center;
            font-weight: 700;
            font-size: 0.75rem;
        }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* TEMPS CIBLES */
        .cibles { background: rgba(255,204,0,0.08); border: 1px solid var(--warning); border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 0.78rem; }
        .cible-row { display: flex; justify-content: space-between; padding: 2px 0; }

        /* TOURS */
        .tour-row { display: flex; align-items: center; gap: 5px; margin: 4px 0; }
        .tour-label { font-size: 0.8rem; font-weight: 700; color: var(--warning); min-width: 25px; }
        .tour-row input { width: 80px; }
        .tour-result { font-size: 0.8rem; color: var(--success); font-weight: 700; min-width: 50px; }

        /* BOUTON SAVE GLOBAL */
        .save-all {
            width: 100%;
            padding: 12px;
            background: var(--success);
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-back { padding: 8px 16px; background: #555; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; margin-bottom: 12px; font-size: 0.85rem; }
    </style>
</head>
<body>

<h1>EPS<span class="accent">PRO</span></h1>
<p class="subtitle">📊 L1/L2 - ÉVALUATION DIAGNOSTIQUE</p>
<button class="btn-back" onclick="window.location.href='index.html'">← Retour</button>

<div class="grid6" id="grid"></div>

<button class="save-all" onclick="saveAll()">💾 ENREGISTRER LES 6 DIAGNOSTICS</button>

<script>
// =============================================
// DONNÉES RÉELLES depuis localStorage
// =============================================
let ELEVES = [];
const cardState = [{},{},{},{},{},{}];

// Table Luc Léger
const LUC_LEGER = {1:8,2:9,3:9.5,4:10,5:10.5,6:11,7:11.5,8:12,9:12.5,10:13,11:13.5,12:14,13:14.5,14:15,15:15.5,16:16,17:16.5,18:17,19:17.5,20:18};

// =============================================
// INITIALISATION DES 6 CARTES
// =============================================
window.onload = function() {
    // Charger élèves depuis localStorage
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        alert('⚠️ Aucun élève trouvé. Ajoutez des élèves depuis l\'accueil.');
        window.location.href = 'index.html';
        return;
    }
    ELEVES = JSON.parse(stored);

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let i = 0; i < 6; i++) {
        grid.innerHTML += buildCard(i);
    }
};

function buildCard(i) {
    // Options élèves
    let opts = '<option value="">-- Choisir --</option>';
    ELEVES.forEach(e => { opts += `<option value="${e.id}">${e.nomPrenom}</option>`; });

    return `
    <div class="card" id="card-${i}">
        <div class="card-header">📋 ÉLÈVE ${i+1}</div>
        <div class="card-body">
            <!-- SELECT -->
            <select class="student-select" onchange="selectEleve(${i}, this.value)">
                ${opts}
            </select>
            <div class="student-info" id="info-${i}"></div>

            <!-- SECTION VMA -->
            <div class="section" id="sec-vma-${i}">
                <div class="section-header vma-h" onclick="toggleSection('vma',${i})">
                    <span>🏃 TEST VMA</span><span class="arrow" id="arr-vma-${i}">▼</span>
                </div>
                <div class="section-body" id="body-vma-${i}">

                    <!-- Objectif -->
                    <div class="objectif-box">
                        🎯 <strong>DÉFI :</strong> Ta vitesse max !
                    </div>

                    <!-- Conseil technique -->
                    <div class="conseil-box">
                        <div class="conseil-title">💡 ASTUCE</div>
                        <div class="conseil-item">• Garde un rythme régulier</div>
                        <div class="conseil-item">• Cours le plus loin possible</div>
                    </div>

                    <!-- Historique -->
                    <div class="historique" id="histo-${i}">
                        <div id="histo-list-${i}"></div>
                        <div class="moy-vma" id="moy-vma-${i}"></div>
                    </div>

                    <!-- Choix test -->
                    <div class="type-btns">
                        <div class="type-btn" id="btn-dc-${i}" onclick="selectVMAType(${i},'demicooper')">⏱️ 1/2 Cooper<br><small style="font-weight:400;color:#aaa">(6 min)</small></div>
                        <div class="type-btn" id="btn-co-${i}" onclick="selectVMAType(${i},'cooper')">⏱️⏱️ Cooper<br><small style="font-weight:400;color:#aaa">(12 min)</small></div>
                        <div class="type-btn" id="btn-ll-${i}" onclick="selectVMAType(${i},'lucleger')">🔊 Luc Léger<br><small style="font-weight:400;color:#aaa">(Paliers)</small></div>
                    </div>

                    <div id="vma-input-demicooper-${i}" style="display:none">
                        <label>Distance en 6 min (m) :</label>
                        <div class="input-row">
                            <input type="number" id="dc-${i}" placeholder="ex: 1250" oninput="calcVMA(${i})">
                        </div>
                    </div>
                    <div id="vma-input-cooper-${i}" style="display:none">
                        <label>Distance en 12 min (m) :</label>
                        <div class="input-row">
                            <input type="number" id="co-${i}" placeholder="ex: 2500" oninput="calcVMA(${i})">
                        </div>
                    </div>
                    <div id="vma-input-lucleger-${i}" style="display:none">
                        <label>Palier atteint :</label>
                        <div class="input-row">
                            <input type="number" id="ll-${i}" min="1" max="20" placeholder="ex: 10" oninput="calcVMA(${i})">
                        </div>
                        <small style="color:#aaa;font-size:0.72rem">Palier 10 = 13.0 km/h</small>
                    </div>

                    <!-- Résultat VMA calculé -->
                    <div class="vma-display" id="vma-res-${i}">
                        <div style="font-size:0.7rem;color:#aaa">🏃 Vitesse de course</div>
                        <div class="vma-val" id="vma-val-${i}">--</div>
                        <div style="font-size:0.7rem;color:#aaa">km/h</div>
                        <button class="btn-save-vma" onclick="saveVMATest(${i})">💾 Enregistrer</button>
                    </div>

                </div>
            </div>

            <!-- SECTION 3×400m -->
            <div class="section" id="sec-course-${i}">
                <div class="section-header course-h" onclick="toggleSection('course',${i})">
                    <span>🏃‍♂️ TEST 3×400m</span><span class="arrow" id="arr-course-${i}">▼</span>
                </div>
                <div class="section-body" id="body-course-${i}">

                    <!-- Progress bar course -->
                    <div style="margin: 10px 0;">
                        <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 4px;">Progression :</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="course-progress-${i}" style="width: 0%"></div>
                        </div>
                        <div style="text-align: center; font-size: 0.75rem; color: #aaa;" id="course-progress-text-${i}">0/3 tours</div>
                    </div>

                    <!-- Temps cibles -->
                    <div class="cibles" id="cibles-${i}" style="display:none">
                        <div style="font-weight:700;color:var(--warning);margin-bottom:4px">🎯 Temps cibles :</div>
                        <div id="cibles-content-${i}"></div>
                    </div>

                    <div class="tour-row">
                        <span class="tour-label">T1</span>
                        <input type="text" id="t1-${i}" placeholder="2:05" oninput="updateTours(${i})" style="width:60px">
                        <span class="tour-result" id="t1r-${i}"></span>
                    </div>
                    <div class="tour-row">
                        <span class="tour-label">T2</span>
                        <input type="text" id="t2-${i}" placeholder="2:08" oninput="updateTours(${i})" style="width:60px">
                        <span class="tour-result" id="t2r-${i}"></span>
                    </div>
                    <div class="tour-row">
                        <span class="tour-label">T3</span>
                        <input type="text" id="t3-${i}" placeholder="2:10" oninput="updateTours(${i})" style="width:60px">
                        <span class="tour-result" id="t3r-${i}"></span>
                    </div>
                    <div id="moy-course-${i}" style="font-size:0.75rem;margin-top:4px;color:var(--success);font-weight:700"></div>
                </div>
            </div>

            <!-- SECTION SAUT -->
            <div class="section" id="sec-saut-${i}">
                <div class="section-header saut-h" onclick="toggleSection('saut',${i})">
                    <span>🦘 SAUT EN LONGUEUR</span><span class="arrow" id="arr-saut-${i}">▼</span>
                </div>
                <div class="section-body" id="body-saut-${i}">

                    <!-- Objectif -->
                    <div class="objectif-box">
                        🎯 <strong>DÉFI :</strong> Saute le plus loin !
                    </div>

                    <!-- Conseils techniques saut sans élan -->
                    <div class="conseil-box">
                        <div class="conseil-title">💡 SAUT SANS ÉLAN</div>
                        <div class="conseil-item">• Plie les genoux</div>
                        <div class="conseil-item">• Bras vers l'arrière puis avant</div>
                        <div class="conseil-item">• Pousse fort avec les 2 pieds</div>
                    </div>

                    <label>Sans élan (m) :</label>
                    <div class="input-row">
                        <input type="number" step="0.01" id="saut-sans-input-${i}" placeholder="ex: 1.85">
                        <button class="btn-add" onclick="addSaut(${i},'sans')">+ Ajouter</button>
                    </div>
                    <div class="results-pills" id="saut-sans-pills-${i}"></div>
                    <div class="best-label" id="saut-sans-best-${i}"></div>

                    <!-- Conseils techniques saut avec élan -->
                    <div class="conseil-box" style="margin-top:10px">
                        <div class="conseil-title">💡 SAUT AVEC ÉLAN</div>
                        <div class="conseil-item">• 6-8 foulées d'élan</div>
                        <div class="conseil-item">• Pied fort sur la ligne</div>
                        <div class="conseil-item">• Pousse vers le haut ET l'avant</div>
                    </div>

                    <label style="margin-top:10px">Avec élan (m) :</label>
                    <div class="input-row">
                        <input type="number" step="0.01" id="saut-avec-input-${i}" placeholder="ex: 2.50">
                        <button class="btn-add" onclick="addSaut(${i},'avec')">+ Ajouter</button>
                    </div>
                    <div class="results-pills" id="saut-avec-pills-${i}"></div>
                    <div class="best-label" id="saut-avec-best-${i}"></div>

                </div>
            </div>

            <!-- SECTION LANCER -->
            <div class="section" id="sec-lancer-${i}">
                <div class="section-header lancer-h" onclick="toggleSection('lancer',${i})">
                    <span>🎯 LANCER</span><span class="arrow" id="arr-lancer-${i}">▼</span>
                </div>
                <div class="section-body" id="body-lancer-${i}">

                    <!-- Objectif -->
                    <div class="objectif-box">
                        🎯 <strong>DÉFI :</strong> Lance le plus loin !
                    </div>

                    <div class="type-btns">
                        <div class="type-btn" id="btn-vortex-${i}" onclick="selectLancerType(${i},'vortex')">🚀 Vortex</div>
                        <div class="type-btn" id="btn-poids-${i}" onclick="selectLancerType(${i},'poids')">🟡 Poids</div>
                    </div>

                    <!-- Conseils techniques vortex -->
                    <div class="conseil-box" id="conseil-vortex-${i}" style="display:none">
                        <div class="conseil-title">💡 VORTEX</div>
                        <div class="conseil-item">• De profil, pied gauche devant</div>
                        <div class="conseil-item">• Vortex au niveau oreille</div>
                        <div class="conseil-item">• Rotation bassin puis bras</div>
                    </div>

                    <!-- Conseils techniques poids -->
                    <div class="conseil-box" id="conseil-poids-${i}" style="display:none">
                        <div class="conseil-title">💡 POIDS</div>
                        <div class="conseil-item">• Poids contre le cou</div>
                        <div class="conseil-item">• Pied fort derrière</div>
                        <div class="conseil-item">• Pousse vers l'avant-haut</div>
                    </div>

                    <label>Distance (m) :</label>
                    <div class="input-row">
                        <input type="number" step="0.01" id="lancer-input-${i}" placeholder="ex: 8.20">
                        <button class="btn-add" onclick="addLancer(${i})">+ Ajouter</button>
                    </div>
                    <div class="results-pills" id="lancer-pills-${i}"></div>
                    <div class="best-label" id="lancer-best-${i}"></div>

                </div>
            </div>

            <!-- COMMENTAIRES -->
            <label style="margin-top:6px;color:var(--warning);font-size:0.7rem">💬 Commentaires :</label>
            <textarea id="comment-${i}" placeholder="Observations..." style="width:100%;min-height:40px;background:#0f1628;border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:white;padding:4px;font-size:0.7rem;resize:vertical;margin-top:3px"></textarea>
        </div>
    </div>`;
}

// =============================================
// SÉLECTION ÉLÈVE
// =============================================
function selectEleve(i, id) {
    const s = ELEVES.find(e => e.id === id);
    if(s) {
        // Charger diagnostic existant si présent
        const existant = s.diagnostique || {};
        cardState[i] = {
            student: s,
            vmaHistorique: s.vmaHistorique || [],
            vma: s.vma || null,
            sautSans: existant.sautSans || [],
            sautAvec: existant.sautAvec || [],
            lancerType: existant.lancerType || null,
            lancerResults: existant.lancerResults || [],
            tours: existant.tours || [null,null,null],
            commentaire: existant.commentaire || ''
        };
    } else {
        cardState[i] = {};
    }

    const info = document.getElementById(`info-${i}`);
    if(s) {
        info.style.display = 'block';
        const vmaInfo = s.vma ? ` | VMA: <strong style="color:var(--success)">${s.vma} km/h</strong>` : '';
        info.innerHTML = `<strong>${s.sexe==='F'?'👧':'🧑'} ${s.sexe==='F'?'Fille':'Garçon'}</strong> | ${s.age} ans${vmaInfo}`;
        // Recharger historique si VMA existante
        if(s.vmaHistorique && s.vmaHistorique.length > 0) updateHistorique(i);
    } else {
        info.style.display = 'none';
    }
}

// =============================================
// TOGGLE SECTIONS
// =============================================
function toggleSection(sec, i) {
    const body = document.getElementById(`body-${sec}-${i}`);
    const arr = document.getElementById(`arr-${sec}-${i}`);
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    arr.classList.toggle('open', !isOpen);
    if(!isOpen && sec === 'course') updateCibles(i);
    if(!isOpen && sec === 'vma') updateHistorique(i);
}

// =============================================
// TEST VMA
// =============================================
function selectVMAType(i, type) {
    ['demicooper','cooper','lucleger'].forEach(t => {
        document.getElementById(`vma-input-${t}-${i}`).style.display = 'none';
        document.getElementById(`btn-${t.replace('demicooper','dc').replace('cooper','co').replace('lucleger','ll')}-${i}`).classList.remove('selected');
    });
    document.getElementById(`vma-input-${type}-${i}`).style.display = 'block';
    const btnId = type==='demicooper'?'dc':type==='cooper'?'co':'ll';
    document.getElementById(`btn-${btnId}-${i}`).classList.add('selected');
    if(cardState[i]) cardState[i].vmaTestType = type;
    document.getElementById(`vma-res-${i}`).style.display = 'none';
}

function calcVMA(i) {
    const type = cardState[i]?.vmaTestType;
    if(!type) return;
    let vma = null;

    if(type === 'demicooper') {
        const d = parseFloat(document.getElementById(`dc-${i}`).value);
        if(d > 0) vma = d / 100;
    } else if(type === 'cooper') {
        const d = parseFloat(document.getElementById(`co-${i}`).value);
        if(d > 0) vma = (d - 504) / 45;
    } else if(type === 'lucleger') {
        const p = parseInt(document.getElementById(`ll-${i}`).value);
        if(p >= 1 && p <= 20) vma = LUC_LEGER[p] || null;
    }

    if(vma && vma > 0) {
        vma = Math.round(vma * 10) / 10;
        cardState[i].vmaCalculee = vma;
        document.getElementById(`vma-val-${i}`).textContent = vma;
        document.getElementById(`vma-res-${i}`).style.display = 'block';
    } else {
        document.getElementById(`vma-res-${i}`).style.display = 'none';
    }
}

function saveVMATest(i) {
    const vma = cardState[i]?.vmaCalculee;
    const type = cardState[i]?.vmaTestType;
    if(!vma || !type) { alert('⚠️ Calculez d\'abord la VMA'); return; }

    const labels = { demicooper:'1/2 Cooper', cooper:'Cooper', lucleger:'Luc Léger' };
    cardState[i].vmaHistorique = cardState[i].vmaHistorique || [];
    cardState[i].vmaHistorique.push({ type, label: labels[type], vma, date: new Date().toLocaleDateString('fr-FR') });

    // Moyenne
    const moy = cardState[i].vmaHistorique.reduce((s,t) => s+t.vma, 0) / cardState[i].vmaHistorique.length;
    cardState[i].vma = Math.round(moy * 10) / 10;

    // Reset input
    document.getElementById(`${type==='demicooper'?'dc':type==='cooper'?'co':'ll'}-${i}`).value = '';
    document.getElementById(`vma-res-${i}`).style.display = 'none';

    updateHistorique(i);
    updateCibles(i);

    // Mettre à jour l'affichage info élève
    const info = document.getElementById(`info-${i}`);
    if(info) {
        const s = cardState[i].student;
        info.innerHTML = `<strong>${s.sexe==='F'?'👧':'🧑'} ${s.sexe==='F'?'Fille':'Garçon'}</strong> | ${s.age} ans | VMA: <strong style="color:var(--success)">${cardState[i].vma} km/h</strong>`;
    }

    alert(`✅ Test enregistré ! VMA moyenne : ${cardState[i].vma} km/h`);
}

function updateHistorique(i) {
    const histo = cardState[i]?.vmaHistorique;
    const el = document.getElementById(`histo-${i}`);
    if(!histo || histo.length === 0) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    document.getElementById(`histo-list-${i}`).innerHTML = histo.map((t, idx) =>
        `<div class="historique-item">
            <span style="color:#aaa">${t.date} - ${t.label}</span>
            <div>
                <span style="font-weight:700">${t.vma} km/h</span>
                <button onclick="supprimerVMA(${i}, ${idx})" style="margin-left: 8px; padding: 2px 6px; background: var(--danger); color: white; border: none; border-radius: 3px; font-size: 0.6rem; cursor: pointer;">✕</button>
            </div>
        </div>`
    ).join('');
    const moy = histo.reduce((s,t) => s+t.vma, 0) / histo.length;
    document.getElementById(`moy-vma-${i}`).textContent = `Moyenne : ${Math.round(moy*10)/10} km/h`;
}

function supprimerVMA(cardIndex, histoIndex) {
    if(!confirm('Supprimer cette valeur VMA ?')) return;
    
    cardState[cardIndex].vmaHistorique.splice(histoIndex, 1);
    
    // Recalculer moyenne
    if(cardState[cardIndex].vmaHistorique.length > 0) {
        const moy = cardState[cardIndex].vmaHistorique.reduce((s,t) => s+t.vma, 0) / cardState[cardIndex].vmaHistorique.length;
        cardState[cardIndex].vma = Math.round(moy * 10) / 10;
    } else {
        cardState[cardIndex].vma = null;
    }
    
    updateHistorique(cardIndex);
    updateCibles(cardIndex);
    
    // Mettre à jour l'affichage info élève
    const info = document.getElementById(`info-${cardIndex}`);
    if(info && cardState[cardIndex].student) {
        const s = cardState[cardIndex].student;
        const vmaInfo = cardState[cardIndex].vma ? ` | VMA: <strong style="color:var(--success)">${cardState[cardIndex].vma} km/h</strong>` : '';
        info.innerHTML = `<strong>${s.sexe==='F'?'👧':'🧑'} ${s.sexe==='F'?'Fille':'Garçon'}</strong> | ${s.age} ans${vmaInfo}`;
    }
}

// =============================================
// 3×400m
// =============================================
function updateCibles(i) {
    // Pas de temps cibles dans le diagnostic - juste faire son maximum
    const el = document.getElementById(`cibles-${i}`);
    if(el) el.style.display = 'none';
}

function supprimerSaut(cardIndex, type, resultIndex) {
    if(!confirm('Supprimer cette valeur de saut ?')) return;
    
    const key = type === 'sans' ? 'sautSans' : 'sautAvec';
    cardState[cardIndex][key].splice(resultIndex, 1);
    
    renderSaut(cardIndex, type);
}

function supprimerLancer(cardIndex, resultIndex) {
    if(!confirm('Supprimer cette valeur de lancer ?')) return;
    
    cardState[cardIndex].lancerResults.splice(resultIndex, 1);
    
    renderLancer(cardIndex);
}

function updateTours(i) {
    let moy = null, valid = 0, total = 0;
    const temps = [];
    
    [1,2,3].forEach(n => {
        const val = parseTime(document.getElementById(`t${n}-${i}`).value);
        const el = document.getElementById(`t${n}r-${i}`);
        if(val) { 
            el.textContent = fmtSec(val); 
            el.style.color = 'var(--success)'; 
            total += val; 
            valid++;
            temps.push(val);
            
            // Pas de feedback dans le diagnostic - juste encourager
            let feedback = `✅ Tour ${n} enregistré !`;
            
            // Afficher feedback simple
            let feedbackEl = document.getElementById(`feedback-t${n}-${i}`);
            if(!feedbackEl) {
                feedbackEl = document.createElement('div');
                feedbackEl.id = `feedback-t${n}-${i}`;
                feedbackEl.className = 'feedback-box';
                el.parentNode.appendChild(feedbackEl);
            }
            feedbackEl.textContent = feedback;
            
        } else { 
            el.textContent = '';
            const feedbackEl = document.getElementById(`feedback-t${n}-${i}`);
            if(feedbackEl) feedbackEl.remove();
        }
    });
    
    // Mettre à jour la progress bar
    const progressBar = document.getElementById(`course-progress-${i}`);
    const progressText = document.getElementById(`course-progress-text-${i}`);
    if(progressBar) {
        const percent = (valid / 3) * 100;
        progressBar.style.width = percent + '%';
        progressText.textContent = `${valid}/3 tours`;
        
        if(valid === 3) {
            progressText.innerHTML = `🏆 <strong>3/3 tours terminés !</strong>`;
            progressText.style.color = 'var(--success)';
        }
    }
    
    const moyEl = document.getElementById(`moy-course-${i}`);
    if(valid === 3) {
        moy = total / 3;
        const ecartMax = Math.max(
            Math.abs(temps[1] - temps[0]),
            Math.abs(temps[2] - temps[1])
        );
        
        let moyFeedback = `Moy : ${fmtSec(moy)}`;
        if(ecartMax <= 5) {
            moyFeedback += ` 🏆 SUPER RÉGULARITÉ !`;
            moyEl.style.color = 'var(--success)';
        } else if(ecartMax <= 10) {
            moyFeedback += ` 👍 Bonne régularité`;
            moyEl.style.color = 'var(--warning)';
        } else {
            moyFeedback += ` 💪 Continue à t'entraîner !`;
            moyEl.style.color = 'var(--warning)';
        }
        
        moyEl.textContent = moyFeedback;
        
        if(cardState[i]) cardState[i].tours = temps;
    } else {
        moyEl.textContent = '';
    }
}

// =============================================
// SAUT
// =============================================
function addSaut(i, type) {
    const input = document.getElementById(`saut-${type}-input-${i}`);
    const val = parseFloat(input.value);
    if(!val || val <= 0) { alert('⚠️ Entrez une distance valide'); return; }

    const key = type === 'sans' ? 'sautSans' : 'sautAvec';
    cardState[i][key] = cardState[i][key] || [];
    cardState[i][key].push(val);
    input.value = '';
    renderSaut(i, type);
}

function renderSaut(i, type) {
    const key = type === 'sans' ? 'sautSans' : 'sautAvec';
    const results = cardState[i][key] || [];
    const best = results.length ? Math.max(...results) : null;

    document.getElementById(`saut-${type}-pills-${i}`).innerHTML = results.map((v, idx) =>
        `<span class="pill${v===best?' best':''}">${v.toFixed(2)}m 
         <button onclick="supprimerSaut(${i}, '${type}', ${idx})" style="margin-left: 4px; padding: 1px 4px; background: var(--danger); color: white; border: none; border-radius: 2px; font-size: 0.6rem; cursor: pointer;">✕</button>
         </span>`
    ).join('');
    document.getElementById(`saut-${type}-best-${i}`).textContent = best ? `✅ Meilleur : ${best.toFixed(2)}m` : '';
}

// =============================================
// LANCER
// =============================================
function selectLancerType(i, type) {
    ['vortex','poids'].forEach(t => document.getElementById(`btn-${t}-${i}`).classList.remove('selected'));
    document.getElementById(`btn-${type}-${i}`).classList.add('selected');
    
    // Afficher le bon conseil
    document.getElementById(`conseil-vortex-${i}`).style.display = type === 'vortex' ? 'block' : 'none';
    document.getElementById(`conseil-poids-${i}`).style.display = type === 'poids' ? 'block' : 'none';
    
    cardState[i].lancerType = type;
}

function addLancer(i) {
    const input = document.getElementById(`lancer-input-${i}`);
    const val = parseFloat(input.value);
    if(!val || val <= 0) { alert('⚠️ Entrez une distance valide'); return; }

    cardState[i].lancerResults = cardState[i].lancerResults || [];
    cardState[i].lancerResults.push(val);
    input.value = '';
    renderLancer(i);
}

function renderLancer(i) {
    const results = cardState[i].lancerResults || [];
    const best = results.length ? Math.max(...results) : null;
    document.getElementById(`lancer-pills-${i}`).innerHTML = results.map((v, idx) =>
        `<span class="pill${v===best?' best':''}">${v.toFixed(2)}m 
         <button onclick="supprimerLancer(${i}, ${idx})" style="margin-left: 4px; padding: 1px 4px; background: var(--danger); color: white; border: none; border-radius: 2px; font-size: 0.6rem; cursor: pointer;">✕</button>
         </span>`
    ).join('');
    document.getElementById(`lancer-best-${i}`).textContent = best ? `✅ Meilleur : ${best.toFixed(2)}m` : '';
}

// =============================================
// ENREGISTREMENT GLOBAL
// =============================================
function saveAll() {
    let count = 0;
    let allStudents = JSON.parse(localStorage.getItem('eps_pro_students') || '[]');

    cardState.forEach((d, i) => {
        if(!d.student) return;

        // Relire TOUS les inputs au moment de sauvegarder
        const t1 = parseTime(document.getElementById(`t1-${i}`)?.value);
        const t2 = parseTime(document.getElementById(`t2-${i}`)?.value);
        const t3 = parseTime(document.getElementById(`t3-${i}`)?.value);
        const tours = [t1, t2, t3];

        const comment = document.getElementById(`comment-${i}`)?.value || '';

        const sautSans = d.sautSans || [];
        const sautAvec = d.sautAvec || [];
        const lancerResults = d.lancerResults || [];

        // Trouver l'élève dans le localStorage
        const idx = allStudents.findIndex(s => s.id === d.student.id);
        if(idx === -1) return;

        // Mettre à jour VMA et historique
        if(d.vma) allStudents[idx].vma = d.vma;
        if(d.vmaHistorique && d.vmaHistorique.length > 0) allStudents[idx].vmaHistorique = d.vmaHistorique;

        // Sauvegarder diagnostic complet
        allStudents[idx].diagnostique = {
            vma: d.vma,
            tour1: t1,
            tour2: t2,
            tour3: t3,
            moyenneCourse: (t1 && t2 && t3) ? (t1+t2+t3)/3 : null,
            sautSans: sautSans,
            sautAvec: sautAvec,
            sautSansBest: sautSans.length ? Math.max(...sautSans) : null,
            sautAvecBest: sautAvec.length ? Math.max(...sautAvec) : null,
            lancerType: d.lancerType,
            lancerResults: lancerResults,
            lancerBest: lancerResults.length ? Math.max(...lancerResults) : null,
            commentaire: comment,
            date: new Date().toISOString()
        };

        count++;
    });

    if(count === 0) { alert('⚠️ Aucun élève sélectionné'); return; }

    localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
    alert(`✅ ${count} diagnostic(s) enregistré(s) !`);
}

// =============================================
// UTILITAIRES
// =============================================
function parseTime(str) {
    if(!str) return null;
    const parts = str.replace(',',':').split(':');
    if(parts.length === 2) {
        const m = parseInt(parts[0]), s = parseInt(parts[1]);
        if(!isNaN(m) && !isNaN(s)) return m*60 + s;
    }
    return null;
}

function fmtSec(sec) {
    const m = Math.floor(sec/60);
    const s = Math.round(sec%60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}
