<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic - EPS PRO</title>
    <style>
        :root {
            --bg: #0b101d;
            --card: #1c2333;
            --accent: #00d2ff;
            --success: #00ff88;
            --warning: #ffcc00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2rem; margin-bottom: 5px; }
        .accent-text { color: var(--accent); }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 15px; font-size: 0.9rem; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        .btn-secondary { background: #666; color: white; }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .student-card {
            background: var(--card);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
            font-size: 0.85rem;
        }
        .student-header {
            background: linear-gradient(135deg, var(--warning), var(--success));
            color: black;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: 700;
            text-align: center;
            font-size: 0.9rem;
        }
        select, input { width: 100%; padding: 6px; border-radius: 6px; border: 2px solid var(--accent); background: #0f0f23; color: white; font-size: 0.8rem; }
        label { display: block; margin: 6px 0 3px 0; font-weight: 600; font-size: 0.75rem; color: var(--accent); }
        .time-input-group { display: flex; gap: 5px; align-items: center; margin: 6px 0; }
        .time-input-group input { width: 45px; padding: 6px; font-size: 0.85rem; }
        .time-input-group span { font-size: 0.75rem; color: #aaa; }
        .section-title {
            background: rgba(255,204,0,0.1);
            padding: 6px;
            border-radius: 6px;
            margin: 10px 0 6px 0;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--warning);
        }
        .vma-result {
            background: rgba(0,255,136,0.1);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--success);
            margin: 6px 0;
            font-weight: 700;
            color: var(--success);
            text-align: center;
        }
        .save-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: var(--success);
            color: black;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }
        @media (max-width: 900px) { .student-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .student-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>EPS<span class="accent-text">PRO</span></h1>
        <p class="subtitle" style="color: var(--warning); font-size: 1.2rem; font-weight: 700;">🔬 DIAGNOSTIC (L1)</p>
        <p class="subtitle">Test VMA + 3×400m + Saut + Lancer</p>
        
        <button onclick="window.location.href='index.html'" class="btn btn-secondary" style="margin-bottom: 15px;">← Retour</button>
        
        <div id="student-grid" class="student-grid">
            <div class="student-card" id="card-0"></div>
            <div class="student-card" id="card-1"></div>
            <div class="student-card" id="card-2"></div>
            <div class="student-card" id="card-3"></div>
            <div class="student-card" id="card-4"></div>
            <div class="student-card" id="card-5"></div>
        </div>
        
        <button onclick="saveAll()" class="save-btn">💾 ENREGISTRER TOUS LES DIAGNOSTICS</button>
    </div>
    
    <script>
    let allStudents = [];
    let cardData = [{},{},{},{},{},{}];
    
    window.onload = function() {
        const stored = localStorage.getItem('eps_pro_students');
        if (!stored) {
            alert('⚠️ Aucun élève.');
            return;
        }
        allStudents = JSON.parse(stored);
        for(let i=0; i<6; i++) renderCard(i);
    };
    
    function renderCard(cardIndex) {
        const card = document.getElementById('card-'+cardIndex);
        const data = cardData[cardIndex];
        
        let content = '<select id="sel-'+cardIndex+'" onchange="selectStudent('+cardIndex+')">';
        content += '<option value="">-- Choisir --</option>';
        allStudents.forEach((s,i) => {
            content += '<option value="'+i+'" '+(data.studentIndex===i?'selected':'')+'>'+s.nomPrenom+'</option>';
        });
        content += '</select>';
        
        if(data.student) {
            const s = data.student;
            content += '<div class="student-header">'+(s.sexe==='F'?'👧':'🧑')+' '+s.nomPrenom+'</div>';
            
            // Test VMA
            content += '<div class="section-title">📊 TEST VMA</div>';
            content += '<label>Type:</label><select id="vma-type-'+cardIndex+'" onchange="updateVMA('+cardIndex+')">';
            const types = [
                {val:'cooper12', label:'Cooper 12 min'},
                {val:'cooper6', label:'1/2 Cooper 6 min'},
                {val:'lucleger', label:'Luc Léger'}
            ];
            types.forEach(t => {
                content += '<option value="'+t.val+'" '+(data.vmaTest===t.val?'selected':'')+'>'+t.label+'</option>';
            });
            content += '</select>';
            
            content += '<label>Résultat:</label>';
            if(data.vmaTest === 'lucleger') {
                content += '<input type="number" step="0.5" id="vma-result-'+cardIndex+'" value="'+(data.vmaResultat||'')+'" placeholder="Palier (ex: 9.5)" oninput="updateVMA('+cardIndex+')">';
            } else {
                content += '<input type="number" id="vma-result-'+cardIndex+'" value="'+(data.vmaResultat||'')+'" placeholder="Distance (m)" oninput="updateVMA('+cardIndex+')">';
            }
            
            if(data.vma) {
                content += '<div class="vma-result">VMA : '+data.vma.toFixed(1)+' km/h</div>';
                const cible = formatTime((0.4 / data.vma) * 3600 * 1000);
                
                // 3×400m
                content += '<div class="section-title">🏃 3×400m (cible: '+cible+')</div>';
                
                const t1m = data.tour1 ? Math.floor(data.tour1/60) : '';
                const t1s = data.tour1 ? data.tour1%60 : '';
                const t2m = data.tour2 ? Math.floor(data.tour2/60) : '';
                const t2s = data.tour2 ? data.tour2%60 : '';
                const t3m = data.tour3 ? Math.floor(data.tour3/60) : '';
                const t3s = data.tour3 ? data.tour3%60 : '';
                
                content += '<label>T1:</label><div class="time-input-group">';
                content += '<input type="number" inputmode="numeric" id="t1m-'+cardIndex+'" value="'+t1m+'">';
                content += '<span>min</span>';
                content += '<input type="number" inputmode="numeric" id="t1s-'+cardIndex+'" value="'+t1s+'">';
                content += '<span>sec</span></div>';
                
                content += '<label>T2:</label><div class="time-input-group">';
                content += '<input type="number" inputmode="numeric" id="t2m-'+cardIndex+'" value="'+t2m+'">';
                content += '<span>min</span>';
                content += '<input type="number" inputmode="numeric" id="t2s-'+cardIndex+'" value="'+t2s+'">';
                content += '<span>sec</span></div>';
                
                content += '<label>T3:</label><div class="time-input-group">';
                content += '<input type="number" inputmode="numeric" id="t3m-'+cardIndex+'" value="'+t3m+'">';
                content += '<span>min</span>';
                content += '<input type="number" inputmode="numeric" id="t3s-'+cardIndex+'" value="'+t3s+'">';
                content += '<span>sec</span></div>';
                
                if(data.tour1 && data.tour2 && data.tour3) {
                    const moy = (data.tour1 + data.tour2 + data.tour3) / 3;
                    content += '<p style="color:var(--success);margin-top:6px">Moy: '+formatTime(moy*1000)+'</p>';
                }
                
                content += '<label>💓 BPM:</label><input type="number" inputmode="numeric" id="bpm-'+cardIndex+'" value="'+(data.bpm||'')+'" style="width:60px">';
                content += '<label>⏱️ Récup:</label><input type="number" inputmode="numeric" id="recup-'+cardIndex+'" value="'+(data.tempsRecup||'')+'" style="width:60px">';
                
                // Saut
                content += '<div class="section-title">🦘 SAUT</div>';
                content += '<label>Sans élan:</label><input type="number" step="0.01" id="saut-sans-'+cardIndex+'" value="'+(data.sautSansElan||'')+'" placeholder="m" style="width:70px">';
                content += '<label>Avec élan:</label><input type="number" step="0.01" id="saut-avec-'+cardIndex+'" value="'+(data.sautAvecElan||'')+'" placeholder="m" style="width:70px">';
                
                // Lancer
                content += '<div class="section-title">🎯 LANCER</div>';
                content += '<label>Distance:</label><input type="number" step="0.1" id="lancer-'+cardIndex+'" value="'+(data.lancer||'')+'" placeholder="m" style="width:70px">';
            }
        }
        
        card.innerHTML = content;
    }
    
    function selectStudent(cardIndex) {
        const sel = document.getElementById('sel-'+cardIndex);
        const studentIndex = parseInt(sel.value);
        
        if(isNaN(studentIndex)) {
            cardData[cardIndex] = {};
        } else {
            const s = allStudents[studentIndex];
            cardData[cardIndex] = s.diagnostique ? {...s.diagnostique, studentIndex, student: s} : {
                studentIndex: studentIndex,
                student: s,
                vmaTest: 'cooper12',
                vmaResultat: null,
                vma: null,
                tour1: null, tour2: null, tour3: null,
                bpm: null, tempsRecup: null,
                sautSansElan: null, sautAvecElan: null,
                lancer: null
            };
        }
        renderCard(cardIndex);
    }
    
    function updateVMA(cardIndex) {
        const d = cardData[cardIndex];
        const type = document.getElementById('vma-type-'+cardIndex).value;
        const result = parseFloat(document.getElementById('vma-result-'+cardIndex).value);
        
        d.vmaTest = type;
        d.vmaResultat = result;
        
        if(result) {
            if(type === 'cooper12') {
                d.vma = (result - 504.9) / 44.73;
            } else if(type === 'cooper6') {
                d.vma = (result - 504.9) / 44.73 * 2;
            } else if(type === 'lucleger') {
                d.vma = result;
            }
        } else {
            d.vma = null;
        }
        
        renderCard(cardIndex);
    }
    
    function saveAll() {
        for(let i=0; i<6; i++) {
            const d = cardData[i];
            if(d.student) {
                const t1m = parseInt(document.getElementById('t1m-'+i).value)||0;
                const t1s = parseInt(document.getElementById('t1s-'+i).value)||0;
                const t2m = parseInt(document.getElementById('t2m-'+i).value)||0;
                const t2s = parseInt(document.getElementById('t2s-'+i).value)||0;
                const t3m = parseInt(document.getElementById('t3m-'+i).value)||0;
                const t3s = parseInt(document.getElementById('t3s-'+i).value)||0;
                
                d.tour1 = t1m*60+t1s||null;
                d.tour2 = t2m*60+t2s||null;
                d.tour3 = t3m*60+t3s||null;
                
                const bpm = document.getElementById('bpm-'+i);
                const recup = document.getElementById('recup-'+i);
                const sautSans = document.getElementById('saut-sans-'+i);
                const sautAvec = document.getElementById('saut-avec-'+i);
                const lancer = document.getElementById('lancer-'+i);
                
                if(bpm) d.bpm = parseInt(bpm.value)||null;
                if(recup) d.tempsRecup = parseInt(recup.value)||null;
                if(sautSans) d.sautSansElan = parseFloat(sautSans.value)||null;
                if(sautAvec) d.sautAvecElan = parseFloat(sautAvec.value)||null;
                if(lancer) d.lancer = parseFloat(lancer.value)||null;
            }
        }
        
        let err = 0;
        cardData.forEach(d => {
            if(d.student && (!d.vma || !d.tour1 || !d.sautAvecElan || !d.lancer)) err++;
        });
        
        if(err > 0 && !confirm(err+' élève(s) incomplet(s). Continuer ?')) return;
        
        cardData.forEach(d => {
            if(d.student) {
                const i = allStudents.findIndex(s => s.id === d.student.id);
                if(i !== -1) {
                    allStudents[i].vma = d.vma;
                    allStudents[i].diagnostique = {
                        vmaTest: d.vmaTest,
                        vmaResultat: d.vmaResultat,
                        vma: d.vma,
                        tour1: d.tour1,
                        tour2: d.tour2,
                        tour3: d.tour3,
                        bpm: d.bpm,
                        tempsRecup: d.tempsRecup,
                        sautSansElan: d.sautSansElan,
                        sautAvecElan: d.sautAvecElan,
                        lancer: d.lancer,
                        date: new Date().toISOString()
                    };
                }
            }
        });
        
        localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
        alert('✅ Diagnostics enregistrés !');
    }
    
    function formatTime(ms) {
        const sec = Math.floor(ms/1000);
        const m = Math.floor(sec/60);
        const s = sec%60;
        return m+"'"+(s<10?'0':'')+s+'"';
    }
    </script>
</body>
</html>
