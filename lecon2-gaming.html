<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leçon 2 - EPS PRO</title>
    <style>
        :root {
            --bg: #0b101d;
            --card: #1c2333;
            --accent: #00d2ff;
            --success: #00ff88;
            --warning: #ffcc00;
            --danger: #ff4b4b;
            --purple: #9b59b6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 12px; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 4px; }
        .accent { color: var(--accent); }
        .subtitle { text-align: center; color: var(--purple); font-size: 1rem; font-weight: 700; margin-bottom: 12px; }

        /* GRILLE 6 CARTES */
        .grid6 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        @media (max-width: 900px) { .grid6 { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 600px) { .grid6 { grid-template-columns: 1fr; } }

        /* CARTE ÉLÈVE */
        .card {
            background: var(--card);
            border: 1px solid rgba(155,89,182,0.3);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .card-header {
            background: linear-gradient(135deg, var(--purple), var(--accent));
            color: white;
            padding: 6px 8px;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-body { padding: 8px; }

        /* SELECT ÉLÈVE */
        .student-select {
            width: 100%;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid var(--purple);
            background: #0f1628;
            color: white;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }
        .student-info {
            background: rgba(155,89,182,0.1);
            border: 1px solid var(--purple);
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 0.7rem;
            margin-bottom: 6px;
            display: none;
        }

        /* BADGES ET NIVEAUX */
        .badge-container {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            margin: 4px 0;
        }
        .badge {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: black;
            padding: 2px 5px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 2px;
            animation: badgeGlow 2s infinite alternate;
        }
        
        .niveau-joueur {
            background: linear-gradient(135deg, var(--purple), var(--accent));
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 800;
            display: inline-block;
            margin: 4px 0;
            text-align: center;
        }

        /* SECTIONS DÉPLIABLES */
        .section { border-radius: 6px; overflow: hidden; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            user-select: none;
        }
        .section-header:hover { opacity: 0.85; }
        .section-header.course-h { background: rgba(155,89,182,0.2); color: var(--purple); }
        .section-header.saut-h { background: rgba(0,255,136,0.2); color: var(--success); }
        .section-header.lancer-h { background: rgba(255,75,75,0.2); color: var(--danger); }
        .section-body { display: none; padding: 8px; background: rgba(255,255,255,0.02); }
        .section-body.open { display: block; }
        .arrow { transition: transform 0.3s; font-size: 0.7rem; }
        .arrow.open { transform: rotate(180deg); }

        /* INPUTS */
        input[type=number], input[type=text] {
            background: #0f1628;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: white;
            padding: 4px 6px;
            font-size: 0.75rem;
        }
        input:focus { outline: none; border-color: var(--purple); }
        label { display: block; font-size: 0.7rem; color: #aaa; margin: 4px 0 2px; }

        /* TEMPS TOURS */
        .tour-row { display: flex; align-items: center; gap: 5px; margin: 4px 0; font-size: 0.75rem; }
        .tour-label { font-size: 0.75rem; font-weight: 700; color: var(--purple); min-width: 25px; }
        .tour-row input { width: 60px; }
        .tour-result { font-size: 0.7rem; color: var(--success); font-weight: 700; min-width: 50px; }

        /* FEEDBACK GAMING */
        .feedback-box {
            background: linear-gradient(135deg, #00ff88, #00d2ff);
            color: black;
            border-radius: 6px;
            padding: 6px;
            margin: 4px 0;
            font-weight: 900;
            text-align: center;
            font-size: 0.7rem;
            animation: feedbackPulse 1s ease-in-out;
            box-shadow: 0 2px 10px rgba(0,255,136,0.3);
        }

        /* PROGRESS BAR */
        .progress-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            height: 8px;
            margin: 6px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, var(--purple), var(--success));
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* CHECKBOXES TECHNIQUES */
        .technique-box {
            background: rgba(0,255,136,0.08);
            border: 1px solid var(--success);
            border-radius: 6px;
            padding: 8px;
            margin: 6px 0;
        }
        .technique-title { color: var(--success); font-weight: 800; margin-bottom: 6px; font-size: 0.75rem; }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 4px 0;
            font-size: 0.7rem;
        }
        .checkbox-row input[type=checkbox] {
            width: 16px;
            height: 16px;
            accent-color: var(--success);
        }

        /* BOUTONS */
        .btn-back { padding: 8px 16px; background: #555; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; margin-bottom: 12px; font-size: 0.85rem; }
        .save-all {
            width: 100%;
            padding: 12px;
            background: var(--success);
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 8px;
        }

        /* ANIMATIONS */
        @keyframes feedbackPulse {
            0% { transform: scale(1); box-shadow: 0 2px 10px rgba(0,255,136,0.3); }
            50% { transform: scale(1.05); box-shadow: 0 4px 20px rgba(0,255,136,0.6); }
            100% { transform: scale(1); box-shadow: 0 2px 10px rgba(0,255,136,0.3); }
        }
        
        @keyframes badgeGlow {
            0% { box-shadow: 0 2px 10px rgba(255,215,0,0.5); }
            100% { box-shadow: 0 4px 20px rgba(255,215,0,0.8); }
        }
        
        @keyframes badgeBounce {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(0deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
    </style>
</head>
<body>

<h1>EPS<span class="accent">PRO</span></h1>
<p class="subtitle">🎮 LEÇON 2 - MODE AVENTURE</p>
<button class="btn-back" onclick="window.location.href='index.html'">← Retour</button>

<div class="grid6" id="grid"></div>

<button class="save-all" onclick="saveAll()">🏆 SAUVEGARDER TES EXPLOITS</button>

<script>
// =============================================
// SYSTÈME GAMING - BADGES ET NIVEAUX 🎮
// =============================================

// Badges disponibles
const BADGES = {
    course: {
        'finisher': { emoji: '🏃‍♂️', nom: 'Finisher', desc: 'Termine 3 tours' },
        'regulier': { emoji: '⚡', nom: 'Régulier', desc: 'Écart < 10s' },
        'machine': { emoji: '🤖', nom: 'Machine', desc: 'Écart < 5s' },
        'rocket': { emoji: '🚀', nom: 'Rocket', desc: 'Performance top !' }
    },
    saut: {
        'apprenti': { emoji: '🎯', nom: 'Apprenti', desc: '1 technique validée' },
        'expert': { emoji: '👑', nom: 'Expert', desc: '2 techniques validées' }
    },
    lancer: {
        'debutant': { emoji: '🎪', nom: 'Débutant', desc: '1 technique validée' },
        'maitre': { emoji: '🏆', nom: 'Maître', desc: '2 techniques validées' }
    }
};

// Phrases motivantes pour 6èmes 💬
const PHRASES_MOTIVANTES = [
    "🔥 WAHOU ! Tu cours comme un champion !",
    "⚡ INCROYABLE ! Tu as le rythme dans la peau !",
    "🚀 GÉNIAL ! Tu progresses à vitesse grand V !",
    "💫 FANTASTIQUE ! Tu es une machine de course !",
    "🎯 TOP ! Technique de pro !",
    "✨ MAGIQUE ! Tu maîtrises parfaitement !",
    "🌟 SUPERBE ! Continue comme ça !",
    "💪 IMPRESSIONNANT ! Tu donnes tout !",
    "🎉 BRAVO ! Tu es au top niveau !",
    "🏅 EXCELLENT ! Performance de champion !",
    "⭐ PARFAIT ! Tu gères comme un boss !",
    "🔥 DINGUE ! Tu es en feu !",
    "🚀 OUFISSIME ! Tu voles littéralement !",
    "💯 ÉNORME ! Performance de légende !",
    "🎊 INCROYABLE ! Tu assures grave !"
];

function getRandomPhrase() {
    return PHRASES_MOTIVANTES[Math.floor(Math.random() * PHRASES_MOTIVANTES.length)];
}

// =============================================
// DONNÉES
// =============================================
let ELEVES = [];
const cardState = [{},{},{},{},{},{}];

// =============================================
// INITIALISATION
// =============================================
window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        alert('⚠️ Aucun élève trouvé. Ajoutez des élèves depuis l\'accueil.');
        window.location.href = 'index.html';
        return;
    }
    ELEVES = JSON.parse(stored);

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let i = 0; i < 6; i++) {
        grid.innerHTML += buildCard(i);
    }
};

function buildCard(i) {
    // Options élèves
    let opts = '<option value="">-- Choisir ton héros --</option>';
    ELEVES.forEach(e => { opts += `<option value="${e.id}">${e.nomPrenom}</option>`; });

    return `
    <div class="card" id="card-${i}">
        <div class="card-header">🎮 JOUEUR ${i+1}</div>
        <div class="card-body">
            <!-- SELECT -->
            <select class="student-select" onchange="selectEleve(${i}, this.value)">
                ${opts}
            </select>
            <div class="student-info" id="info-${i}"></div>
            
            <!-- BADGES ET NIVEAU -->
            <div id="badges-${i}" class="badge-container" style="display:none"></div>
            <div id="niveau-joueur-${i}" style="display:none"></div>

            <!-- SECTION COURSE -->
            <div class="section" id="sec-course-${i}" style="display:none">
                <div class="section-header course-h" onclick="toggleSection('course',${i})">
                    <span>🏃‍♂️ COURSE 3×400m</span><span class="arrow" id="arr-course-${i}">▼</span>
                </div>
                <div class="section-body" id="body-course-${i}">

                    <!-- Progress bar -->
                    <div style="margin: 8px 0;">
                        <div style="font-size: 0.7rem; color: #aaa; margin-bottom: 4px;">Mission :</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="course-progress-${i}" style="width: 0%"></div>
                        </div>
                        <div style="text-align: center; font-size: 0.7rem; color: #aaa;" id="course-progress-text-${i}">0/3 tours</div>
                    </div>

                    <!-- Temps tours -->
                    <div class="tour-row">
                        <span class="tour-label">T1</span>
                        <input type="text" id="t1-${i}" placeholder="2:15" oninput="updateTours(${i})" style="width:60px">
                        <span class="tour-result" id="t1r-${i}"></span>
                    </div>
                    <div class="tour-row">
                        <span class="tour-label">T2</span>
                        <input type="text" id="t2-${i}" placeholder="2:18" oninput="updateTours(${i})" style="width:60px">
                        <span class="tour-result" id="t2r-${i}"></span>
                    </div>
                    <div class="tour-row">
                        <span class="tour-label">T3</span>
                        <input type="text" id="t3-${i}" placeholder="2:20" oninput="updateTours(${i})" style="width:60px">
                        <span class="tour-result" id="t3r-${i}"></span>
                    </div>
                    <div id="moy-course-${i}" style="font-size:0.75rem;margin-top:6px;color:var(--success);font-weight:700"></div>

                </div>
            </div>

            <!-- SECTION SAUT -->
            <div class="section" id="sec-saut-${i}" style="display:none">
                <div class="section-header saut-h" onclick="toggleSection('saut',${i})">
                    <span>🦘 SAUT - TECHNIQUE</span><span class="arrow" id="arr-saut-${i}">▼</span>
                </div>
                <div class="section-body" id="body-saut-${i}">

                    <div class="technique-box">
                        <div class="technique-title">🎯 MISSIONS TECHNIQUE (2/4)</div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="saut1-${i}" onchange="updateBadges(${i})">
                            <label>✅ Course d'élan régulière (6-8 foulées)</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="saut2-${i}" onchange="updateBadges(${i})">
                            <label>✅ Pied d'appel précis sur la ligne</label>
                        </div>
                    </div>

                    <label>Distance sautée (m) :</label>
                    <input type="number" step="0.01" id="saut-distance-${i}" placeholder="2.50" style="width:80px">

                </div>
            </div>

            <!-- SECTION LANCER -->
            <div class="section" id="sec-lancer-${i}" style="display:none">
                <div class="section-header lancer-h" onclick="toggleSection('lancer',${i})">
                    <span>🎯 LANCER - TECHNIQUE</span><span class="arrow" id="arr-lancer-${i}">▼</span>
                </div>
                <div class="section-body" id="body-lancer-${i}">

                    <div class="technique-box">
                        <div class="technique-title">🎯 MISSIONS TECHNIQUE (2/4)</div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="lancer1-${i}" onchange="updateBadges(${i})">
                            <label>✅ Position de profil correcte</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="lancer2-${i}" onchange="updateBadges(${i})">
                            <label>✅ Prise et placement de l'engin</label>
                        </div>
                    </div>

                    <label>Distance lancée (m) :</label>
                    <input type="number" step="0.01" id="lancer-distance-${i}" placeholder="8.50" style="width:80px">

                </div>
            </div>

        </div>
    </div>`;
}

// =============================================
// SÉLECTION ÉLÈVE
// =============================================
function selectEleve(i, id) {
    const s = ELEVES.find(e => e.id === id);
    if(s) {
        // Charger données existantes
        const existant = s.seances?.find(seance => seance.lecon === 'L2') || {};
        cardState[i] = {
            student: s,
            tours: existant.tours || [null,null,null],
            sautDistance: existant.sautDistance || null,
            sautTech1: existant.sautTech1 || false,
            sautTech2: existant.sautTech2 || false,
            lancerDistance: existant.lancerDistance || null,
            lancerTech1: existant.lancerTech1 || false,
            lancerTech2: existant.lancerTech2 || false
        };

        // Recharger checkboxes si existantes
        if(existant.sautTech1) document.getElementById(`saut1-${i}`).checked = true;
        if(existant.sautTech2) document.getElementById(`saut2-${i}`).checked = true;
        if(existant.lancerTech1) document.getElementById(`lancer1-${i}`).checked = true;
        if(existant.lancerTech2) document.getElementById(`lancer2-${i}`).checked = true;
        if(existant.sautDistance) document.getElementById(`saut-distance-${i}`).value = existant.sautDistance;
        if(existant.lancerDistance) document.getElementById(`lancer-distance-${i}`).value = existant.lancerDistance;
    } else {
        cardState[i] = {};
    }

    const info = document.getElementById(`info-${i}`);
    
    if(s) {
        info.style.display = 'block';
        const vmaInfo = s.vma ? ` | VMA: <strong style="color:var(--success)">${s.vma} km/h</strong>` : '';
        info.innerHTML = `<strong>${s.sexe==='F'?'👧':'🧑'} ${s.sexe==='F'?'Héroïne':'Héros'}</strong> | ${s.age} ans${vmaInfo}`;
        
        // Afficher sections
        document.getElementById(`sec-course-${i}`).style.display = 'block';
        document.getElementById(`sec-saut-${i}`).style.display = 'block';
        document.getElementById(`sec-lancer-${i}`).style.display = 'block';

        // Vérifier badges existants
        updateBadges(i);
    } else {
        info.style.display = 'none';
        document.getElementById(`sec-course-${i}`).style.display = 'none';
        document.getElementById(`sec-saut-${i}`).style.display = 'none';
        document.getElementById(`sec-lancer-${i}`).style.display = 'none';
    }
}

// =============================================
// TOGGLE SECTIONS
// =============================================
function toggleSection(sec, i) {
    const body = document.getElementById(`body-${sec}-${i}`);
    const arr = document.getElementById(`arr-${sec}-${i}`);
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    arr.classList.toggle('open', !isOpen);
}

// =============================================
// GESTION TOURS - VERSION GAMING 🎮
// =============================================
function updateTours(i) {
    let moy = null, valid = 0, total = 0;
    const temps = [];

    [1,2,3].forEach(n => {
        const val = parseTime(document.getElementById(`t${n}-${i}`).value);
        const el = document.getElementById(`t${n}r-${i}`);
        if(val) { 
            el.textContent = fmtSec(val); 
            el.style.color = 'var(--success)'; 
            total += val; 
            valid++;
            temps.push(val);

            // FEEDBACK GAMING MOTIVANT !
            let feedback = getRandomPhrase();

            // Afficher feedback
            let feedbackEl = document.getElementById(`feedback-t${n}-${i}`);
            if(!feedbackEl) {
                feedbackEl = document.createElement('div');
                feedbackEl.id = `feedback-t${n}-${i}`;
                feedbackEl.className = 'feedback-box';
                el.parentNode.appendChild(feedbackEl);
            }
            feedbackEl.textContent = feedback;

        } else { 
            el.textContent = '';
            const feedbackEl = document.getElementById(`feedback-t${n}-${i}`);
            if(feedbackEl) feedbackEl.remove();
        }
    });

    // Progress bar GAMING
    const progressBar = document.getElementById(`course-progress-${i}`);
    const progressText = document.getElementById(`course-progress-text-${i}`);
    if(progressBar) {
        const percent = (valid / 3) * 100;
        progressBar.style.width = percent + '%';
        progressText.textContent = `${valid}/3 tours`;

        if(valid === 3) {
            progressText.innerHTML = `🏆 <strong>MISSION ACCOMPLIE !</strong>`;
            progressText.style.color = 'var(--success)';
        }
    }

    // Moyenne GAMING
    const moyEl = document.getElementById(`moy-course-${i}`);
    if(valid === 3) {
        moy = total / 3;
        const ecartMax = Math.max(
            Math.abs(temps[1] - temps[0]),
            Math.abs(temps[2] - temps[1])
        );

        let moyFeedback = `Moy : ${fmtSec(moy)} `;
        if(ecartMax <= 5) {
            moyFeedback += `🤖 MACHINE PARFAITE !`;
            moyEl.style.color = 'var(--success)';
        } else if(ecartMax <= 10) {
            moyFeedback += `⚡ RYTHME DE CHAMPION !`;
            moyEl.style.color = 'var(--warning)';
        } else {
            moyFeedback += `🚀 TU PROGRESSES !`;
            moyEl.style.color = 'var(--warning)';
        }

        moyEl.textContent = moyFeedback;
        cardState[i].tours = temps;
        
        // VÉRIFIER BADGES !
        updateBadges(i);
    } else {
        moyEl.textContent = '';
    }
}

// =============================================
// SYSTÈME BADGES 🏆
// =============================================
function checkBadges(cardIndex) {
    const data = cardState[cardIndex];
    if(!data.student) return [];
    
    const newBadges = [];
    
    // Badges course
    if(data.tours && data.tours.filter(t => t).length === 3) {
        newBadges.push(BADGES.course.finisher);
        
        const ecartMax = Math.max(
            Math.abs(data.tours[1] - data.tours[0]),
            Math.abs(data.tours[2] - data.tours[1])
        );
        
        if(ecartMax <= 10) newBadges.push(BADGES.course.regulier);
        if(ecartMax <= 5) newBadges.push(BADGES.course.machine);
    }
    
    // Badges saut
    const saut1 = document.getElementById(`saut1-${cardIndex}`)?.checked;
    const saut2 = document.getElementById(`saut2-${cardIndex}`)?.checked;
    const sautTechs = [saut1, saut2].filter(t => t).length;
    
    if(sautTechs >= 1) newBadges.push(BADGES.saut.apprenti);
    if(sautTechs >= 2) newBadges.push(BADGES.saut.expert);
    
    // Badges lancer
    const lancer1 = document.getElementById(`lancer1-${cardIndex}`)?.checked;
    const lancer2 = document.getElementById(`lancer2-${cardIndex}`)?.checked;
    const lancerTechs = [lancer1, lancer2].filter(t => t).length;
    
    if(lancerTechs >= 1) newBadges.push(BADGES.lancer.debutant);
    if(lancerTechs >= 2) newBadges.push(BADGES.lancer.maitre);
    
    return newBadges;
}

function updateBadges(cardIndex) {
    const badges = checkBadges(cardIndex);
    const container = document.getElementById(`badges-${cardIndex}`);
    
    if(badges.length) {
        container.style.display = 'flex';
        container.innerHTML = badges.map(b => 
            `<div class="badge" title="${b.desc}">${b.emoji} ${b.nom}</div>`
        ).join('');
        
        // Animation déblockage UNIQUE
        if(badges.length > (cardState[cardIndex].lastBadgeCount || 0)) {
            showBadgeUnlock(cardIndex, badges);
            cardState[cardIndex].lastBadgeCount = badges.length;
        }
        
        // Niveau joueur
        const niveauEl = document.getElementById(`niveau-joueur-${cardIndex}`);
        const totalBadges = badges.length;
        let niveau = '';
        
        if(totalBadges >= 5) niveau = '👑 LÉGENDE';
        else if(totalBadges >= 3) niveau = '⚔️ CHAMPION';
        else if(totalBadges >= 1) niveau = '🗺️ AVENTURIER';
        
        if(niveau) {
            niveauEl.innerHTML = `<div class="niveau-joueur">${niveau}</div>`;
            niveauEl.style.display = 'block';
        }
    }
}

function showBadgeUnlock(cardIndex, badges) {
    if(!badges.length) return;
    
    const card = document.getElementById(`card-${cardIndex}`);
    const badgePopup = document.createElement('div');
    badgePopup.style.cssText = `
        position: absolute;
        top: 10px;
        right: 10px;
        background: linear-gradient(135deg, #FFD700, #FFA500);
        color: black;
        padding: 8px 12px;
        border-radius: 20px;
        font-weight: 900;
        font-size: 0.7rem;
        z-index: 1000;
        animation: badgeBounce 2s ease-in-out;
        box-shadow: 0 4px 15px rgba(255,215,0,0.8);
        text-align: center;
    `;
    
    const newBadge = badges[badges.length - 1]; // Dernier badge
    badgePopup.innerHTML = `
        🎉 BADGE DÉBLOQUÉ !<br>
        ${newBadge.emoji} <strong>${newBadge.nom}</strong>
    `;
    
    card.appendChild(badgePopup);
    
    setTimeout(() => badgePopup.remove(), 3000);
}

// =============================================
// SAUVEGARDE
// =============================================
function saveAll() {
    let count = 0;
    let allStudents = JSON.parse(localStorage.getItem('eps_pro_students') || '[]');

    cardState.forEach((d, i) => {
        if(!d.student) return;

        // Lire tous les inputs
        const t1 = parseTime(document.getElementById(`t1-${i}`)?.value);
        const t2 = parseTime(document.getElementById(`t2-${i}`)?.value);
        const t3 = parseTime(document.getElementById(`t3-${i}`)?.value);

        const sautDistance = parseFloat(document.getElementById(`saut-distance-${i}`)?.value) || null;
        const sautTech1 = document.getElementById(`saut1-${i}`)?.checked || false;
        const sautTech2 = document.getElementById(`saut2-${i}`)?.checked || false;

        const lancerDistance = parseFloat(document.getElementById(`lancer-distance-${i}`)?.value) || null;
        const lancerTech1 = document.getElementById(`lancer1-${i}`)?.checked || false;
        const lancerTech2 = document.getElementById(`lancer2-${i}`)?.checked || false;

        // Trouver l'élève
        const idx = allStudents.findIndex(s => s.id === d.student.id);
        if(idx === -1) return;

        // Initialiser seances
        if(!allStudents[idx].seances) allStudents[idx].seances = [];

        // Trouver ou créer L2
        let seanceIdx = allStudents[idx].seances.findIndex(s => s.lecon === 'L2');
        if(seanceIdx === -1) {
            allStudents[idx].seances.push({
                lecon: 'L2',
                date: new Date().toISOString()
            });
            seanceIdx = allStudents[idx].seances.length - 1;
        }

        // Sauvegarder
        allStudents[idx].seances[seanceIdx] = {
            ...allStudents[idx].seances[seanceIdx],
            tours: [t1, t2, t3],
            moyenneTours: (t1 && t2 && t3) ? (t1+t2+t3)/3 : null,
            sautDistance: sautDistance,
            sautTech1: sautTech1,
            sautTech2: sautTech2,
            lancerDistance: lancerDistance,
            lancerTech1: lancerTech1,
            lancerTech2: lancerTech2,
            badges: checkBadges(i),
            date: new Date().toISOString()
        };

        count++;
    });

    if(count === 0) { 
        alert('⚠️ Aucun héros sélectionné !'); 
        return; 
    }

    localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
    alert(`🏆 Exploits sauvegardés pour ${count} héros ! GG !`);
}

// =============================================
// UTILITAIRES
// =============================================
function parseTime(str) {
    if(!str) return null;
    const parts = str.replace(',',':').split(':');
    if(parts.length === 2) {
        const m = parseInt(parts[0]), s = parseInt(parts[1]);
        if(!isNaN(m) && !isNaN(s)) return m*60 + s;
    }
    return null;
}

function fmtSec(sec) {
    const m = Math.floor(sec/60);
    const s = Math.round(sec%60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}
