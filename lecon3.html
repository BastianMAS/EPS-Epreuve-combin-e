<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L3 - Découverte & Technique - EPS PRO</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #00d9ff;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            color: white; 
            padding: 16px; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 2rem; 
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .grid6 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(139,92,246,0.2);
            border-radius: 16px;
            overflow: visible;
            position: relative;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(139,92,246,0.4);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--purple) 0%, var(--accent) 100%);
            color: white;
            padding: 12px 16px;
            border-radius: 16px 16px 0 0;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-body { 
            padding: 16px; 
        }

        .student-select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid rgba(139,92,246,0.3);
            background: rgba(15,20,25,0.8);
            color: white;
            font-size: 0.85rem;
            margin-bottom: 12px;
            transition: border-color 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .student-select:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
        }
        
        .student-info {
            background: rgba(139,92,246,0.1);
            border: 1px solid var(--purple);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.75rem;
            margin-bottom: 12px;
            display: none;
            backdrop-filter: blur(5px);
        }

        .niveau-box {
            background: rgba(0,217,255,0.1);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            display: none;
        }
        
        .niveau-title { 
            color: var(--accent); 
            font-weight: 800; 
            margin-bottom: 10px; 
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .niveau-options { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        .niveau-btn {
            padding: 10px 12px;
            border: 1px solid rgba(0,217,255,0.3);
            background: rgba(0,217,255,0.05);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            text-align: left;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .niveau-btn:hover { 
            background: rgba(0,217,255,0.15); 
            border-color: var(--accent);
            transform: translateX(4px);
        }
        
        .niveau-btn.selected { 
            background: var(--accent); 
            color: black; 
            font-weight: 700;
            border-color: var(--accent);
        }

        .objectif-box {
            background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(0,217,255,0.1));
            border: 1px solid var(--purple);
            border-radius: 10px;
            padding: 10px;
            margin: 8px 0;
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
            display: none;
        }
        
        .cible-box {
            background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(245,158,11,0.2));
            border: 1px solid var(--warning);
            border-radius: 10px;
            padding: 12px;
            margin: 8px 0;
            text-align: center;
            display: none;
        }
        
        .cible-temps {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--warning);
            font-family: 'SF Mono', monospace;
            text-shadow: 0 0 10px rgba(251,191,36,0.3);
        }

        .section { 
            border-radius: 12px; 
            overflow: hidden; 
            margin-bottom: 8px; 
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            user-select: none;
            transition: all 0.3s ease;
        }
        
        .section-header:hover { 
            opacity: 0.8; 
            transform: translateX(2px);
        }
        
        .section-header.course-h { 
            background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(139,92,246,0.1)); 
            color: var(--purple); 
        }
        
        .section-header.saut-h { 
            background: linear-gradient(135deg, rgba(74,222,128,0.2), rgba(74,222,128,0.1)); 
            color: var(--success); 
        }
        
        .section-header.lancer-h { 
            background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(239,68,68,0.1)); 
            color: var(--danger); 
        }
        
        .section-body { 
            display: none; 
            padding: 16px; 
            background: rgba(255,255,255,0.02);
        }
        
        .section-body.open { 
            display: block; 
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .arrow { 
            transition: transform 0.3s ease; 
            font-size: 0.7rem; 
        }
        .arrow.open { 
            transform: rotate(180deg); 
        }

        input[type=number], input[type=text] {
            background: rgba(15,20,25,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            padding: 8px 10px;
            font-size: 0.8rem;
            transition: border-color 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        input:focus { 
            outline: none; 
            border-color: var(--purple); 
            box-shadow: 0 0 0 2px rgba(139,92,246,0.1);
        }
        
        label { 
            display: block; 
            font-size: 0.75rem; 
            color: #94a3b8; 
            margin: 6px 0 4px; 
            font-weight: 500;
        }

        .tours-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        
        .tour-input-box {
            background: rgba(139,92,246,0.1);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        
        .tour-label {
            font-size: 0.7rem;
            color: var(--purple);
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        
        .tour-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.8rem;
            text-align: center;
            font-weight: 600;
        }
        
        .tour-result {
            font-size: 0.7rem;
            color: var(--success);
            font-weight: 600;
            margin-top: 4px;
            min-height: 16px;
        }

        .feedback-box {
            background: linear-gradient(135deg, var(--success), var(--accent));
            color: black;
            border-radius: 10px;
            padding: 8px;
            margin: 8px 0;
            font-weight: 800;
            text-align: center;
            font-size: 0.75rem;
            animation: feedbackPulse 1s ease-in-out;
            box-shadow: 0 4px 15px rgba(74,222,128,0.3);
        }
        
        .feedback-warning {
            background: linear-gradient(135deg, var(--warning), var(--gold));
            box-shadow: 0 4px 15px rgba(251,191,36,0.3);
        }
        
        .feedback-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239,68,68,0.3);
        }
        
        @keyframes feedbackPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .progress-bar {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 10px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            background: linear-gradient(90deg, var(--purple), var(--success));
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(139,92,246,0.3);
        }

        .technique-box {
            background: rgba(74,222,128,0.1);
            border: 1px solid var(--success);
            border-radius: 10px;
            padding: 12px;
            margin: 8px 0;
        }
        
        .technique-title { 
            color: var(--success); 
            font-weight: 800; 
            margin-bottom: 8px; 
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
            font-size: 0.75rem;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        
        .checkbox-row:hover {
            background: rgba(74,222,128,0.1);
        }
        
        .checkbox-row input[type=checkbox] {
            width: 18px;
            height: 18px;
            accent-color: var(--success);
        }

        .btn-back { 
            padding: 10px 20px; 
            background: linear-gradient(135deg, #374151, #4b5563); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            margin-bottom: 20px; 
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        
        .save-all {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            display: block;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--success), #16a34a);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .save-all:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(74,222,128,0.4);
        }

        @media (max-width: 768px) {
            .grid6 { grid-template-columns: 1fr; }
            h1 { font-size: 1.6rem; }
            .subtitle { font-size: 1rem; }
        }

        /* ── Autosave indicator ── */
        #autosave-indicator {
            position: fixed; bottom: 80px; right: 16px; z-index: 9999;
            background: rgba(30,40,55,0.92); border: 1px solid rgba(74,222,128,0.3);
            border-radius: 10px; padding: 6px 12px; font-size: 0.72rem;
            color: #94a3b8; font-weight: 600; pointer-events: none;
            transition: opacity 0.5s ease;
        }
        /* ── Sélection élève forte ── */
        .student-confirm {
            background: linear-gradient(135deg, rgba(139,92,246,0.25), rgba(0,217,255,0.15));
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: none;
            animation: confirmPop 0.3s ease-out;
        }
        @keyframes confirmPop {
            from { transform: scale(0.95); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }
        .student-confirm .student-name-big {
            font-size: 1.15rem; font-weight: 900; color: white;
            letter-spacing: 0.3px; margin-bottom: 3px;
        }
        .student-confirm .student-meta {
            font-size: 0.75rem; color: #94a3b8;
        }
        .no-vma-warning {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 10px; padding: 10px 12px;
            color: #fca5a5; font-size: 0.8rem; font-weight: 600;
            margin-bottom: 8px; display: none;
        }
        /* ── Champ temps invalide ── */
        .tour-input.invalid {
            border-color: var(--danger) !important;
            background: rgba(239,68,68,0.1) !important;
            animation: shake 0.3s ease;
        }
        .tour-input.valid-time {
            border-color: var(--success) !important;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%      { transform: translateX(-4px); }
            75%      { transform: translateX(4px); }
        }

        /* ── Badge save dirty ── */
        .save-wrapper { position: relative; display: inline-block; width: 100%; }
        .save-badge {
            position: absolute; top: -8px; right: -8px;
            background: #ef4444; color: white;
            border-radius: 50%; width: 22px; height: 22px;
            font-size: 0.7rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #0f172a; pointer-events: none;
            opacity: 0; transition: opacity 0.2s;
        }
        .save-badge.visible { opacity: 1; }
        @keyframes savePulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(139,92,246,0.5); }
            50%      { box-shadow: 0 0 0 10px rgba(139,92,246,0); }
        }
        .save-all.dirty { animation: savePulse 1.5s infinite; }

        /* ── Notation étoiles ── */
        .star-rating { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
        .star-btn {
            font-size: 1.4rem; cursor: pointer; opacity: 0.3;
            transition: opacity 0.15s, transform 0.15s;
            background: none; border: none; padding: 2px; line-height: 1;
        }
        .star-btn.active { opacity: 1; transform: scale(1.1); }
        .star-label { font-size: 0.72rem; color: #94a3b8; margin-left: 6px; font-style: italic; }
        .star-section-title { font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
    </style>
</head>
<body>

<h1>EPS<span style="color: var(--accent);">PRO</span></h1>
<p class="subtitle">🚀 L3 - DÉCOUVERTE & TECHNIQUE</p>
<button class="btn-back" onclick="window.location.href='index.html'">← Retour</button>


<div id="autosave-indicator">💾 Sauvegarde auto active</div>
<div class="grid6" id="grid"></div>

<div class="save-wrapper"><button class="save-all" id="save-btn" onclick="saveAll()">🏆 Enregistrer les performances</button><div class="save-badge" id="save-badge">0</div></div>

<script>
const NIVEAUX_VMA_L3 = [
    { id: 'vma95',  label: '95% VMA',  desc: '🟢 Je peux parler — rythme régulier et maîtrisé',       pourcent: 95  },
    { id: 'vma100', label: '100% VMA', desc: '🟡 Mon meilleur rythme régulier — respiration soutenue', pourcent: 100 },
    { id: 'vma105', label: '105% VMA', desc: '🟠 Je suis poussé — difficile de parler',               pourcent: 105 },
    { id: 'vma110', label: '110% VMA', desc: '🔴 Effort max — très difficile de tenir',               pourcent: 110 }
];

function getFeedbackCourse(tempsSecEleve, tempsCibleSec, tourNum) {
    const ecart = Math.abs(tempsSecEleve - tempsCibleSec);
    const isDernierTour = (tourNum === 6);
    
    if(ecart <= 2) {
        return { 
            message: isDernierTour ? "🔥 PARFAIT ! Série terminée comme un chef !" : "🔥 PARFAIT ! Rythme de champion !", 
            type: "success" 
        };
    } else if(ecart <= 5) {
        if(tempsSecEleve > tempsCibleSec) {
            return { 
                message: isDernierTour ? "👍 Bien ! Tu progresses à chaque séance" : "👍 Presque ! Accélère un peu au suivant", 
                type: "warning" 
            };
        } else {
            return { 
                message: isDernierTour ? "👍 Bien ! Garde ce rythme la prochaine fois" : "👍 Presque ! Économise-toi un peu", 
                type: "warning" 
            };
        }
    } else {
        if(tempsSecEleve > tempsCibleSec + 8) {
            return { 
                message: isDernierTour ? "💪 Bonne série ! Tu vas progresser" : "💪 Tu peux y arriver ! Pousse plus fort", 
                type: "danger" 
            };
        } else if(tempsSecEleve < tempsCibleSec - 8) {
            return { 
                message: isDernierTour ? "⚠️ Série intense ! Dose tes efforts la prochaine fois" : "⚠️ Trop rapide ! Garde tes forces", 
                type: "danger" 
            };
        } else if(tempsSecEleve > tempsCibleSec) {
            return { 
                message: isDernierTour ? "💪 Bon travail ! Continue tes efforts" : "💪 Bien ! Trouve ton rythme idéal", 
                type: "warning" 
            };
        } else {
            return { 
                message: isDernierTour ? "⚠️ Rythme soutenu ! Pense à la régularité" : "⚠️ Ralentis ! Garde ton énergie", 
                type: "warning" 
            };
        }
    }
}

let ELEVES = [];
const cardState = [{},{},{},{},{},{}];

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        alert('⚠️ Aucun élève trouvé. Ajoutez des élèves depuis l\'accueil.');
        window.location.href = 'index.html';
        return;
    }
    ELEVES = JSON.parse(stored);

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let i = 0; i < 6; i++) {
        grid.innerHTML += buildCard(i);
    }
};

function buildCard(i) {
    let opts = '<option value="">-- Choisir élève --</option>';
    ELEVES.forEach(e => { opts += `<option value="${e.id}">${e.nomPrenom}</option>`; });

    return `
    <div class="card" id="card-${i}">
        <div class="card-header">🎯 STATION ${i+1}</div>
        <div class="card-body">
            <select class="student-select" onchange="selectEleve(${i}, this.value)">
                ${opts}
            </select>
            <div class="student-info" id="info-${i}"></div>
            <div class="student-confirm" id="confirm-${i}">
                <div style="display:flex;align-items:center;gap:10px">
                    <div id="confirm-avatar-${i}" style="flex-shrink:0"></div>
                    <div>
                        <div class="student-name-big" id="confirm-name-${i}"></div>
                        <div class="student-meta" id="confirm-meta-${i}"></div>
                    </div>
                </div>
            </div>
            <div class="no-vma-warning" id="novma-${i}">
                ⚠️ Pas de VMA pour cet élève — saisie manuelle uniquement, pas de temps cible calculé.
            </div>
            
            <div class="niveau-box" id="niveau-${i}">
                <div class="niveau-title">🎯 Choisis ton objectif :</div>
                <div class="niveau-options">
                    ${NIVEAUX_VMA_L3.map(n => `
                        <button class="niveau-btn" id="btn-${n.id}-${i}" onclick="selectNiveau(${i}, '${n.id}')">
                            ${n.label} - ${n.desc}
                        </button>
                    `).join('')}
                </div>
            </div>

            <div class="section" id="sec-course-${i}" style="display:none">
                <div class="section-header course-h" onclick="toggleSection('course',${i})">
                    <span>🏃‍♂️ COURSE 6×200m</span><span class="arrow" id="arr-course-${i}">▼</span>
                </div>
                <div class="section-body" id="body-course-${i}">
                    <div class="objectif-box" id="objectif-${i}"></div>
                    <div class="cible-box" id="cible-${i}"></div>
                    <div style="display:flex;align-items:center;gap:8px;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.25);border-radius:8px;padding:7px 12px;margin:6px 0;font-size:0.78rem;font-weight:700;color:#a5b4fc">
                        ⏱️ Récupération entre chaque 200m : <span style="color:white;font-size:0.92rem">90 secondes</span>
                    </div>

                    <div style="margin: 10px 0;">
                        <div style="font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px;">Progression :</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="course-progress-${i}" style="width: 0%"></div>
                        </div>
                        <div style="text-align: center; font-size: 0.75rem; color: #94a3b8;" id="course-progress-text-${i}">0/6 tours</div>
                    </div>

                    <div class="tours-container">
                        <div class="tour-input-box">
                            <div class="tour-label">200m #1</div>
                            <input type="text" class="tour-input" id="t1-${i}" placeholder="0:45" oninput="updateTours(${i})" inputmode="decimal">
                            <div class="tour-result" id="t1r-${i}"></div>
                        </div>
                        <div class="tour-input-box">
                            <div class="tour-label">200m #2</div>
                            <input type="text" class="tour-input" id="t2-${i}" placeholder="0:46" oninput="updateTours(${i})" inputmode="decimal">
                            <div class="tour-result" id="t2r-${i}"></div>
                        </div>
                        <div class="tour-input-box">
                            <div class="tour-label">200m #3</div>
                            <input type="text" class="tour-input" id="t3-${i}" placeholder="0:45" oninput="updateTours(${i})" inputmode="decimal">
                            <div class="tour-result" id="t3r-${i}"></div>
                        </div>
                        <div class="tour-input-box">
                            <div class="tour-label">200m #4</div>

function updateTours(i) {
    [1,2,3,4,5,6].forEach(n => { const inp=document.getElementById(`t${n}-${i}`); if(inp) validateTimeInput(inp,LIMITES_200M.max,LIMITES_200M.min); });
    markDirty(i);
    const cardData = cardState[i];
    if(!cardData?.student) return;
    if(!cardData.niveau) return;

    const niveau = NIVEAUX_VMA_L3.find(n => n.id === cardData.niveau);
    const vma = parseFloat(cardData.student.vma);
    const vitesseCible = vma * (niveau.pourcent / 100);
    const tempsCible = (0.2 / vitesseCible) * 3600;

    let moy = null, valid = 0, total = 0;
    const temps = [];

    [1,2,3,4,5,6].forEach(n => {
        const val = parseTime(document.getElementById(`t${n}-${i}`).value);
        const el = document.getElementById(`t${n}r-${i}`);
        if(val) { 
            el.textContent = fmtSec(val); 
            el.style.color = 'var(--success)'; 
            total += val; 
            valid++;
            temps.push(val);

            const feedback = getFeedbackCourse(val, tempsCible, n);

            let feedbackEl = document.getElementById(`feedback-t${n}-${i}`);
            if(!feedbackEl) {
                feedbackEl = document.createElement('div');
                feedbackEl.id = `feedback-t${n}-${i}`;
                el.parentNode.appendChild(feedbackEl);
            }
            
            feedbackEl.className = `feedback-box`;
            if(feedback.type === 'warning') feedbackEl.className += ' feedback-warning';
            if(feedback.type === 'danger') feedbackEl.className += ' feedback-danger';
            
            feedbackEl.textContent = feedback.message;

        } else { 
            el.textContent = '';
            const feedbackEl = document.getElementById(`feedback-t${n}-${i}`);
            if(feedbackEl) feedbackEl.remove();
        }
    });

    const progressBar = document.getElementById(`course-progress-${i}`);
    const progressText = document.getElementById(`course-progress-text-${i}`);
    if(progressBar) {
        const percent = (valid / 6) * 100;
        progressBar.style.width = percent + '%';
        progressText.textContent = `${valid}/6 tours`;

        if(valid === 6) {
            progressText.innerHTML = `🏆 <strong>SÉRIE TERMINÉE !</strong>`;
            progressText.style.color = 'var(--success)';
        }
    }

    const moyEl = document.getElementById(`moy-course-${i}`);
    if(valid === 6) {
        moy = total / 6;
        const ecartMax = Math.max(...temps.map((t, idx) => 
            idx > 0 ? Math.abs(t - temps[idx-1]) : 0
        ));
        
        const ecartMoyenne = Math.abs(moy - tempsCible);
        let moyFeedback = `Moyenne : ${fmtSec(moy)} `;
        
        if(ecartMoyenne <= 2) {
            moyFeedback += `🎯 OBJECTIF PARFAIT !`;
            moyEl.style.color = 'var(--success)';
        } else if(ecartMoyenne <= 5) {
            moyFeedback += `👍 Très proche de l'objectif !`;
            moyEl.style.color = 'var(--warning)';
        } else {
            moyFeedback += `💪 Continue, tu progresses !`;
            moyEl.style.color = 'var(--warning)';
        }
        
        if(ecartMax <= 3) {
            moyFeedback += ` 🤖 RÉGULARITÉ TOP !`;
        }

        moyEl.textContent = moyFeedback;
        const tend3 = getTendance([t1,t2,t3,t4,t5,t6]); if(tend3) moyEl.textContent += ` ${tend3}`;
        cardState[i].tours = temps;
    } else {
        moyEl.textContent = '';
    }
}

// ── Tendance inter-tours ──
function getTendance(temps) {
    const valid = temps.filter(t => t !== null && t > 0);
    if(valid.length < 3) return '';
    const first = valid.slice(0, Math.ceil(valid.length/2)).reduce((a,b)=>a+b)/Math.ceil(valid.length/2);
    const last  = valid.slice(-Math.floor(valid.length/2)).reduce((a,b)=>a+b)/Math.floor(valid.length/2);
    const delta = last - first;
    if(delta < -1.5) return '📈 En progression';
    if(delta > 1.5)  return '📉 Attention au relâchement';
    return '↔️ Régulier';
}

function saveAll(silent=false) {

        const sautDistance = (!isNaN(sautRaw) && sautRaw >= 0.8 && sautRaw <= 5.5) ? sautRaw : null;

            erreurs.push(`${d.student.nomPrenom} : distance saut aberrante (${sautRaw}m) — ignorée`);
        const sautTech1 = getStarValue(i,'saut',1);
        const sautTech2 = getStarValue(i,'saut',2);

        const lancerDistance = (!isNaN(lancerRaw) && lancerRaw >= 3.0 && lancerRaw <= 25.0) ? lancerRaw : null;
        if(!isNaN(lancerRaw) && lancerRaw !== 0 && lancerDistance === null)
            erreurs.push(`${d.student.nomPrenom} : distance lancer aberrante (${lancerRaw}m) — ignorée`);
        const lancerTech1 = getStarValue(i,'lancer',1);
        const lancerTech2 = getStarValue(i,'lancer',2);

        const idx = allStudents.findIndex(s => s.id === d.student.id);
        if(idx === -1) return;

        if(!allStudents[idx].seances) allStudents[idx].seances = [];

        // ── Sécurité multi-sessions ──────────────────────────────────────────
        const sessionsExistantes_L3 = allStudents[idx].seances
            .map((s, si) => ({...s, _idx: si}))
            .filter(s => s.lecon === 'L3');

        let seanceIdx = -1;

        if(!silent && sessionsExistantes_L3.length > 0) {
            const lastDate = sessionsExistantes_L3[sessionsExistantes_L3.length-1].date
                ? new Date(sessionsExistantes_L3[sessionsExistantes_L3.length-1].date).toLocaleDateString('fr-FR')

            const choix = window.confirm(
                `⚠️ ${d.student.nomPrenom} a déjà une séance L3 (${lastDate}).\n\n` +
                `OK → Nouvelle session (conserve l'ancienne)\n` +

            );
            if(choix) {
                allStudents[idx].seances.push({ lecon: 'L3', date: new Date().toISOString() });
                seanceIdx = allStudents[idx].seances.length - 1;
            } else {
                seanceIdx = sessionsExistantes_L3[sessionsExistantes_L3.length-1]._idx;
            }
        } else {

                seanceIdx = sessionsExistantes_L3[sessionsExistantes_L3.length-1]._idx;
            } else {
                allStudents[idx].seances.push({ lecon: 'L3', date: new Date().toISOString() });

}

function parseTime(str) {
    if(!str) return null;
    const raw = str.trim().replace(',', ':').replace('.', ':');
    // Format M:SS ou MM:SS
    const m1 = raw.match(/^(\d+):(\d{1,2})$/);
    if(m1) {
        const min = parseInt(m1[1]), sec = parseInt(m1[2]);
        if(sec < 60) return min * 60 + sec;
    }
    // Format "entier seul" ex: 125 → détecté comme 1:25
    const m2 = raw.match(/^(\d{3,4})$/);
    if(m2) {
        const n = parseInt(m2[0]);
        if(n >= 100 && n <= 9959) {
            const min = Math.floor(n / 100), sec = n % 100;
            if(sec < 60) return min * 60 + sec;
        }
    }
    return null;
}

// Validation visuelle temps en temps réel (L3: 200m entre 28s et 105s)
const LIMITES_200M = { min: 28, max: 105 };
function validateTimeInput(input, leMax, leMin) {
    const max = leMax || LIMITES_200M.max;
    const min = leMin || LIMITES_200M.min;
    const val = parseTime(input.value);
    input.classList.remove('invalid', 'valid-time');
    if(!input.value.trim()) return;
    if(val === null || val < min || val > max) {
        input.classList.add('invalid');
    } else {
        input.classList.add('valid-time');
    }
}

function fmtSec(sec) {
    const m = Math.floor(sec/60);
    const s = Math.round(sec%60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}

// Autosave silencieux 30s — jamais de popup
let _lastAutoSave = Date.now();
function silentSave() {
    try {
        let count = 0;
        let allStudents = JSON.parse(localStorage.getItem('eps_pro_students') || '[]');
        cardState.forEach((d, i) => {
            if(!d.student) return;
            const idx = allStudents.findIndex(s => s.id === d.student.id);
            if(idx === -1) return;
            if(!allStudents[idx].seances) allStudents[idx].seances = [];
            const seanceIdx = allStudents[idx].seances.findIndex(s => s.lecon === 'L3' && s._autoSlot);
            const tours = [1,2,3,4,5,6].map(n => parseTime(document.getElementById(`t${n}-${i}`)?.value));
            const sautRaw = parseFloat(document.getElementById(`saut-distance-${i}`)?.value);
            const lancerRaw = parseFloat(document.getElementById(`lancer-distance-${i}`)?.value);
            const payload = {
                lecon: 'L3', _autoSlot: true, _draft: true,
                niveau: d.niveau,
                tours,
                sautDistance: (!isNaN(sautRaw) && sautRaw >= 0.8 && sautRaw <= 5.5) ? sautRaw : null,
                lancerDistance: (!isNaN(lancerRaw) && lancerRaw >= 3.0 && lancerRaw <= 25.0) ? lancerRaw : null,
                date: new Date().toISOString()
            };
            if(seanceIdx === -1) allStudents[idx].seances.push(payload);
            else allStudents[idx].seances[seanceIdx] = payload;
            count++;
        });
        if(count > 0) {
            localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
            _lastAutoSave = Date.now();
            updateAutosaveIndicator();
        }
    } catch(e) { /* silent */ }
}

function updateAutosaveIndicator() {
    const el = document.getElementById('autosave-indicator');
    if(!el) return;
    const sec = Math.round((Date.now() - _lastAutoSave) / 1000);
    el.textContent = sec < 5 ? '💾 Sauvegardé' : `💾 Sauvegardé il y a ${sec}s`;
}

setInterval(() => {
    try {
        const _a = window.alert; const _c = window.confirm;
        window.alert = () => {}; window.confirm = () => false;
        silentSave();
        window.alert = _a; window.confirm = _c;
    } catch(e) {}
}, 30000);
setInterval(() => { updateAutosaveIndicator(); }, 10000);

</script>

<!-- SW registration + bandeau offline -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(function(){});
}
(function() {
    function updateBanner() {
        var b = document.getElementById('_offline_banner');
        if (!b) {
            b = document.createElement('div');
            b.id = '_offline_banner';
            b.style.cssText = [
                'display:none','position:fixed','top:0','left:0','right:0',
                'background:#ff6b35','color:#fff','text-align:center',
                'padding:8px 12px','font-size:0.82rem','font-weight:700',
                'z-index:99999','letter-spacing:0.3px'
            ].join(';');
            b.textContent = '\u{1F4E1} Mode hors ligne — données sauvegardées localement';
            document.body.appendChild(b);
        }
        b.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online',  updateBanner);
    window.addEventListener('offline', updateBanner);
    window.addEventListener('load',    updateBanner);
})();
</script>
