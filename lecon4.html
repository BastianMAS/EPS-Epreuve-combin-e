<body>

<h1>EPS<span style="color: var(--accent);">PRO</span></h1>
<p class="subtitle">🔧 L4 - TECHNIQUE DE BASE ATELIER 2</p>
<button class="btn-back" onclick="window.location.href='index.html'">← Retour</button>


<div id="autosave-indicator">💾 Sauvegarde auto active</div>
<div class="grid6" id="grid"></div>

<div class="save-wrapper"><button class="save-all" id="save-btn" onclick="saveAll()">🔥 Enregistrer les performances</button><div class="save-badge" id="save-badge">0</div></div>

<script>
const PROGRESSIONS_L4 = [
    { id: 'refaire', label: '🔁 Refaire L3',     desc: 'Rattrapage — je revois les bases',           delta: 'L3' },
    { id: 'meme',    label: '⚖️ Même niveau',    desc: '🟡 Je consolide — respiration soutenue',     delta: 0   },
    { id: 'plus5',   label: '📈 +5% VMA',        desc: '🟠 Je progresse — difficile de parler',      delta: 5   },
    { id: 'plus10',  label: '🔥 +10% VMA',       desc: '🔴 Je me challenge — effort intense',        delta: 10  },
    { id: 'plus15',  label: '⚡ +15% VMA',       desc: '💀 Je me dépasse — effort maximal',          delta: 15  }
];

function analysePerformanceL3(eleve) {
    const seanceL3 = eleve.seances?.find(s => s.lecon === 'L3');
    if(!seanceL3 || !seanceL3.moyenne200m || !seanceL3.niveau || !eleve.vma) {
        return {
            status: 'absent',
            niveau: null,
            moyenne: null,
            cible: null,
            ecart: null,
            recommandations: ['refaire'],
            message: "Absent ou données L3 incomplètes"
        };
    }

    // Calculer performance L3
    const niveauL3 = getNiveauL3Data(seanceL3.niveau);
    const vma = parseFloat(eleve.vma);
    const vitesseCible = vma * (niveauL3.pourcent / 100);
    const tempsCible = (0.2 / vitesseCible) * 3600;
    const ecart = Math.abs(seanceL3.moyenne200m - tempsCible);
    const pourcentageEcart = (ecart / tempsCible) * 100;

    let status = 'moyen';
    let recommandations = [];
    let message = '';

    if(pourcentageEcart <= 3) {
        // Excellent : dans les clous
        status = 'excellent';
        recommandations = ['plus5', 'plus10', 'plus15'];
        message = `Excellent ! Tu maîtrises ${niveauL3.label}`;
    } else if(pourcentageEcart <= 8) {
        // Bon : proche objectif
        status = 'bon';
        recommandations = ['plus5', 'plus10', 'meme'];
        message = `Bon niveau ! Tu es proche de ${niveauL3.label}`;
    } else if(pourcentageEcart <= 15) {
        // Moyen : assez loin
        status = 'moyen';
        recommandations = ['meme', 'plus5'];
        message = `En progression sur ${niveauL3.label}`;
    } else {
        // Difficile : très loin ou absent
        status = 'difficile';
        recommandations = ['refaire', 'meme'];
        message = `Difficultés avec ${niveauL3.label}`;
    }

    return {
        status: status,
        niveau: seanceL3.niveau,
        niveauData: niveauL3,
        moyenne: seanceL3.moyenne200m,
        cible: tempsCible,
        ecart: ecart,
        recommandations: recommandations,
        message: message
    };
}

function getNiveauL3Data(niveauId) {
    const niveauxL3 = {
        'vma95': { label: '95% VMA', pourcent: 95 },
        'vma100': { label: '100% VMA', pourcent: 100 },
        'vma105': { label: '105% VMA', pourcent: 105 },
        'vma110': { label: '110% VMA', pourcent: 110 }
    };
    return niveauxL3[niveauId] || null;
}

function getFeedbackCourse(tempsSecEleve, tempsCibleSec, tourNumero) {
    const ecart = Math.abs(tempsSecEleve - tempsCibleSec);
    const isDernierTour = (tourNumero === 6);
    
    if(ecart <= 2) {
        return { 
            message: isDernierTour ? "🔥 EXCELLENCE ! Tu maîtrises parfaitement !" : "🔥 PARFAIT ! Régularité de champion !", 
            type: "success" 
        };
    } else if(ecart <= 5) {
        if(tempsSecEleve > tempsCibleSec) {
            return { 
                message: isDernierTour ? "👍 Bien ! Tu progresses, continue ainsi" : "👍 Presque ! Accroche-toi au suivant", 
                type: "warning" 
            };
        } else {
            return { 
                message: isDernierTour ? "👍 Bon ! Dose mieux ton effort la prochaine fois" : "👍 Presque ! Économise-toi un peu", 
                type: "warning" 
            };
        }
    } else {
        if(tempsSecEleve > tempsCibleSec + 8) {
            return { 
                message: isDernierTour ? "💪 Courage ! L'objectif est ambitieux" : "💪 Tu peux y arriver ! Donne tout", 
                type: "danger" 
            };
        } else if(tempsSecEleve < tempsCibleSec - 8) {
            return { 
                message: isDernierTour ? "⚠️ Trop rapide ! Apprends la régularité" : "⚠️ Trop rapide ! Garde tes forces", 
                type: "danger" 
            };
        } else if(tempsSecEleve > tempsCibleSec) {
            return { 
                message: isDernierTour ? "💪 Bon travail ! Tu progresses à ton rythme" : "💪 Bien ! Trouve ton rythme optimal", 
                type: "warning" 
            };
        } else {
            return { 
                message: isDernierTour ? "⚠️ Bien ! Pense à la régularité sur toute la série" : "⚠️ Ralentis ! Maîtrise ton allure", 
                type: "warning" 
            };
        }
    }
}

let ELEVES = [];
const cardState = [{},{},{},{},{},{}];

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        alert('⚠️ Aucun élève trouvé. Ajoutez des élèves depuis l\'accueil.');
        window.location.href = 'index.html';
        return;
    }
    ELEVES = JSON.parse(stored);

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let i = 0; i < 6; i++) {
        grid.innerHTML += buildCard(i);
    }
};

function selectEleve(i, id) {
    const s = ELEVES.find(e => e.id === id);
    if(s) {
        const existantL4 = s.seances?.find(seance => seance.lecon === 'L4') || {};
        const existantL3 = s.seances?.find(seance => seance.lecon === 'L3') || {};
        
        cardState[i] = {
            student: s,
            progression: existantL4.progression || null,
            tours: existantL4.tours || [null,null,null,null,null,null],
            sautDistance: existantL4.sautDistance || existantL3.sautDistance || null,
            sautTech1: existantL4.sautTech1 !== undefined ? existantL4.sautTech1 : (existantL3.sautTech1 || false),
            sautTech2: existantL4.sautTech2 !== undefined ? existantL4.sautTech2 : (existantL3.sautTech2 || false),
            sautTech3: existantL4.sautTech3 || false,
            sautTech4: existantL4.sautTech4 || false,
            lancerDistance: existantL4.lancerDistance || existantL3.lancerDistance || null,
            lancerTech1: existantL4.lancerTech1 !== undefined ? existantL4.lancerTech1 : (existantL3.lancerTech1 || false),
            lancerTech2: existantL4.lancerTech2 !== undefined ? existantL4.lancerTech2 : (existantL3.lancerTech2 || false),
            lancerTech3: existantL4.lancerTech3 || false,
            lancerTech4: existantL4.lancerTech4 || false
        };

        // Recharger données
        setTimeout(() => {
            ['saut1', 'saut2', 'saut3', 'saut4', 'lancer1', 'lancer2', 'lancer3', 'lancer4'].forEach(tech => {
                const el = document.getElementById(`${tech}-${i}`);
                const techKey = tech.replace(/(\d)/, 'Tech$1');
                if(el && cardState[i][techKey]) el.checked = true;
            });
            
            if(cardState[i].sautDistance) {
                const el = document.getElementById(`saut-distance-${i}`);
                if(el) el.value = cardState[i].sautDistance;
            }
            if(cardState[i].lancerDistance) {
                const el = document.getElementById(`lancer-distance-${i}`);
                if(el) el.value = cardState[i].lancerDistance;
            }
        }, 100);
    } else {
        cardState[i] = {};
    }

    const info = document.getElementById(`info-${i}`);
    const analyse = document.getElementById(`analyse-${i}`);
    const progression = document.getElementById(`progression-${i}`);
    
    if(s) {
        info.style.display = 'block';
        const vmaInfo = s.vma ? ` | VMA: <strong style="color:var(--success)">${s.vma} km/h</strong>` : '';
        info.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
            ${s.photo ? `<img src="${s.photo}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.3);flex-shrink:0">` : `<span style="font-size:1.3rem">${s.sexe==='F'?'👧':'🧑'}</span>`}
            <div><strong>${s.nomPrenom}</strong><span style="font-size:0.82rem;opacity:0.7"> | ${s.age} ans${vmaInfo}</span></div>
        </div>`;
        
        if(s.vma) {
            // Analyser performance L3
            const perfL3 = analysePerformanceL3(s);
            
            // Afficher analyse
            analyse.style.display = 'block';
            let analyseHTML = `<div style="font-size: 0.8rem;">${perfL3.message}</div>`;
            
            if(perfL3.status !== 'absent') {
                analyseHTML += `
                    <div style="font-size: 0.75rem; margin-top: 6px; opacity: 0.8;">
                        Niveau L3: ${perfL3.niveauData.label} | 
                        Moyenne: ${fmtSec(perfL3.moyenne)} | 
                        Cible: ${fmtSec(perfL3.cible)} | 
                        Écart: ${fmtSec(perfL3.ecart)}
                    </div>
                `;
            }
            
            document.getElementById(`analyse-content-${i}`).innerHTML = analyseHTML;
            
            // Afficher options de progression
            progression.style.display = 'block';
            generateProgressionOptions(i, perfL3);
            
            if(cardState[i].progression) {
                selectProgression(i, cardState[i].progression);
            }
        } else {
            // Pas de VMA
            analyse.style.display = 'none';
            progression.style.display = 'none';
            document.getElementById(`novma-${i}`).style.display = 'block';
            document.getElementById(`sec-course-${i}`).style.display = 'block';
            document.getElementById(`sec-saut-${i}`).style.display = 'block';
            document.getElementById(`sec-lancer-${i}`).style.display = 'block';
        }

        // ── Confirmation visuelle forte (toujours, avec ou sans VMA) ──
        const avatarEl = document.getElementById(`confirm-avatar-${i}`);
        avatarEl.innerHTML = s.photo
            ? `<img src="${s.photo}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)">`
            : `<span style="font-size:2rem">${s.sexe==='F'?'👧':'🧑'}</span>`;
        document.getElementById(`confirm-name-${i}`).textContent = s.nomPrenom;
        document.getElementById(`confirm-meta-${i}`).textContent =
            `${s.age} ans · ${s.classe || ''} · VMA : ${s.vma ? s.vma + ' km/h' : 'non renseignée'}`;
        document.getElementById(`confirm-${i}`).style.display = 'block';
        document.getElementById(`novma-${i}`).style.display = s.vma ? 'none' : 'block';
        setTimeout(() => {
            const ex = s.seances?.find(se => se.lecon === 'L4') || {};
            [1,2,3,4].forEach(c => {
                if(ex[`sautTech${c}`])   renderStar4(i,'saut',c,   ex[`sautTech${c}`]);
                if(ex[`lancerTech${c}`]) renderStar4(i,'lancer',c, ex[`lancerTech${c}`]);
            });
            // Recharger ressenti + afficher la box si séance existante
            if(ex.ressenti) setRessenti4(i, ex.ressenti);
            if(ex.moyenne200m) {
                const rb = document.getElementById(`ressenti-box-${i}`);
                if(rb) rb.style.display = 'block';
            }
        }, 150);
    } else {
        document.getElementById(`info-${i}`).style.display = 'none';
        document.getElementById(`confirm-${i}`).style.display = 'none';
        document.getElementById(`novma-${i}`).style.display = 'none';
        analyse.style.display = 'none';
        progression.style.display = 'none';
        document.getElementById(`sec-course-${i}`).style.display = 'none';
        document.getElementById(`sec-saut-${i}`).style.display = 'none';
        document.getElementById(`sec-lancer-${i}`).style.display = 'none';
    }
}

function generateProgressionOptions(i, perfL3) {
    const container = document.getElementById(`progression-options-${i}`);
    let html = '';
    
    PROGRESSIONS_L4.forEach(prog => {
        if(!perfL3.recommandations.includes(prog.id)) return;
        
        const isRecommende = perfL3.recommandations[0] === prog.id;
        const className = `progression-btn ${isRecommende ? 'recommande' : ''}`;
        
        html += `
            <button class="${className}" id="btn-${prog.id}-${i}" onclick="selectProgression(${i}, '${prog.id}')">
                <strong>${prog.label}</strong><br>
                <span style="font-size: 0.65rem; opacity: 0.8;">${prog.desc}</span>
            </button>
        `;
    });
    
    container.innerHTML = html;
}

function selectProgression(i, progressionId) {
    const progression = PROGRESSIONS_L4.find(p => p.id === progressionId);
    if(!progression || !cardState[i].student?.vma) return;

    // Mettre à jour sélection visuelle
    PROGRESSIONS_L4.forEach(p => {
        const btn = document.getElementById(`btn-${p.id}-${i}`);
        if(btn) btn.classList.remove('selected');
    });
    const selectedBtn = document.getElementById(`btn-${progressionId}-${i}`);
    if(selectedBtn) selectedBtn.classList.add('selected');

    cardState[i].progression = progressionId;

    // Redirection si refaire L3
    if(progressionId === 'refaire') {
        if(confirm('Rediriger vers L3 pour rattrapage ?')) {
            // Sauvegarder choix et rediriger
            window.location.href = 'lecon3.html';
            return;
        }
    }

    // Calculer nouveau niveau VMA
    const perfL3 = analysePerformanceL3(cardState[i].student);
    let nouveauPourcent;
    
    if(perfL3.status === 'absent') {
        nouveauPourcent = 100; // Défaut
    } else if(progression.delta === 'L3') {
        nouveauPourcent = perfL3.niveauData.pourcent;
    } else if(progression.delta === 0) {
        nouveauPourcent = perfL3.niveauData.pourcent;
    } else {
        nouveauPourcent = perfL3.niveauData.pourcent + progression.delta;
    }

    const vma = parseFloat(cardState[i].student.vma);
    const vitesseCible = vma * (nouveauPourcent / 100);
    const tempsCible200m = (0.2 / vitesseCible) * 3600;

    // Afficher objectif
    document.getElementById(`objectif-${i}`).innerHTML = `
        🔧 <strong>OBJECTIF L4 :</strong> ${nouveauPourcent}% VMA - ${progression.desc}
    `;
    document.getElementById(`objectif-${i}`).style.display = 'block';
    
    document.getElementById(`cible-${i}`).innerHTML = `
        <div style="font-size:0.7rem;color:#fbbf24;margin-bottom:4px">Temps cible par 200m :</div>
        <div class="cible-temps">${fmtSec(tempsCible200m)}</div>
        <div style="font-size:0.7rem;color:#fbbf24;margin-top:4px">${nouveauPourcent}% de ta VMA</div>
    `;
    document.getElementById(`cible-${i}`).style.display = 'block';

    // Afficher évolution depuis L3
    if(perfL3.status !== 'absent') {
        const deltaStr = progression.delta === 0 ? 'Même niveau' : 
                        progression.delta === 'L3' ? 'Rattrapage' :
                        `+${progression.delta}% VMA`;
        
        document.getElementById(`evolution-${i}`).innerHTML = `
            📈 <strong>Évolution :</strong> L3 (${perfL3.niveauData.label}) → L4 (${nouveauPourcent}% VMA)
            <div style="color: var(--accent); font-weight: 700; margin-top: 4px;">${deltaStr}</div>
        `;
        document.getElementById(`evolution-${i}`).style.display = 'block';
    }

    document.getElementById(`sec-course-${i}`).style.display = 'block';
    document.getElementById(`sec-saut-${i}`).style.display = 'block';
    document.getElementById(`sec-lancer-${i}`).style.display = 'block';

    // ── Ouverture auto section Course ──
    const bCourse = document.getElementById(`body-course-${i}`);
    const aCourse = document.getElementById(`arr-course-${i}`);
    if(bCourse && !bCourse.classList.contains('open')) {
        bCourse.classList.add('open');
        if(aCourse) aCourse.classList.add('open');
    }
}

function toggleSection(sec, i) {
    const body = document.getElementById(`body-${sec}-${i}`);
    const arr = document.getElementById(`arr-${sec}-${i}`);
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    arr.classList.toggle('open', !isOpen);
}

function updateTours(i) {
    [1,2,3,4,5,6].forEach(n => { const inp=document.getElementById(`t${n}-${i}`); if(inp) validateTimeInput(inp,LIMITES_200M.max,LIMITES_200M.min); });
    markDirty4(i);
    const cardData = cardState[i];
    if(!cardData?.student) return;
    if(!cardData.progression) return;

    const progression = PROGRESSIONS_L4.find(p => p.id === cardData.progression);
    const perfL3 = analysePerformanceL3(cardData.student);
    
    let nouveauPourcent;
    if(perfL3.status === 'absent') {
        nouveauPourcent = 100;
    } else if(progression.delta === 'L3' || progression.delta === 0) {
        nouveauPourcent = perfL3.niveauData.pourcent + (progression.delta === 'L3' ? 0 : progression.delta);
    } else {
        nouveauPourcent = perfL3.niveauData.pourcent + progression.delta;
    }

    const vma = parseFloat(cardData.student.vma);
    const vitesseCible = vma * (nouveauPourcent / 100);
    const tempsCible = (0.2 / vitesseCible) * 3600;

    let moy = null, valid = 0, total = 0;
    const temps = [];

    [1,2,3,4,5,6].forEach(n => {
        const val = parseTime(document.getElementById(`t${n}-${i}`).value);
        const el = document.getElementById(`t${n}r-${i}`);
        if(val) { 
            el.textContent = fmtSec(val); 
            el.style.color = 'var(--success)'; 
            total += val; 
            valid++;
            temps.push(val);

            const feedback = getFeedbackCourse(val, tempsCible, n);

            let feedbackEl = document.getElementById(`feedback-t${n}-${i}`);
            if(!feedbackEl) {
                feedbackEl = document.createElement('div');
                feedbackEl.id = `feedback-t${n}-${i}`;
                el.parentNode.appendChild(feedbackEl);
            }
            
            feedbackEl.className = `feedback-box`;
            if(feedback.type === 'warning') feedbackEl.className += ' feedback-warning';
            if(feedback.type === 'danger') feedbackEl.className += ' feedback-danger';
            
            feedbackEl.textContent = feedback.message;

        } else { 
            el.textContent = '';
            const feedbackEl = document.getElementById(`feedback-t${n}-${i}`);
            if(feedbackEl) feedbackEl.remove();
        }
    });

    const progressBar = document.getElementById(`course-progress-${i}`);
    const progressText = document.getElementById(`course-progress-text-${i}`);
    if(progressBar) {
        const percent = (valid / 6) * 100;
        progressBar.style.width = percent + '%';
        progressText.textContent = `${valid}/6 tours`;

        if(valid === 6) {
            progressText.innerHTML = `🔥 <strong>SÉRIE MAÎTRISÉE !</strong>`;
            progressText.style.color = 'var(--success)';
        }
    }

    const moyEl = document.getElementById(`moy-course-${i}`);
    if(valid === 6) {
        moy = total / 6;
        const ecartMax = Math.max(...temps.map((t, idx) => 
            idx > 0 ? Math.abs(t - temps[idx-1]) : 0
        ));
        
        const ecartMoyenne = Math.abs(moy - tempsCible);
        let moyFeedback = `Moyenne : ${fmtSec(moy)} `;
        
        if(ecartMoyenne <= 2) {
            moyFeedback += `🎯 OBJECTIF PARFAIT !`;
            moyEl.style.color = 'var(--success)';
        } else if(ecartMoyenne <= 5) {
            moyFeedback += `👍 Très bonne progression !`;
            moyEl.style.color = 'var(--warning)';
        } else {
            moyFeedback += `💪 En route vers la maîtrise !`;
            moyEl.style.color = 'var(--warning)';
        }
        
        if(ecartMax <= 3) {
            moyFeedback += ` 🤖 RÉGULARITÉ EXCELLENTE !`;
        }

        moyEl.textContent = moyFeedback;
        const tend4 = getTendance(temps); if(tend4) moyEl.textContent += ` ${tend4}`;
        cardState[i].tours = temps;
        // Afficher la ressenti-box quand les 6 tours sont remplis
        const rb = document.getElementById(`ressenti-box-${i}`);
        if(rb) rb.style.display = 'block';
    } else {
        moyEl.textContent = '';
    }
}

// ── Tendance inter-tours ──
function getTendance(temps) {
    const valid = temps.filter(t => t !== null && t > 0);
    if(valid.length < 3) return '';
    const first = valid.slice(0, Math.ceil(valid.length/2)).reduce((a,b)=>a+b)/Math.ceil(valid.length/2);
    const last  = valid.slice(-Math.floor(valid.length/2)).reduce((a,b)=>a+b)/Math.floor(valid.length/2);
    const delta = last - first;
    if(delta < -1.5) return '📈 En progression'; // temps qui baisse = plus rapide = bien
    if(delta > 1.5)  return '📉 Attention au relâchement';
    return '↔️ Régulier';
}

        const lancerTech1 = getStarValue4(i,'lancer',1);

        const idx = allStudents.findIndex(s => s.id === d.student.id);
        if(idx === -1) return;

        if(!allStudents[idx].seances) allStudents[idx].seances = [];

        const sessionsExistantes_L4 = allStudents[idx].seances
            .map((s, si) => ({...s, _idx: si}))

            const choix = window.confirm(

            );
            if(choix) {

            } else {

            }
        } else {
            if(sessionsExistantes_L4.length > 0) {

            lancerTech3: lancerTech3,

        };

    });

}

function parseTime(str) {
    if(!str) return null;
    const raw = str.trim().replace(',', ':').replace('.', ':');
    const m1 = raw.match(/^(\d+):(\d{1,2})$/);
    if(m1) { const min=parseInt(m1[1]),sec=parseInt(m1[2]); if(sec<60) return min*60+sec; }
    const m2 = raw.match(/^(\d{3,4})$/);
    if(m2) { const n=parseInt(m2[0]); if(n>=100&&n<=9959){const min=Math.floor(n/100),sec=n%100; if(sec<60) return min*60+sec;} }
    return null;
}

const LIMITES_200M = { min: 28, max: 105 };
function validateTimeInput(input, max, min) {
    const val = parseTime(input.value);
    input.classList.remove('invalid','valid-time');
    if(!input.value.trim()) return;
    if(val===null||val<(min||28)||val>(max||105)) input.classList.add('invalid');
    else input.classList.add('valid-time');
}

function fmtSec(sec) {
    const m = Math.floor(sec/60);
    const s = Math.round(sec%60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}
window.addEventListener('beforeunload', function() { silentSave(); });

let _lastAutoSave = Date.now();
function silentSave() {
    try {
        let allStudents = JSON.parse(localStorage.getItem('eps_pro_students') || '[]');
        let count = 0;
        cardState.forEach((d, i) => {
            if(!d.student) return;
            const idx = allStudents.findIndex(s => s.id === d.student.id);
            if(idx === -1) return;
            if(!allStudents[idx].seances) allStudents[idx].seances = [];
            const seanceIdx = allStudents[idx].seances.findIndex(s => s.lecon === 'L4' && s._autoSlot);
            const tours = [1,2,3,4,5,6].map(n => parseTime(document.getElementById(`t${n}-${i}`)?.value));
            const sautRaw = parseFloat(document.getElementById(`saut-distance-${i}`)?.value);
            const lancerRaw = parseFloat(document.getElementById(`lancer-distance-${i}`)?.value);
            const payload = {
                lecon: 'L4', _autoSlot: true, _draft: true,
                progression: d.progression, tours,
                sautDistance: (!isNaN(sautRaw) && sautRaw>=0.8 && sautRaw<=5.5) ? sautRaw : null,
                lancerDistance: (!isNaN(lancerRaw) && lancerRaw>=3.0 && lancerRaw<=25.0) ? lancerRaw : null,
                date: new Date().toISOString()
            };
            if(seanceIdx === -1) allStudents[idx].seances.push(payload);
            else allStudents[idx].seances[seanceIdx] = payload;
            count++;
        });
        if(count > 0) { localStorage.setItem('eps_pro_students', JSON.stringify(allStudents)); _lastAutoSave = Date.now(); updateAutosaveIndicator(); }
    } catch(e) {}
}
function updateAutosaveIndicator() {
    const el = document.getElementById('autosave-indicator'); if(!el) return;
    const sec = Math.round((Date.now()-_lastAutoSave)/1000);
    el.textContent = sec < 5 ? '💾 Sauvegardé' : `💾 Sauvegardé il y a ${sec}s`;
}
setInterval(() => {
    try {
        const _a = window.alert; const _c = window.confirm;
        window.alert = () => {}; window.confirm = () => false;
        silentSave();
        window.alert = _a; window.confirm = _c;
    } catch(e) {}
}, 30000);
setInterval(updateAutosaveIndicator, 10000);
