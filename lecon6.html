<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L6 - Perfectionnement Technique - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #00d9ff;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --gold: #f59e0b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            color: white; 
            padding: 16px; 
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 2rem; 
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .grid6 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (max-width: 900px) { .grid6 { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 600px) { .grid6 { grid-template-columns: 1fr; } }

        .card {
            background: var(--card);
            border: 1px solid rgba(0,217,255,0.3);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: white;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-body { 
            padding: 16px; 
        }
        
        .student-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: rgba(0,217,255,0.05);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .section {
            margin-bottom: 16px;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,0.02);
        }
        
        .section-header {
            background: rgba(0,217,255,0.15);
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        
        .arrow {
            transition: transform 0.3s ease;
            font-size: 0.8rem;
        }
        
        .arrow.open {
            transform: rotate(180deg);
        }
        
        .section-body {
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        
        .section-body.open {
            padding: 12px;
            max-height: 600px;
        }
        
        .pyramide-info {
            background: rgba(0,217,255,0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        
        .temps-cibles {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        
        .temps-cible {
            background: rgba(123,92,246,0.2);
            padding: 8px 6px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.8rem;
        }
        
        .temps-cible .distance {
            font-weight: 700;
            color: var(--purple);
            font-size: 0.85rem;
        }
        
        .temps-cible .temps {
            font-family: 'SF Mono', Monaco, monospace;
            color: var(--accent);
            font-weight: 600;
        }
        
        .pyramide-validation {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 12px 0;
        }
        
        .pyramide-check {
            text-align: center;
            font-size: 0.8rem;
        }
        
        .pyramide-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--success);
            margin-bottom: 4px;
        }
        
        .technique-box {
            background: rgba(75,222,128,0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .technique-title {
            font-weight: 700;
            color: var(--success);
            margin-bottom: 10px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
            font-size: 0.8rem;
        }
        
        .checkbox-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--success);
        }
        
        .distance-input {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        
        .distance-input input {
            padding: 6px 8px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 0.9rem;
        }
        
        .distance-input input[type="number"] {
            width: 80px;
        }
        
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-back:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .save-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--success), var(--accent));
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .save-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(75,222,128,0.4);
        }
        
        @media (max-width: 768px) {
            .temps-cibles, .pyramide-validation { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS: épreuve Combinée</h1>
<p class="subtitle">⚡ L6 - PERFECTIONNEMENT TECHNIQUE</p>

<div class="grid6" id="grid"></div>

<button class="save-btn" onclick="saveAll()">💾 Sauvegarder</button>

<script>
let ELEVES = [];
const cardState = [{},{},{},{},{},{}];

const TEMPS_PYRAMIDE = {
    8: { 60: 22.5, 80: 32.0, 100: 41.7 },
    9: { 60: 20.0, 80: 28.4, 100: 37.0 },
    10: { 60: 18.0, 80: 25.6, 100: 33.3 },
    11: { 60: 16.4, 80: 23.3, 100: 30.3 },
    12: { 60: 15.0, 80: 21.3, 100: 27.8 },
    13: { 60: 13.8, 80: 19.7, 100: 25.6 },
    14: { 60: 12.9, 80: 18.3, 100: 23.8 },
    15: { 60: 12.0, 80: 17.1, 100: 22.2 },
    16: { 60: 11.3, 80: 16.0, 100: 20.8 },
    17: { 60: 10.6, 80: 15.0, 100: 19.6 },
    18: { 60: 10.0, 80: 14.2, 100: 18.5 }
};

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        alert('⚠️ Aucun élève trouvé.');
        window.location.href = 'index.html';
        return;
    }
    ELEVES = JSON.parse(stored);

    const grid = document.getElementById('grid');
    for(let i = 0; i < 6; i++) {
        grid.appendChild(createCard(i));
    }
};

function createCard(i) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
        <div class="card-header">
            <span>⚡ ÉLÈVE ${i+1}</span>
        </div>
        <div class="card-body">
            <select onchange="selectStudent(${i}, this.value)" style="width:100%; padding:8px; background:var(--card); color:white; border:1px solid rgba(255,255,255,0.3); border-radius:6px; margin-bottom:12px;">
                <option value="">Sélectionner un élève</option>
                ${ELEVES.map(eleve => `<option value="${eleve.id}">${eleve.nomPrenom}</option>`).join('')}
            </select>
            
            <div id="info-${i}" class="student-info" style="display:none;"></div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection('course', ${i})">
                    <span>🏃‍♂️ PYRAMIDE DOUCE</span><span class="arrow" id="arr-course-${i}">▼</span>
                </div>
                <div class="section-body" id="body-course-${i}">
                    <div class="pyramide-info">
                        <strong>📊 Pyramide Autonome :</strong><br>
                        60m → 80m → 100m → 80m → 60m<br>
                        <small>⏱️ Récup 60s | Chrono de groupe | 110-120% VMA</small>
                    </div>
                    <div class="temps-cibles" id="temps-cibles-${i}"></div>
                    <div style="font-size: 0.85rem; color: var(--warning); margin: 10px 0;">
                        <strong>✅ Validation des distances :</strong>
                    </div>
                    <div class="pyramide-validation">
                        <div class="pyramide-check">
                            <input type="checkbox" id="pyramide-60-1-${i}">
                            <div>60m T1</div>
                        </div>
                        <div class="pyramide-check">
                            <input type="checkbox" id="pyramide-80-1-${i}">
                            <div>80m T2</div>
                        </div>
                        <div class="pyramide-check">
                            <input type="checkbox" id="pyramide-100-${i}">
                            <div>100m T3</div>
                        </div>
                        <div class="pyramide-check">
                            <input type="checkbox" id="pyramide-80-2-${i}">
                            <div>80m T4</div>
                        </div>
                        <div class="pyramide-check">
                            <input type="checkbox" id="pyramide-60-2-${i}">
                            <div>60m T5</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection('saut', ${i})">
                    <span>🦘 SAUT - PERFECTIONNEMENT</span><span class="arrow" id="arr-saut-${i}">▼</span>
                </div>
                <div class="section-body" id="body-saut-${i}">
                    <div class="technique-box">
                        <div class="technique-title">🎯 Maîtrise avancée (5/5)</div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="saut1-${i}">
                            <label>✅ Course d'élan fluide</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="saut2-${i}">
                            <label>✅ Placement précis</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="saut3-${i}">
                            <label>✅ Impulsion maximale</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="saut4-${i}">
                            <label>✅ Vol et réception</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="saut5-${i}">
                            <label>⭐ Geste harmonieux</label>
                        </div>
                    </div>
                    <div class="distance-input">
                        <label>Distance (m):</label>
                        <input type="number" step="0.01" id="saut-distance-${i}" placeholder="3.50">
                    </div>
                    <div class="distance-input">
                        <label>Tentatives:</label>
                        <input type="number" min="1" max="6" id="saut-tentatives-${i}" placeholder="3" style="width: 60px;">
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection('lancer', ${i})">
                    <span>🎯 LANCER - PERFECTIONNEMENT</span><span class="arrow" id="arr-lancer-${i}">▼</span>
                </div>
                <div class="section-body" id="body-lancer-${i}">
                    <div class="technique-box">
                        <div class="technique-title">🎯 Maîtrise avancée (5/5)</div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="lancer1-${i}">
                            <label>✅ Placement optimal</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="lancer2-${i}">
                            <label>✅ Chaîne cinétique</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="lancer3-${i}">
                            <label>✅ Transfert poids</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="lancer4-${i}">
                            <label>✅ Accompagnement</label>
                        </div>
                        <div class="checkbox-row">
                            <input type="checkbox" id="lancer5-${i}">
                            <label>⭐ Coordination globale</label>
                        </div>
                    </div>
                    <div class="distance-input">
                        <label>Distance (m):</label>
                        <input type="number" step="0.01" id="lancer-distance-${i}" placeholder="12.00">
                    </div>
                    <div class="distance-input">
                        <label>Tentatives:</label>
                        <input type="number" min="1" max="6" id="lancer-tentatives-${i}" placeholder="3" style="width: 60px;">
                    </div>
                </div>
            </div>
        </div>
    `;
    return card;
}

function selectStudent(i, studentId) {
    const student = ELEVES.find(s => s.id === studentId);
    
    if(student) {
        const existantL6 = student.seances?.find(seance => seance.lecon === 'L6') || {};
        
        cardState[i] = {
            student: student,
            sautTech1: existantL6.sautTech1 || false,
            sautTech2: existantL6.sautTech2 || false,
            sautTech3: existantL6.sautTech3 || false,
            sautTech4: existantL6.sautTech4 || false,
            sautTech5: existantL6.sautTech5 || false,
            sautDistance: existantL6.sautDistance || null,
            sautTentatives: existantL6.sautTentatives || null,
            lancerTech1: existantL6.lancerTech1 || false,
            lancerTech2: existantL6.lancerTech2 || false,
            lancerTech3: existantL6.lancerTech3 || false,
            lancerTech4: existantL6.lancerTech4 || false,
            lancerTech5: existantL6.lancerTech5 || false,
            lancerDistance: existantL6.lancerDistance || null,
            lancerTentatives: existantL6.lancerTentatives || null,
            pyramide60_1: existantL6.pyramide60_1 || false,
            pyramide80_1: existantL6.pyramide80_1 || false,
            pyramide100: existantL6.pyramide100 || false,
            pyramide80_2: existantL6.pyramide80_2 || false,
            pyramide60_2: existantL6.pyramide60_2 || false
        };
        
        setTimeout(() => {
            ['saut1', 'saut2', 'saut3', 'saut4', 'saut5', 'lancer1', 'lancer2', 'lancer3', 'lancer4', 'lancer5'].forEach(tech => {
                const el = document.getElementById(`${tech}-${i}`);
                const techKey = tech.replace(/(\d)/, 'Tech$1');
                if(el && cardState[i][techKey]) el.checked = true;
            });
            
            if(existantL6.sautDistance) document.getElementById(`saut-distance-${i}`).value = existantL6.sautDistance;
            if(existantL6.sautTentatives) document.getElementById(`saut-tentatives-${i}`).value = existantL6.sautTentatives;
            if(existantL6.lancerDistance) document.getElementById(`lancer-distance-${i}`).value = existantL6.lancerDistance;
            if(existantL6.lancerTentatives) document.getElementById(`lancer-tentatives-${i}`).value = existantL6.lancerTentatives;
            
            ['pyramide-60-1', 'pyramide-80-1', 'pyramide-100', 'pyramide-80-2', 'pyramide-60-2'].forEach(pyra => {
                const el = document.getElementById(`${pyra}-${i}`);
                const pyraKey = pyra.replace(/-/g, '');
                if(el && cardState[i][pyraKey]) el.checked = true;
            });
        }, 100);
    } else {
        cardState[i] = {};
    }
    
    const info = document.getElementById(`info-${i}`);
    if(student) {
        info.style.display = 'block';
        const vmaInfo = student.vma ? ` | VMA: <strong style="color:var(--success)">${student.vma} km/h</strong>` : '';
        info.innerHTML = `<strong>${student.sexe==='F'?'👧':'🧑'} ${student.sexe==='F'?'Fille':'Garçon'}</strong> | ${student.age} ans${vmaInfo}`;
        generateTempsCibles(i, student.vma);
    } else {
        info.style.display = 'none';
        document.getElementById(`temps-cibles-${i}`).innerHTML = '';
    }
}

function generateTempsCibles(i, vma) {
    const container = document.getElementById(`temps-cibles-${i}`);
    if(!vma) {
        container.innerHTML = '<div style="text-align:center; color:var(--warning); font-size:0.8rem;">⚠️ VMA nécessaire</div>';
        return;
    }
    
    const vmaNum = Math.round(parseFloat(vma));
    const temps = TEMPS_PYRAMIDE[vmaNum] || TEMPS_PYRAMIDE[12];
    
    const distances = [60, 80, 100, 80, 60];
    let html = '';
    
    distances.forEach((dist, idx) => {
        const tempsCible = temps[dist];
        html += `
            <div class="temps-cible">
                <div class="distance">${dist}m</div>
                <div class="temps">${tempsCible}"</div>
                <div style="font-size: 0.7rem;">T${idx+1}</div>
            </div>
        `;
    });
    
    container.innerHTML = html;
}

function toggleSection(sec, i) {
    const body = document.getElementById(`body-${sec}-${i}`);
    const arr = document.getElementById(`arr-${sec}-${i}`);
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    arr.classList.toggle('open', !isOpen);
}

function saveAll() {
    let count = 0;
    let allStudents = JSON.parse(localStorage.getItem('eps_pro_students') || '[]');

    cardState.forEach((d, i) => {
        if(!d.student) return;

        const sautDistance = parseFloat(document.getElementById(`saut-distance-${i}`)?.value) || null;
        const sautTentatives = parseInt(document.getElementById(`saut-tentatives-${i}`)?.value) || null;
        const sautTech1 = document.getElementById(`saut1-${i}`)?.checked || false;
        const sautTech2 = document.getElementById(`saut2-${i}`)?.checked || false;
        const sautTech3 = document.getElementById(`saut3-${i}`)?.checked || false;
        const sautTech4 = document.getElementById(`saut4-${i}`)?.checked || false;
        const sautTech5 = document.getElementById(`saut5-${i}`)?.checked || false;

        const lancerDistance = parseFloat(document.getElementById(`lancer-distance-${i}`)?.value) || null;
        const lancerTentatives = parseInt(document.getElementById(`lancer-tentatives-${i}`)?.value) || null;
        const lancerTech1 = document.getElementById(`lancer1-${i}`)?.checked || false;
        const lancerTech2 = document.getElementById(`lancer2-${i}`)?.checked || false;
        const lancerTech3 = document.getElementById(`lancer3-${i}`)?.checked || false;
        const lancerTech4 = document.getElementById(`lancer4-${i}`)?.checked || false;
        const lancerTech5 = document.getElementById(`lancer5-${i}`)?.checked || false;

        const pyramide60_1 = document.getElementById(`pyramide-60-1-${i}`)?.checked || false;
        const pyramide80_1 = document.getElementById(`pyramide-80-1-${i}`)?.checked || false;
        const pyramide100 = document.getElementById(`pyramide-100-${i}`)?.checked || false;
        const pyramide80_2 = document.getElementById(`pyramide-80-2-${i}`)?.checked || false;
        const pyramide60_2 = document.getElementById(`pyramide-60-2-${i}`)?.checked || false;

        const idx = allStudents.findIndex(s => s.id === d.student.id);
        if(idx === -1) return;

        if(!allStudents[idx].seances) allStudents[idx].seances = [];

        let seanceIdx = allStudents[idx].seances.findIndex(s => s.lecon === 'L6');
        if(seanceIdx === -1) {
            allStudents[idx].seances.push({
                lecon: 'L6',
                date: new Date().toISOString()
            });
            seanceIdx = allStudents[idx].seances.length - 1;
        }

        const scoreSaut = [sautTech1, sautTech2, sautTech3, sautTech4, sautTech5].filter(Boolean).length;
        const scoreLancer = [lancerTech1, lancerTech2, lancerTech3, lancerTech4, lancerTech5].filter(Boolean).length;
        
        const pyramideReussites = [pyramide60_1, pyramide80_1, pyramide100, pyramide80_2, pyramide60_2];
        const pyramideReussie = pyramideReussites.every(Boolean);
        
        let pyramideEchec = null;
        if(!pyramideReussie) {
            const distances = ['60m T1', '80m T2', '100m T3', '80m T4', '60m T5'];
            const index = pyramideReussites.findIndex(r => !r);
            if(index !== -1) pyramideEchec = distances[index];
        }

        allStudents[idx].seances[seanceIdx] = {
            ...allStudents[idx].seances[seanceIdx],
            type: 'perfectionnement_technique',
            sautDistance, sautTentatives,
            sautTech1, sautTech2, sautTech3, sautTech4, sautTech5,
            scoreTechniqueSaut: scoreSaut,
            lancerDistance, lancerTentatives,
            lancerTech1, lancerTech2, lancerTech3, lancerTech4, lancerTech5,
            scoreTechniqueLancer: scoreLancer,
            pyramide60_1, pyramide80_1, pyramide100, pyramide80_2, pyramide60_2,
            pyramideReussie: pyramideReussie,
            pyramideEchec: pyramideEchec,
            date: new Date().toISOString()
        };

        count++;
    });

    if(count === 0) { 
        alert('⚠️ Aucun élève sélectionné !'); 
        return; 
    }

    localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
    alert(`⚡ L6 perfectionnement sauvegardé pour ${count} élève(s) !`);
}

console.log('⚡ L6 - Perfectionnement Technique chargé !');
</script>
</body>
</html>
