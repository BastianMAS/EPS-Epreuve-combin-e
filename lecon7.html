// ── Helpers ─────────────────────────────────────────────────────────────────

function calcTemps400(vma, pct) {
    if(!vma || !pct) return '—';
    const vitesse = parseFloat(vma) * pct / 100 / 3.6;
    const sec = Math.round(400 / vitesse);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2,'0')}`;
}

// Lit le % VMA réel depuis les données de séance
function getPctVMAFromSeance(s, vma) {
    if(!s || !vma) return null;
    // Priorité 1 : niveau choisi en L3 (vma95/100/105/110)
    if(s.lecon === 'L3' && s.niveau) {
        const map = { vma95:95, vma100:100, vma105:105, vma110:110 };
        if(map[s.niveau]) return map[s.niveau];
    }
    // Priorité 2 : calcul depuis moyenne200m
    if(s.moyenne200m) {
        const vitesse = 200 / parseFloat(s.moyenne200m);
        return Math.round((vitesse / (parseFloat(vma) / 3.6)) * 100);
    }
    return null;
}

function getPctL4(sL3, sL4, vma) {
    const pctL3 = getPctVMAFromSeance(sL3, vma);
    if(!sL4) return pctL3;
    // Si moyenne200m dispo → calcul direct
    if(sL4.moyenne200m) return getPctVMAFromSeance(sL4, vma);
    // Sinon delta depuis progression choisie
    if(pctL3 !== null && sL4.progression) {
        const delta = { maintien:0, progression:5, depassement:10 }[sL4.progression] ?? 0;
        return pctL3 + delta;
    }
    return pctL3;
}

// ── Historique (section dépliable au-dessus des tours) ──────────────────────

function generateHistorique(i, student) {
    const container = document.getElementById(`historique-data-${i}`);
    const vma = parseFloat(student.vma) || null;
    const seances = student.seances || [];
    const sL3 = seances.filter(s => s.lecon==='L3').at(-1) || null;
    const sL4 = seances.filter(s => s.lecon==='L4').at(-1) || null;
    const sL5 = seances.filter(s => s.lecon==='L5').at(-1) || null;
    const sL6 = seances.filter(s => s.lecon==='L6').at(-1) || null;

    const pctL3 = getPctVMAFromSeance(sL3, vma);
    const pctL4 = getPctL4(sL3, sL4, vma);
    const pctL5 = sL5?.performanceMoyenne ? Math.round(sL5.performanceMoyenne) : null;
    const pyramideOk = sL6?.pyramideReussie ?? null;

    // Calcul du % conseillé pour T1
    let pctConseil = 100; // défaut
    let baseLabel = 'Base 100% VMA';
    let raisonnement = [];

    if(pctL3 !== null) {
        pctConseil = pctL3;
        baseLabel = `L3 → ${pctL3}%`;
    }
    if(pctL4 !== null) {
        if(pctL4 > pctConseil) {
            raisonnement.push(`progression L3→L4 : +${pctL4 - pctL3}%`);
        }
        pctConseil = pctL4;
        baseLabel = `L4 → ${pctL4}%`;
    }
    // L5 relais > 95% = endurance confirmée → +5%
    if(pctL5 !== null && pctL5 >= 95) {
        pctConseil = Math.min(pctConseil + 5, 130);
        raisonnement.push(`relais L5 réussi à ${pctL5}% → +5%`);
    }
    // L6 pyramide validée → capable de haute intensité → +5% sup
    if(pyramideOk === true) {
        pctConseil = Math.min(pctConseil + 5, 130);
        raisonnement.push(`pyramide L6 validée → +5%`);
    }

    // Stocker dans cardState pour que T2/T3 puissent y accéder
    if(!cardState[i]) cardState[i] = {};
    cardState[i].pctConseil = pctConseil;
    cardState[i].vma = vma;

    // Construire l'affichage
    let html = '<div class="historique-box">';

    // Ligne de progression visuelle
    if(pctL3 !== null || pctL4 !== null) {
        html += `<div style="font-size:0.72rem;font-weight:800;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">📈 Ta progression</div>`;
        html += `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px">`;
        if(pctL3 !== null) html += `<span style="background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.4);border-radius:6px;padding:3px 8px;font-size:0.75rem;font-weight:800;color:#34d399">L3 · ${pctL3}%</span>`;
        if(pctL4 !== null) {
            const arrow = pctL4 > (pctL3||pctL4) ? '↑' : pctL4 < (pctL3||pctL4) ? '↓' : '→';
            const arrowColor = arrow==='↑'?'#34d399':arrow==='↓'?'#f87171':'#94a3b8';
            html += `<span style="color:${arrowColor};font-weight:900;font-size:0.9rem">${arrow}</span>`;
            html += `<span style="background:rgba(96,165,250,0.15);border:1px solid rgba(96,165,250,0.4);border-radius:6px;padding:3px 8px;font-size:0.75rem;font-weight:800;color:#60a5fa">L4 · ${pctL4}%</span>`;
        }
        if(pctL5 !== null) {
            html += `<span style="color:#94a3b8;font-size:0.8rem">→</span>`;
            const l5Color = pctL5>=95?'#a78bfa':'#f87171';
            html += `<span style="background:rgba(167,139,250,0.12);border:1px solid rgba(167,139,250,0.3);border-radius:6px;padding:3px 8px;font-size:0.75rem;font-weight:800;color:${l5Color}">Relais · ${pctL5}%</span>`;
        }
        if(pyramideOk !== null) {
            html += `<span style="font-size:0.75rem;${pyramideOk?'color:#34d399':'color:#f87171'}">${pyramideOk ? '⚡ Pyramide ✅' : '⚡ Pyramide ❌'}</span>`;
        }
        html += `</div>`;
    }

    // Conseil T1
    const tConseil = vma ? calcTemps400(vma, pctConseil) : null;
    const raisStr = raisonnement.length ? ` (${raisonnement.join(', ')})` : '';
    html += `<div style="background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.25);border-radius:8px;padding:8px 10px">`;
    html += `<div style="font-size:0.72rem;font-weight:800;color:#fbbf24;margin-bottom:3px">💡 Mon conseil pour ton 1er 400m${raisStr}</div>`;
    html += `<div style="font-size:0.85rem;font-weight:900;color:white">Pars à <span style="color:#fbbf24">${pctConseil}% VMA</span>${tConseil ? ` → <span style="color:#fbbf24">⏱ ${tConseil}</span>` : ''}</div>`;
    html += `</div>`;

    html += '</div>';
    container.innerHTML = html;
}

// ── Boutons de choix dynamiques ──────────────────────────────────────────────

function buildChoixBtns(i, student) {
    const vma = parseFloat(student.vma) || null;
    const pctRef = cardState[i]?.pctConseil || 100;

    // Tour 1 : prudent = pctRef-10, conseillé = pctRef, ambitieux = pctRef+10
    renderChoixGrid(i, 'tour1', [
        { key:'prudent',   emoji:'🐌', label:'Prudent',    pct: pctRef - 10 },
        { key:'regulier',  emoji:'⚖️', label:'Conseillé',  pct: pctRef, highlight: true },
        { key:'ambitieux', emoji:'⚡', label:'Ambitieux',  pct: pctRef + 10 },
    ], vma);

    // Tour 2 : rempli après saisie T1 + ressenti (voir updateTour2Btns)
    renderChoixGrid(i, 'tour2', [
        { key:'plus-lent', emoji:'🐌', label:'Réduire',    pct: pctRef - 5 },
        { key:'meme',      emoji:'⚖️', label:'Maintenir',  pct: pctRef, highlight: true },
        { key:'plus-vite', emoji:'⚡', label:'Accélérer',  pct: pctRef + 5 },
    ], vma);

    // Tour 3 idem
    renderChoixGrid(i, 'tour3', [
        { key:'tenir',     emoji:'🛡️', label:'Tenir',     pct: pctRef - 5 },
        { key:'maintenir', emoji:'⚖️', label:'Maintenir', pct: pctRef, highlight: true },
        { key:'sprint',    emoji:'🚀', label:'Sprint',    pct: pctRef + 10 },
    ], vma);
}

function renderChoixGrid(i, tour, configs, vma) {
    const grid = document.getElementById(`choix-grid-${tour}-${i}`);
    if(!grid) return;
    grid.innerHTML = configs.map(c => {
        const t = vma ? calcTemps400(vma, c.pct) : '';
        const borderStyle = c.highlight ? 'border-color:rgba(251,191,36,0.5);background:rgba(251,191,36,0.08)' : '';
        return `<div class="choix-btn" id="btn-${tour}-${c.key}-${i}" onclick="selectChoix(${i}, '${tour}', '${c.key}')" style="${borderStyle}">
            ${c.emoji} ${c.label}
            <span class="vma-hint">${vma ? c.pct+'% VMA' : '—'}</span>
            ${t ? `<span class="temps-hint">⏱ ${t}</span>` : ''}
        </div>`;
    }).join('');
}

// Mise à jour intelligente de T2 après ressenti T1
function updateTour2Btns(i) {
    const state = cardState[i];
    if(!state?.student) return;
    const vma = parseFloat(state.student.vma) || null;
    const pctT1 = getChoixPct(i, 'tour1') || state.pctConseil || 100;

    // Lire le ressenti T1
    const facile = document.getElementById(`ressenti1-facile-${i}`)?.checked;
    const bien   = document.getElementById(`ressenti1-bien-${i}`)?.checked;
    const dur    = document.getElementById(`ressenti1-dur-${i}`)?.checked;

    let pctT2ref = pctT1;
    let conseil = '';
    if(facile) { pctT2ref = pctT1 + 10; conseil = 'Facile → tu peux accélérer'; }
    else if(bien) { pctT2ref = pctT1 + 5; conseil = 'Bien → légère hausse possible'; }
    else if(dur)  { pctT2ref = pctT1 - 5; conseil = 'Dur → réduis un peu'; }
    else          { pctT2ref = pctT1;      conseil = 'Choisis ton rythme'; }

    // Mettre à jour le header du tour2
    const header = document.querySelector(`#body-tour2-${i} .tour-header`);
    if(header && conseil) header.innerHTML = `Après ton 1er tour (${pctT1}% VMA) — <span style="color:#fbbf24">${conseil}</span>`;

    cardState[i].pctT2ref = pctT2ref;

    renderChoixGrid(i, 'tour2', [
        { key:'plus-lent', emoji:'🐌', label:'Réduire',   pct: pctT2ref - 5 },
        { key:'meme',      emoji:'⚖️', label:'Maintenir', pct: pctT2ref, highlight: true },
        { key:'plus-vite', emoji:'⚡', label:'Accélérer', pct: pctT2ref + 5 },
    ], vma);
}

// Mise à jour intelligente de T3 après ressenti T2
function updateTour3Btns(i) {
    const state = cardState[i];
    if(!state?.student) return;
    const vma = parseFloat(state.student.vma) || null;
    const pctT2 = getChoixPct(i, 'tour2') || state.pctT2ref || state.pctConseil || 100;

    const facile = document.getElementById(`ressenti2-facile-${i}`)?.checked;
    const bien   = document.getElementById(`ressenti2-bien-${i}`)?.checked;
    const fatigue= document.getElementById(`ressenti2-fatigue-${i}`)?.checked;

    let pctT3ref = pctT2;
    let conseil = '';
    if(facile) { pctT3ref = pctT2 + 10; conseil = 'Encore facile → sprint final !'; }
    else if(bien) { pctT3ref = pctT2 + 5; conseil = 'Bien → maintiens ou sprint léger'; }
    else if(fatigue) { pctT3ref = pctT2 - 5; conseil = 'Tu fatigues → tiens le rythme'; }
    else { pctT3ref = pctT2; conseil = 'Choisis ton projet final'; }

    const header = document.querySelector(`#body-tour3-${i} .tour-header`);
    if(header && conseil) header.innerHTML = `Dernier 400m — <span style="color:#fbbf24">${conseil}</span>`;

    renderChoixGrid(i, 'tour3', [
        { key:'tenir',     emoji:'🛡️', label:'Tenir',     pct: pctT3ref - 5 },
        { key:'maintenir', emoji:'⚖️', label:'Maintenir', pct: pctT3ref, highlight: true },
        { key:'sprint',    emoji:'🚀', label:'Sprint',    pct: pctT3ref + 10 },
    ], vma);
}

function getChoixPct(i, tour) {
    const choix = cardState[i]?.choix?.[tour];
    if(!choix) return null;
    const btn = document.getElementById(`btn-${tour}-${choix}-${i}`);
    if(!btn) return null;
    // Lire le % depuis le texte du span vma-hint
    const hint = btn.querySelector('.vma-hint');
    if(!hint) return null;
    const m = hint.textContent.match(/(\d+)%/);
    return m ? parseInt(m[1]) : null;
}


function selectStudent(i, studentId) {
    const student = ELEVES.find(s => s.id === studentId);
    
    if(student) {
        cardState[i] = { student: student };
        
        const info = document.getElementById(`info-${i}`);
        info.style.display = 'block';
        const vmaInfo = student.vma ? ` | VMA: <strong style="color:var(--success)">${student.vma} km/h</strong>` : '';
        info.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
            ${student.photo ? `<img src="${student.photo}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.3);flex-shrink:0">` : `<span style="font-size:1.3rem">${student.sexe==='F'?'👧':'🧑'}</span>`}
            <div><strong>${student.nomPrenom}</strong><span style="font-size:0.82rem;opacity:0.7"> | ${student.age} ans${vmaInfo}</span></div>
        </div>`;
        
        generateHistorique(i, student);
        buildChoixBtns(i, student);
        
        // Désactiver tour2 et tour3 par défaut
        document.getElementById(`tour2-container-${i}`).classList.add('disabled');
        document.getElementById(`tour3-container-${i}`).classList.add('disabled');
    } else {
        cardState[i] = {};
        document.getElementById(`info-${i}`).style.display = 'none';
        document.getElementById(`historique-data-${i}`).innerHTML = '';
    }
}

function selectChoix(i, tour, choix) {
    // Retirer sélection précédente dans la grille
    const grid = document.getElementById(`choix-grid-${tour}-${i}`);
    if(grid) grid.querySelectorAll('.choix-btn').forEach(btn => btn.classList.remove('selected'));
    // Ajouter nouvelle sélection sur le bon bouton
    const btn = document.getElementById(`btn-${tour}-${choix}-${i}`);
    if(btn) btn.classList.add('selected');
    
    // Stocker le choix
    if(!cardState[i].choix) cardState[i].choix = {};
    cardState[i].choix[tour] = choix;
}

function checkTour2(i) {
    const input = document.getElementById(`temps1-${i}`);
    const temps = input.value.trim();
    
    if(temps) {
        const validation = convertTempsAvecValidation(temps, input);

function checkTour3(i) {
    const input = document.getElementById(`temps2-${i}`);
    const temps = input.value.trim();
    
    if(temps) {
        const validation = convertTempsAvecValidation(temps, input);
        if(validation.valide) {
            document.getElementById(`tour3-container-${i}`).classList.remove('disabled');
            updateTour3Btns(i);
        }
    }
}

// Fonction validation temps avec alertes intelligentes
function convertTempsAvecValidation(tempsStr, inputElement = null) {
    if(!tempsStr || tempsStr.trim() === '') return { valide: false, secondes: 0 };
    
    const input = tempsStr.trim();
    
    // Format standard M:SS ou MM:SS
    const matchStandard = input.match(/^(\d+):(\d+)$/);
    if(matchStandard) {
        const min = parseInt(matchStandard[1]);
        const sec = parseInt(matchStandard[2]);
        
        if(sec >= 60) {
            alert(`❌ Erreur : ${sec} secondes impossible !\n\n✅ Les secondes vont de 0 à 59\nExemple : 2:30 pour 2min30s`);
            if(inputElement) inputElement.focus();
            return { valide: false, secondes: 0 };
        }
        
        const total = min * 60 + sec;
        return { valide: true, secondes: total };
    }
    
    // Format avec dixièmes M:SS.D
    const matchDixiemes = input.match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        
        if(sec >= 60) {
            alert(`❌ Erreur : ${sec} secondes impossible !\n\nFormat attendu : M:SS (ex: 2:30)`);
            if(inputElement) inputElement.focus();
            return { valide: false, secondes: 0 };
        }
        
        const total = min * 60 + sec + dixieme / 10;
        return { valide: true, secondes: total };
    }
    
    // Corrections automatiques
    const matchDecimal = input.replace(',', '.').match(/^(\d+)[.,](\d+)$/);
    if(matchDecimal) {
        const min = parseInt(matchDecimal[1]);
        const sec = parseInt(matchDecimal[2]);
        
        if(sec < 60) {
            const correction = `${min}:${sec.toString().padStart(2,'0')}`;
            if(confirm(`⚠️ Tu as écrit "${input}"\n\n✅ Tu veux dire "${correction}" ?\n\nCliquer OK pour corriger`)) {
                if(inputElement) inputElement.value = correction;
                const total = min * 60 + sec;
                return { valide: true, secondes: total };
            }
        }
        
        alert(`❌ Format incorrect : "${input}"\n\n✅ Format attendu : M:SS\nExemple : 1:25 pour 1min25s`);
        if(inputElement) inputElement.focus();
        return { valide: false, secondes: 0 };
    }
    
    // Nombre entier - probablement erreur de format
    const nombreEntier = parseInt(input);
    if(!isNaN(nombreEntier) && nombreEntier.toString() === input) {
        
        if(nombreEntier >= 60 && nombreEntier <= 300) {
            const min = Math.floor(nombreEntier / 60);
            const sec = nombreEntier % 60;
            const correction = `${min}:${sec.toString().padStart(2,'0')}`;
            
            if(confirm(`⚠️ Tu as écrit "${nombreEntier}"\n\n✅ Tu veux dire ${nombreEntier} secondes ?\nÇa fait ${correction}\n\nCliquer OK pour corriger`)) {
                if(inputElement) inputElement.value = correction;
                return { valide: true, secondes: nombreEntier };
            }
        }
        
        // Format MMSS au lieu de MM:SS (erreur courante)
        if(nombreEntier >= 100 && nombreEntier <= 999) {
            const minStr = Math.floor(nombreEntier / 100).toString();
            const secStr = (nombreEntier % 100).toString().padStart(2, '0');
            const sec = parseInt(secStr);
            
            if(sec < 60) {
                const correction = `${minStr}:${secStr}`;
                if(confirm(`⚠️ Tu as écrit "${nombreEntier}"\n\n✅ Tu veux dire "${correction}" ?\n\nCliquer OK pour corriger`)) {
                    if(inputElement) inputElement.value = correction;
                    const total = parseInt(minStr) * 60 + sec;
                    return { valide: true, secondes: total };
                }
            }
        }
        
        alert(`❌ Temps impossible : "${input}"\n\n✅ Format attendu : M:SS\nExemples :\n• 1:25 pour 1min25s\n• 2:00 pour 2min00s`);
        if(inputElement) inputElement.focus();
        return { valide: false, secondes: 0 };
    }
    
    alert(`❌ Format non reconnu : "${input}"\n\n✅ Formats acceptés :\n• 1:25 (1min25s)\n• 2:00 (2min00s)\n• 1:30.5 (avec dixièmes)\n\n📝 Exemple : Pour 1min25s, écris 1:25`);
    if(inputElement) inputElement.focus();
    return { valide: false, secondes: 0 };
}

function toggleSection(sec, i) {
    const body = document.getElementById(`body-${sec}-${i}`);
    const arr = document.getElementById(`arr-${sec}-${i}`);
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    arr.classList.toggle('open', !isOpen);
}

function saveAll(silent=false) {
    let count = 0;
    let erreurs = [];
    let allStudents = JSON.parse(localStorage.getItem('eps_pro_students') || '[]');

    cardState.forEach((d, i) => {
        if(!d.student) return;

        const temps1Input = document.getElementById(`temps1-${i}`);
        const temps2Input = document.getElementById(`temps2-${i}`);
        const temps3Input = document.getElementById(`temps3-${i}`);
        
        // Validation des temps avant sauvegarde
        let temps1 = null, temps2 = null, temps3 = null;
        
        if(temps1Input?.value) {
            const validation1 = convertTempsAvecValidation(temps1Input.value, temps1Input);
            if(validation1.valide) {
                temps1 = temps1Input.value;
            } else {
                erreurs.push(`${d.student.nomPrenom} - Temps 1 incorrect`);
                return;
            }
        }
        
        if(temps2Input?.value) {
            const validation2 = convertTempsAvecValidation(temps2Input.value, temps2Input);
            if(validation2.valide) {
                temps2 = temps2Input.value;
            } else {
                erreurs.push(`${d.student.nomPrenom} - Temps 2 incorrect`);
                return;
            }
        }
        
        if(temps3Input?.value) {
            const validation3 = convertTempsAvecValidation(temps3Input.value, temps3Input);
            if(validation3.valide) {
                temps3 = temps3Input.value;
            } else {
                erreurs.push(`${d.student.nomPrenom} - Temps 3 incorrect`);
                return;
            }
        }

        const idx = allStudents.findIndex(s => s.id === d.student.id);
        if(idx === -1) return;

        if(!allStudents[idx].seances) allStudents[idx].seances = [];

        // ── Sécurité multi-sessions ──────────────────────────────────────────
        // Chercher une session L7 existante NON horodatée (ancienne) ou la session active
        const sessionsExistantes = allStudents[idx].seances
            .map((s, idx) => ({...s, _idx: idx}))
            .filter(s => s.lecon === 'L7');

        let seanceIdx = -1;

        if(!silent && sessionsExistantes.length > 0) {
            const lastDate = sessionsExistantes[sessionsExistantes.length-1].date
                ? new Date(sessionsExistantes[sessionsExistantes.length-1].date).toLocaleDateString('fr-FR')
                : 'date inconnue';
            const choix = window.confirm(
                `⚠️ ${d.student.nomPrenom} a déjà une séance L7 (${lastDate}).\n\n` +
                `OK → Nouvelle session (conserve l'ancienne)\n` +
                `Annuler → Écraser la session existante`
            );
            if(choix) {
                // Nouvelle session horodatée
                allStudents[idx].seances.push({ lecon: 'L7', date: new Date().toISOString() });
                seanceIdx = allStudents[idx].seances.length - 1;
            } else {
                // Écraser la dernière session L7
                seanceIdx = sessionsExistantes[sessionsExistantes.length-1]._idx;
            }
        } else {
            // Autosave : toujours mettre à jour la dernière session ou en créer une
            if(sessionsExistantes.length > 0) {
                seanceIdx = sessionsExistantes[sessionsExistantes.length-1]._idx;
            } else {
                allStudents[idx].seances.push({ lecon: 'L7', date: new Date().toISOString() });
                seanceIdx = allStudents[idx].seances.length - 1;
            }
        }

        allStudents[idx].seances[seanceIdx] = {
            ...allStudents[idx].seances[seanceIdx],
            type: 'mise_en_situation_adaptative',
            temps1, temps2, temps3,
            choixTour1: d.choix?.tour1 || null,
            choixTour2: d.choix?.tour2 || null,
            choixTour3: d.choix?.tour3 || null,
            ressenti1Facile: document.getElementById(`ressenti1-facile-${i}`)?.checked || false,
            ressenti1Bien: document.getElementById(`ressenti1-bien-${i}`)?.checked || false,
            ressenti1Dur: document.getElementById(`ressenti1-dur-${i}`)?.checked || false,
            ressenti2Facile: document.getElementById(`ressenti2-facile-${i}`)?.checked || false,
            ressenti2Bien: document.getElementById(`ressenti2-bien-${i}`)?.checked || false,
            ressenti2Fatigue: document.getElementById(`ressenti2-fatigue-${i}`)?.checked || false,
            projetReussi: document.getElementById(`projet-reussi-${i}`)?.checked || false,
            confiantL8: document.getElementById(`confiant-l8-${i}`)?.checked || false,
            strategieTrouvee: document.getElementById(`strategie-trouvee-${i}`)?.checked || false,
            // Travail autonome saut
            sautCourseElan: document.getElementById(`saut-course-elan-${i}`)?.checked || false,
            sautPrecision: document.getElementById(`saut-precision-${i}`)?.checked || false,
            sautReception: document.getElementById(`saut-reception-${i}`)?.checked || false,
            sautDistance: document.getElementById(`saut-distance-${i}`)?.checked || false,
            // Travail autonome lancer
            lancerCoordination: document.getElementById(`lancer-coordination-${i}`)?.checked || false,
            lancerTransfert: document.getElementById(`lancer-transfert-${i}`)?.checked || false,
            lancerAccompagnement: document.getElementById(`lancer-accompagnement-${i}`)?.checked || false,
            lancerRegularite: document.getElementById(`lancer-regularite-${i}`)?.checked || false,
            date: new Date().toISOString()
        };

        count++;
    });

    if(erreurs.length > 0) {
        alert(`⚠️ Erreurs de saisie :\n\n${erreurs.join('\n')}\n\nCorrige les temps avant de sauvegarder !`);
        return;
    }

    if(count === 0) { 
        alert('⚠️ Aucun élève sélectionné !'); 
        return; 
    }

    localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
    alert(`🎯 L7 sauvegardée pour ${count} élève(s) !\n\n✅ Tous les temps sont au bon format !`);
}
// Sauvegarde automatique uniquement à la fermeture/quitter la page
window.addEventListener('beforeunload', function() {
    if(typeof saveAll === 'function') saveAll(true);
});
