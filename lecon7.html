<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L7 - Mise en Situation Adaptative - EPS: épreuve Combinée</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --accent: #ff6b35;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
            --purple: #8b5cf6;
            --gold: #f59e0b;
            --orange: #ff8800;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: linear-gradient(135deg, var(--bg) 0%, #2d1810 100%);
            color: white; 
            padding: 16px;
            padding-bottom: calc(200px + env(safe-area-inset-bottom, 20px));
            min-height: 100vh;
        }
        
        h1 { 
            text-align: center; 
            font-size: 2rem; 
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle { 
            text-align: center; 
            color: var(--accent); 
            font-size: 1.1rem; 
            font-weight: 600; 
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .grid6 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (max-width: 900px) { .grid6 { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 600px) { .grid6 { grid-template-columns: 1fr; } }

        .card {
            background: var(--card);
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--accent), var(--orange));
            color: white;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-body { 
            padding: 16px; 
        }
        
        .student-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: rgba(255,107,53,0.05);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .section {
            margin-bottom: 16px;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255,255,255,0.02);
        }
        
        .section-header {
            background: rgba(255,107,53,0.15);
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        
        .arrow {
            transition: transform 0.3s ease;
            font-size: 0.8rem;
        }
        
        .arrow.open {
            transform: rotate(180deg);
        }
        
        .section-body {
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        
        .section-body.open {
            padding: 12px;
            max-height: 800px;
        }
        
        .historique-box {
            background: rgba(255,107,53,0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        
        .tour-container {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
        }
        
        .tour-header {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
            font-size: 1rem;
        }
        
        .choix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin: 12px 0;
        }
        
        .choix-btn {
            padding: 12px 8px;
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            border-radius: 8px;
            color: white;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .choix-btn:hover {
            border-color: var(--accent);
            background: rgba(255,107,53,0.2);
        }
        
        .choix-btn.selected {
            border-color: var(--success);
            background: rgba(75,222,128,0.2);
            color: var(--success);
        }
        
        .temps-saisie {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0;
            width: 100%;
            box-sizing: border-box;
        }
        
        .temps-input {
            flex: 1;
            min-width: 0;
            max-width: 140px;
            padding: 10px 8px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-align: center;
            font-family: 'SF Mono', Monaco, monospace;
            font-weight: 600;
            font-size: 1.1rem;
            box-sizing: border-box;
        }
        
        .temps-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .ressenti-box {
            background: rgba(75,222,128,0.1);
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
        }
        
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0;
            font-size: 0.85rem;
        }
        
        .checkbox-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--success);
        }
        
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .save-btn {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            right: 20px;
            z-index: 100;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--success), var(--accent));
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

<a href="index.html" class="btn-back">← Retour</a>

<h1>EPS: épreuve Combinée</h1>
<p class="subtitle">🎯 L7 - MISE EN SITUATION ADAPTATIVE</p>

<div class="grid6" id="grid"></div>

<button class="save-btn" onclick="saveAll()">💾 Sauvegarder</button>

<script>
let ELEVES = [];
const cardState = [{},{},{},{},{},{}];

window.onload = function() {
    const stored = localStorage.getItem('eps_pro_students');
    if(!stored) {
        alert('⚠️ Aucun élève trouvé.');
        window.location.href = 'index.html';
        return;
    }
    ELEVES = JSON.parse(stored);

    const grid = document.getElementById('grid');
    for(let i = 0; i < 6; i++) {
        grid.appendChild(createCard(i));
    }
};

function createCard(i) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
        <div class="card-header">
            <span>🎯 ÉLÈVE ${i+1}</span>
        </div>
        <div class="card-body">
            <select onchange="selectStudent(${i}, this.value)" style="width:100%; padding:8px; background:var(--card); color:white; border:1px solid rgba(255,255,255,0.3); border-radius:6px; margin-bottom:12px;">
                <option value="">Sélectionner un élève</option>
                ${ELEVES.map(eleve => `<option value="${eleve.id}">${eleve.nomPrenom}</option>`).join('')}
            </select>
            
            <div id="info-${i}" class="student-info" style="display:none;"></div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection('historique', ${i})">
                    <span>📊 TON HISTORIQUE</span><span class="arrow" id="arr-historique-${i}">▼</span>
                </div>
                <div class="section-body" id="body-historique-${i}">
                    <div id="historique-data-${i}">
                        <!-- Généré selon historique L3/L4/L5/L6 -->
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection('tour1', ${i})">
                    <span>🏃‍♂️ 400M #1 - TON CHOIX</span><span class="arrow" id="arr-tour1-${i}">▼</span>
                </div>
                <div class="section-body" id="body-tour1-${i}">
                    <div class="tour-container">
                        <div class="tour-header">Comment veux-tu aborder ce 1er 400m ?</div>
                        <div class="choix-grid">
                            <div class="choix-btn" onclick="selectChoix(${i}, 'tour1', 'prudent')">
                                🐌<br>Prudent<br><small>En sécurité</small>
                            </div>
                            <div class="choix-btn" onclick="selectChoix(${i}, 'tour1', 'regulier')">
                                ⚖️<br>Régulier<br><small>Comme L3/L4</small>
                            </div>
                            <div class="choix-btn" onclick="selectChoix(${i}, 'tour1', 'ambitieux')">
                                ⚡<br>Ambitieux<br><small>Je me lance</small>
                            </div>
                        </div>
                        <div class="temps-saisie">
                            <label style="min-width: 60px;">Temps :</label>
                            <input type="text" class="temps-input" id="temps1-${i}" placeholder="1:25" onchange="checkTour2(${i})" inputmode="decimal">
                        </div>
                        <div class="ressenti-box">
                            <div style="font-weight: 700; margin-bottom: 8px;">Comment ça s'est passé ?</div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="ressenti1-facile-${i}">
                                <label>😊 C'était facile</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="ressenti1-bien-${i}">
                                <label>👍 C'était bien</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="ressenti1-dur-${i}">
                                <label>😮‍💨 C'était dur</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection('tour2', ${i})">
                    <span>🏃‍♂️ 400M #2 - ADAPTATION</span><span class="arrow" id="arr-tour2-${i}">▼</span>
                </div>
                <div class="section-body" id="body-tour2-${i}">
                    <div class="tour-container disabled" id="tour2-container-${i}">
                        <div class="tour-header">Après ton 1er tour, que veux-tu faire ?</div>
                        <div class="choix-grid">
                            <div class="choix-btn" onclick="selectChoix(${i}, 'tour2', 'plus-lent')">
                                🐌<br>Plus lent<br><small>Je me calme</small>
                            </div>
                            <div class="choix-btn" onclick="selectChoix(${i}, 'tour2', 'meme')">
                                ⚖️<br>Même rythme<br><small>Ça me va</small>
                            </div>
                            <div class="choix-btn" onclick="selectChoix(${i}, 'tour2', 'plus-vite')">
                                ⚡<br>Plus vite<br><small>J'accélère</small>
                            </div>
                        </div>
                        <div class="temps-saisie">
                            <label style="min-width: 60px;">Temps :</label>
                            <input type="text" class="temps-input" id="temps2-${i}" placeholder="1:25" onchange="checkTour3(${i})" inputmode="decimal">
                        </div>
                        <div class="ressenti-box">
                            <div style="font-weight: 700; margin-bottom: 8px;">Comment ça s'est passé ?</div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="ressenti2-facile-${i}">
                                <label>😊 Encore facile</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="ressenti2-bien-${i}">
                                <label>👍 Toujours bien</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="ressenti2-fatigue-${i}">
                                <label>😮‍💨 Je commence à fatiguer</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-header" onclick="toggleSection('tour3', ${i})">
                    <span>🏃‍♂️ 400M #3 - TON PROJET</span><span class="arrow" id="arr-tour3-${i}">▼</span>
                </div>
                <div class="section-body" id="body-tour3-${i}">
                    <div class="tour-container disabled" id="tour3-container-${i}">
                        <div class="tour-header">Pour ce dernier tour, quel est TON projet ?</div>
                        <div class="choix-grid">
                            <div class="choix-btn" onclick="selectChoix(${i}, 'tour3', 'tenir')">
                                🛡️<br>Tenir<br><small>Finir proprement</small>
                            </div>
                            <div class="choix-btn" onclick="selectChoix(${i}, 'tour3', 'maintenir')">
                                ⚖️<br>Maintenir<br><small>Même allure</small>
                            </div>
                            <div class="choix-btn" onclick="selectChoix(${i}, 'tour3', 'sprint')">
                                🚀<br>Sprint<br><small>Tout donner</small>
                            </div>
                        </div>
                        <div class="temps-saisie">
                            <label style="min-width: 60px;">Temps :</label>
                            <input type="text" class="temps-input" id="temps3-${i}" placeholder="1:25" inputmode="decimal">
                        </div>
                        <div class="ressenti-box">
                            <div style="font-weight: 700; margin-bottom: 8px;">Ressenti final :</div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="projet-reussi-${i}">
                                <label>✅ Mon projet était réussi</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="confiant-l8-${i}">
                                <label>💪 Je suis confiant pour L8</label>
                            </div>
                            <div class="checkbox-row">
                                <input type="checkbox" id="strategie-trouvee-${i}">
                                <label>🎯 J'ai trouvé ma stratégie</label>
                            </div>
                        </div>
                        
                        <div class="ressenti-box">
                            <div style="font-weight: 700; margin-bottom: 8px;">Travail autonome saut/lancer (15min chacun) :</div>
                            
                            <div style="margin-bottom: 12px;">
                                <div style="font-weight: 600; color: var(--warning); margin-bottom: 6px;">🦘 SAUT - J'ai travaillé sur :</div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="saut-course-elan-${i}">
                                    <label>Course d'élan régulière</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="saut-precision-${i}">
                                    <label>Précision de l'appel</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="saut-reception-${i}">
                                    <label>Amélioration réception</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="saut-distance-${i}">
                                    <label>Recherche distance max</label>
                                </div>
                            </div>
                            
                            <div>
                                <div style="font-weight: 600; color: var(--warning); margin-bottom: 6px;">🎯 LANCER - J'ai travaillé sur :</div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="lancer-coordination-${i}">
                                    <label>Coordination globale</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="lancer-transfert-${i}">
                                    <label>Transfert de poids</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="lancer-accompagnement-${i}">
                                    <label>Accompagnement du geste</label>
                                </div>
                                <div class="checkbox-row">
                                    <input type="checkbox" id="lancer-regularite-${i}">
                                    <label>Régularité des lancers</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
    return card;
}

function selectStudent(i, studentId) {
    const student = ELEVES.find(s => s.id === studentId);
    
    if(student) {
        cardState[i] = { student: student };
        
        const info = document.getElementById(`info-${i}`);
        info.style.display = 'block';
        const vmaInfo = student.vma ? ` | VMA: <strong style="color:var(--success)">${student.vma} km/h</strong>` : '';
        info.innerHTML = `<strong>${student.sexe==='F'?'👧':'🧑'} ${student.sexe==='F'?'Fille':'Garçon'}</strong> | ${student.age} ans${vmaInfo}`;
        
        generateHistorique(i, student);
        
        // Désactiver tour2 et tour3 par défaut
        document.getElementById(`tour2-container-${i}`).classList.add('disabled');
        document.getElementById(`tour3-container-${i}`).classList.add('disabled');
    } else {
        cardState[i] = {};
        document.getElementById(`info-${i}`).style.display = 'none';
        document.getElementById(`historique-data-${i}`).innerHTML = '';
    }
}

function generateHistorique(i, student) {
    const container = document.getElementById(`historique-data-${i}`);
    let html = '<div class="historique-box">';
    
    // Analyser L3/L4 avec conversion 400m
    const seanceL3 = student.seances?.find(s => s.lecon === 'L3');
    const seanceL4 = student.seances?.find(s => s.lecon === 'L4');
    
    if(seanceL3 && seanceL3.moyenne200m && student.vma) {
        const moyenne200 = parseFloat(seanceL3.moyenne200m);
        const vma = parseFloat(student.vma);
        
        // Calcul % VMA sur 200m
        const vitesse200 = 200 / moyenne200; // m/s
        const vitesseVMA = vma / 3.6; // m/s
        const pourcentageVMA = Math.round((vitesse200 / vitesseVMA) * 100);
        
        // Estimation 400m (dégradation ~8-12% selon profil)
        const estimation400 = moyenne200 * 2.1; // Facteur empirique
        const minutes = Math.floor(estimation400 / 60);
        const secondes = Math.floor(estimation400 % 60);
        const dixiemes = Math.round((estimation400 % 1) * 10);
        const temps400Str = `${minutes}:${secondes.toString().padStart(2, '0')}.${dixiemes}`;
        
        html += `
            <div><strong>📊 Tes 200m L3/L4 :</strong> ${moyenne200.toFixed(1)}" (${pourcentageVMA}% VMA)</div>
            <div><strong>🎯 Estimation 400m :</strong> ${temps400Str} si tu cours au même %VMA</div>
        `;
        
        // Propositions avec %VMA
        html += `
            <div style="margin-top: 8px; font-size: 0.85rem; color: var(--gold);">
                <strong>💡 Choix possibles 1er 400m :</strong><br>
                • <strong>Prudent</strong> : ${pourcentageVMA - 10}% VMA (plus facile)<br>
                • <strong>Régulier</strong> : ${pourcentageVMA}% VMA (comme L3/L4)<br>  
                • <strong>Ambitieux</strong> : ${pourcentageVMA + 10}% VMA (plus dur)
            </div>
        `;
    } else if(seanceL3 && seanceL3.moyenne200m) {
        html += `<div>📊 <strong>Tes 200m L3/L4 :</strong> ${parseFloat(seanceL3.moyenne200m).toFixed(1)}" (VMA non renseignée)</div>`;
    }
    
    // Analyser L5
    const seanceL5 = student.seances?.find(s => s.lecon === 'L5');
    if(seanceL5 && seanceL5.distanceMoyenneIndividuelle) {
        html += `<div>🏅 <strong>Relais L5 :</strong> ${seanceL5.distanceMoyenneIndividuelle}m par manche (travail en équipe)</div>`;
    }
    
    // Analyser L6
    const seanceL6 = student.seances?.find(s => s.lecon === 'L6');
    if(seanceL6) {
        const pyramideText = seanceL6.pyramideReussie ? 
            'Pyramide réussie ✅ (tu gères les efforts intenses)' : 
            `Pyramide échouée ❌ sur ${seanceL6.pyramideEchec || 'une distance'} (normal, c'est très intense)`;
        html += `<div>⚡ <strong>Perfectionnement L6 :</strong> ${pyramideText}</div>`;
    }
    
    html += '<div style="margin-top: 12px; font-style: italic; color: var(--warning);">';
    html += '💡 <strong>À toi de choisir :</strong> Avec ces informations, comment veux-tu aborder tes 3×400m ?';
    html += '</div>';
    
    html += '</div>';
    container.innerHTML = html;
}

function selectChoix(i, tour, choix) {
    // Retirer sélection précédente
    document.querySelectorAll(`#body-${tour}-${i} .choix-btn`).forEach(btn => btn.classList.remove('selected'));
    // Ajouter nouvelle sélection
    event.target.classList.add('selected');
    
    // Stocker le choix
    if(!cardState[i].choix) cardState[i].choix = {};
    cardState[i].choix[tour] = choix;
}

function checkTour2(i) {
    const input = document.getElementById(`temps1-${i}`);
    const temps = input.value.trim();
    
    if(temps) {
        const validation = convertTempsAvecValidation(temps, input);
        if(validation.valide) {
            document.getElementById(`tour2-container-${i}`).classList.remove('disabled');
        }
    }
}

function checkTour3(i) {
    const input = document.getElementById(`temps2-${i}`);
    const temps = input.value.trim();
    
    if(temps) {
        const validation = convertTempsAvecValidation(temps, input);
        if(validation.valide) {
            document.getElementById(`tour3-container-${i}`).classList.remove('disabled');
        }
    }
}

// Fonction validation temps avec alertes intelligentes
function convertTempsAvecValidation(tempsStr, inputElement = null) {
    if(!tempsStr || tempsStr.trim() === '') return { valide: false, secondes: 0 };
    
    const input = tempsStr.trim();
    
    // Format standard M:SS ou MM:SS
    const matchStandard = input.match(/^(\d+):(\d+)$/);
    if(matchStandard) {
        const min = parseInt(matchStandard[1]);
        const sec = parseInt(matchStandard[2]);
        
        if(sec >= 60) {
            alert(`❌ Erreur : ${sec} secondes impossible !\n\n✅ Les secondes vont de 0 à 59\nExemple : 2:30 pour 2min30s`);
            if(inputElement) inputElement.focus();
            return { valide: false, secondes: 0 };
        }
        
        const total = min * 60 + sec;
        return { valide: true, secondes: total };
    }
    
    // Format avec dixièmes M:SS.D
    const matchDixiemes = input.match(/^(\d+):(\d+)\.(\d+)$/);
    if(matchDixiemes) {
        const min = parseInt(matchDixiemes[1]);
        const sec = parseInt(matchDixiemes[2]);
        const dixieme = parseInt(matchDixiemes[3]);
        
        if(sec >= 60) {
            alert(`❌ Erreur : ${sec} secondes impossible !\n\nFormat attendu : M:SS (ex: 2:30)`);
            if(inputElement) inputElement.focus();
            return { valide: false, secondes: 0 };
        }
        
        const total = min * 60 + sec + dixieme / 10;
        return { valide: true, secondes: total };
    }
    
    // Corrections automatiques
    const matchDecimal = input.replace(',', '.').match(/^(\d+)[.,](\d+)$/);
    if(matchDecimal) {
        const min = parseInt(matchDecimal[1]);
        const sec = parseInt(matchDecimal[2]);
        
        if(sec < 60) {
            const correction = `${min}:${sec.toString().padStart(2,'0')}`;
            if(confirm(`⚠️ Tu as écrit "${input}"\n\n✅ Tu veux dire "${correction}" ?\n\nCliquer OK pour corriger`)) {
                if(inputElement) inputElement.value = correction;
                const total = min * 60 + sec;
                return { valide: true, secondes: total };
            }
        }
        
        alert(`❌ Format incorrect : "${input}"\n\n✅ Format attendu : M:SS\nExemple : 1:25 pour 1min25s`);
        if(inputElement) inputElement.focus();
        return { valide: false, secondes: 0 };
    }
    
    // Nombre entier - probablement erreur de format
    const nombreEntier = parseInt(input);
    if(!isNaN(nombreEntier) && nombreEntier.toString() === input) {
        
        if(nombreEntier >= 60 && nombreEntier <= 300) {
            const min = Math.floor(nombreEntier / 60);
            const sec = nombreEntier % 60;
            const correction = `${min}:${sec.toString().padStart(2,'0')}`;
            
            if(confirm(`⚠️ Tu as écrit "${nombreEntier}"\n\n✅ Tu veux dire ${nombreEntier} secondes ?\nÇa fait ${correction}\n\nCliquer OK pour corriger`)) {
                if(inputElement) inputElement.value = correction;
                return { valide: true, secondes: nombreEntier };
            }
        }
        
        // Format MMSS au lieu de MM:SS (erreur courante)
        if(nombreEntier >= 100 && nombreEntier <= 999) {
            const minStr = Math.floor(nombreEntier / 100).toString();
            const secStr = (nombreEntier % 100).toString().padStart(2, '0');
            const sec = parseInt(secStr);
            
            if(sec < 60) {
                const correction = `${minStr}:${secStr}`;
                if(confirm(`⚠️ Tu as écrit "${nombreEntier}"\n\n✅ Tu veux dire "${correction}" ?\n\nCliquer OK pour corriger`)) {
                    if(inputElement) inputElement.value = correction;
                    const total = parseInt(minStr) * 60 + sec;
                    return { valide: true, secondes: total };
                }
            }
        }
        
        alert(`❌ Temps impossible : "${input}"\n\n✅ Format attendu : M:SS\nExemples :\n• 1:25 pour 1min25s\n• 2:00 pour 2min00s`);
        if(inputElement) inputElement.focus();
        return { valide: false, secondes: 0 };
    }
    
    alert(`❌ Format non reconnu : "${input}"\n\n✅ Formats acceptés :\n• 1:25 (1min25s)\n• 2:00 (2min00s)\n• 1:30.5 (avec dixièmes)\n\n📝 Exemple : Pour 1min25s, écris 1:25`);
    if(inputElement) inputElement.focus();
    return { valide: false, secondes: 0 };
}

function toggleSection(sec, i) {
    const body = document.getElementById(`body-${sec}-${i}`);
    const arr = document.getElementById(`arr-${sec}-${i}`);
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    arr.classList.toggle('open', !isOpen);
}

function saveAll(silent=false) {
    let count = 0;
    let erreurs = [];
    let allStudents = JSON.parse(localStorage.getItem('eps_pro_students') || '[]');

    cardState.forEach((d, i) => {
        if(!d.student) return;

        const temps1Input = document.getElementById(`temps1-${i}`);
        const temps2Input = document.getElementById(`temps2-${i}`);
        const temps3Input = document.getElementById(`temps3-${i}`);
        
        // Validation des temps avant sauvegarde
        let temps1 = null, temps2 = null, temps3 = null;
        
        if(temps1Input?.value) {
            const validation1 = convertTempsAvecValidation(temps1Input.value, temps1Input);
            if(validation1.valide) {
                temps1 = temps1Input.value;
            } else {
                erreurs.push(`${d.student.nomPrenom} - Temps 1 incorrect`);
                return;
            }
        }
        
        if(temps2Input?.value) {
            const validation2 = convertTempsAvecValidation(temps2Input.value, temps2Input);
            if(validation2.valide) {
                temps2 = temps2Input.value;
            } else {
                erreurs.push(`${d.student.nomPrenom} - Temps 2 incorrect`);
                return;
            }
        }
        
        if(temps3Input?.value) {
            const validation3 = convertTempsAvecValidation(temps3Input.value, temps3Input);
            if(validation3.valide) {
                temps3 = temps3Input.value;
            } else {
                erreurs.push(`${d.student.nomPrenom} - Temps 3 incorrect`);
                return;
            }
        }

        const idx = allStudents.findIndex(s => s.id === d.student.id);
        if(idx === -1) return;

        if(!allStudents[idx].seances) allStudents[idx].seances = [];

        // ── Sécurité multi-sessions ──────────────────────────────────────────
        // Chercher une session L7 existante NON horodatée (ancienne) ou la session active
        const sessionsExistantes = allStudents[idx].seances
            .map((s, idx) => ({...s, _idx: idx}))
            .filter(s => s.lecon === 'L7');

        let seanceIdx = -1;

        if(!silent && sessionsExistantes.length > 0) {
            const lastDate = sessionsExistantes[sessionsExistantes.length-1].date
                ? new Date(sessionsExistantes[sessionsExistantes.length-1].date).toLocaleDateString('fr-FR')
                : 'date inconnue';
            const choix = window.confirm(
                `⚠️ ${d.student.nomPrenom} a déjà une séance L7 (${lastDate}).\n\n` +
                `OK → Nouvelle session (conserve l'ancienne)\n` +
                `Annuler → Écraser la session existante`
            );
            if(choix) {
                // Nouvelle session horodatée
                allStudents[idx].seances.push({ lecon: 'L7', date: new Date().toISOString() });
                seanceIdx = allStudents[idx].seances.length - 1;
            } else {
                // Écraser la dernière session L7
                seanceIdx = sessionsExistantes[sessionsExistantes.length-1]._idx;
            }
        } else {
            // Autosave : toujours mettre à jour la dernière session ou en créer une
            if(sessionsExistantes.length > 0) {
                seanceIdx = sessionsExistantes[sessionsExistantes.length-1]._idx;
            } else {
                allStudents[idx].seances.push({ lecon: 'L7', date: new Date().toISOString() });
                seanceIdx = allStudents[idx].seances.length - 1;
            }
        }

        allStudents[idx].seances[seanceIdx] = {
            ...allStudents[idx].seances[seanceIdx],
            type: 'mise_en_situation_adaptative',
            temps1, temps2, temps3,
            choixTour1: d.choix?.tour1 || null,
            choixTour2: d.choix?.tour2 || null,
            choixTour3: d.choix?.tour3 || null,
            ressenti1Facile: document.getElementById(`ressenti1-facile-${i}`)?.checked || false,
            ressenti1Bien: document.getElementById(`ressenti1-bien-${i}`)?.checked || false,
            ressenti1Dur: document.getElementById(`ressenti1-dur-${i}`)?.checked || false,
            ressenti2Facile: document.getElementById(`ressenti2-facile-${i}`)?.checked || false,
            ressenti2Bien: document.getElementById(`ressenti2-bien-${i}`)?.checked || false,
            ressenti2Fatigue: document.getElementById(`ressenti2-fatigue-${i}`)?.checked || false,
            projetReussi: document.getElementById(`projet-reussi-${i}`)?.checked || false,
            confiantL8: document.getElementById(`confiant-l8-${i}`)?.checked || false,
            strategieTrouvee: document.getElementById(`strategie-trouvee-${i}`)?.checked || false,
            // Travail autonome saut
            sautCourseElan: document.getElementById(`saut-course-elan-${i}`)?.checked || false,
            sautPrecision: document.getElementById(`saut-precision-${i}`)?.checked || false,
            sautReception: document.getElementById(`saut-reception-${i}`)?.checked || false,
            sautDistance: document.getElementById(`saut-distance-${i}`)?.checked || false,
            // Travail autonome lancer
            lancerCoordination: document.getElementById(`lancer-coordination-${i}`)?.checked || false,
            lancerTransfert: document.getElementById(`lancer-transfert-${i}`)?.checked || false,
            lancerAccompagnement: document.getElementById(`lancer-accompagnement-${i}`)?.checked || false,
            lancerRegularite: document.getElementById(`lancer-regularite-${i}`)?.checked || false,
            date: new Date().toISOString()
        };

        count++;
    });

    if(erreurs.length > 0) {
        alert(`⚠️ Erreurs de saisie :\n\n${erreurs.join('\n')}\n\nCorrige les temps avant de sauvegarder !`);
        return;
    }

    if(count === 0) { 
        alert('⚠️ Aucun élève sélectionné !'); 
        return; 
    }

    localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
    alert(`🎯 L7 sauvegardée pour ${count} élève(s) !\n\n✅ Tous les temps sont au bon format !`);
}
// Sauvegarde automatique uniquement à la fermeture/quitter la page
window.addEventListener('beforeunload', function() {
    if(typeof saveAll === 'function') saveAll(true);
});

</script>

<script>

(function() {
    function updateBanner() {
        var b = document.getElementById('_offline_banner');
        if (!b) {
            b = document.createElement('div');
            b.id = '_offline_banner';
            b.style.cssText = [
                'display:none','position:fixed','top:0','left:0','right:0',
                'background:#ff6b35','color:#fff','text-align:center',
                'padding:8px 12px','font-size:0.82rem','font-weight:700',
                'z-index:99999','letter-spacing:0.3px'
            ].join(';');
            b.textContent = '\u{1F4E1} Mode hors ligne — données sauvegardées localement';
            document.body.appendChild(b);
        }
        b.style.display = navigator.onLine ? 'none' : 'block';
    }
    window.addEventListener('online',  updateBanner);
    window.addEventListener('offline', updateBanner);
    window.addEventListener('load',    updateBanner);
})();
</script>
