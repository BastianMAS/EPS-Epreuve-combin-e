<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séance 2 - EPS PRO</title>
    <style>
        :root {
            --bg: #0b101d;
            --card: #1c2333;
            --accent: #00d2ff;
            --success: #00ff88;
            --warning: #ffcc00;
            --purple: #9b59b6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 10px; }
        .accent-text { color: var(--accent); }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 20px; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary { background: #666; color: white; }
        .btn-pct {
            padding: 8px 12px;
            border: 2px solid var(--accent);
            background: #0f0f23;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            margin: 2px;
        }
        .btn-pct.active { background: var(--accent); color: black; }
        .pct-selector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,210,255,0.05);
            border-radius: 12px;
        }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .student-card {
            background: var(--card);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
        }
        .student-header {
            background: linear-gradient(135deg, var(--accent), var(--success));
            color: black;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .time-input-group {
            display: flex;
            gap: 5px;
            align-items: center;
            margin: 8px 0;
        }
        .time-input-group input {
            width: 50px;
            padding: 8px;
            border-radius: 6px;
            border: 2px solid var(--accent);
            background: #0f0f23;
            color: white;
            text-align: center;
            font-size: 1rem;
        }
        .time-input-group span { font-size: 0.85rem; color: #aaa; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 2px solid var(--accent);
            background: #0f0f23;
            color: white;
            font-size: 0.9rem;
        }
        textarea { font-family: Arial; resize: vertical; min-height: 60px; }
        label {
            display: block;
            margin: 8px 0 4px 0;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent);
        }
        .results-box {
            background: rgba(0,255,136,0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--success);
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .analysis-box {
            background: rgba(255,204,0,0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--warning);
            margin: 10px 0;
            font-size: 0.85rem;
        }
        .atelier-box {
            background: rgba(155,89,182,0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--purple);
            margin: 10px 0;
        }
        .save-btn {
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: var(--success);
            color: black;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }
        @media (max-width: 900px) {
            .student-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .student-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EPS<span class="accent-text">PRO</span></h1>
        <p class="subtitle" style="color: var(--purple); font-size: 1.5rem; font-weight: 700;">
            📅 SÉANCE 2 - ENTRAÎNEMENT
        </p>
        <p class="subtitle" style="font-size: 1.1rem;">3×400m + Saut</p>
        
        <button onclick="window.location.href='index.html'" class="btn btn-secondary" style="margin-bottom: 20px;">← Retour</button>
        
        <div class="pct-selector">
            <span style="color: var(--accent); font-weight: 700; margin-right: 10px;">% VMA :</span>
            <button onclick="setGlobalPct(90)" class="btn-pct" id="btn-90">90%</button>
            <button onclick="setGlobalPct(95)" class="btn-pct" id="btn-95">95%</button>
            <button onclick="setGlobalPct(100)" class="btn-pct active" id="btn-100">100%</button>
            <button onclick="setGlobalPct(105)" class="btn-pct" id="btn-105">105%</button>
            <button onclick="setGlobalPct(110)" class="btn-pct" id="btn-110">110%</button>
            <button onclick="setGlobalPct(115)" class="btn-pct" id="btn-115">115%</button>
            <button onclick="setGlobalPct(120)" class="btn-pct" id="btn-120">120%</button>
            <button onclick="setGlobalPct(125)" class="btn-pct" id="btn-125">125%</button>
            <button onclick="setGlobalPct(130)" class="btn-pct" id="btn-130">130%</button>
        </div>
        
        <div id="student-grid" class="student-grid"></div>
        
        <button onclick="saveAll()" class="save-btn">💾 ENREGISTRER TOUTE LA SÉANCE</button>
    </div>
    
    <script>
    let students = [];
    let globalPct = 100;
    let seanceData = {};
    
    window.onload = function() {
        loadStudents();
    };
    
    function loadStudents() {
        const stored = localStorage.getItem('eps_pro_students');
        if (!stored) {
            alert('Aucun élève. Ajoutez des élèves dans app principale.');
            return;
        }
        students = JSON.parse(stored).slice(0, 6);
        students.forEach(s => {
            seanceData[s.id] = s.seance2 || {
                pctVMA: 100, tour1: null, tour2: null, tour3: null,
                bpm: null, tempsRecup: null, commentaire: '', atelierSaut: ''
            };
        });
        setGlobalPct(100);
    }
    
    function setGlobalPct(pct) {
        globalPct = pct;
        [90,95,100,105,110,115,120,125,130].forEach(p => {
            const btn = document.getElementById('btn-'+p);
            if (btn) btn.classList.toggle('active', p === pct);
        });
        students.forEach(s => { seanceData[s.id].pctVMA = pct; });
        renderGrid();
    }
    
    function renderGrid() {
        document.getElementById('student-grid').innerHTML = students.map(renderStudentCard).join('');
    }
    
    function renderStudentCard(s) {
        const d = seanceData[s.id];
        const vma = parseFloat(s.vma);
        const cible = formatTime((0.4 / (vma * (d.pctVMA / 100))) * 3600 * 1000);
        
        let results = '', analysis = '';
        if (d.tour1 && d.tour2 && d.tour3) {
            const moy = (d.tour1 + d.tour2 + d.tour3) / 3;
            const pct = ((0.4 / (moy / 3600)) / vma) * 100;
            results = '<div class="results-box"><strong>Moyenne:</strong> ' + formatTime(moy*1000) + '<br><strong>% VMA:</strong> ' + pct.toFixed(1) + '%</div>';
            
            let profil = d.tour3 > d.tour2 && d.tour2 > d.tour1 ? '📉 Dégressive' : 
                         d.tour3 < d.tour2 && d.tour2 < d.tour1 ? '📈 Progressive' : '➡️ Constante';
            let obj = pct >= d.pctVMA - 5 ? '✅ Réussi' : '⚠️ À retravailler';
            analysis = '<div class="analysis-box"><strong>Profil:</strong> ' + profil + '<br><strong>Objectif:</strong> ' + obj + '</div>';
        }
        
        const t1m = d.tour1 ? Math.floor(d.tour1/60) : '', t1s = d.tour1 ? d.tour1%60 : '';
        const t2m = d.tour2 ? Math.floor(d.tour2/60) : '', t2s = d.tour2 ? d.tour2%60 : '';
        const t3m = d.tour3 ? Math.floor(d.tour3/60) : '', t3s = d.tour3 ? d.tour3%60 : '';
        
        return '<div class="student-card"><div class="student-header">' + (s.sexe==='F'?'👧':'🧑') + ' ' + s.nomPrenom + 
               '</div><div style="color:#aaa;font-size:0.85rem;margin-bottom:10px">VMA: ' + vma + ' km/h | Cible: ' + cible + 
               '</div><label>Tour 1:</label><div class="time-input-group"><input type="number" id="' + s.id + '-t1-min" min="0" max="10" value="' + t1m + '" oninput="updateData(\'' + s.id + '\')"><span>min</span><input type="number" id="' + s.id + '-t1-sec" min="0" max="59" value="' + t1s + '" oninput="updateData(\'' + s.id + '\')"><span>sec</span></div>' +
               '<label>Tour 2:</label><div class="time-input-group"><input type="number" id="' + s.id + '-t2-min" min="0" max="10" value="' + t2m + '" oninput="updateData(\'' + s.id + '\')"><span>min</span><input type="number" id="' + s.id + '-t2-sec" min="0" max="59" value="' + t2s + '" oninput="updateData(\'' + s.id + '\')"><span>sec</span></div>' +
               '<label>Tour 3:</label><div class="time-input-group"><input type="number" id="' + s.id + '-t3-min" min="0" max="10" value="' + t3m + '" oninput="updateData(\'' + s.id + '\')"><span>min</span><input type="number" id="' + s.id + '-t3-sec" min="0" max="59" value="' + t3s + '" oninput="updateData(\'' + s.id + '\')"><span>sec</span></div>' +
               results + analysis +
               '<label>💓 BPM:</label><input type="number" id="' + s.id + '-bpm" min="60" max="220" value="' + (d.bpm||'') + '" placeholder="Ex: 180">' +
               '<label>⏱️ Temps récup (min):</label><input type="number" id="' + s.id + '-recup" min="1" max="10" value="' + (d.tempsRecup||'') + '" placeholder="Ex: 3">' +
               '<label>💬 Commentaire course:</label><textarea id="' + s.id + '-comment" placeholder="Points forts, à améliorer...">' + d.commentaire + '</textarea>' +
               '<div class="atelier-box"><label style="color:var(--purple)">🦘 Atelier SAUT:</label><textarea id="' + s.id + '-saut" placeholder="Travail technique...">' + d.atelierSaut + '</textarea></div></div>';
    }
    
    function updateData(id) {
        const d = seanceData[id];
        const t1m = parseInt(document.getElementById(id+'-t1-min').value)||0;
        const t1s = parseInt(document.getElementById(id+'-t1-sec').value)||0;
        const t2m = parseInt(document.getElementById(id+'-t2-min').value)||0;
        const t2s = parseInt(document.getElementById(id+'-t2-sec').value)||0;
        const t3m = parseInt(document.getElementById(id+'-t3-min').value)||0;
        const t3s = parseInt(document.getElementById(id+'-t3-sec').value)||0;
        d.tour1 = t1m*60+t1s||null;
        d.tour2 = t2m*60+t2s||null;
        d.tour3 = t3m*60+t3s||null;
        renderGrid();
    }
    
    function saveAll() {
        students.forEach(s => {
            const d = seanceData[s.id];
            d.bpm = parseInt(document.getElementById(s.id+'-bpm').value)||null;
            d.tempsRecup = parseInt(document.getElementById(s.id+'-recup').value)||null;
            d.commentaire = document.getElementById(s.id+'-comment').value;
            d.atelierSaut = document.getElementById(s.id+'-saut').value;
        });
        
        let err = students.filter(s => !seanceData[s.id].tour1 || !seanceData[s.id].tour2 || !seanceData[s.id].tour3).length;
        if (err > 0 && !confirm(err + ' élève(s) sans les 3 temps. Sauvegarder ?')) return;
        
        const all = JSON.parse(localStorage.getItem('eps_pro_students'));
        students.forEach(s => {
            const i = all.findIndex(st => st.id === s.id);
            if (i !== -1) all[i].seance2 = {...seanceData[s.id], date: new Date().toISOString()};
        });
        localStorage.setItem('eps_pro_students', JSON.stringify(all));
        alert('✅ Séance 2 enregistrée !');
    }
    
    function formatTime(ms) {
        const sec = Math.floor(ms/1000);
        const m = Math.floor(sec/60);
        const s = sec%60;
        return m + "'" + (s<10?'0':'') + s + '"';
    }
    </script>
</body>
</html>
