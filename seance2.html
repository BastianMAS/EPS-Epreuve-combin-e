<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séance 2 - EPS PRO</title>
    <style>
        :root {
            --bg: #0b101d;
            --card: #1c2333;
            --accent: #00d2ff;
            --success: #00ff88;
            --warning: #ffcc00;
            --purple: #9b59b6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 10px; }
        .accent-text { color: var(--accent); }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn-secondary { background: #666; color: white; }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .student-card {
            background: var(--card);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
        }
        .student-header {
            background: linear-gradient(135deg, var(--accent), var(--success));
            color: black;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 700;
            text-align: center;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 2px solid var(--accent);
            background: #0f0f23;
            color: white;
            font-size: 0.9rem;
        }
        textarea { font-family: Arial; resize: vertical; min-height: 60px; }
        label { display: block; margin: 8px 0 4px 0; font-weight: 600; font-size: 0.85rem; color: var(--accent); }
        .btn-pct {
            padding: 6px 10px;
            border: 2px solid var(--accent);
            background: #0f0f23;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            margin: 2px;
        }
        .btn-pct.active { background: var(--accent); color: black; }
        .pct-group { display: flex; gap: 4px; flex-wrap: wrap; margin: 10px 0; }
        .time-input-group { display: flex; gap: 5px; align-items: center; margin: 8px 0; }
        .time-input-group input {
            width: 50px;
            padding: 8px;
            border-radius: 6px;
            border: 2px solid var(--accent);
            background: #0f0f23;
            color: white;
            text-align: center;
            font-size: 1rem;
        }
        .time-input-group span { font-size: 0.85rem; color: #aaa; }
        .results-box {
            background: rgba(0,255,136,0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--success);
            margin: 10px 0;
            font-size: 0.85rem;
        }
        .analysis-box {
            background: rgba(255,204,0,0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--warning);
            margin: 10px 0;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .atelier-box {
            background: rgba(155,89,182,0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--purple);
            margin: 10px 0;
        }
        .save-btn {
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: var(--success);
            color: black;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }
        @media (max-width: 900px) { .student-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .student-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>EPS<span class="accent-text">PRO</span></h1>
        <p class="subtitle" style="color: var(--purple); font-size: 1.5rem; font-weight: 700;">📅 SÉANCE 2 - ENTRAÎNEMENT</p>
        <p class="subtitle" style="font-size: 1.1rem;">3×400m + Saut</p>
        
        <button onclick="window.location.href='index.html'" class="btn btn-secondary" style="margin-bottom: 20px;">← Retour</button>
        
        <div id="student-grid" class="student-grid">
            <div class="student-card" id="card-0"></div>
            <div class="student-card" id="card-1"></div>
            <div class="student-card" id="card-2"></div>
            <div class="student-card" id="card-3"></div>
            <div class="student-card" id="card-4"></div>
            <div class="student-card" id="card-5"></div>
        </div>
        
        <button onclick="saveAll()" class="save-btn">💾 ENREGISTRER TOUTE LA SÉANCE</button>
    </div>
    
    <script>
    let allStudents = [];
    let cardData = [{},{},{},{},{},{}];
    
    window.onload = function() {
        const stored = localStorage.getItem('eps_pro_students');
        if (!stored) {
            alert('⚠️ Aucun élève. Ajoutez des élèves dans app principale.');
            return;
        }
        allStudents = JSON.parse(stored);
        for(let i=0; i<6; i++) renderCard(i);
    };
    
    function renderCard(cardIndex) {
        const card = document.getElementById('card-'+cardIndex);
        const data = cardData[cardIndex];
        
        let content = '<label>Élève :</label><select id="sel-'+cardIndex+'" onchange="selectStudent('+cardIndex+')">';
        content += '<option value="">-- Choisir --</option>';
        allStudents.forEach((s,i) => {
            content += '<option value="'+i+'" '+(data.studentIndex===i?'selected':'')+'>'+s.nomPrenom+'</option>';
        });
        content += '</select>';
        
        if(data.student) {
            const s = data.student;
            const vma = parseFloat(s.vma);
            const pct = data.pctVMA || 100;
            const cible = formatTime((0.4 / (vma * (pct/100))) * 3600 * 1000);
            
            content += '<div class="student-header">'+(s.sexe==='F'?'👧':'🧑')+' '+s.nomPrenom+' | VMA: '+vma+' km/h</div>';
            content += '<label>% VMA :</label><div class="pct-group">';
            [90,95,100,105,110,115,120,125,130].forEach(p => {
                content += '<button onclick="setPct('+cardIndex+','+p+')" class="btn-pct '+(pct===p?'active':'')+'" id="pct-'+cardIndex+'-'+p+'">'+p+'%</button>';
            });
            content += '</div><p style="color:var(--success);font-weight:700;margin:10px 0">⏱️ Temps cible: '+cible+'</p>';
            
            const t1m = data.tour1 ? Math.floor(data.tour1/60) : '';
            const t1s = data.tour1 ? data.tour1%60 : '';
            const t2m = data.tour2 ? Math.floor(data.tour2/60) : '';
            const t2s = data.tour2 ? data.tour2%60 : '';
            const t3m = data.tour3 ? Math.floor(data.tour3/60) : '';
            const t3s = data.tour3 ? data.tour3%60 : '';
            
            content += '<label>Tour 1:</label><div class="time-input-group">';
            content += '<input type="number" id="t1m-'+cardIndex+'" min="0" max="10" value="'+t1m+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>min</span><input type="number" id="t1s-'+cardIndex+'" min="0" max="59" value="'+t1s+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>sec</span></div>';
            
            content += '<label>Tour 2:</label><div class="time-input-group">';
            content += '<input type="number" id="t2m-'+cardIndex+'" min="0" max="10" value="'+t2m+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>min</span><input type="number" id="t2s-'+cardIndex+'" min="0" max="59" value="'+t2s+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>sec</span></div>';
            
            content += '<label>Tour 3:</label><div class="time-input-group">';
            content += '<input type="number" id="t3m-'+cardIndex+'" min="0" max="10" value="'+t3m+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>min</span><input type="number" id="t3s-'+cardIndex+'" min="0" max="59" value="'+t3s+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>sec</span></div>';
            
            if(data.tour1 && data.tour2 && data.tour3) {
                const moy = (data.tour1 + data.tour2 + data.tour3) / 3;
                const pctRealise = ((0.4 / (moy/3600)) / vma) * 100;
                
                content += '<div class="results-box"><strong>Moyenne:</strong> '+formatTime(moy*1000)+'<br>';
                content += '<strong>% VMA réalisé:</strong> '+pctRealise.toFixed(1)+'%</div>';
                
                let analyse = generateAnalysis(data, pct, pctRealise);
                content += '<div class="analysis-box"><strong>📈 ANALYSE AUTO:</strong><br>'+analyse+'</div>';
            }
            
            content += '<label>💓 BPM:</label><input type="number" id="bpm-'+cardIndex+'" min="60" max="220" value="'+(data.bpm||'')+'" placeholder="Ex: 180">';
            content += '<label>⏱️ Récup (min):</label><input type="number" id="recup-'+cardIndex+'" min="1" max="10" value="'+(data.tempsRecup||'')+'" placeholder="Ex: 3">';
            content += '<label>💬 Commentaire:</label><textarea id="comment-'+cardIndex+'" placeholder="Points forts, à améliorer...">'+(data.commentaire||'')+'</textarea>';
            content += '<div class="atelier-box"><label style="color:var(--purple)">🦘 Atelier SAUT:</label>';
            content += '<textarea id="saut-'+cardIndex+'" placeholder="Travail technique...">'+(data.atelierSaut||'')+'</textarea></div>';
        }
        
        card.innerHTML = content;
    }
    
    function selectStudent(cardIndex) {
        const sel = document.getElementById('sel-'+cardIndex);
        const studentIndex = parseInt(sel.value);
        
        if(isNaN(studentIndex)) {
            cardData[cardIndex] = {};
        } else {
            const s = allStudents[studentIndex];
            cardData[cardIndex] = s.seance2 || {
                studentIndex: studentIndex,
                student: s,
                pctVMA: 100,
                tour1: null, tour2: null, tour3: null,
                bpm: null, tempsRecup: null,
                commentaire: '', atelierSaut: ''
            };
            cardData[cardIndex].studentIndex = studentIndex;
            cardData[cardIndex].student = s;
        }
        renderCard(cardIndex);
    }
    
    function setPct(cardIndex, pct) {
        cardData[cardIndex].pctVMA = pct;
        renderCard(cardIndex);
    }
    
    function updateTime(cardIndex) {
        const d = cardData[cardIndex];
        const t1m = parseInt(document.getElementById('t1m-'+cardIndex).value)||0;
        const t1s = parseInt(document.getElementById('t1s-'+cardIndex).value)||0;
        const t2m = parseInt(document.getElementById('t2m-'+cardIndex).value)||0;
        const t2s = parseInt(document.getElementById('t2s-'+cardIndex).value)||0;
        const t3m = parseInt(document.getElementById('t3m-'+cardIndex).value)||0;
        const t3s = parseInt(document.getElementById('t3s-'+cardIndex).value)||0;
        d.tour1 = t1m*60+t1s||null;
        d.tour2 = t2m*60+t2s||null;
        d.tour3 = t3m*60+t3s||null;
        renderCard(cardIndex);
    }
    
    function generateAnalysis(data, pctCible, pctRealise) {
        let txt = '';
        
        // Profil de course
        const t1=data.tour1, t2=data.tour2, t3=data.tour3;
        if(t3 > t2 && t2 > t1) {
            txt += 'Course <strong>dégressive</strong> (rapide puis ralentissement). ';
            txt += 'Bon départ mais baisse de rythme sur le 3ème tour. ';
        } else if(t3 < t2 && t2 < t1) {
            txt += 'Course <strong>progressive</strong> (accélération). ';
            txt += 'Montée en puissance, bon finish. ';
        } else {
            txt += 'Course <strong>constante</strong> (régulier). ';
            txt += 'Bonne gestion du rythme. ';
        }
        
        // Objectif
        if(pctRealise >= pctCible) {
            txt += '<strong>Objectif atteint ✅</strong> ('+pctRealise.toFixed(1)+'% ≥ '+pctCible+'%). ';
        } else if(pctRealise >= pctCible - 5) {
            txt += '<strong>Objectif presque atteint ⚠️</strong> ('+pctRealise.toFixed(1)+'% vs '+pctCible+'%). ';
        } else {
            txt += '<strong>Objectif non atteint ❌</strong> ('+pctRealise.toFixed(1)+'% < '+pctCible+'%). ';
        }
        
        // Conseil
        if(t3 > t2 && t2 > t1) {
            txt += 'Travailler l\'endurance pour maintenir le rythme.';
        } else if(t3 < t2 && t2 < t1) {
            txt += 'Bon finish, travailler le départ pour être régulier.';
        } else {
            txt += 'Continue comme ça !';
        }
        
        return txt;
    }
    
    function saveAll() {
        for(let i=0; i<6; i++) {
            const d = cardData[i];
            if(d.student) {
                const bpm = document.getElementById('bpm-'+i);
                const recup = document.getElementById('recup-'+i);
                const comment = document.getElementById('comment-'+i);
                const saut = document.getElementById('saut-'+i);
                
                if(bpm) d.bpm = parseInt(bpm.value)||null;
                if(recup) d.tempsRecup = parseInt(recup.value)||null;
                if(comment) d.commentaire = comment.value;
                if(saut) d.atelierSaut = saut.value;
            }
        }
        
        let err = 0;
        cardData.forEach(d => {
            if(d.student && (!d.tour1 || !d.tour2 || !d.tour3)) err++;
        });
        
        if(err > 0 && !confirm(err+' élève(s) sans les 3 temps. Sauvegarder ?')) return;
        
        cardData.forEach(d => {
            if(d.student) {
                const i = allStudents.findIndex(s => s.id === d.student.id);
                if(i !== -1) {
                    allStudents[i].seance2 = {
                        pctVMA: d.pctVMA,
                        tour1: d.tour1,
                        tour2: d.tour2,
                        tour3: d.tour3,
                        bpm: d.bpm,
                        tempsRecup: d.tempsRecup,
                        commentaire: d.commentaire,
                        atelierSaut: d.atelierSaut,
                        date: new Date().toISOString()
                    };
                }
            }
        });
        
        localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
        alert('✅ Séance 2 enregistrée !');
    }
    
    function formatTime(ms) {
        const sec = Math.floor(ms/1000);
        const m = Math.floor(sec/60);
        const s = sec%60;
        return m+"'"+(s<10?'0':'')+s+'"';
    }
    </script>
</body>
</html>
