<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séance 5 - EPS PRO</title>
    <style>
        :root {
            --bg: #0b101d;
            --card: #1c2333;
            --accent: #00d2ff;
            --success: #00ff88;
            --warning: #ffcc00;
            --purple: #9b59b6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2rem; margin-bottom: 5px; }
        .accent-text { color: var(--accent); }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 15px; font-size: 0.9rem; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        .btn-secondary { background: #666; color: white; }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .student-card {
            background: var(--card);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
        }
        .student-header {
            background: linear-gradient(135deg, var(--accent), var(--success));
            color: black;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: 700;
            text-align: center;
            font-size: 0.9rem;
        }
        select, input, textarea {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 2px solid var(--accent);
            background: #0f0f23;
            color: white;
            font-size: 0.85rem;
        }
        textarea { font-family: Arial; resize: vertical; min-height: 100px; }
        label { display: block; margin: 6px 0 3px 0; font-weight: 600; font-size: 0.8rem; color: var(--accent); }
        .btn-pct {
            padding: 5px 8px;
            border: 2px solid var(--accent);
            background: #0f0f23;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            margin: 2px;
        }
        .btn-pct.active { background: var(--accent); color: black; }
        .pct-group { display: flex; gap: 3px; flex-wrap: wrap; margin: 8px 0; }
        .time-input-group { display: flex; gap: 5px; align-items: center; margin: 8px 0; }
        .time-input-group input {
            width: 50px;
            padding: 8px;
            border-radius: 6px;
            border: 2px solid var(--accent);
            background: #0f0f23;
            color: white;
            text-align: center;
            font-size: 1rem;
        }
        .time-input-group span { font-size: 0.8rem; color: #aaa; }
        .results-box {
            background: rgba(0,255,136,0.1);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--success);
            margin: 8px 0;
            font-size: 0.8rem;
        }
        .btn-analyse {
            background: var(--warning);
            color: black;
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .atelier-section {
            background: rgba(155,89,182,0.1);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--purple);
            margin-top: 20px;
        }
        .atelier-choice {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }
        .atelier-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--purple);
            background: rgba(155,89,182,0.2);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .atelier-btn.active {
            background: var(--purple);
            color: black;
        }
        .save-btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: var(--success);
            color: black;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid var(--warning);
        }
        @media (max-width: 900px) { .student-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .student-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>EPS<span class="accent-text">PRO</span></h1>
        <p class="subtitle" style="color: var(--purple); font-size: 1.2rem; font-weight: 700;">📅 SÉANCE 5</p>
        <p class="subtitle">3×400m</p>
        
        <button onclick="window.location.href='index.html'" class="btn btn-secondary" style="margin-bottom: 15px;">← Retour</button>
        
        <div id="student-grid" class="student-grid">
            <div class="student-card" id="card-0"></div>
            <div class="student-card" id="card-1"></div>
            <div class="student-card" id="card-2"></div>
            <div class="student-card" id="card-3"></div>
            <div class="student-card" id="card-4"></div>
            <div class="student-card" id="card-5"></div>
        </div>
        
        <div class="atelier-section">
            <h3 style="color: var(--purple); margin-bottom: 15px;">🏋️ ATELIER TECHNIQUE (COMMUN)</h3>
            
            <div class="atelier-choice">
                <button onclick="selectAtelier('saut')" class="atelier-btn" id="btn-saut">🦘 SAUT</button>
                <button onclick="selectAtelier('lancer')" class="atelier-btn" id="btn-lancer">🎯 LANCER</button>
            </div>
            
            <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 10px;" id="atelier-instruction">
                Sélectionnez l'atelier technique effectué
            </p>
            <textarea id="atelier-commun" placeholder="Décrivez le travail technique effectué pour tout le groupe..."></textarea>
        </div>
        
        <button onclick="saveAll()" class="save-btn">💾 ENREGISTRER</button>
    </div>
    
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 style="color: var(--warning); margin-bottom: 15px;">📈 ANALYSE</h2>
            <div id="modal-content"></div>
            <button onclick="closeModal()" class="btn" style="background: var(--accent); color: black; width: 100%; margin-top: 15px;">Fermer</button>
        </div>
    </div>
    
    <script>
    let allStudents = [];
    let cardData = [{},{},{},{},{},{}];
    let atelierType = null;
    let atelierTexte = '';
    
    window.onload = function() {
        const stored = localStorage.getItem('eps_pro_students');
        if (!stored) {
            alert('⚠️ Aucun élève.');
            return;
        }
        allStudents = JSON.parse(stored);
        
        const seanceData = JSON.parse(localStorage.getItem('seance5_data') || '{}');
        if(seanceData.atelierType) {
            selectAtelier(seanceData.atelierType);
            document.getElementById('atelier-commun').value = seanceData.atelierTexte || '';
        }
        
        for(let i=0; i<6; i++) renderCard(i);
    };
    
    function selectAtelier(type) {
        atelierType = type;
        document.getElementById('btn-saut').classList.toggle('active', type === 'saut');
        document.getElementById('btn-lancer').classList.toggle('active', type === 'lancer');
        
        const textarea = document.getElementById('atelier-commun');
        const instruction = document.getElementById('atelier-instruction');
        
        if(type === 'saut') {
            instruction.textContent = '🦘 Décrivez le travail technique sur le SAUT';
            textarea.placeholder = 'Ex: Travail sur l\'élan et l\'impulsion : course d\'élan (6 foulées), placement du pied d\'appel, gainage en l\'air. Exercices : sauts sans élan, avec élan court...';
        } else {
            instruction.textContent = '🎯 Décrivez le travail technique sur le LANCER';
            textarea.placeholder = 'Ex: Travail technique sur le lancer poids : position de départ, rotation du bassin, accompagnement du geste. Exercices : lancer à genoux, debout, avec rotation...';
        }
    }
    
    function renderCard(cardIndex) {
        const card = document.getElementById('card-'+cardIndex);
        const data = cardData[cardIndex];
        
        let content = '<select id="sel-'+cardIndex+'" onchange="selectStudent('+cardIndex+')" style="font-size: 0.85rem;">';
        content += '<option value="">-- Choisir --</option>';
        allStudents.forEach((s,i) => {
            content += '<option value="'+i+'" '+(data.studentIndex===i?'selected':'')+'>'+s.nomPrenom+'</option>';
        });
        content += '</select>';
        
        if(data.student) {
            const s = data.student;
            const vma = parseFloat(s.vma);
            const pct = data.pctVMA || 100;
            const cible = formatTime((0.4 / (vma * (pct/100))) * 3600 * 1000);
            
            content += '<div class="student-header">'+(s.sexe==='F'?'👧':'🧑')+' '+s.nomPrenom+' | VMA: '+vma+'</div>';
            content += '<div class="pct-group">';
            [90,95,100,105,110,115,120,125,130].forEach(p => {
                content += '<button onclick="setPct('+cardIndex+','+p+')" class="btn-pct '+(pct===p?'active':'')+'" id="pct-'+cardIndex+'-'+p+'">'+p+'%</button>';
            });
            content += '</div><p style="color:var(--success);font-weight:700;font-size:0.85rem;margin:5px 0">Cible: '+cible+'</p>';
            
            const t1m = data.tour1 ? Math.floor(data.tour1/60) : '';
            const t1s = data.tour1 ? data.tour1%60 : '';
            const t2m = data.tour2 ? Math.floor(data.tour2/60) : '';
            const t2s = data.tour2 ? data.tour2%60 : '';
            const t3m = data.tour3 ? Math.floor(data.tour3/60) : '';
            const t3s = data.tour3 ? data.tour3%60 : '';
            
            content += '<label>T1:</label><div class="time-input-group">';
            content += '<input type="number" inputmode="numeric" id="t1m-'+cardIndex+'" min="0" max="10" value="'+t1m+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>min</span>';
            content += '<input type="number" inputmode="numeric" id="t1s-'+cardIndex+'" min="0" max="59" value="'+t1s+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>sec</span></div>';
            
            content += '<label>T2:</label><div class="time-input-group">';
            content += '<input type="number" inputmode="numeric" id="t2m-'+cardIndex+'" min="0" max="10" value="'+t2m+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>min</span>';
            content += '<input type="number" inputmode="numeric" id="t2s-'+cardIndex+'" min="0" max="59" value="'+t2s+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>sec</span></div>';
            
            content += '<label>T3:</label><div class="time-input-group">';
            content += '<input type="number" inputmode="numeric" id="t3m-'+cardIndex+'" min="0" max="10" value="'+t3m+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>min</span>';
            content += '<input type="number" inputmode="numeric" id="t3s-'+cardIndex+'" min="0" max="59" value="'+t3s+'" oninput="updateTime('+cardIndex+')">';
            content += '<span>sec</span></div>';
            
            content += '<div id="results-'+cardIndex+'"></div>';
            
            content += '<label>💓 BPM:</label><input type="number" inputmode="numeric" id="bpm-'+cardIndex+'" value="'+(data.bpm||'')+'" placeholder="180" style="width:70px">';
            content += '<label>⏱️ Récup:</label><input type="number" inputmode="numeric" id="recup-'+cardIndex+'" value="'+(data.tempsRecup||'')+'" placeholder="3" style="width:70px">';
            content += '<label>💬 Notes:</label><textarea id="comment-'+cardIndex+'" placeholder="Points forts, à améliorer..." style="min-height:50px">'+(data.commentaire||'')+'</textarea>';
        }
        
        card.innerHTML = content;
        updateResults(cardIndex);
    }
    
    function selectStudent(cardIndex) {
        const sel = document.getElementById('sel-'+cardIndex);
        const studentIndex = parseInt(sel.value);
        
        if(isNaN(studentIndex)) {
            cardData[cardIndex] = {};
        } else {
            const s = allStudents[studentIndex];
            cardData[cardIndex] = s.seance5 || {
                studentIndex: studentIndex,
                student: s,
                pctVMA: 100,
                tour1: null, tour2: null, tour3: null,
                bpm: null, tempsRecup: null,
                commentaire: ''
            };
            cardData[cardIndex].studentIndex = studentIndex;
            cardData[cardIndex].student = s;
        }
        renderCard(cardIndex);
    }
    
    function setPct(cardIndex, pct) {
        cardData[cardIndex].pctVMA = pct;
        renderCard(cardIndex);
    }
    
    function updateTime(cardIndex) {
        const d = cardData[cardIndex];
        const t1m = parseInt(document.getElementById('t1m-'+cardIndex).value)||0;
        const t1s = parseInt(document.getElementById('t1s-'+cardIndex).value)||0;
        const t2m = parseInt(document.getElementById('t2m-'+cardIndex).value)||0;
        const t2s = parseInt(document.getElementById('t2s-'+cardIndex).value)||0;
        const t3m = parseInt(document.getElementById('t3m-'+cardIndex).value)||0;
        const t3s = parseInt(document.getElementById('t3s-'+cardIndex).value)||0;
        
        d.tour1 = t1m*60+t1s||null;
        d.tour2 = t2m*60+t2s||null;
        d.tour3 = t3m*60+t3s||null;
        
        updateResults(cardIndex);
    }
    
    function updateResults(cardIndex) {
        const d = cardData[cardIndex];
        const resultsDiv = document.getElementById('results-'+cardIndex);
        if(!resultsDiv) return;
        
        if(d.tour1 && d.tour2 && d.tour3 && d.student) {
            const moy = (d.tour1 + d.tour2 + d.tour3) / 3;
            const vma = parseFloat(d.student.vma);
            const pctRealise = ((0.4 / (moy/3600)) / vma) * 100;
            
            resultsDiv.innerHTML = '<div class="results-box"><strong>Moy:</strong> '+formatTime(moy*1000)+' | <strong>VMA:</strong> '+pctRealise.toFixed(1)+'%</div><button onclick="showAnalysis('+cardIndex+')" class="btn-analyse">📈 VOIR ANALYSE</button>';
        } else {
            resultsDiv.innerHTML = '';
        }
    }
    
    function showAnalysis(cardIndex) {
        const d = cardData[cardIndex];
        const vma = parseFloat(d.student.vma);
        const pct = d.pctVMA;
        const moy = (d.tour1 + d.tour2 + d.tour3) / 3;
        const pctRealise = ((0.4 / (moy/3600)) / vma) * 100;
        
        const ecart1_2 = d.tour2 - d.tour1;
        const ecart2_3 = d.tour3 - d.tour2;
        const ecartMax = Math.max(Math.abs(ecart1_2), Math.abs(ecart2_3));
        
        let txt = '<p style="line-height:1.6">';
        txt += '<strong>Profil de course:</strong><br>';
        
        if(ecartMax <= 5) {
            txt += '➡️ <strong>RÉGULIÈRE</strong><br>Excellent ! Rythme constant, très bonne gestion.<br><br>';
        } else {
            txt += '⚠️ <strong>IRRÉGULIÈRE</strong><br>';
            if(Math.abs(ecart1_2) > 10 || Math.abs(ecart2_3) > 10) {
                txt += 'Gros écarts détectés :<br>';
                if(ecart1_2 > 10) txt += '• T1→T2 : <strong style="color:var(--danger)">+'+ecart1_2+'s</strong> (grosse baisse) 📉<br>';
                else if(ecart1_2 > 5) txt += '• T1→T2 : +'+ecart1_2+'s<br>';
                else if(ecart1_2 < -10) txt += '• T1→T2 : '+ecart1_2+'s (grosse accélération) 📈<br>';
                else if(ecart1_2 < -5) txt += '• T1→T2 : '+ecart1_2+'s<br>';
                
                if(ecart2_3 > 10) txt += '• T2→T3 : <strong style="color:var(--danger)">+'+ecart2_3+'s</strong> (grosse baisse) 📉<br>';
                else if(ecart2_3 > 5) txt += '• T2→T3 : +'+ecart2_3+'s<br>';
                else if(ecart2_3 < -10) txt += '• T2→T3 : '+ecart2_3+'s (grosse accélération) 📈<br>';
                else if(ecart2_3 < -5) txt += '• T2→T3 : '+ecart2_3+'s<br>';
            }
            txt += '<br>';
        }
        
        txt += '<strong>Objectif '+pct+'% VMA:</strong><br>';
        if(pctRealise >= pct) {
            txt += '✅ <span style="color:var(--success)">ATTEINT</span> ('+pctRealise.toFixed(1)+'%)<br><br>';
        } else if(pctRealise >= pct - 5) {
            txt += '⚠️ <span style="color:var(--warning)">PRESQUE</span> ('+pctRealise.toFixed(1)+'%)<br><br>';
        } else {
            txt += '❌ <span style="color:var(--danger)">NON ATTEINT</span> ('+pctRealise.toFixed(1)+'%)<br><br>';
        }
        
        txt += '<strong>Conseil:</strong><br>';
        if(ecartMax <= 5) {
            txt += 'Parfait ! Continue, la régularité est la clé.';
        } else if(ecart1_2 > 10) {
            txt += 'Grosse baisse au T2. Travailler l\'endurance. Partir moins vite.';
        } else if(ecart2_3 > 10) {
            txt += 'Grosse baisse au T3. Travailler la résistance.';
        } else {
            txt += 'Travailler la régularité. Viser écarts < 5s.';
        }
        
        txt += '</p>';
        
        document.getElementById('modal-content').innerHTML = txt;
        document.getElementById('modal').style.display = 'flex';
    }
    
    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }
    
    function saveAll() {
        if(!atelierType) {
            alert('⚠️ Sélectionnez l\'atelier technique (Saut ou Lancer)');
            return;
        }
        
        for(let i=0; i<6; i++) {
            const d = cardData[i];
            if(d.student) {
                const bpm = document.getElementById('bpm-'+i);
                const recup = document.getElementById('recup-'+i);
                const comment = document.getElementById('comment-'+i);
                
                if(bpm) d.bpm = parseInt(bpm.value)||null;
                if(recup) d.tempsRecup = parseInt(recup.value)||null;
                if(comment) d.commentaire = comment.value;
            }
        }
        
        const atelierTexte = document.getElementById('atelier-commun').value;
        
        let err = 0;
        cardData.forEach(d => {
            if(d.student && (!d.tour1 || !d.tour2 || !d.tour3)) err++;
        });
        
        if(err > 0 && !confirm(err+' élève(s) sans temps. Continuer ?')) return;
        
        cardData.forEach(d => {
            if(d.student) {
                const i = allStudents.findIndex(s => s.id === d.student.id);
                if(i !== -1) {
                    allStudents[i].seance5 = {
                        pctVMA: d.pctVMA,
                        tour1: d.tour1,
                        tour2: d.tour2,
                        tour3: d.tour3,
                        bpm: d.bpm,
                        tempsRecup: d.tempsRecup,
                        commentaire: d.commentaire,
                        date: new Date().toISOString()
                    };
                }
            }
        });
        
        localStorage.setItem('eps_pro_students', JSON.stringify(allStudents));
        localStorage.setItem('seance5_data', JSON.stringify({
            atelierType: atelierType,
            atelierTexte: atelierTexte
        }));
        
        alert('✅ Séance 5 enregistrée !');
    }
    
    function formatTime(ms) {
        const sec = Math.floor(ms/1000);
        const m = Math.floor(sec/60);
        const s = sec%60;
        return m+"'"+(s<10?'0':'')+s+'"';
    }
    </script>
</body>
</html>
